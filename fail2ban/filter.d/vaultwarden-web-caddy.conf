# STATUS: retired
# ============================================================
# RETIRED FILTER — DO NOT ASSIGN TO ANY JAIL
# ============================================================
# vaultwarden-web-caddy.conf is no longer referenced by any jail.
# It has been superseded by two scoped, dedicated filters:
#
#   vaultwarden-web-auth.conf  — used by [vaultwarden-web-auth]
#                                and [vaultwarden-rate-limit]
#   vaultwarden-web-admin.conf — used by [vaultwarden-web-admin]
#   vaultwarden-security.conf  — used by [vaultwarden-security]
#                                and [vaultwarden-2fa]
#
# History: this broad filter was previously shared across multiple
# jails, causing every matched log line to increment counters in all
# referencing jails simultaneously (double-fire / duplicate bans).
# Each jail now uses its own dedicated filter to prevent this.
#
# This file is retained only for historical reference. If you need
# to add a new jail, use or extend one of the dedicated filters above.
# Assigning this file to a new jail will reintroduce the double-fire
# problem and is explicitly unsupported.
# ============================================================

# VaultWarden Comprehensive Web Security Filter (Caddy Logs)
# Covers authentication endpoint failures and API abuse via Caddy access logs.
# FIXED: tls block made optional (was required, missing on HTTP requests).
# FIXED: Removed overly broad 404 method wildcard fallback — replaced with
#        scoped POST-only fallback to avoid banning legitimate Bitwarden
#        client discovery probes (GET /.well-known/*, OPTIONS, HEAD).
# FIXED: JSON failregex patterns now use \r?$ anchor instead of $ to handle
#        CRLF line endings from non-Linux log mounts (Windows/NFS volumes).
# Source log: /var/log/caddy/access.log

[INCLUDES]
before = common.conf

[Definition]

# DEPENDENCY: This filter requires Caddy to emit JSON-format access logs.
# The log format is pinned in caddy/Caddyfile:
#   format json { time_format "2006-01-02T15:04:05.000Z07:00" ... }
# If the Caddyfile log format is changed, ALL Caddy-based filters will silently stop matching.
# Test after any Caddyfile log format change with: fail2ban-regex <logfile> <this-filter>
# P4-05 fix: added log format dependency comment block.

# PRIMARY: JSON Caddy log patterns.
# The tls block is optional (?): absent on plain HTTP (port 80 probes,
# ACME challenges, redirect phase). remote_ip and remote_port are
# separate fields in Caddy's structured logger (caddy.Log / zap format).
# \r?$ handles both LF (Linux) and CRLF (Windows/NFS mounts) line endings
# to prevent silently dropped detections on non-native mounts.
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[13].*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/identity/connect/token.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[01].*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/api/accounts/prelogin.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":401.*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":404.*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":429.*\}\r?$

            # FALLBACK: Plain-text Caddy log patterns (non-JSON log_format)
            # 404 fallback is POST-only to avoid banning Bitwarden client
            # discovery probes (GET /.well-known/bitwarden.json → 404 is normal).
            ^.*<HOST>.*"POST /(api|identity)/.*" 40[013] .*\r?$
            ^.*<HOST>.*"POST /identity/connect/token.*" 40[01] .*\r?$
            ^.*<HOST>.*"POST /api/accounts/prelogin.*" 401 .*\r?$
            ^.*<HOST>.*"POST /(api|identity)/.*" 404 .*\r?$

# NOTE: The broad plain-text 429 fallback has been intentionally removed.
# It would ban any user hitting any rate limit including legitimate traffic,
# Cloudflare origin pulls, and monitoring probes.
# 429 detection is retained in the scoped JSON pattern above (api/identity only).

# Ignore legitimate requests, internal system endpoints, and well-known discovery endpoints
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)".* 200 .*$
              ^.*"OPTIONS /(api|identity)/.*" 20[04] .*$
              ^.*"HEAD /.*" 200 .*$
              ^.*\.well-known/.*$
              ^.*"GET /api/config".*$
              ^.*"GET /\.well-known/openid-configuration".*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs.
datepattern = ^\{"ts":%%s\.%%f,"
