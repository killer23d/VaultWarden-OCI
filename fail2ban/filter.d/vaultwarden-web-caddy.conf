# VaultWarden Comprehensive Web Security Filter (Caddy Logs)
# Covers authentication endpoint failures and API abuse via Caddy access logs.
# FIXED: tls block made optional (was required, missing on HTTP requests).
# FIXED: Removed overly broad 429 plain-text fallback to prevent false positives.
# Source log: /var/log/caddy/access.log

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log patterns.
# The tls block is optional (?): absent on plain HTTP (port 80 probes,
# ACME challenges, redirect phase). remote_ip and remote_port are
# separate fields in Caddy's structured logger (caddy.Log / zap format).
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[13].*\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/identity/connect/token.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[01].*\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/api/accounts/prelogin.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":401.*\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":404.*\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":429.*\}$

            # FALLBACK: Plain-text Caddy log patterns (non-JSON log_format)
            ^.*<ADDR>.*"POST /(api|identity)/.*" 40[013] .*$
            ^.*<ADDR>.*"POST /identity/connect/token.*" 40[01] .*$
            ^.*<ADDR>.*"POST /api/accounts/prelogin.*" 401 .*$
            ^.*<ADDR>.*".* /(api|identity)/.*" 404 .*$

# NOTE: The broad plain-text 429 fallback (^.*<ADDR>.*".* /.*" 429 .*$) has been
# intentionally removed. It would ban any user hitting any rate limit including
# legitimate traffic, Cloudflare origin pulls, and monitoring probes.
# 429 detection is retained in the scoped JSON pattern above (api/identity only).

# Ignore legitimate requests and internal system endpoints
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)".* 200 .*$
              ^.*"OPTIONS /(api|identity)/.*" 20[04] .*$
              ^.*"HEAD /.*" 200 .*$
              ^.*\.well-known/acme-challenge.*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs.
datepattern = ^\{"ts":%%s\.%%f,"
