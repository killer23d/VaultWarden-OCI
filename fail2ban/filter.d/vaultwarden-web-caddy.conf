# VaultWarden Comprehensive Security Filter (Caddy Logs)
# ENHANCED: Unified filter covering API endpoints, web attacks, and rate limiting
# CONSOLIDATION: Replaces both vaultwarden-api.conf and provides comprehensive coverage
# Optimized for Caddy JSON logs with fallback patterns for compatibility

[INCLUDES]
before = common.conf

[Definition]
# PRIMARY: Enhanced JSON-based detection for VaultWarden attacks via Caddy logs
# Covers authentication failures, API abuse, and rate limiting violations

# API and Identity endpoint authentication failures (401, 403)
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":40[13],"err_id":".*","err_trace":".*"\}$

# Specific high-value authentication endpoints (400, 401)
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/identity/connect/token.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":40[01],"err_id":".*","err_trace":".*"\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/api/accounts/prelogin.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":401,"err_id":".*","err_trace":".*"\}$

# API endpoint scanning/enumeration attempts (404 on API paths)
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":404,"err_id":".*","err_trace":".*"\}$

# Rate limiting violations (429 status - critical for password managers)
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":429,"err_id":".*","err_trace":".*"\}$

# FALLBACK: Alternative patterns for non-JSON Caddy logs (compatibility)
            ^.*<HOST>.*"POST /(api|identity)/.*" 40[013] .*$
            ^.*<HOST>.*"POST /identity/connect/token.*" 40[01] .*$
            ^.*<HOST>.*"POST /api/accounts/prelogin.*" 401 .*$
            ^.*<HOST>.*".* /(api|identity)/.*" 404 .*$
            ^.*<HOST>.*".* /.*" 429 .*$

# Ignore legitimate requests and system endpoints
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg).*" 200 .*$
              ^.*"GET /alive.*" 200 .*$
              ^.*"GET /api/alive.*" 200 .*$
              ^.*"OPTIONS /(api|identity)/.*" 20[04] .*$
              ^.*"HEAD /.*" 200 .*$

[Init]
maxlines = 1
datepattern = ^\{"ts":%%s\.%%f,"

# COMPREHENSIVE COVERAGE NOTES:
# 
# This filter provides unified detection for:
# 1. API authentication failures (covers vaultwarden-api.conf functionality)
# 2. Web interface attacks and brute force attempts
# 3. Rate limiting violations (critical for password managers)  
# 4. API endpoint enumeration and scanning
# 5. Specific high-value authentication endpoint attacks
#
# COMPATIBILITY FEATURES:
# - Primary JSON log parsing for Caddy structured logs
# - Fallback regex patterns for non-JSON Caddy configurations
# - Comprehensive ignore patterns for legitimate traffic
# - Optimized for VaultWarden-specific attack patterns
#
# OPERATIONAL BENEFITS:
# - Single filter file to maintain instead of multiple
# - Consistent detection logic across all web-based attacks
# - Better performance with unified pattern matching
# - Easier troubleshooting with centralized filter logic
