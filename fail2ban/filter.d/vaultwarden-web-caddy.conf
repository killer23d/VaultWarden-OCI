# VaultWarden Web Interface Security Filter (Caddy Logs)
# Enhanced: Caddy-based detection for web interface attacks
# Complements VaultWarden log parsing for comprehensive protection

[INCLUDES]
before = common.conf

[Definition]
# Enhanced regex patterns for web-based attacks via Caddy logs
# Using JSON log parsing for better reliability
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":40[13],"err_id":".*","err_trace":".*"\}$

# Alternative patterns for non-JSON Caddy logs (fallback)
            ^.*<HOST>.*"POST /(api|identity)/.*" 40[13] .*$
            ^.*<HOST>.*"POST /identity/connect/token.*" 400 .*$
            ^.*<HOST>.*"POST /api/accounts/prelogin.*" 401 .*$

# Rate limiting detection
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":429,"err_id":".*","err_trace":".*"\}$

# Ignore legitimate responses and static content
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg).*" 200 .*$
              ^.*"GET /alive.*" 200 .*$
              ^.*"OPTIONS .*" 20[04] .*$

[Init]
maxlines = 1
datepattern = ^\{"ts":%%s\.%%f,"

# Notes:
# This filter focuses on Caddy access logs to catch web-based attacks
# that might not appear in VaultWarden application logs. It uses both
# JSON parsing (primary) and regex fallbacks for maximum compatibility.
