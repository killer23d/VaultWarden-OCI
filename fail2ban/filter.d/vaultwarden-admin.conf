# VaultWarden Admin Panel Security Filter
# FIXED: High-fidelity parsing of VaultWarden admin access attempts
# Detects unauthorized admin access from application logs

[INCLUDES]
before = common.conf

[Definition]
# FIXED: Parse actual VaultWarden admin-related authentication failures
# Focus on admin panel specific security events
failregex = ^.*\[ERROR\].*Admin authentication failed.*<HOST>.*$
            ^.*\[WARN\].*Unauthorized admin access attempt.*from <HOST>.*$
            ^.*\[ERROR\].*Invalid admin token.*client:<HOST>.*$
            ^.*\[WARN\].*Admin login failed.*IP:<HOST>.*$
            ^.*\[ERROR\].*Admin panel access denied.*<HOST>.*$
            ^.*\[WARN\].*Failed admin authentication.*from.*<HOST>.*$

# Also catch admin-specific HTTP attacks as backup (from Caddy logs)
# These complement the VaultWarden log parsing
            ^.*\s<HOST>\s.*"(GET|POST)\s+/admin.*"\s(401|403|404).*$
            ^.*\s<HOST>\s.*".*\s+/admin/.*"\s(401|403|404).*$

# Ignore legitimate admin operations
ignoreregex = ^.*\[INFO\].*Admin.*authenticated successfully.*$
              ^.*\[INFO\].*Admin operation completed.*$
              ^.*\[DEBUG\].*Admin.*$

[Init]
maxlines = 1
journalmatch = _SYSTEMD_UNIT=docker.service
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S

# Notes:
# Admin panel attacks are particularly dangerous, so this filter combines:
# 1. High-fidelity VaultWarden log parsing for auth failures
# 2. Backup HTTP status detection from Caddy logs
# This ensures comprehensive protection against admin panel attacks
