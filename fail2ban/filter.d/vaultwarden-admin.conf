# VaultWarden Admin Panel Security Filter
# Matches the exact VaultWarden admin authentication failure log message.
# Source log: /var/log/vaultwarden/vaultwarden.log (Docker volume mount)
# Caddy-level admin endpoint coverage is handled by vaultwarden-web-caddy.conf.

[INCLUDES]
before = common.conf

[Definition]

# Exact VaultWarden log message for admin token failures.
# <ADDR> matches both IPv4 and IPv6.
# Reference: https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
failregex = ^.*Invalid admin token\. IP: <ADDR>.*$

# Ignore successful admin operations and debug noise
ignoreregex = ^.*\[INFO\].*$
              ^.*\[DEBUG\].*$

[Init]
maxlines = 1

# Two-line datepattern covers both ISO 8601 with T-separator and space-separator.
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
