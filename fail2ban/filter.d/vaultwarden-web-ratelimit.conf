# VaultWarden Web Rate-Limit Filter (Caddy Logs)
# Matches HTTP 429 responses emitted by VaultWarden's internal rate limiter
# on the API and identity endpoints. This is a distinct event from auth
# failures (401/403) — it fires when the server-side rate limiter trips,
# not when credentials are wrong.
#
# Used exclusively by [vaultwarden-rate-limit].
# Keeping this filter separate from vaultwarden-web-auth.conf prevents
# double-fire: each matched log line can only increment one jail's counter.
#
# Source log: /var/log/caddy/access.log
# caddy-cloudflare build (>= v2.11.0): remote_ip = real client IP

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log — HTTP 429 on API or identity endpoints only.
# \r?$ handles CRLF line endings from NFS-mounted log volumes (OCI).
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":429,.*\}\r?$

# FALLBACK: Plain-text Caddy log (non-JSON log_format)
            ^.*<HOST>.*".* /(api|identity)/.*" 429 .*\r?$

# Ignore 429s on paths that are NOT auth/API endpoints
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)".* 429 .*$
              ^.*\.well-known/acme-challenge.*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs
datepattern = ^\{"ts":%%s\.%%f,"
