# VaultWarden Authentication Failure Filter
# FIXED: High-fidelity parsing of actual VaultWarden authentication messages
# Detects real authentication failures from application logs, not HTTP status codes

[INCLUDES]
before = common.conf

[Definition]
# FIXED: Parse actual VaultWarden authentication failure messages
# These are the exact log messages VaultWarden produces for auth failures
failregex = ^.*\[ERROR\].*Invalid login attempt.*<HOST>.*$
            ^.*\[WARN\].*Failed login attempt.*from <HOST>.*$
            ^.*\[ERROR\].*Username or password is incorrect.*from.*<HOST>.*$
            ^.*\[WARN\].*Invalid credentials.*<HOST>.*$
            ^.*\[ERROR\].*Authentication failed.*client:<HOST>.*$
            ^.*\[WARN\].*Login failed.*IP:<HOST>.*$
            ^.*\[ERROR\].*Failed to authenticate user.*<HOST>.*$

# Ignore successful authentications and normal operations
ignoreregex = ^.*\[INFO\].*User.*authenticated successfully.*$
              ^.*\[DEBUG\].*$
              ^.*\[INFO\].*Successful login.*$

[Init]
# Maximum number of lines to buffer for multiline log analysis
maxlines = 1

# Additional metadata for enhanced detection
journalmatch = _SYSTEMD_UNIT=docker.service

# Date pattern matching for VaultWarden log format
datepattern = ^%%Y-%%m-%%d %%H:%%M:%%S

# Notes:
# This filter provides high-fidelity detection by parsing actual VaultWarden
# authentication failure messages instead of relying on HTTP status codes.
# It eliminates false positives from legitimate 401/403 responses and
# ensures only real authentication failures trigger IP bans.
