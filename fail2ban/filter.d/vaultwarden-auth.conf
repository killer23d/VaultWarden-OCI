# VaultWarden Authentication Failure Filter
# Matches VaultWarden application log messages for authentication failures.
# Covers password failures, TOTP failures, and device verification failures.
# Source log: /var/log/vaultwarden/vaultwarden.log (Docker volume mount)
#
# DUAL-FORMAT SUPPORT
# This filter handles both log formats VaultWarden can emit:
#
#   Plaintext (default): LOG_FORMAT not set or LOG_FORMAT=text
#     [2024-01-15 12:34:56][ERROR][auth] Username or password is incorrect. Try again. IP: 1.2.3.4.
#
#   JSON (structured):   LOG_FORMAT=json in .env
#     {"timestamp":"2024-01-15T12:34:56Z","level":"ERROR","target":"vaultwarden::api::identity",
#      "fields":{"message":"Username or password is incorrect","ip":"1.2.3.4"}}
#
# Both sets of failregex live in this single file.  Fail2ban evaluates every
# regex against every line; only one format will produce matches at runtime
# depending on which lines appear in the log.  No runtime branching, no second
# jail, no action-level filter selection needed.
#
# DOUBLE-COUNT WARNING:
# vaultwarden-auth and vaultwarden-web-auth both detect auth failures.
# Do NOT apply both filters to the same logfile in a single jail.
# Use vaultwarden-auth for the application log and vaultwarden-web-auth
# for the Caddy access log.  Applying both to the same source will cause
# each failure to be counted twice, halving the effective maxretry threshold.

[INCLUDES]
before = common.conf

[Definition]

# P4-01 fix: Added prefregex to pre-filter only VaultWarden ERROR/WARN/WARNING
# lines for the plaintext format, preventing cross-container log contamination.
# JSON lines do not begin with '[' so the prefregex alternation includes '{'.
prefregex = ^(?:\[.+\]\[(?:ERROR|WARN|WARNING)\]|\{")

# ---------------------------------------------------------------------------
# Plaintext format (LOG_FORMAT=text, the default)
# Log format: [TIMESTAMP][LEVEL][MODULE] MESSAGE IP: X.X.X.X.
# Patterns are anchored on the " IP: <HOST>" tail to prevent loose matching
# from triggering on non-auth lines from other containers.
# Reference: https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
# ---------------------------------------------------------------------------
failregex = ^\[.+\]\[(?:ERROR|WARN|WARNING)\]\[.+\] .*Username or password is incorrect\. Try again\. IP: <HOST>\..*$
            ^\[.+\]\[(?:ERROR|WARN|WARNING)\]\[.+\] .*Invalid TOTP code.*IP: <HOST>\..*$
            ^\[.+\]\[(?:ERROR|WARN|WARNING)\]\[.+\] .*Device verification failed\..*IP: <HOST>\..*$

# ---------------------------------------------------------------------------
# JSON format (LOG_FORMAT=json in .env, VaultWarden 1.30+)
# Log format: {"timestamp":"...","level":"...","fields":{"message":"...","ip":"..."}}
# The ip field holds the real client IP forwarded by Caddy via
# the CF-Connecting-IP / X-Real-IP header chain.
# Field order within "fields" is not guaranteed by the tracing-subscriber
# JSON formatter; use non-anchored patterns that match regardless of order.
# ---------------------------------------------------------------------------
            ^\{.*"level":"(?:ERROR|WARN|WARNING)".*"message":"Username or password is incorrect[^"]*".*"ip":"<HOST>".*\}$
            ^\{.*"level":"(?:ERROR|WARN|WARNING)".*"message":"Invalid TOTP code[^"]*".*"ip":"<HOST>".*\}$
            ^\{.*"level":"(?:ERROR|WARN|WARNING)".*"message":"Device verification failed[^"]*".*"ip":"<HOST>".*\}$

# Suppress debug noise and unrelated info lines.
# CHANGED: ignoreregex no longer hard-codes [INFO] suppression.
# Previously the [INFO] negative-lookahead suppressed any future auth failure
# messages that Vaultwarden might change from [ERROR] to [INFO] level, causing
# silent missed detections.  The failregex patterns above now cover ERROR,
# WARN, and WARNING levels; DEBUG lines are still suppressed.
# If Vaultwarden adds [INFO]-level auth failure messages in a future release,
# add [INFO] to the failregex alternation above and the prefregex.
# Monitor release notes at: https://github.com/dani-garcia/vaultwarden/releases
ignoreregex = ^.*\[DEBUG\].*$
              ^\{.*"level":"DEBUG".*\}$

[Init]
maxlines = 1

# Two-line datepattern covers both ISO 8601 with T-separator and space-separator,
# and accommodates optional subsecond precision emitted by VaultWarden.
# Both forms appear depending on VaultWarden version and log configuration.
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
