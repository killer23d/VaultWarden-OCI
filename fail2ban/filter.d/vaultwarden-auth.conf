# VaultWarden Authentication Failure Filter
# Matches exact VaultWarden application log messages per official wiki.
# Covers password failures, TOTP failures, and device verification failures.
# Source log: /var/log/vaultwarden/vaultwarden.log (Docker volume mount)
#
# DOUBLE-COUNT WARNING:
# vaultwarden-auth and vaultwarden-web-auth both detect auth failures.
# Do NOT apply both filters to the same logfile in a single jail.
# Use vaultwarden-auth for the application log and vaultwarden-web-auth
# for the Caddy access log.  Applying both to the same source will cause
# each failure to be counted twice, halving the effective maxretry threshold.

[INCLUDES]
before = common.conf

[Definition]

# Exact VaultWarden log messages for authentication failures.
# <ADDR> matches both IPv4 and IPv6 (preferred over <HOST>).
# Reference: https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
failregex = ^.*\[(?:ERROR|WARN|WARNING)\] .*Username or password is incorrect\. Try again\. IP: <ADDR>\..*$
            ^.*\[(?:ERROR|WARN|WARNING)\] .*Invalid TOTP code! Server time:.*IP: <ADDR>\..*$
            ^.*\[(?:ERROR|WARN|WARNING)\] .*Device verification failed\..*IP: <ADDR>\..*$

# Suppress debug noise and unrelated info lines.
# CHANGED: ignoreregex no longer hard-codes [INFO] suppression.
# Previously the [INFO] negative-lookahead suppressed any future auth failure
# messages that Vaultwarden might change from [ERROR] to [INFO] level, causing
# silent missed detections.  The failregex patterns above now cover ERROR,
# WARN, and WARNING levels; DEBUG lines are still suppressed.
# If Vaultwarden adds [INFO]-level auth failure messages in a future release,
# add [INFO] to the failregex alternation above.
# Monitor release notes at: https://github.com/dani-garcia/vaultwarden/releases
ignoreregex = ^.*\[DEBUG\].*$

[Init]
maxlines = 1

# Two-line datepattern covers both ISO 8601 with T-separator and space-separator,
# and accommodates optional subsecond precision emitted by VaultWarden.
# Both forms appear depending on VaultWarden version and log configuration.
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
