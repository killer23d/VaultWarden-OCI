# VaultWarden Authentication Failure Filter
# Matches exact VaultWarden application log messages per official wiki.
# Covers password failures, TOTP failures, and device verification failures.
# Source log: /var/log/vaultwarden/vaultwarden.log (Docker volume mount)

[INCLUDES]
before = common.conf

[Definition]

# Exact VaultWarden log messages for authentication failures.
# <ADDR> matches both IPv4 and IPv6 (preferred over <HOST>).
# Reference: https://github.com/dani-garcia/vaultwarden/wiki/Fail2Ban-Setup
failregex = ^.*\[ERROR\] .*Username or password is incorrect\. Try again\. IP: <ADDR>\..*$
            ^.*\[ERROR\] .*Invalid TOTP code! Server time:.*IP: <ADDR>\..*$
            ^.*\[ERROR\] .*Device verification failed\..*IP: <ADDR>\..*$

# Ignore successful authentications and debug noise
ignoreregex = ^.*\[INFO\].*$
              ^.*\[DEBUG\].*$

[Init]
maxlines = 1

# Two-line datepattern covers both ISO 8601 with T-separator and space-separator,
# and accommodates optional subsecond precision emitted by VaultWarden.
# Both forms appear depending on VaultWarden version and log configuration.
datepattern = {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S
              {^LN-BEG}%%Y-%%m-%%d %%H:%%M:%%S
