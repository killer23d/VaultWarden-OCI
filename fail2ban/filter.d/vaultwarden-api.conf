# Fail2Ban filter for VaultWarden API (Caddy JSON logs via regex)
# Converted from JMESPath to avoid python-jmespath dependency

[INCLUDES]
before = common.conf

[Definition]
# API authentication failures - JSON format (primary)
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":40[13],"err_id":".*","err_trace":".*"\}$

# API specific endpoints that indicate brute force attempts
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/identity/connect/token.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":400,"err_id":".*","err_trace":".*"\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/api/accounts/prelogin.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":401,"err_id":".*","err_trace":".*"\}$

# 404s on API endpoints (scanning attempts)
            ^\{"ts":.*,"request":\{"remote_ip":"<HOST>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\},"tls":\{.*\}\},"duration":[0-9.]+,"status":404,"err_id":".*","err_trace":".*"\}$

# Ignore legitimate requests
ignoreregex = ^.*"GET /api/alive.*" 200 .*$
              ^.*"OPTIONS /(api|identity)/.*" 20[04] .*$

[Init]
maxlines = 1
datepattern = ^\{"ts":%%s\.%%f,"
