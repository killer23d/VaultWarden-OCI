# VaultWarden Web Admin Panel Filter (Caddy Logs)
# Detects failed access attempts on the /admin path via Caddy JSON access logs.
#
# Used exclusively by the [vaultwarden-web-admin] jail.
# Kept separate from vaultwarden-web-auth.conf to prevent double-firing:
# both jails previously shared vaultwarden-web-caddy.conf, causing every
# matched log line to increment counters in both jails simultaneously and
# sending duplicate ban notification emails per event.
#
# Source log: /var/log/caddy/access.log
# caddy-cloudflare build (>= v2.11.0): remote_ip = real client IP

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log patterns scoped to /admin path.
# 401 = Caddy basic_auth rejection; 403 = explicit deny; 404 = path probe.
# tls block is optional.
# FIX [FW-5]: Added \r?$ to handle CRLF line endings (OCI NFS volumes).
# Mirrors the \r?$ fix applied to the auth, web-caddy, and security filters.
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/admin.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[134].*\}\r?$

# FALLBACK: Plain-text Caddy log patterns
            ^.*<ADDR>.*"(?:GET|POST|HEAD) /admin.*" 40[134] .*\r?$

# Ignore successful admin page loads (200/304) and CORS preflight
ignoreregex = ^.*"GET /admin.*" 20[04] .*$
              ^.*"OPTIONS /admin.*" 20[04] .*$
              ^.*\.well-known/acme-challenge.*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs
datepattern = ^\{"ts":%%s\.%%f,"
