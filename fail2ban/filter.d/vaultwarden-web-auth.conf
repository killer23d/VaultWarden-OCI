# VaultWarden Web Authentication Filter (Caddy Logs)
# Detects authentication failures on API and identity endpoints via Caddy
# JSON access logs. Scoped to /api/ and /identity/ endpoints only.
#
# Used exclusively by the [vaultwarden-web-auth] jail.
# Kept separate from vaultwarden-web-admin.conf to prevent double-firing:
# both jails previously shared vaultwarden-web-caddy.conf, causing every
# matched log line to increment counters in both jails simultaneously.
#
# Source log: /var/log/caddy/access.log
# caddy-cloudflare build (>= v2.11.0): remote_ip = real client IP

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log patterns.
# tls block is optional: absent on plain HTTP (port-80 probes, ACME phase).
# FIX [FW-1]: Appended \r?$ to all 5 JSON failregex lines.
# On NFS-mounted log volumes (common on OCI), lines end \r\n. The bare $
# anchor does not consume \r, causing all JSON structured-log detections
# to silently fail. Only the plaintext fallback patterns would fire without
# this fix. The \r?$ anchor handles both \n and \r\n line endings.
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[13].*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/identity/connect/token.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":40[01].*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":"POST","host":".*","uri":"/api/accounts/prelogin.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":401.*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":404.*\}\r?$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>","remote_port":\d+,"proto":"HTTP.*","method":".*","host":".*","uri":"/(api|identity)/.*","headers":\{.*\}(?:,"tls":\{.*?\})?\},"duration":[0-9.]+,"status":429.*\}\r?$

# FALLBACK: Plain-text Caddy log patterns (non-JSON log_format)
# FIX [FW-2]: Added \r?$ to all plaintext fallback patterns to handle CRLF
# line endings from NFS-mounted log volumes (OCI). Mirrors the \r?$ fix
# already applied to the JSON patterns above.
            ^.*<ADDR>.*"POST /(api|identity)/.*" 40[013] .*\r?$
            ^.*<ADDR>.*"POST /identity/connect/token.*" 40[01] .*\r?$
            ^.*<ADDR>.*"POST /api/accounts/prelogin.*" 401 .*\r?$
            ^.*<ADDR>.*".* /(api|identity)/.*" 404 .*\r?$

# Ignore static assets, CORS preflight, HEAD probes, ACME, and well-known discovery endpoints
ignoreregex = ^.*"GET /.*\.(css|js|png|jpg|jpeg|gif|ico|woff|woff2|ttf|svg)".* 200 .*$
              ^.*"OPTIONS /(api|identity)/.*" 20[04] .*$
              ^.*"HEAD /.*" 200 .*$
              ^.*\.well-known/acme-challenge.*$
              ^.*"GET /api/config".*$
              ^.*"GET /\.well-known/openid-configuration".*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs
datepattern = ^\{"ts":%%s\.%%f,"
