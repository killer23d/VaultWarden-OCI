# VaultWarden Security Scanner / Exploit Probe Filter (Caddy Logs)
# NOTE: This filter is used by the [vaultwarden-probe-scanner] jail in
# jail.d/vaultwarden-oci.conf (formerly [vaultwarden-2fa]; renamed to
# accurately reflect that this filter detects generic scanner and
# exploit-probe traffic — not 2FA or TOTP bypass attempts).
# The [vaultwarden-probe-scanner] jail (filter = vaultwarden-security)
# must be enabled.
# See P4-07 fix in jail.d/vaultwarden-oci.conf.
# Detects scanner and exploit-probe traffic targeting paths that have no
# legitimate use in a VaultWarden deployment.
# Source log: /var/log/caddy/access.log
#
# FIXED: Removed overbroad JSON 400/404 pattern that had no URI constraint.
# It would fire on ANY request returning 400/404 — including Cloudflare
# healthchecks, ACME renewal probes, and normal browser 404s — causing
# false-positive bans at maxretry=1 with a 48h ban time.
# All patterns are now scoped to specific probe URI paths only.

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log patterns for scanner/probe traffic.
# With caddy-cloudflare-ip (caddy-cloudflare build >= v2.11.0), remote_ip
# is rewritten to the real client IP from Cf-Connecting-Ip.
# The tls block is optional — probes frequently arrive over plain HTTP.
# FIX [FW-4]: Added \r?$ to JSON failregex to handle CRLF line endings.
# Matches FW-1/FW-2/FW-3 fixes applied to the auth and web-caddy filters.
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>".*"uri":"(?:/wp-admin|/wp-login\.php|/phpmyadmin|/pma|/\.env|/\.git|/xmlrpc\.php|/admin\.php|/shell\.php|/cmd\.php|/eval\.php|/upload\.php|/\.aws/credentials|/\.ssh/|/etc/passwd|/proc/self|/actuator/health|/api/swagger|/manager/html)(?:/.*)?".*\},.*\}\r?$

# FALLBACK: Plain-text Caddy log patterns (non-JSON log_format)
            ^.*<ADDR>.*"(?:GET|POST|HEAD) (?:/wp-admin|/wp-login\.php|/phpmyadmin|/pma|/\.env|/\.git/|/xmlrpc\.php|/admin\.php|/shell\.php|/cmd\.php|/eval\.php|/upload\.php|/\.aws/credentials|/\.ssh/|/actuator/health|/api/swagger|/manager/html).*" \d+ .*$

# Ignore ACME challenge paths and internal health endpoints
ignoreregex = ^.*\.well-known/acme-challenge.*$
              ^.*"GET /alive".*$
              ^.*"GET /api/alive".*$

[Init]
maxlines = 1

# Epoch-based datepattern for Caddy JSON structured logs
datepattern = ^\{"ts":%%s\.%%f,"
