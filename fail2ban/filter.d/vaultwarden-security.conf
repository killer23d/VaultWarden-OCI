# VaultWarden Security Scanner / Exploit Probe Filter (Caddy Logs)
# Detects scanner and exploit-probe traffic targeting paths that have no
# legitimate use in a VaultWarden deployment.
# Source log: /var/log/caddy/access.log
#
# This filter is REQUIRED: jail.d/vaultwarden-oci.conf references it via
# filter = vaultwarden-security. Fail2Ban will not start without this file.

[INCLUDES]
before = common.conf

[Definition]

# PRIMARY: JSON Caddy log patterns for scanner/probe traffic.
# tls block is optional (omitted on plain HTTP probes).
failregex = ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>".*"uri":"/(wp-admin|wp-login\.php|phpmyadmin|pma|\.env|\.git|xmlrpc\.php|admin\.php|shell\.php|cmd\.php|eval\.php|upload\.php|\.aws/credentials|\.ssh/|etc/passwd|proc/self).*"\}.*\}$
            ^\{"ts":.*,"request":\{"remote_ip":"<ADDR>".*\},"duration":[0-9.]+,"status":40[04],"err_id":".*".*\}$

# FALLBACK: Plain-text Caddy log patterns (non-JSON log_format)
            ^.*<ADDR>.*"(GET|POST|HEAD) /(wp-admin|wp-login\.php|phpmyadmin|pma|\.env|\.git/|xmlrpc\.php|admin\.php|shell\.php|cmd\.php|eval\.php|upload\.php).*" \d+ .*$
            ^.*<ADDR>.*"(GET|POST) /.*" 400 .*$

# Ignore Caddy's own ACME challenge paths and health endpoints
ignoreregex = ^.*\.well-known/acme-challenge.*$
              ^.*"GET /alive".*$
              ^.*"GET /api/alive".*$

[Init]
maxlines = 1

# JSON datepattern for Caddy structured logs (epoch seconds.fractional)
datepattern = ^\{"ts":%%s\.%%f,"
              {^LN-BEG}%%Y-%%m-%%dT%%H:%%M:%%S
