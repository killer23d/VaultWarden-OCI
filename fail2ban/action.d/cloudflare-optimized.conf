# fail2ban/action.d/cloudflare-optimized.conf
#
# Optimized Cloudflare API action with error handling and rate limiting
# Replaces the basic cloudflare.conf with production-ready features
#
[Definition]

# Rate limiting: max 30 API calls per minute to avoid Cloudflare limits
actionstart = mkdir -p /tmp/f2b-cf-rate 2>/dev/null || true
actionstop = rm -rf /tmp/f2b-cf-rate 2>/dev/null || true
actioncheck = 

# Enhanced ban action with error handling and logging
actionban = /bin/bash -c '
    # Rate limiting check
    rate_file="/tmp/f2b-cf-rate/$(date +%%M)"
    if [[ -f "$rate_file" ]]; then
        count=$(cat "$rate_file" 2>/dev/null || echo "0")
        if [[ $count -ge 30 ]]; then
            logger -t fail2ban-cf "Rate limit reached, delaying ban for <ip>"
            sleep 2
        fi
    fi
    
    # Increment rate counter
    echo "$(($(cat "$rate_file" 2>/dev/null || echo "0") + 1))" > "$rate_file" 2>/dev/null || true
    
    # Execute ban with error handling
    response=$(curl -s -w "%%{http_code}" -X POST \
        "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules" \
        -H "Authorization: Bearer $(cat /run/secrets/fail2ban_cloudflare_firewall_token)" \
        -H "Content-Type: application/json" \
        --max-time 10 \
        --data "{\"mode\":\"block\",\"configuration\":{\"target\":\"ip\",\"value\":\"<ip>\"},\"notes\":\"Blocked by fail2ban <name> $(date)\"}" 2>/dev/null)
    
    http_code="${response: -3}"
    response_body="${response%???}"
    
    if [[ "$http_code" == "200" ]]; then
        logger -t fail2ban-cf "Successfully banned <ip> via Cloudflare"
        exit 0
    else
        logger -t fail2ban-cf "Failed to ban <ip>: HTTP $http_code - $response_body"
        exit 1
    fi'

# Enhanced unban action with improved error handling
actionunban = /bin/bash -c '
    # Get CF token
    CF_TOKEN=$(cat /run/secrets/fail2ban_cloudflare_firewall_token)
    
    # Find rule ID with timeout
    rule_response=$(curl -s -w "%%{http_code}" -X GET \
        "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>&per_page=1" \
        -H "Authorization: Bearer $CF_TOKEN" \
        -H "Content-Type: application/json" \
        --max-time 10 2>/dev/null)
    
    http_code="${rule_response: -3}"
    response_body="${rule_response%???}"
    
    if [[ "$http_code" != "200" ]]; then
        logger -t fail2ban-cf "Failed to query rules for <ip>: HTTP $http_code"
        exit 0  # Dont fail unban if we cant query
    fi
    
    # Extract rule ID using basic text processing (avoid jq dependency)
    rule_id=$(echo "$response_body" | grep -o "\"id\":\"[^\"]*\"" | head -1 | cut -d\" -f4)
    
    if [[ -z "$rule_id" ]]; then
        logger -t fail2ban-cf "No rule found for <ip>, may already be unbanned"
        exit 0
    fi
    
    # Delete rule
    delete_response=$(curl -s -w "%%{http_code}" -X DELETE \
        "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules/$rule_id" \
        -H "Authorization: Bearer $CF_TOKEN" \
        -H "Content-Type: application/json" \
        --max-time 10 2>/dev/null)
    
    delete_http_code="${delete_response: -3}"
    
    if [[ "$delete_http_code" == "200" ]]; then
        logger -t fail2ban-cf "Successfully unbanned <ip> from Cloudflare"
    else
        logger -t fail2ban-cf "Failed to unban <ip>: HTTP $delete_http_code"
    fi
    
    exit 0  # Always succeed unban to avoid issues'

[Init]
# cfzone is set in jail.d configuration
cfzone =