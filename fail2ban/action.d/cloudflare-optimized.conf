# Fail2ban action: Cloudflare + UFW dual blocking (transactional, idempotent, rate-limited)
# File: fail2ban/action.d/cloudflare-optimized.conf

[Definition]

# Variables expected from jail:
#  - env_CLOUDFLARE_ZONE_ID: Cloudflare Zone ID (inherited from environment)
#  - Token is read securely from /run/secrets/fail2ban_cloudflare_firewall_token inside the container

# Helper shell to keep logic readable
actionstart =
actionstop  =
actioncheck =

# Bounded retry helper with exponential backoff
_cf_retry() {
  local cmd="$1"
  local attempts="${2:-3}"
  local sleep_base="${3:-2}"
  local i=1
  while [ "$i" -le "$attempts" ]; do
    eval "$cmd" && return 0
    sleep $(( sleep_base ** i ))
    i=$((i+1))
  done
  return 1
}

# Compose CF auth headers (reads token from mounted secret)
_cf_headers() {
  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null)"
  [ -z "$CF_TOKEN" ] && echo "CF_TOKEN_MISSING" && return 1
  echo "-H 'Authorization: Bearer ${CF_TOKEN}' -H 'Content-Type: application/json'"
}

# Create CF block rule (idempotent by lookup before create)
_cf_block_ip() {
  local zone_id="$1" ip="$2" name="$3"
  local headers cmd body rid
  headers="$(_cf_headers)" || return 1

  # If rule exists, treat as success (idempotent)
  rid="$(bash -lc "curl -s -X GET 'https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip}&page=1&per_page=1' ${headers} | jq -r '.result[0].id // empty'")"
  if [ -n "$rid" ]; then
    return 0
  fi

  body="$(printf '{"mode":"block","configuration":{"target":"ip","value":"%s"},"notes":"f2b-%s"}' "$ip" "$name")"
  cmd="curl -s -X POST 'https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules' ${headers} --data '${body}' | jq -e '.success == true' >/dev/null"
  _cf_retry "$cmd" 3 2
}

# Delete CF block rule (idempotent)
_cf_unblock_ip() {
  local zone_id="$1" ip="$2"
  local headers rid cmd
  headers="$(_cf_headers)" || return 1

  rid="$(bash -lc "curl -s -X GET 'https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip}&page=1&per_page=1' ${headers} | jq -r '.result[0].id // empty'")"
  [ -z "$rid" ] && return 0

  cmd="curl -s -X DELETE 'https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules/${rid}' ${headers} | jq -e '.success == true' >/dev/null"
  _cf_retry "$cmd" 3 2
}

# Add UFW deny (idempotent-ish by comment tag)
_ufw_block_ip() {
  local ip="$1" name="$2"
  # Insert at top so local deny takes precedence; ignore error if exists
  ufw insert 1 deny from "$ip" comment "f2b-${name}" >/dev/null 2>&1 || ufw deny from "$ip" comment "f2b-${name}" >/dev/null 2>&1 || true
}

# Remove UFW deny (idempotent)
_ufw_unblock_ip() {
  local ip="$1"
  # Try rule-numbered delete first; if not present, try by spec; else ignore
  # Note: numbered deletion is fragile to ordering; spec deletion is fine if unique
  ufw delete deny from "$ip" >/dev/null 2>&1 || true
  # Best effort cleanup of older tagged comments (optional)
}

# Transactional ban: Cloudflare first, then UFW. Degrades safely if CF fails.
actionban = bash -lc '
  set -e
  zone="${env_CLOUDFLARE_ZONE_ID}"
  ip="<ip>"
  name="<name>"

  if [ -z "$zone" ]; then
    echo "[cloudflare-optimized] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1
  fi

  # Try Cloudflare ban (with retries)
  if _cf_block_ip "$zone" "$ip" "$name"; then
    cf="ok"
  else
    cf="fail"
    echo "[cloudflare-optimized] WARN: CF ban failed for ${ip}. Falling back to local UFW only."
  fi

  # Apply local UFW ban regardless (ensures local protection)
  if _ufw_block_ip "$ip" "$name"; then
    ufw="ok"
  else
    ufw="fail"
  fi

  if [ "$cf" = "ok" ] && [ "$ufw" = "ok" ]; then
    echo "[cloudflare-optimized] INFO: Dual ban succeeded (CF+UFW) for ${ip}"
    exit 0
  elif [ "$cf" = "ok" ] && [ "$ufw" = "fail" ]; then
    echo "[cloudflare-optimized] WARN: CF ban ok, UFW failed for ${ip}. Edge-only protection in effect."
    exit 0
  elif [ "$cf" = "fail" ] && [ "$ufw" = "ok" ]; then
    echo "[cloudflare-optimized] WARN: CF ban failed, UFW ban ok for ${ip}. Local-only protection in effect."
    exit 0
  else
    echo "[cloudflare-optimized] ERROR: Both CF and UFW ban failed for ${ip}"
    exit 1
  fi
'

# Transactional unban: remove from both sides; idempotent cleanup
actionunban = bash -lc '
  set -e
  zone="${env_CLOUDFLARE_ZONE_ID}"
  ip="<ip>"

  cf="skip"
  if [ -n "$zone" ]; then
    if _cf_unblock_ip "$zone" "$ip"; then
      cf="ok"
    else
      cf="fail"
    fi
  fi

  if _ufw_unblock_ip "$ip"; then
    ufw="ok"
  else
    ufw="fail"
  fi

  # Unban is best-effort: treat missing sides as success
  echo "[cloudflare-optimized] INFO: Unban results for ${ip}: CF=${cf}, UFW=${ufw}"
  exit 0
'

[Init]
# Require jq for JSON handling
init = bash -lc 'command -v jq >/dev/null 2>&1 || { echo "[cloudflare-optimized] ERROR: jq not found"; exit 1; }'
