# Fail2Ban SMTP notification action via bokysan/docker-postfix
# FIXED: Replaced hardcoded smtplib.SMTP('127.0.0.1', 587) with tag variables
#        <host> and <port> so jail-level host=/port= parameters are honoured.
#        int() cast is required: fail2ban tag substitution produces strings,
#        smtplib.SMTP() requires port as an integer.
# FIXED: All handlers now use STARTTLS (ehlo + starttls) to protect credentials
#        if host= is ever changed to a remote relay.
# FIXED: IP validation before whois call to prevent outbound to attacker-
#        controlled server via a crafted log line.
# FIXED: Timestamps now use datetime.now(timezone.utc) for accurate UTC
#        regardless of container TZ setting.
# FIXED: Deduplicated to a single shared Python helper script invoked with
#        --action argument; four inline scripts replaced.

[Definition]

# All four handlers delegate to the shared notification script.
# The script path must match the fail2ban container's action.d mount.
actionstart = /usr/bin/python3 /etc/fail2ban/action.d/smtp_notify.py \
                --action start \
                --name    '<name>' \
                --sender  '<sender>' \
                --dest    '<dest>' \
                --host    '<host>' \
                --port    '<port>'

actionstop  = /usr/bin/python3 /etc/fail2ban/action.d/smtp_notify.py \
                --action stop \
                --name   '<name>' \
                --sender '<sender>' \
                --dest   '<dest>' \
                --host   '<host>' \
                --port   '<port>'

actioncheck =

actionban   = /usr/bin/python3 /etc/fail2ban/action.d/smtp_notify.py \
                --action   ban \
                --name     '<name>' \
                --ip       '<ip>' \
                --failures '<failures>' \
                --sender   '<sender>' \
                --dest     '<dest>' \
                --host     '<host>' \
                --port     '<port>'

actionunban = /usr/bin/python3 /etc/fail2ban/action.d/smtp_notify.py \
                --action unban \
                --name   '<name>' \
                --ip     '<ip>' \
                --sender '<sender>' \
                --dest   '<dest>' \
                --host   '<host>' \
                --port   '<port>'

[Init]

name = default
host = 127.0.0.1
port = 587
