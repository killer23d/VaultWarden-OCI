actionban = /usr/bin/python3 -c "
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart
import subprocess
import sys
from datetime import datetime

def get_whois_info(ip):
    try:
        whois_output = subprocess.check_output(
            ['whois', ip], 
            text=True, 
            timeout=10,
            stderr=subprocess.DEVNULL
        )
        # Filter for relevant information
        relevant_lines = []
        for line in whois_output.split('\n'):
            line = line.strip()
            if any(keyword.lower() in line.lower() for keyword in [
                'orgname', 'organization', 'orgid', 'address', 'city', 
                'stateprov', 'postalcode', 'country', 'phone', 'comment',
                'netname', 'descr', 'admin-c', 'tech-c'
            ]):
                relevant_lines.append(line)
        
        return '\n'.join(relevant_lines[:15]) if relevant_lines else 'No relevant whois information found'
    except subprocess.TimeoutExpired:
        return 'Whois lookup timed out'
    except subprocess.CalledProcessError:
        return 'Whois lookup failed'
    except Exception as e:
        return f'Whois error: {str(e)}'

def send_email():
    msg = MIMEMultipart()
    msg['From'] = '<sender>'
    msg['To'] = '<dest>'
    msg['Subject'] = '🚨 [Fail2Ban] <name>: BANNED <ip> after <failures> attempts'

    whois_info = get_whois_info('<ip>')
    timestamp = datetime.now().strftime('%Y-%m-%d %H:%M:%S UTC')

    body = f'''🚨 SECURITY ALERT 🚨

The IP address <ip> has just been BANNED by Fail2Ban after <failures> failed attempts against <name>.

BAN DETAILS:
- IP Address: <ip>
- Service: <name>
- Failed Attempts: <failures>
- Ban Time: {timestamp}
- Server: VaultWarden-OCI

WHOIS INFORMATION:
{whois_info}

RECOMMENDED ACTIONS:
1. Review the attack patterns in your logs
2. Consider extending ban time if this is a repeat offender
3. Check for any successful logins from this IP before the ban
4. Monitor for attempts from related IP ranges

This is an automated security notification from your VaultWarden-OCI deployment.

Regards,
Fail2Ban Security Monitor'''

    msg.attach(MIMEText(body, 'plain'))

    try:
        server = smtplib.SMTP('msmtpd', 1025)
        server.send_message(msg)
        server.quit()
        print(f'Ban notification sent successfully for IP <ip>')
        return True
    except Exception as e:
        print(f'Failed to send ban notification: {e}', file=sys.stderr)
        return False

send_email()
"

