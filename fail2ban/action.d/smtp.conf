# Notes: This action uses Python SMTP to send emails via msmtpd sidecar container
# The msmtpd container runs on port 1025 and handles all SMTP authentication
# This eliminates the need for host mailutils dependencies

actionstart = /usr/bin/python3 -c "
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart
import sys

def send_email():
    msg = MIMEMultipart()
    msg['From'] = '<sender>'
    msg['To'] = '<dest>'
    msg['Subject'] = '[Fail2Ban] <name>: started'

    body = '''Hi,

The jail <name> has been started successfully.

Server: <name>
Status: Active
Configuration: VaultWarden-OCI Enhanced Security

Regards,
Fail2Ban'''

    msg.attach(MIMEText(body, 'plain'))

    try:
        server = smtplib.SMTP('msmtpd', 1025)
        server.send_message(msg)
        server.quit()
        print('Jail start notification sent successfully')
        return True
    except Exception as e:
        print(f'Failed to send jail start notification: {e}', file=sys.stderr)
        return False

send_email()
"

