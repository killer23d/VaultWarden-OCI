actionban = /usr/bin/python3 -c "
import smtplib, subprocess
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart

whois_text = ''
try:
    out = subprocess.check_output(['whois', '<ip>'], text=True, timeout=10)
    lines = [l for l in out.splitlines() if any(k in l for k in ['OrgName','Organization','OrgId','Address','City','StateProv','PostalCode','Country','Phone','Comment','netname','descr'])]
    whois_text = '\n'.join(lines[:20]) or 'No whois information available'
except Exception:
    whois_text = 'Whois lookup failed'

msg = MIMEMultipart()
msg['From'] = '<sender>'
msg['To'] = '<dest>'
msg['Subject'] = '[Fail2Ban] <name>: banned <ip>'

body = f'''Hi,

The IP <ip> has just been banned by Fail2Ban after <failures> attempts against <name>.

Here is more information about <ip>:
{whois_text}

Regards,
Fail2Ban'''
msg.attach(MIMEText(body, 'plain'))

server = smtplib.SMTP('msmtpd', 1025)
server.send_message(msg)
server.quit()
"

