[Definition]
# DEPRECATED shim: forward traditional sendmail-whois to the new smtp action
# This keeps existing jail configurations working while removing host mailutils.
# It sends the same content but routes through the msmtpd sidecar via smtp.conf.

# Common Python SMTP sender invoked with dynamic subject/body generation below.

actionstart = /usr/bin/python3 -c "
import smtplib
from email.mime.text import MIMEText
from email.mime.multipart import MIMEMultipart

msg = MIMEMultipart()
msg['From'] = '<sender>'
msg['To'] = '<dest>'
msg['Subject'] = '[Fail2Ban] <name>: started'

body = '''Hi,

The jail <name> has been started successfully.

Regards,
Fail2Ban'''
msg.attach(MIMEText(body, 'plain'))

server = smtplib.SMTP('msmtpd', 1025)
server.send_message(msg)
server.quit()
"

