# File: fail2ban/action.d/cloudflare-apiv4.conf
# Purpose: Cloudflare APIv4 blocking via Access Rules (no local firewall/UFW here).
# Notes: Local banning (iptables) should be handled by adding a separate action
#        (e.g., iptables-multiport) in the jail definition, not in this file.

[Definition]
# No-ops for lifecycle hooks
actionstart =
actionstop  =
actioncheck =

# Cloudflare ban (idempotent: checks for existing rule first)
actionban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"
  name="<name>"

  if [ -z "${zone}" ]; then
    echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"
    exit 1
  fi

  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  if [ -z "${CF_TOKEN}" ]; then
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 1
  fi

  _cf_api_call() {
    local endpoint="$1"
    local method="$2"
    local body="${3:-}"
    local response_file header_file cfg_file http_code retry_after

    response_file="$(mktemp)"
    header_file="$(mktemp)"
    cfg_file="$(mktemp)"
    chmod 600 "$cfg_file" 2>/dev/null || true
    printf "header = \"Authorization: Bearer %s\"\nheader = \"Content-Type: application/json\"\n" "$CF_TOKEN" > "$cfg_file"

    if [ -n "$body" ]; then
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" --data "$body" || echo "000")
    else
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" || echo "000")
    fi

    if [ "$http_code" = "429" ]; then
      retry_after=$(awk -F': *' 'tolower($1)=="retry-after"{gsub("\r", "", $2); print $2; exit}' "$header_file")
      [ -n "$retry_after" ] || retry_after=5
      rm -f "$cfg_file" "$header_file" "$response_file"
      echo "RETRY_AFTER:${retry_after}"
      return 2
    fi

    if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
      cat "$response_file"
      rm -f "$cfg_file" "$header_file" "$response_file"
      return 0
    fi

    rm -f "$cfg_file" "$header_file" "$response_file"
    return 1
  }

  _cf_retry() {
    local endpoint="$1" method="$2" body="${3:-}" attempts="${4:-4}" sleep_base="${5:-2}"
    local i=1 out
    while [ "$i" -le "$attempts" ]; do
      out="$(_cf_api_call "$endpoint" "$method" "$body")" && return 0
      rc=$?
      if [ "$rc" -eq 2 ] && printf "%s" "$out" | grep -q "^RETRY_AFTER:"; then
        sleep "${out#RETRY_AFTER:}"
      else
        sleep $(( sleep_base ** i ))
      fi
      i=$(( i + 1 ))
    done
    return 1
  }

  _cf_get_rule_id() {
    local zone_id="$1" ip_addr="$2" out
    out="$(_cf_api_call "https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip_addr}&page=1&per_page=1" "GET")" || return 1
    printf "%s" "$out" | jq -r ".result[0].id // empty"
  }

  rid="$(_cf_get_rule_id "$zone" "$ip" || true)"
  if [ -n "${rid}" ]; then
    echo "[cloudflare-apiv4] INFO: Rule already exists for ${ip}"
    exit 0
  fi

  body="$(printf "{\"mode\":\"block\",\"configuration\":{\"target\":\"ip\",\"value\":\"%s\"},\"notes\":\"f2b-%s\"}" "$ip" "$name")"
  if _cf_retry "https://api.cloudflare.com/client/v4/zones/${zone}/firewall/access_rules/rules" "POST" "$body"; then
    echo "[cloudflare-apiv4] INFO: CF ban succeeded for ${ip}"
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF ban failed for ${ip}"
  exit 1
'

# Cloudflare unban (idempotent: no-op if rule missing)
actionunban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"

  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  if [ -z "${CF_TOKEN}" ]; then
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 1
  fi

  _cf_api_call() {
    local endpoint="$1" method="$2" body="${3:-}" response_file header_file cfg_file http_code retry_after
    response_file="$(mktemp)"; header_file="$(mktemp)"; cfg_file="$(mktemp)"
    chmod 600 "$cfg_file" 2>/dev/null || true
    printf "header = \"Authorization: Bearer %s\"\nheader = \"Content-Type: application/json\"\n" "$CF_TOKEN" > "$cfg_file"

    if [ -n "$body" ]; then
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" --config "$cfg_file" -X "$method" "$endpoint" --data "$body" || echo "000")
    else
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" --config "$cfg_file" -X "$method" "$endpoint" || echo "000")
    fi

    if [ "$http_code" = "429" ]; then
      retry_after=$(awk -F': *' 'tolower($1)=="retry-after"{gsub("\r", "", $2); print $2; exit}' "$header_file")
      [ -n "$retry_after" ] || retry_after=5
      rm -f "$cfg_file" "$header_file" "$response_file"
      echo "RETRY_AFTER:${retry_after}"
      return 2
    fi

    if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && jq -e '.success == true' "$response_file" >/dev/null 2>&1; then
      cat "$response_file"
      rm -f "$cfg_file" "$header_file" "$response_file"
      return 0
    fi

    rm -f "$cfg_file" "$header_file" "$response_file"
    return 1
  }

  _cf_retry() {
    local endpoint="$1" method="$2" body="${3:-}" attempts="${4:-4}" sleep_base="${5:-2}"
    local i=1 out
    while [ "$i" -le "$attempts" ]; do
      out="$(_cf_api_call "$endpoint" "$method" "$body")" && return 0
      rc=$?
      if [ "$rc" -eq 2 ] && printf "%s" "$out" | grep -q "^RETRY_AFTER:"; then
        sleep "${out#RETRY_AFTER:}"
      else
        sleep $(( sleep_base ** i ))
      fi
      i=$(( i + 1 ))
    done
    return 1
  }

  _cf_get_rule_id() {
    local zone_id="$1" ip_addr="$2" out
    out="$(_cf_api_call "https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip_addr}&page=1&per_page=1" "GET")" || return 1
    printf "%s" "$out" | jq -r ".result[0].id // empty"
  }

  [ -n "$zone" ] || { echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1; }
  rid="$(_cf_get_rule_id "$zone" "$ip" || true)"
  [ -n "$rid" ] || { echo "[cloudflare-apiv4] INFO: No matching CF rule for ${ip}"; exit 0; }

  if _cf_retry "https://api.cloudflare.com/client/v4/zones/${zone}/firewall/access_rules/rules/${rid}" "DELETE"; then
    echo "[cloudflare-apiv4] INFO: CF unban succeeded for ${ip}"
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF unban failed for ${ip}"
  exit 1
'

[Init]
# Require jq for JSON handling
init = bash -lc 'command -v jq >/dev/null 2>&1 || { echo "[cloudflare-apiv4] ERROR: jq not found"; exit 1; }'
