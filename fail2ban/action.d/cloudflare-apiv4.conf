# File: fail2ban/action.d/cloudflare-apiv4.conf
# Purpose: Cloudflare APIv4 blocking via Access Rules (no local firewall/UFW here).
# Notes: Local banning (iptables) should be handled by adding a separate action
#        (e.g., iptables-multiport) in the jail definition, not in this file.

[Definition]
# No-ops for lifecycle hooks
actionstart =
actionstop  =
actioncheck =

# Cloudflare ban (idempotent: checks for existing rule first)
actionban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID}"
  ip="<ip>"
  name="<name>"

  if [ -z "${zone:-}" ]; then
    echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"
    exit 1
  fi

  # Read CF API token from Docker secret
  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  if [ -z "${CF_TOKEN}" ]; then
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 1
  fi

  _cf_retry() {
    local cmd="$1"
    local attempts="${2:-3}"
    local sleep_base="${3:-2}"
    local i=1
    while [ "$i" -le "$attempts" ]; do
      eval "$cmd" && return 0
      sleep $(( sleep_base ** i ))
      i=$((i+1))
    done
    return 1
  }

  _cf_block_ip() {
    local zone_id="$1"
    local ip="$2"
    local name="$3"

    # If rule exists, treat as success (idempotent)
    local rid
    rid="$(
      curl -s -X GET \
        "https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip}&page=1&per_page=1" \
        -H "Authorization: Bearer ${CF_TOKEN}" \
        -H "Content-Type: application/json" \
      | jq -r ".result[0].id // empty"
    )"
    if [ -n "${rid}" ]; then
      echo "[cloudflare-apiv4] INFO: Rule already exists for ${ip}"
      return 0
    fi

    # Create block rule
    local body
    body="$(printf "{\"mode\":\"block\",\"configuration\":{\"target\":\"ip\",\"value\":\"%s\"},\"notes\":\"f2b-%s\"}" "${ip}" "${name}")"

    local cmd
    cmd="curl -s -X POST \"https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules\" \
      -H \"Authorization: Bearer ${CF_TOKEN}\" -H \"Content-Type: application/json\" \
      --data '${body}' | jq -e '.success == true' >/dev/null"
    _cf_retry "${cmd}" 3 2
  }

  if _cf_block_ip "${zone}" "${ip}" "${name}"; then
    echo "[cloudflare-apiv4] INFO: CF ban succeeded for ${ip}"
    exit 0
  else
    echo "[cloudflare-apiv4] ERROR: CF ban failed for ${ip}"
    exit 1
  fi
'

# Cloudflare unban (idempotent: no-op if rule missing)
actionunban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID}"
  ip="<ip>"

  # Read CF API token from Docker secret
  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  if [ -z "${CF_TOKEN}" ]; then
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 0
  fi

  _cf_retry() {
    local cmd="$1"
    local attempts="${2:-3}"
    local sleep_base="${3:-2}"
    local i=1
    while [ "$i" -le "$attempts" ]; do
      eval "$cmd" && return 0
      sleep $(( sleep_base ** i ))
      i=$((i+1))
    done
    return 1
  }

  _cf_unblock_ip() {
    local zone_id="$1"
    local ip="$2"

    local rid
    rid="$(
      curl -s -X GET \
        "https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules?configuration.target=ip&configuration.value=${ip}&page=1&per_page=1" \
        -H "Authorization: Bearer ${CF_TOKEN}" \
        -H "Content-Type: application/json" \
      | jq -r ".result[0].id // empty"
    )"
    [ -z "${rid}" ] && return 0

    local cmd
    cmd="curl -s -X DELETE \"https://api.cloudflare.com/client/v4/zones/${zone_id}/firewall/access_rules/rules/${rid}\" \
      -H \"Authorization: Bearer ${CF_TOKEN}\" -H \"Content-Type: application/json\" \
      | jq -e '.success == true' >/dev/null"
    _cf_retry "${cmd}" 3 2
  }

  if [ -n "${zone}" ] && _cf_unblock_ip "${zone}" "${ip}"; then
    echo "[cloudflare-apiv4] INFO: CF unban succeeded for ${ip}"
  else
    echo "[cloudflare-apiv4] WARN: CF unban failed for ${ip}"
  fi

  exit 0
'

[Init]
# Require jq for JSON handling
init = bash -lc 'command -v jq >/dev/null 2>&1 || { echo "[cloudflare-apiv4] ERROR: jq not found"; exit 1; }'
