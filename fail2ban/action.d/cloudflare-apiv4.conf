# PREREQUISITE: actionban/actionunban execute under 'bash -lc' (for local
# keyword) and require jq and curl.  The bash ** exponentiation operator is
# NO LONGER used; delays are supplied via a POSIX-portable static table in
# the shared helper script.
# The shared helper script must be present at the path below.

[Definition]
# P7-23 fix: Source helpers and validate the CF token at fail2ban startup so a
# bad/missing token is caught immediately rather than silently failing on first ban.
actionstart = bash -lc '
  . /etc/fail2ban/action.d/cloudflare-apiv4-helpers.sh
  _cf_validate_token || { echo "ERROR: Cloudflare token validation failed — check fail2ban_cloudflare_firewall_token in secrets" >&2; exit 1; }
'
actionstop  =
actioncheck =

# ---------------------------------------------------------------------------
# Cloudflare WAF Custom Rules – actionban
#
# Migrated from the deprecated Firewall Access Rules API
#   (/zones/{zone_id}/firewall/access_rules/rules)
# to the current WAF Custom Rules Rulesets API
#   (/zones/{zone_id}/rulesets/{ruleset_id}/rules).
#
# API reference:
#   https://developers.cloudflare.com/api/operations/zone-rulesets-list-a-zone-s-rulesets
#   https://developers.cloudflare.com/waf/custom-rules/create-api/
#
# Behaviour:
#  - Locates (or creates) the zone's http_request_firewall_custom ruleset.
#  - Adds a "block" rule tagged "f2b-<name>-<ip>" for reliable unban lookup.
#  - Idempotent: exits 0 if the tag already exists.
#  - CF API token read from Docker secret; never passed on the command line.
#  - 429 responses honour the Retry-After header.
#  - DELETE returns 204 No Content (handled separately from JSON success checks).
#  - Helper functions sourced from cloudflare-apiv4-helpers.sh (single copy).
# ---------------------------------------------------------------------------
actionban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"
  name="<name>"

  [ -n "$zone" ] || { echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1; }

  # Source shared helpers (single authoritative copy).
  # P7-20 fix: _validate_ip, _cf_get_or_create_waf_ruleset, and _cf_find_rule_id
  # are now defined in the helpers file; duplicate inline definitions removed.
  # shellcheck source=cloudflare-apiv4-helpers.sh
  . /etc/fail2ban/action.d/cloudflare-apiv4-helpers.sh

  # Load and export CF_TOKEN from Docker secret.
  _cf_load_token || exit 1

  if ! _validate_ip "$ip"; then
    echo "[cloudflare-apiv4] ERROR: invalid IP address substitution: '"'"'$ip'"'"'" >&2
    exit 1
  fi

  # Stable tag: jail-name + IP so actionunban can locate the exact rule.
  tag="f2b-${name}-${ip}"

  ruleset_id="$(_cf_get_or_create_waf_ruleset "$zone")" || {
    echo "[cloudflare-apiv4] ERROR: cannot get/create WAF ruleset for zone ${zone}"
    exit 1
  }

  # Idempotent: skip if a block rule for this tag already exists.
  existing_id="$(_cf_find_rule_id "$zone" "$ruleset_id" "$tag" || true)"
  if [ -n "$existing_id" ]; then
    echo "[cloudflare-apiv4] INFO: WAF block rule already exists for ${ip} (rule_id=${existing_id})"
    exit 0
  fi

  # P7-21 fix: Build JSON payload via jq so IP and tag values are safely quoted
  # and never interpolated raw into the JSON string (prevents injection).
  body="$(jq -cn --arg ip "$ip" --arg desc "$tag" \
    '"'"'{"action":"block","expression":("(ip.src eq \"" + $ip + "\")"), "description": $desc, "enabled": true}'"'"')"

  if _cf_retry \
    "https://api.cloudflare.com/client/v4/zones/${zone}/rulesets/${ruleset_id}/rules" \
    "POST" "$body"; then
    echo "[cloudflare-apiv4] INFO: WAF block rule created for ${ip} (tag: ${tag})"
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF ban failed for ${ip}" >&2
  # W4-C6 FALLBACK: Apply a local iptables DROP so the IP is blocked at the host
  # firewall even when the Cloudflare API is unreachable or returns an error.
  # This ensures enforcement never fails open during a CF outage.
  if command -v iptables >/dev/null 2>&1; then
    if iptables -I INPUT -s "${ip}" -j DROP 2>/dev/null; then
      echo "[cloudflare-apiv4] WARN: CF unreachable — applied local iptables DROP for ${ip}"
    else
      echo "[cloudflare-apiv4] WARN: iptables fallback also failed for ${ip}" >&2
    fi
  else
    echo "[cloudflare-apiv4] WARN: iptables not found — no fallback ban applied for ${ip}" >&2
  fi
  exit 1
'

# ---------------------------------------------------------------------------
# Cloudflare WAF Custom Rules – actionunban
# Idempotent: exits 0 if no matching rule is found.
# ---------------------------------------------------------------------------
actionunban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"
  name="<name>"

  [ -n "$zone" ] || { echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1; }

  # Source shared helpers (single authoritative copy).
  # P7-20 fix: _validate_ip, _cf_get_waf_ruleset_id, and _cf_find_rule_id
  # are now defined in the helpers file; duplicate inline definitions removed.
  # shellcheck source=cloudflare-apiv4-helpers.sh
  . /etc/fail2ban/action.d/cloudflare-apiv4-helpers.sh

  # Load and export CF_TOKEN from Docker secret.
  _cf_load_token || exit 1

  if ! _validate_ip "$ip"; then
    echo "[cloudflare-apiv4] ERROR: invalid IP address substitution: '"'"'$ip'"'"'" >&2
    exit 1
  fi

  tag="f2b-${name}-${ip}"

  ruleset_id="$(_cf_get_waf_ruleset_id "$zone" || true)"
  if [ -z "$ruleset_id" ]; then
    echo "[cloudflare-apiv4] INFO: no WAF ruleset found for zone ${zone} — nothing to unban"
    exit 0
  fi

  rule_id="$(_cf_find_rule_id "$zone" "$ruleset_id" "$tag" || true)"
  if [ -z "$rule_id" ]; then
    echo "[cloudflare-apiv4] INFO: no WAF rule found for ${ip} (tag: ${tag}) — nothing to do"
    exit 0
  fi

  if _cf_retry \
    "https://api.cloudflare.com/client/v4/zones/${zone}/rulesets/${ruleset_id}/rules/${rule_id}" \
    "DELETE"; then
    echo "[cloudflare-apiv4] INFO: WAF block rule deleted for ${ip} (tag: ${tag})"
    # W4-C6: Also remove any iptables fallback rule that may have been applied during a CF outage.
    if command -v iptables >/dev/null 2>&1; then
      iptables -D INPUT -s "${ip}" -j DROP 2>/dev/null || true
    fi
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF unban failed for ${ip} — rule may persist"
  exit 1
'

# IMPORTANT: Override 'name' per jail in each jail's action= directive, e.g.:
#   action = cloudflare-apiv4[name=vaultwarden-auth]
# Using the default name for multiple jails causes WAF rule tag collisions:
# banning IP x in jail A then unbanning it from jail B fires against the same
# tag, silently removing the wrong rule.  The CHANGEME sentinel below is
# intentionally visible in logs and WAF rule descriptions so a missed override
# is immediately obvious.
# P7-22 fix: added comment block and CHANGEME sentinel.

[Init]
name = f2b-vaultwarden-CHANGEME
