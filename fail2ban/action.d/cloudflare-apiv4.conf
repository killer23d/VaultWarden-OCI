# Cloudflare API v4 Action for VaultWarden-OCI
# Enhanced: Robust Cloudflare integration with better error handling

[INCLUDES]
before = iptables-common.conf

[Definition]
# Cloudflare API v4 firewall rule actions
actionstart = 
actionstop = 
actioncheck = 
actionban = curl -s -X POST "https://api.cloudflare.com/client/v4/zones/<cf_zone_id>/firewall/access_rules/rules" \
            -H "Authorization: Bearer <cfapi_token>" \
            -H "Content-Type: application/json" \
            --data '{"mode":"block","configuration":{"target":"ip","value":"<ip>"},"notes":"Fail2Ban VaultWarden-OCI <name> <time>"}' \
            | jq -r '.success // false' | grep -q 'true' || echo "Cloudflare ban failed for <ip>"

actionunban = curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<cf_zone_id>/firewall/access_rules/rules?mode=block&configuration_target=ip&configuration_value=<ip>&notes=Fail2Ban" \
              -H "Authorization: Bearer <cfapi_token>" \
              -H "Content-Type: application/json" | jq -r '.result[0].id // empty' | \
              xargs -I {} curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/<cf_zone_id>/firewall/access_rules/rules/{}" \
              -H "Authorization: Bearer <cfapi_token>" \
              -H "Content-Type: application/json"

[Init]
# Configuration parameters
cf_zone_id = 
cfapi_token = 
name = default

# Notes:
# This action integrates with Cloudflare's global network to block IPs
# at the edge, preventing attacks from reaching your server entirely.
# Enhanced error handling ensures ban operations are logged and verified.
