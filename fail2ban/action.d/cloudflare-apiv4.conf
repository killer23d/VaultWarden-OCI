# PREREQUISITE: actionban/actionunban execute under 'bash -lc' and require
# bash >= 4.0 (for ** exponentiation in exponential backoff) plus jq and curl.
# Verify: docker exec vaultwarden_fail2ban bash -c 'echo $((2**3))' → 8

[Definition]
actionstart =
actionstop  =
actioncheck =

# ---------------------------------------------------------------------------
# Cloudflare WAF Custom Rules – actionban
#
# Migrated from the deprecated Firewall Access Rules API
#   (/zones/{zone_id}/firewall/access_rules/rules)
# to the current WAF Custom Rules Rulesets API
#   (/zones/{zone_id}/rulesets/{ruleset_id}/rules).
#
# API reference:
#   https://developers.cloudflare.com/api/operations/zone-rulesets-list-a-zone-s-rulesets
#   https://developers.cloudflare.com/waf/custom-rules/create-api/
#
# Behaviour:
#  - Locates (or creates) the zone's http_request_firewall_custom ruleset.
#  - Adds a "block" rule tagged "f2b-<name>-<ip>" for reliable unban lookup.
#  - Idempotent: exits 0 if the tag already exists.
#  - CF API token read from Docker secret; never passed on the command line.
#  - 429 responses honour the Retry-After header.
#  - DELETE returns 204 No Content (handled separately from JSON success checks).
#  - Exponential backoff uses bash ** operator (requires bash >= 4.0);
#    max delay is 2^4 = 16s across 4 retry attempts.
# ---------------------------------------------------------------------------
actionban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"
  name="<name>"

  [ -n "$zone" ] || { echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1; }

  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  [ -n "$CF_TOKEN" ] || {
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 1
  }

  # Write bearer token to a mode-600 temp file so it never appears in
  # /proc/<PID>/cmdline or process environment during curl execution.
  # chmod failure is treated as a hard error — a world-readable curl config
  # would expose the live CF bearer token to other processes on the host.
  _make_curl_cfg() {
    local cfg
    cfg="$(mktemp)"
    if ! chmod 600 "$cfg" 2>/dev/null; then
      rm -f "$cfg"
      echo "[cloudflare-apiv4] ERROR: chmod 600 failed on curl config tempfile — aborting to protect CF token" >&2
      return 1
    fi
    printf "header = \"Authorization: Bearer %s\"\nheader = \"Content-Type: application/json\"\n" \
      "$CF_TOKEN" > "$cfg"
    printf "%s" "$cfg"
  }

  # Generic Cloudflare API call.
  # Returns: 0 + prints response body on success (2xx+success:true, or 204).
  #          1 on hard error.
  #          2 + prints "RETRY_AFTER:<n>" on 429 rate-limit.
  _cf_api_call() {
    local endpoint="$1" method="$2" body="${3:-}"
    local response_file header_file cfg_file http_code

    response_file="$(mktemp)"
    header_file="$(mktemp)"
    cfg_file="$(_make_curl_cfg)" || return 1

    if [ -n "$body" ]; then
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" --data "$body" || echo "000")
    else
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" || echo "000")
    fi
    rm -f "$cfg_file" 2>/dev/null || true

    # 429 Rate-limit: signal caller with back-off value from Retry-After header.
    if [ "$http_code" = "429" ]; then
      local retry_after
      retry_after=$(awk -F": *" \
        "tolower(\$1)==\"retry-after\"{gsub(\"\\r\",\"\",\$2);print \$2;exit}" \
        "$header_file")
      [ -n "$retry_after" ] || retry_after=5
      rm -f "$header_file" "$response_file"
      printf "RETRY_AFTER:%s" "$retry_after"
      return 2
    fi

    # 204 No Content = success (WAF Rulesets DELETE returns this).
    if [ "$http_code" = "204" ]; then
      rm -f "$header_file" "$response_file"
      return 0
    fi

    # Standard 2xx JSON envelope with success:true.
    if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && \
       jq -e ".success == true" "$response_file" >/dev/null 2>&1; then
      cat "$response_file"
      rm -f "$header_file" "$response_file"
      return 0
    fi

    echo "[cloudflare-apiv4] ERROR: HTTP ${http_code} from ${method} ${endpoint}" >&2
    jq -r ".errors[]?.message // empty" "$response_file" >&2 2>/dev/null || true
    rm -f "$header_file" "$response_file"
    return 1
  }

  # Retry wrapper with exponential back-off and 429-aware sleep.
  # Requires bash >= 4.0 for ** operator; max delay = sleep_base^attempts = 2^4 = 16s.
  _cf_retry() {
    local endpoint="$1" method="$2" body="${3:-}" attempts="${4:-4}" sleep_base="${5:-2}"
    local i=1 out rc
    while [ "$i" -le "$attempts" ]; do
      out="$(_cf_api_call "$endpoint" "$method" "$body")" && { printf "%s" "$out"; return 0; }
      rc=$?
      if [ "$rc" -eq 2 ] && printf "%s" "$out" | grep -q "^RETRY_AFTER:"; then
        sleep "${out#RETRY_AFTER:}"
      else
        sleep $(( sleep_base ** i ))
      fi
      i=$(( i + 1 ))
    done
    return 1
  }

  # Return the zone WAF Custom Rules (http_request_firewall_custom) ruleset ID.
  # Creates an empty zone-level ruleset if none exists yet.
  _cf_get_or_create_waf_ruleset() {
    local zone_id="$1" out ruleset_id
    out="$(_cf_api_call \
      "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets" "GET")" || return 1
    ruleset_id=$(printf "%s" "$out" | jq -r \
      ".result[] | select(.phase==\"http_request_firewall_custom\" and .kind==\"zone\") | .id" \
      | head -n1)

    if [ -n "$ruleset_id" ]; then
      printf "%s" "$ruleset_id"
      return 0
    fi

    # No ruleset yet — create an empty zone-level one.
    local create_body
    create_body="$(printf \
      "{\"name\":\"fail2ban custom rules\",\"kind\":\"zone\",\"phase\":\"http_request_firewall_custom\",\"rules\":[]}")"
    out="$(_cf_retry \
      "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets" "POST" "$create_body")" \
      || return 1
    printf "%s" "$out" | jq -r ".result.id"
  }

  # Find a rule inside a ruleset by its exact description tag.
  _cf_find_rule_id() {
    local zone_id="$1" ruleset_id="$2" tag="$3" out
    out="$(_cf_api_call \
      "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/${ruleset_id}" "GET")" \
      || return 1
    printf "%s" "$out" | jq -r \
      ".result.rules // [] | .[] | select(.description == \"${tag}\") | .id" | head -n1
  }

  # Stable tag: jail-name + IP so actionunban can locate the exact rule.
  tag="f2b-${name}-${ip}"

  ruleset_id="$(_cf_get_or_create_waf_ruleset "$zone")" || {
    echo "[cloudflare-apiv4] ERROR: cannot get/create WAF ruleset for zone ${zone}"
    exit 1
  }

  # Idempotent: skip if a block rule for this tag already exists.
  existing_id="$(_cf_find_rule_id "$zone" "$ruleset_id" "$tag" || true)"
  if [ -n "$existing_id" ]; then
    echo "[cloudflare-apiv4] INFO: WAF block rule already exists for ${ip} (rule_id=${existing_id})"
    exit 0
  fi

  body="$(printf \
    "{\"action\":\"block\",\"expression\":\"(ip.src eq \\\"%s\\\")\",\"description\":\"%s\",\"enabled\":true}" \
    "$ip" "$tag")"

  if _cf_retry \
    "https://api.cloudflare.com/client/v4/zones/${zone}/rulesets/${ruleset_id}/rules" \
    "POST" "$body"; then
    echo "[cloudflare-apiv4] INFO: WAF block rule created for ${ip} (tag: ${tag})"
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF ban failed for ${ip}"
  exit 1
'

# ---------------------------------------------------------------------------
# Cloudflare WAF Custom Rules – actionunban
# Idempotent: exits 0 if no matching rule is found.
# ---------------------------------------------------------------------------
actionunban = bash -lc '
  set -euo pipefail

  zone="${env_CLOUDFLARE_ZONE_ID:-}"
  ip="<ip>"
  name="<name>"

  [ -n "$zone" ] || { echo "[cloudflare-apiv4] ERROR: CLOUDFLARE_ZONE_ID not set"; exit 1; }

  CF_TOKEN="$(cat /run/secrets/fail2ban_cloudflare_firewall_token 2>/dev/null || true)"
  [ -n "$CF_TOKEN" ] || {
    echo "[cloudflare-apiv4] ERROR: token missing at /run/secrets/fail2ban_cloudflare_firewall_token"
    exit 1
  }

  _make_curl_cfg() {
    local cfg
    cfg="$(mktemp)"
    if ! chmod 600 "$cfg" 2>/dev/null; then
      rm -f "$cfg"
      echo "[cloudflare-apiv4] ERROR: chmod 600 failed on curl config tempfile — aborting to protect CF token" >&2
      return 1
    fi
    printf "header = \"Authorization: Bearer %s\"\nheader = \"Content-Type: application/json\"\n" \
      "$CF_TOKEN" > "$cfg"
    printf "%s" "$cfg"
  }

  _cf_api_call() {
    local endpoint="$1" method="$2" body="${3:-}"
    local response_file header_file cfg_file http_code
    response_file="$(mktemp)"; header_file="$(mktemp)"
    cfg_file="$(_make_curl_cfg)" || return 1

    if [ -n "$body" ]; then
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" --data "$body" || echo "000")
    else
      http_code=$(curl -sS -o "$response_file" -D "$header_file" -w "%{http_code}" \
        --config "$cfg_file" -X "$method" "$endpoint" || echo "000")
    fi
    rm -f "$cfg_file" 2>/dev/null || true

    if [ "$http_code" = "429" ]; then
      local retry_after
      retry_after=$(awk -F": *" \
        "tolower(\$1)==\"retry-after\"{gsub(\"\\r\",\"\",\$2);print \$2;exit}" "$header_file")
      [ -n "$retry_after" ] || retry_after=5
      rm -f "$header_file" "$response_file"
      printf "RETRY_AFTER:%s" "$retry_after"
      return 2
    fi

    if [ "$http_code" = "204" ]; then
      rm -f "$header_file" "$response_file"; return 0
    fi

    if [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ] && \
       jq -e ".success == true" "$response_file" >/dev/null 2>&1; then
      cat "$response_file"
      rm -f "$header_file" "$response_file"
      return 0
    fi

    echo "[cloudflare-apiv4] ERROR: HTTP ${http_code} from ${method} ${endpoint}" >&2
    jq -r ".errors[]?.message // empty" "$response_file" >&2 2>/dev/null || true
    rm -f "$header_file" "$response_file"
    return 1
  }

  # Requires bash >= 4.0 for ** operator; max delay = sleep_base^attempts = 2^4 = 16s.
  _cf_retry() {
    local endpoint="$1" method="$2" body="${3:-}" attempts="${4:-4}" sleep_base="${5:-2}"
    local i=1 out rc
    while [ "$i" -le "$attempts" ]; do
      out="$(_cf_api_call "$endpoint" "$method" "$body")" && { printf "%s" "$out"; return 0; }
      rc=$?
      if [ "$rc" -eq 2 ] && printf "%s" "$out" | grep -q "^RETRY_AFTER:"; then
        sleep "${out#RETRY_AFTER:}"
      else
        sleep $(( sleep_base ** i ))
      fi
      i=$(( i + 1 ))
    done
    return 1
  }

  _cf_get_waf_ruleset_id() {
    local zone_id="$1" out
    out="$(_cf_api_call \
      "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets" "GET")" || return 1
    printf "%s" "$out" | jq -r \
      ".result[] | select(.phase==\"http_request_firewall_custom\" and .kind==\"zone\") | .id" \
      | head -n1
  }

  _cf_find_rule_id() {
    local zone_id="$1" ruleset_id="$2" tag="$3" out
    out="$(_cf_api_call \
      "https://api.cloudflare.com/client/v4/zones/${zone_id}/rulesets/${ruleset_id}" "GET")" \
      || return 1
    printf "%s" "$out" | jq -r \
      ".result.rules // [] | .[] | select(.description == \"${tag}\") | .id" | head -n1
  }

  tag="f2b-${name}-${ip}"

  ruleset_id="$(_cf_get_waf_ruleset_id "$zone" || true)"
  if [ -z "$ruleset_id" ]; then
    echo "[cloudflare-apiv4] INFO: no WAF ruleset found for zone ${zone} — nothing to unban"
    exit 0
  fi

  rule_id="$(_cf_find_rule_id "$zone" "$ruleset_id" "$tag" || true)"
  if [ -z "$rule_id" ]; then
    echo "[cloudflare-apiv4] INFO: no WAF rule found for ${ip} (tag: ${tag}) — nothing to do"
    exit 0
  fi

  if _cf_retry \
    "https://api.cloudflare.com/client/v4/zones/${zone}/rulesets/${ruleset_id}/rules/${rule_id}" \
    "DELETE"; then
    echo "[cloudflare-apiv4] INFO: WAF block rule deleted for ${ip} (tag: ${tag})"
    exit 0
  fi

  echo "[cloudflare-apiv4] ERROR: CF unban failed for ${ip} — rule may persist"
  exit 1
'

[Init]
name = f2b-vaultwarden
