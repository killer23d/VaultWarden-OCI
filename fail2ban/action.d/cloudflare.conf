# fail2ban/action.d/cloudflare.conf
#
# This action uses the Cloudflare API v4 to block/unblock IPs.
# It reads the API token directly from the Docker secret file.
#
[Definition]

# Note: actionstart, actionstop, actioncheck are not needed for this.
actionstart =
actionstop =
actioncheck =

# Ban action:
# Creates a new "block" rule in the Cloudflare IP Access Rules.
actionban = curl -s -X POST "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules" \
            -H "Authorization: Bearer $(cat /run/secrets/fail2ban_cloudflare_firewall_token)" \
            -H "Content-Type: application/json" \
            --data '{"mode":"block","configuration":{"target":"ip","value":"<ip>"},"notes":"Blocked by fail2ban (<name>)"}'

# Unban action:
# 1. Gets the Cloudflare token from the secret file.
# 2. Finds the rule ID associated with the IP address.
# 3. Deletes that rule by its ID.
# 4. Appends '|| true' to suppress errors if the rule was already deleted manually.
actionunban = CF_TOKEN=$(cat /run/secrets/fail2ban_cloudflare_firewall_token); \
              RULE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules?configuration.target=ip&configuration.value=<ip>&per_page=1" \
                          -H "Authorization: Bearer $CF_TOKEN" \
                          -H "Content-Type: application/json" \
                          | jq -r 'first(.result[].id // "")'); \
              [ -n "$RULE_ID" ] && curl -s -X DELETE "https://api.cloudflare.com/client/v4/zones/<cfzone>/firewall/access_rules/rules/$RULE_ID" \
                                    -H "Authorization: Bearer $CF_TOKEN" \
                                    -H "Content-Type: application/json" || true

[Init]
# cfzone is set in jail.d/vaultwarden-oci-ng.conf
cfzone =
