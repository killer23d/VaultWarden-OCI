# VaultWarden-OCI Fail2Ban Jail Configuration
# FIXED: Centralized Caddy logging (all web jails point to access.log)
# FIXED: OCI/Oracle Linux SSH log compatibility
# FIXED: Removed [nginx-http-auth] jail (nginx filter irrelevant to Caddy)
# FIXED: [recidive] uses mounted log volume (F2B_LOG_TARGET=STDOUT means
#        /var/log/fail2ban.log does not exist; use the volume-mounted path)
# FIXED: Dedicated per-jail filters to prevent double-fire on shared log file
# FIXED: Explicit filter = declarations on all jails for robustness
# CRITICAL: Web traffic blocked at Cloudflare edge; SSH blocked locally.

[DEFAULT]

# Cloudflare action configuration (token and zone handled by action via env/secret)
cf_zone_id = %(env[CLOUDFLARE_ZONE_ID])s
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Email configuration (via postfix container on 127.0.0.1:587)
destemail = %(env[ADMIN_EMAIL])s
sender = fail2ban@%(env[DOMAIN_NAME])s
sendername = VaultWarden-Fail2Ban

# Default ban settings
bantime = 1h
findtime = 10m
maxretry = 3
backend = auto


# ====================================================================
# ESSENTIAL: SSH Protection (Never remove!)
# NOT proxied by Cloudflare — iptables ban is correct here.
# ====================================================================

[sshd]

enabled = true
filter = sshd
port = 22
logpath = /var/log/ssh-auth.log
backend = auto
maxretry = 3
bantime = 24h
findtime = 10m

# Email + local iptables (no Cloudflare — avoid remote lockout on SSH)
action = smtp[name=sshd, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         iptables-multiport[name=sshd, port="ssh", protocol=tcp, chain=INPUT]


# Custom SSH port — use ONLY if SSH_PORT in .env differs from 22.
# IMPORTANT: If you enable this jail, you MUST disable [sshd] above first
# (set enabled = false) to prevent both jails from incrementing the counter
# on the same log lines, which would halve the effective maxretry threshold.

[sshd-custom]

enabled = false
filter = sshd
# IMPORTANT: Set port = to your actual SSH port (e.g. 2222) and set
# enabled = true. Also set enabled = false in [sshd] above.
# Leaving port = CHANGEME_SSH_PORT will cause Fail2Ban to fail on startup
# if this jail is enabled — this is intentional (fail-safe).
# If both [sshd] and [sshd-custom] are enabled on the same port, every
# SSH failure increments both counters, halving the effective maxretry.
port = CHANGEME_SSH_PORT
logpath = /var/log/ssh-auth.log
maxretry = 3
bantime = 24h
findtime = 10m

# NOTE: Update port= above to match SSH_PORT from your .env file.
#       Disable [sshd] above before enabling this jail.
action = smtp[name=sshd-custom, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         iptables-multiport[name=sshd-custom, port="%(port)s", protocol=tcp]


# ====================================================================
# VaultWarden Application Log Monitoring (High-Fidelity)
# Reads internal VaultWarden logs — independent of Caddy.
# IP source: VaultWarden receives real IP via CF-Connecting-IP header
# (set by Caddy via header_up CF-Connecting-IP {client_ip}).
# ====================================================================

[vaultwarden-auth]

enabled = true
filter = vaultwarden-auth
port = 80,443
logpath = /var/log/vaultwarden/vaultwarden.log
maxretry = 3
bantime = 2h
findtime = 10m

# Cloudflare-only blocking (iptables removed — traffic is proxied via CF)
action = smtp[name=vaultwarden-auth, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


[vaultwarden-admin]

enabled = true
filter = vaultwarden-admin
port = 80,443
logpath = /var/log/vaultwarden/vaultwarden.log
maxretry = 2
bantime = 24h
findtime = 5m

action = smtp[name=vaultwarden-admin, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


# ====================================================================
# Caddy Centralized Log Monitoring
# All web jails point to the single access.log.
# Each jail uses its OWN dedicated filter to prevent double-fire:
# a single log line must only increment ONE jail's counter.
# IP source: caddy-cloudflare build >= v2.11.0 rewrites remote_ip to
# the real client IP from Cf-Connecting-Ip (caddy-cloudflare-ip module).
# ====================================================================

[vaultwarden-web-auth]

enabled = true
# FIXED: Dedicated filter — was vaultwarden-web-caddy (shared with web-admin)
# Sharing caused every match to fire in both jails simultaneously.
filter = vaultwarden-web-auth
port = 80,443
logpath = /var/log/caddy/access.log
maxretry = 10
bantime = 1h
findtime = 5m

action = smtp[name=vaultwarden-web-auth, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


[vaultwarden-web-admin]

enabled = true
# FIXED: Dedicated filter — was vaultwarden-web-caddy (shared with web-auth)
filter = vaultwarden-web-admin
port = 80,443
logpath = /var/log/caddy/access.log
maxretry = 5
bantime = 24h
findtime = 10m

action = smtp[name=vaultwarden-web-admin, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


# ====================================================================
# General Caddy Security / Rate Monitoring
# ====================================================================

[vaultwarden-rate-limit]

enabled = true
# Intentionally reuses filter = vaultwarden-web-auth to detect volumetric
# abuse of the same auth/API endpoints. The dedicated web-auth jail fires
# first on credential failures (maxretry=10/5m); this jail fires independently
# on raw request volume (maxretry=30/1m) and bans on rate alone regardless
# of response code. Both jails incrementing the same log line is correct
# behaviour — each enforces a distinct policy (failure-based vs rate-based).
filter = vaultwarden-web-auth
port = 80,443
logpath = /var/log/caddy/access.log
# FIXED: Was 100 — unreachable in a <10 user deployment. 30 is aggressive
# enough to catch automated tools while not firing on legitimate spikes.
maxretry = 30
bantime = 30m
findtime = 1m

action = smtp[name=vaultwarden-rate-limit, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


[vaultwarden-security]

enabled = true
filter = vaultwarden-security
port = 80,443
logpath = /var/log/caddy/access.log
maxretry = 1
bantime = 48h
findtime = 1h

action = smtp[name=vaultwarden-security, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4


# ====================================================================
# Recidivism Protection
# FIXED: F2B_LOG_TARGET=STDOUT means /var/log/fail2ban.log does not
# exist inside the container. logpath points to the volume-mounted
# fail2ban log directory written by the crazymax/fail2ban image.
# backend=polling required: inotify cannot watch volume mounts reliably
# in Docker host-networking mode.
# ====================================================================

[recidive]

enabled = true
filter = recidive
logpath = /var/log/fail2ban/fail2ban.log
backend = polling
# BUG-#33 FIX: Add explicit polltime. Without this, fail2ban uses the global
# default (1s) — excessive I/O for a recidive jail that needs to fire at most
# once per minute. 60s polling is appropriate for a daily findtime window.
polltime = 60
bantime = 1w
findtime = 1d
maxretry = 5

# Cloudflare-only blocking for repeat offenders
action = smtp[name=recidive, dest="%(destemail)s", sender="%(sender)s", host="127.0.0.1", port=587]
         cloudflare-apiv4
