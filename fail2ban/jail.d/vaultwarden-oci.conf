# VaultWarden-OCI Fail2Ban Jail Configuration
# ENHANCED: Uses msmtpd sidecar for improved email reliability (replaces mailutils)
# FIXED: OCI/Oracle Linux SSH log compatibility
# FIXED: Pointed web jails to correct specialized Caddy logs
# High-fidelity parsing + Built-in email + Corrected Log Paths

[DEFAULT]
# Cloudflare action configuration
cf_zone_id = ${CLOUDFLARE_ZONE_ID}
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Email configuration (via msmtpd sidecar container)
destemail = ${ADMIN_EMAIL}
sender = fail2ban@${DOMAIN}
sendername = VaultWarden-Fail2Ban

# Default ban settings
bantime  = 1h
findtime = 10m
maxretry = 3
backend  = auto

# ============================================================================
# ESSENTIAL: SSH Protection (Never remove!)
# FIXED: Uses platform-agnostic mount point for OCI compatibility
# ============================================================================

[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/ssh-auth.log
backend  = auto
maxretry = 3
bantime  = 24h
findtime = 10m
# Email + local iptables (no Cloudflare to avoid lockout)
action   = smtp[name=sshd, dest="%(destemail)s", sender="%(sender)s"]
           iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# Custom SSH port (if needed)
# FIXED: Uses platform-agnostic mount point for OCI compatibility
[sshd-custom]
enabled  = false
port     = 2222
logpath  = /var/log/ssh-auth.log
backend  = auto
filter   = sshd
maxretry = 3
bantime  = 24h
findtime = 10m
action   = smtp[name=sshd-custom, dest="%(destemail)s", sender="%(sender)s"]
           iptables-multiport[name=sshd-custom, port="2222", protocol=tcp]

# ============================================================================
# VaultWarden Application Log Monitoring
# ============================================================================

# High-fidelity: VaultWarden Authentication Failures (from application log)
[vaultwarden-auth]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-auth
maxretry = 3
bantime  = 2h
findtime = 10m
# ENHANCED: msmtpd SMTP action + Cloudflare blocking
action   = smtp[name=vaultwarden-auth, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# High-fidelity: VaultWarden Admin Panel Attacks (from application log)
[vaultwarden-admin]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-admin
maxretry = 2
bantime  = 24h
findtime = 5m
# CRITICAL: Always email for admin attacks
action   = smtp[name=vaultwarden-admin, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# ============================================================================
# CRITICAL FIX: Caddy Specialized Log Monitoring
# ============================================================================

# FIX: Changed logpath from access.log to auth_attempts.log
# Monitors failed logins to /api/ and /identity/ endpoints via Caddy log
[vaultwarden-web-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/auth_attempts.log
filter   = vaultwarden-web-caddy
maxretry = 10
bantime  = 1h
findtime = 5m
action   = smtp[name=vaultwarden-web-auth, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# FIX: Added new jail to monitor the specialized Caddy admin log
# Monitors failed logins to /admin/ endpoint via Caddy log
[vaultwarden-web-admin]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/admin_access.log
filter   = vaultwarden-web-caddy
maxretry = 5
bantime  = 24h
findtime = 10m
action   = smtp[name=vaultwarden-web-admin, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# ============================================================================
# General Caddy Log Monitoring
# ============================================================================

# Rate Limiting (429 errors from Caddy)
# FIX: Changed filter to vaultwarden-web-caddy (which includes 429 regex)
[vaultwarden-rate-limit]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-web-caddy
maxretry = 100
bantime  = 30m
findtime = 1m
action   = smtp[name=vaultwarden-rate-limit, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Security Scanning (403/404 on /api/ from Caddy)
[vaultwarden-security]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-security
maxretry = 1
bantime  = 48h
findtime = 1h
action   = smtp[name=vaultwarden-security, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# General Web Security
[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = nginx-http-auth
maxretry = 5
bantime  = 1h
action   = smtp[name=nginx-http-auth, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# ============================================================================
# Recidivism Protection
# ============================================================================

# Recidive: Ban repeat offenders longer (with email)
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 1w
findtime = 1d
maxretry = 5
action   = smtp[name=recidive, dest="%(destemail)s", sender="%(sender)s"]
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-allports[name=recidive]

# ============================================================================
# PLATFORM COMPATIBILITY NOTES:
# ============================================================================
# - SSH logs now use universal mount point: /var/log/ssh-auth.log
# - Host SSH log location is detected automatically by setup script:
#   * Debian/Ubuntu: /var/log/auth.log -> /var/log/ssh-auth.log
#   * RHEL/CentOS/OCI: /var/log/secure -> /var/log/ssh-auth.log
# - This eliminates hardcoded platform-specific paths
# - Works correctly on Oracle Linux (OCI) and all other supported distributions
# - Email functionality now uses containerized msmtpd (no host dependencies)
