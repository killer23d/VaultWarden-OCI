# VaultWarden-OCI fail2ban jail configuration (transactional Cloudflare + UFW)

[DEFAULT]
# Ban settings
bantime  = 6h
findtime = 10m
maxretry = 5
backend  = auto

# Use transactional Cloudflare + UFW action
banaction = cloudflare-optimized

# The action reads the zone id from env_CLOUDFLARE_ZONE_ID and the token from
# /run/secrets/fail2ban_cloudflare_firewall_token (mounted via docker-compose).

# Optional: Email notifications (configure SMTP first)
# action = %(banaction)s[name=%(name)s, cfzone="%(env_CLOUDFLARE_ZONE_ID)s"] \
#          %(mta)s-whois[name=%(name)s, sender="%(sender)s", dest="%(destemail)s"]

[vaultwarden-admin]
enabled = true
port     = http,https
filter   = vaultwarden-admin
logpath  = /var/log/caddy/access.log
maxretry = 3
bantime  = 6h
findtime = 5m

[vaultwarden-api]
enabled  = true
port     = http,https
filter   = vaultwarden-api
logpath  = /var/log/caddy/access.log
maxretry = 10
bantime  = 6h
findtime = 10m

[sshd]
enabled   = false
port      = ssh,2222
filter    = sshd
logpath   = /var/log/auth.log
maxretry  = 3
bantime   = 7d
findtime  = 1h

[caddy-botsearch]
enabled  = false
port     = http,https
filter   = caddy-botsearch
logpath  = /var/log/caddy/access.log
maxretry = 2
bantime  = 24h
findtime = 1h
# Action uses DEFAULT defined above
