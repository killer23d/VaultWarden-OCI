# VaultWarden-OCI Fail2Ban Jail Configuration
# ENHANCED: Uses msmtpd sidecar for improved email reliability (replaces mailutils)
# FIXED: OCI/Oracle Linux SSH log compatibility
# FIXED: Pointed web jails to correct specialized Caddy logs
# CRITICAL FIX: Removed ineffective iptables-multiport action from all web-facing (Cloudflare-proxied) jails.

[DEFAULT]
# Cloudflare action configuration (token and zone are handled by the action via env/secret)
cf_zone_id = ${CLOUDFLARE_ZONE_ID}
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Email configuration (msmtpd sidecar or local SMTP)
destemail = ${ADMIN_EMAIL}
sender = fail2ban@${DOMAIN}
sendername = VaultWarden-Fail2Ban

# Default ban settings
bantime  = 1h
findtime = 10m
maxretry = 3
backend  = auto

# ====================================================================
# ESSENTIAL: SSH Protection (Never remove!)
# This is NOT proxied by Cloudflare, so iptables is CORRECT here.
# ====================================================================
[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/ssh-auth.log
backend  = auto
maxretry = 3
bantime  = 24h
findtime = 10m
# Email + local iptables (no Cloudflare here to avoid remote lockout)
action = smtp[name=sshd, dest="%(destemail)s", sender="%(sender)s"]
         iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# Custom SSH port (if needed)
[sshd-custom]
enabled  = false
port     = 2222
logpath  = /var/log/ssh-auth.log
# ... (rest is same as sshd)
action = smtp[name=sshd-custom, dest="%(destemail)s", sender="%(sender)s"]
         iptables-multiport[name=sshd-custom, port="2222", protocol=tcp]

# ====================================================================
# VaultWarden Application Log Monitoring (High-Fidelity)
# CRITICAL FIX: Removed iptables action.
# ====================================================================
[vaultwarden-auth]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-auth
maxretry = 3
bantime  = 2h
findtime = 10m
# Cloudflare-only blocking
action = smtp[name=vaultwarden-auth, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

[vaultwarden-admin]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-admin
maxretry = 2
bantime  = 24h
findtime = 5m
# Cloudflare-only blocking
action = smtp[name=vaultwarden-admin, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

# ====================================================================
# Caddy Specialized Log Monitoring
# CRITICAL FIX: Removed iptables action.
# ====================================================================
# (Log paths are correct in this version)
[vaultwarden-web-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/auth_attempts.log
filter   = vaultwarden-web-caddy
maxretry = 10
bantime  = 1h
findtime = 5m
# Cloudflare-only blocking
action = smtp[name=vaultwarden-web-auth, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

[vaultwarden-web-admin]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/admin_access.log
filter   = vaultwarden-web-caddy
maxretry = 5
bantime  = 24h
findtime = 10m
# Cloudflare-only blocking
action = smtp[name=vaultwarden-web-admin, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

# ====================================================================
# General Caddy Log Monitoring
# CRITICAL FIX: Removed iptables action.
# ====================================================================
[vaultwarden-rate-limit]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-web-caddy
maxretry = 100
bantime  = 30m
findtime = 1m
# Cloudflare-only blocking
action = smtp[name=vaultwarden-rate-limit, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

[vaultwarden-security]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-security
maxretry = 1
bantime  = 48h
findtime = 1h
# Cloudflare-only blocking
action = smtp[name=vaultwarden-security, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = nginx-http-auth
maxretry = 5
bantime  = 1h
# Cloudflare-only blocking
action = smtp[name=nginx-http-auth, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4

# ====================================================================
# Recidivism Protection
# CRITICAL FIX: Removed iptables action.
# ====================================================================
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 1w
findtime = 1d
maxretry = 5
# Cloudflare-only blocking for recidivism
action = smtp[name=recidive, dest="%(destemail)s", sender="%(sender)s"]
         cloudflare-apiv4
