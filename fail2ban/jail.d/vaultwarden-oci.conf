# VaultWarden-OCI Fail2Ban Jail Configuration
# FIXED: High-fidelity parsing of VaultWarden application logs
# COMPLETE: Includes SSH protection and all security layers

[DEFAULT]
# Cloudflare action configuration
cf_zone_id = ${CLOUDFLARE_ZONE_ID}
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Default ban settings
bantime = 1h
findtime = 10m
maxretry = 3
backend = auto

# ESSENTIAL: SSH Protection (Never remove!)
[sshd]
enabled = true
port = ssh
logpath = /var/log/auth.log
backend = systemd
# Aggressive SSH protection settings
maxretry = 3
bantime = 24h
findtime = 10m
# Local iptables only for SSH (not Cloudflare to avoid lockout)
action = iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# Custom SSH port support (if using non-standard port)
[sshd-custom]
enabled = false
port = 2222
logpath = /var/log/auth.log
backend = systemd
filter = sshd
maxretry = 3
bantime = 24h
findtime = 10m
action = iptables-multiport[name=sshd-custom, port="2222", protocol=tcp]

# FIXED: VaultWarden Authentication Failures (High-Fidelity)
[vaultwarden-auth]
enabled = true
port = http,https
# FIXED: Parse actual VaultWarden logs instead of Caddy access logs
logpath = /var/log/vaultwarden/vaultwarden.log
# Use dedicated filter for VaultWarden authentication failures
filter = vaultwarden-auth
# More aggressive settings for auth failures
maxretry = 3
bantime = 2h
findtime = 10m
# Cloudflare action for global IP blocking
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
         iptables-multiport[name=vaultwarden-auth]

# FIXED: VaultWarden Admin Panel Attacks (High-Fidelity) 
[vaultwarden-admin]
enabled = true
port = http,https
# FIXED: Parse VaultWarden logs for admin access attempts
logpath = /var/log/vaultwarden/vaultwarden.log
filter = vaultwarden-admin
# Very strict for admin attacks
maxretry = 2
bantime = 24h
findtime = 5m
# Immediate Cloudflare blocking for admin attacks
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
         iptables-multiport[name=vaultwarden-admin]

# Enhanced: Web Vault Brute Force (Backup - Caddy logs)
[vaultwarden-web]
enabled = true
port = http,https
# Secondary detection via Caddy for web-based attacks
logpath = /var/log/caddy/access.log
filter = vaultwarden-web-caddy
maxretry = 10
bantime = 1h
findtime = 5m
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
         iptables-multiport[name=vaultwarden-web]

# Rate Limiting: Excessive Requests
[vaultwarden-rate-limit]
enabled = true
port = http,https
logpath = /var/log/caddy/access.log
filter = vaultwarden-rate-limit
# Higher threshold for rate limiting
maxretry = 100
bantime = 30m
findtime = 1m
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Security: Scanning and Probing
[vaultwarden-security]
enabled = true  
port = http,https
logpath = /var/log/caddy/access.log
filter = vaultwarden-security
# Zero tolerance for security probes
maxretry = 1
bantime = 48h
findtime = 1h
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
         iptables-multiport[name=vaultwarden-security]

# General Web Security
[nginx-http-auth]
enabled = true
port = http,https
logpath = /var/log/caddy/access.log
filter = nginx-http-auth
maxretry = 5
bantime = 1h
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Recidive: Ban repeat offenders longer
[recidive]
enabled = true
logpath = /var/log/fail2ban.log
action = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-allports[name=recidive]
bantime = 1w
findtime = 1d
maxretry = 5
