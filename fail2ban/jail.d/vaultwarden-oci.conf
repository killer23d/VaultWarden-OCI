# VaultWarden-OCI fail2ban jail configuration
# Protects against brute force attacks using Cloudflare API

[DEFAULT]
# Ban settings
bantime  = 6h
findtime = 10m
maxretry = 5
backend  = auto

# Use Cloudflare ban action
banaction = cloudflare

# FIXED (P2): Removed the cftoken="..." parameter.
# The action script (cloudflare.conf) reads the token directly from the secret file.
action = %(banaction)s[name=%(name)s, cfzone="%(env_CLOUDFLARE_ZONE_ID)s"]
# Optional: Email notifications (configure SMTP first)
#           %(mta)s-whois[name=%(name)s, sender="%(sender)s", dest="%(destemail)s"]

[vaultwarden-admin]
enabled = true
# Port isn't needed for Cloudflare action, but kept for context
port     = http,https
filter   = vaultwarden-admin
logpath  = /var/log/caddy/access.log
maxretry = 3
bantime  = 6h
findtime = 5m
# Action uses DEFAULT defined above

[vaultwarden-api]
enabled  = true
port     = http,https
filter   = vaultwarden-api
logpath  = /var/log/caddy/access.log
maxretry = 10
bantime  = 6h
findtime = 10m
# Action uses DEFAULT defined above

[sshd]
enabled   = true
port      = ssh,2222
filter    = sshd
logpath   = /var/log/auth.log
maxretry  = 3         # Stricter than web attacks
bantime   = 24h       # Longer ban for SSH attacks  
findtime  = 5m        # Shorter detection window
# Uses same DEFAULT Cloudflare banaction for dual blocking

[caddy-botsearch]
# FIXED (P3): Disabled this aggressive filter.
# It can block legitimate services (like search engines) and is
# unnecessary for a private, non-indexed service.
enabled  = false
port     = http,https
filter   = caddy-botsearch
logpath  = /var/log/caddy/access.log
maxretry = 2
bantime  = 24h
findtime = 1h
# Action uses DEFAULT defined above
