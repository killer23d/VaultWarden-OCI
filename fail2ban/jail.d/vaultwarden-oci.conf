# VaultWarden-OCI Fail2Ban Jail Configuration
# High-fidelity parsing of VaultWarden application logs
# Email notifications are optional and scoped to high-signal jails

[DEFAULT]
# Cloudflare action configuration
cf_zone_id = ${CLOUDFLARE_ZONE_ID}
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Default ban settings
bantime  = 1h
findtime = 10m
maxretry = 3
backend  = auto

# Optional email settings (inherited by jails that include sendmail-whois.conf)
# Will use your .env values via docker-compose environment/expansion
destemail = ${ADMIN_EMAIL}
sender    = fail2ban@${DOMAIN}
mta       = mail

# ESSENTIAL: SSH Protection (Never remove!)
[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/auth.log
backend  = systemd
maxretry = 3
bantime  = 24h
findtime = 10m
# Local iptables only for SSH (avoid CF lockout)
action   = iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# Custom SSH port (if needed)
[sshd-custom]
enabled  = false
port     = 2222
logpath  = /var/log/auth.log
backend  = systemd
filter   = sshd
maxretry = 3
bantime  = 24h
findtime = 10m
action   = iptables-multiport[name=sshd-custom, port="2222", protocol=tcp]

# High-fidelity: VaultWarden Authentication Failures
[vaultwarden-auth]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-auth
maxretry = 3
bantime  = 2h
findtime = 10m
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-multiport[name=vaultwarden-auth]
# OPTIONAL email (uncomment to enable for general auth brute-force)
#           sendmail-whois.conf[dest="%(destemail)s"]

# High-fidelity: VaultWarden Admin Panel Attacks (email enabled)
[vaultwarden-admin]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-admin
maxretry = 2
bantime  = 24h
findtime = 5m
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-multiport[name=vaultwarden-admin]
           sendmail-whois.conf[dest="%(destemail)s"]

# Enhanced: Web Vault Brute Force (Caddy logs as secondary)
[vaultwarden-web]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-web-caddy
maxretry = 10
bantime  = 1h
findtime = 5m
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-multiport[name=vaultwarden-web]
# OPTIONAL email (uncomment if desired)
#           sendmail-whois.conf[dest="%(destemail)s"]

# Rate Limiting: Excessive Requests (Caddy logs)
[vaultwarden-rate-limit]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-rate-limit
maxretry = 100
bantime  = 30m
findtime = 1m
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Security: Scanning and Probing (zero tolerance)
[vaultwarden-security]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-security
maxretry = 1
bantime  = 48h
findtime = 1h
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-multiport[name=vaultwarden-security]
# OPTIONAL email (uncomment if desired)
#           sendmail-whois.conf[dest="%(destemail)s"]

# General Web Security (http auth patterns)
[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = nginx-http-auth
maxretry = 5
bantime  = 1h
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Recidive: Ban repeat offenders longer (email enabled)
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 1w
findtime = 1d
maxretry = 5
action   = cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-allports[name=recidive]
           sendmail-whois.conf[dest="%(destemail)s"]
