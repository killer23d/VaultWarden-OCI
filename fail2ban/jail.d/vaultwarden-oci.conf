# VaultWarden-OCI Fail2Ban Jail Configuration  
# SIMPLE: Uses existing host mailutils (no additional setup needed)
# High-fidelity parsing of VaultWarden application logs + Built-in email

[DEFAULT]
# Cloudflare action configuration
cf_zone_id = ${CLOUDFLARE_ZONE_ID}
cf_api_token_file = /run/secrets/fail2ban_cloudflare_firewall_token

# Email configuration (leverages existing mailutils setup)
destemail = ${ADMIN_EMAIL}
sender = fail2ban@${DOMAIN}
sendername = VaultWarden-Fail2Ban

# Default ban settings
bantime  = 1h
findtime = 10m
maxretry = 3
backend  = auto

# ESSENTIAL: SSH Protection (Never remove!)
[sshd]
enabled  = true
port     = ssh
logpath  = /var/log/auth.log
backend  = systemd
maxretry = 3
bantime  = 24h
findtime = 10m
# Email + local iptables (no Cloudflare to avoid lockout)
action   = %(action_mwl)s
           iptables-multiport[name=sshd, port="ssh", protocol=tcp]

# Custom SSH port (if needed)
[sshd-custom]
enabled  = false
port     = 2222
logpath  = /var/log/auth.log
backend  = systemd
filter   = sshd
maxretry = 3
bantime  = 24h
findtime = 10m
action   = %(action_mwl)s
           iptables-multiport[name=sshd-custom, port="2222", protocol=tcp]

# High-fidelity: VaultWarden Authentication Failures (with email)
[vaultwarden-auth]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-auth
maxretry = 3
bantime  = 2h
findtime = 10m
# SIMPLE: Built-in email action + Cloudflare blocking
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# High-fidelity: VaultWarden Admin Panel Attacks (with email)
[vaultwarden-admin]
enabled  = true
port     = http,https
logpath  = /var/log/vaultwarden/vaultwarden.log
filter   = vaultwarden-admin
maxretry = 2
bantime  = 24h
findtime = 5m
# CRITICAL: Always email for admin attacks
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Enhanced: Web Vault Brute Force (with email)
[vaultwarden-web]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-web-caddy
maxretry = 10
bantime  = 1h
findtime = 5m
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Rate Limiting (with email notifications)
[vaultwarden-rate-limit]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-rate-limit
maxretry = 100
bantime  = 30m
findtime = 1m
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Security Scanning (with email notifications)
[vaultwarden-security]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = vaultwarden-security
maxretry = 1
bantime  = 48h
findtime = 1h
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# General Web Security
[nginx-http-auth]
enabled  = true
port     = http,https
logpath  = /var/log/caddy/access.log
filter   = nginx-http-auth
maxretry = 5
bantime  = 1h
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]

# Recidive: Ban repeat offenders longer (with email)
[recidive]
enabled  = true
logpath  = /var/log/fail2ban.log
bantime  = 1w
findtime = 1d
maxretry = 5
action   = %(action_mwl)s
           cloudflare-apiv4[cfapi_token="%(cf_api_token_file)s"]
           iptables-allports[name=recidive]
