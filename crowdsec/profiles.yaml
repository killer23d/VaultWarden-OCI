# CrowdSec profiles — VaultWarden-OCI
#
# Profiles are evaluated in order; on_success: break stops further evaluation.
# repeat_offender MUST come first so high-event bursts get the longer ban before
# the catch-all default_ip_remediation matches and breaks.
name: repeat_offender
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip" && Alert.GetEventsCount() >= 5
decisions:
  - type: ban
    duration: 168h
on_success: break
---
name: default_ip_remediation
filters:
  - Alert.Remediation == true && Alert.GetScope() == "Ip"
decisions:
  - type: ban
    duration: 4h
on_success: break
