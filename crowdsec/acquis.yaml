# CrowdSec log acquisition configuration — VaultWarden-OCI
# Installed to /etc/crowdsec/acquis.d/vaultwarden.yaml by setup-crowdsec.sh
#
# TOKEN_PROJECT_STATE_DIR is substituted at install time by setup-crowdsec.sh
# with the value of PROJECT_STATE_DIR from .env.
#
# FIELD NAME REFERENCE (journald source):
#   Correct : journalctl_filter  (list)   ← mandatory, single unit per document
#   Wrong   : journal_filters             ← does not exist, causes FATAL on start
# Ref: https://docs.crowdsec.net/docs/next/log_processor/data_sources/journald/

# ── Vaultwarden application logs ─────────────────────────────────────────────
source: file
filenames:
  - TOKEN_PROJECT_STATE_DIR/logs/vaultwarden/vaultwarden.log
labels:
  type: vaultwarden

---

# ── Caddy access logs (JSON format) ──────────────────────────────────────────
# Caddy writes structured JSON by default. The caddy collection parser handles
# both plain-text and JSON formats; no extra label is needed.
source: file
filenames:
  - TOKEN_PROJECT_STATE_DIR/logs/caddy/access.log
labels:
  type: caddy

---

# ── SSH brute-force detection via journald (Debian/Ubuntu: ssh.service) ───────
# Ubuntu names the SSH unit 'ssh.service'.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=ssh.service"
labels:
  type: syslog

---

# ── SSH brute-force detection via journald (RHEL/Oracle Linux: sshd.service) ──
# Oracle Linux (OCI default compute image) names the SSH unit 'sshd.service'.
# CrowdSec will simply find no events from whichever unit is absent on the host.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=sshd.service"
labels:
  type: syslog

---

# ── iptables kernel firewall logs ────────────────────────────────────────────
# Required by crowdsecurity/iptables collection.
# iptables must be configured to log DROP/REJECT packets with a prefix, e.g.:
#   sudo iptables -I INPUT -j LOG --log-prefix "[IPTABLES] " --log-level 4
# On OCI free-tier the default security list already drops port-scans;
# this source captures those drops so CrowdSec can correlate scanning activity.
source: file
filenames:
  - /var/log/kern.log
  - /var/log/messages
labels:
  type: iptables
