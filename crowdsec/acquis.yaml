# CrowdSec log acquisition configuration — VaultWarden-OCI
# Installed to /etc/crowdsec/acquis.d/vaultwarden.yaml by
# utilities/setup-crowdsec.sh.
#
# TOKEN_PROJECT_STATE_DIR is substituted at install time with the value of
# PROJECT_STATE_DIR from .env.
#
# FIELD NAME REFERENCE (journald source):
#   Correct : journalctl_filter  (list)   ← mandatory, single unit per document
#   Wrong   : journal_filters             ← does not exist, causes FATAL on start
# Ref: https://docs.crowdsec.net/docs/next/log_processor/data_sources/journald/

# ── Vaultwarden application logs ─────────────────────────────────────────────
# The Dominic-Wagner/vaultwarden parser requires a numeric UTC offset in each
# timestamp. Keep Vaultwarden's LOG_TIMESTAMP_FORMAT set to:
#   %Y-%m-%d %H:%M:%S.%3f%z
source: file
filenames:
  - TOKEN_PROJECT_STATE_DIR/logs/vaultwarden/vaultwarden.log
labels:
  type: vaultwarden

---

# ── Caddy access logs (JSON format) ──────────────────────────────────────────
# Caddy writes structured JSON by default. The caddy collection parser handles
# both plain-text and JSON formats; no extra label is needed.
source: file
filenames:
  - TOKEN_PROJECT_STATE_DIR/logs/caddy/access.log
labels:
  type: caddy

---

# ── SSH brute-force detection via journald (Debian/Ubuntu: ssh.service) ───────
# Ubuntu names the SSH unit 'ssh.service'.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=ssh.service"
labels:
  type: syslog

---

# ── SSH brute-force detection via journald (RHEL/Oracle Linux: sshd.service) ──
# Oracle Linux (OCI default compute image) names the SSH unit 'sshd.service'.
# CrowdSec will simply find no events from whichever unit is absent on the host.
source: journalctl
journalctl_filter:
  - "_SYSTEMD_UNIT=sshd.service"
labels:
  type: syslog

---

# ── Host firewall/kernel packet logs ─────────────────────────────────────────
# Required by crowdsecurity/iptables. The iptables parser runs after the syslog
# parser, so kernel messages must enter the pipeline with type: syslog.
#
# Only packets that reach this VM can be observed here. Traffic dropped by an
# OCI Security List or another provider-side firewall never reaches journald.
# Configure UFW/iptables/nftables logging for locally dropped packets; avoid
# acquiring /var/log/kern.log or /var/log/messages in parallel with this source,
# which would ingest the same events twice on systems forwarding journal logs.
source: journalctl
journalctl_filter:
  - "_TRANSPORT=kernel"
labels:
  type: syslog
