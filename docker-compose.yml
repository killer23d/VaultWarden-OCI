# VaultWarden-OCI-NG Docker Compose Configuration
# Fixed: Corrected UID/GID variable names and improved container configuration
# Updated: admin_basic_auth_hash now uses Docker secrets consistently

services:
  # VaultWarden Password Manager
  vaultwarden:
    image: vaultwarden/server:latest
    container_name: vaultwarden_app
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      # Core Configuration
      DOMAIN: "https://${DOMAIN}"
      ROCKET_PORT: 80
      ROCKET_ADDRESS: 0.0.0.0

      # Database
      # DATABASE_URL: "sqlite:///data/db.sqlite3"

      # Admin Configuration
      ADMIN_TOKEN_FILE: "/run/secrets/admin_token"

      # SMTP Configuration (optional)
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_FROM: "${SMTP_FROM:-noreply@${DOMAIN}}"
      SMTP_FROM_NAME: "${SMTP_FROM_NAME:-VaultWarden}"
      SMTP_PORT: "${SMTP_PORT:-587}"
      SMTP_SECURITY: "${SMTP_SECURITY:-starttls}"
      SMTP_USERNAME: "${SMTP_USERNAME:-}"
      SMTP_PASSWORD_FILE: "/run/secrets/smtp_password"

      # Push Notifications (optional)
      PUSH_ENABLED: "${PUSH_ENABLED:-false}"
      PUSH_INSTALLATION_ID_FILE: "/run/secrets/push_installation_id"
      PUSH_INSTALLATION_KEY_FILE: "/run/secrets/push_installation_key"

      # Security Settings
      SIGNUPS_ALLOWED: "${SIGNUPS_ALLOWED:-false}"
      INVITATIONS_ALLOWED: "${INVITATIONS_ALLOWED:-true}"
      EMERGENCY_ACCESS_ALLOWED: "${EMERGENCY_ACCESS_ALLOWED:-true}"
      SENDS_ALLOWED: "${SENDS_ALLOWED:-true}"
      WEB_VAULT_ENABLED: "${WEB_VAULT_ENABLED:-true}"

      # Performance
      DATABASE_MAX_CONNS: 10
      ROCKET_WORKERS: 10
      WEBSOCKET_ENABLED: "false"
      WEBSOCKET_ADDRESS: "0.0.0.0" 
      WEBSOCKET_PORT: 3012

      # Logging
      LOG_LEVEL: info
      EXTENDED_LOGGING: true
      LOG_FILE: "/data/vaultwarden.log"

      # Timezone
      TZ: "${TZ:-UTC}"

    volumes:
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/data:/data"
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/vaultwarden:/logs"

    secrets:
      - admin_token
      - smtp_password
      - push_installation_id
      - push_installation_key

    networks:
      - vaultwarden_network

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/alive"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 2G
        reservations:
          cpus: '0.2'
          memory: 512M

  # Caddy Reverse Proxy
  caddy:
    image: caddy:latest
    container_name: vaultwarden_caddy
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      DOMAIN: "${DOMAIN}"
      EMAIL: "${ADMIN_EMAIL}"

    ports:
      - "80:80"
      - "443:443"

    volumes:
      # Configuration files
      - "./caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
      - "./caddy/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro"

      # Persistent data
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/caddy/data:/data"
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/caddy/config:/config"

      # Logs
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/caddy:/logs"

    secrets:
      - admin_basic_auth_hash

    networks:
      - vaultwarden_network

    depends_on:
      vaultwarden:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 1m
      timeout: 15s
      retries: 5
      start_period: 1m

    deploy:
      resources:
        limits:
          cpus: '0.3'
          memory: 256M
        reservations:
          cpus: '0.05'
          memory: 128M

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # DDClient for Dynamic DNS
  ddclient:
    image: lscr.io/linuxserver/ddclient:latest
    container_name: vaultwarden_ddclient
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"
    
    environment:
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TZ: "${TZ:-UTC}"
      # Non-sensitive config from .env
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID}"
      DDCLIENT_HOSTNAME: "${DDCLIENT_HOSTNAME}"
      # SECRET: Use FILE__ prefix to read from Docker secret
      FILE__DDCLIENT_API_TOKEN: "/run/secrets/ddclient_api_token"

    volumes:
      - "./ddclient/ddclient.conf:/config/ddclient.conf"
      - "./ddclient/ddclient.conf:/etc/ddclient/ddclient.conf"
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/ddclient:/config/data"
    secrets:
      - ddclient_api_token

    networks:
      - vaultwarden_network

    deploy:
      resources:
        limits:
          cpus: '0.1'
          memory: 64M
        reservations:
          cpus: '0.02'
          memory: 32M

  # Fail2Ban Intrusion Prevention
  fail2ban:
    image: crazymax/fail2ban:latest
    container_name: vaultwarden_fail2ban
    restart: unless-stopped
    
    environment:
      F2B_LOG_LEVEL: INFO
      F2B_LOG_TARGET: /data/fail2ban.log
      TZ: "${TZ:-UTC}"
      # Non-sensitive config from .env
      CLOUDFLARE_ZONE_ID: "${CLOUDFLARE_ZONE_ID}"

    volumes:
      # Configuration
      - "./fail2ban/jail.d:/etc/fail2ban/jail.d:ro"
      - "./fail2ban/filter.d:/etc/fail2ban/filter.d:ro"
      - "./fail2ban/action.d:/etc/fail2ban/action.d:ro"
      
      # Data and logs
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/fail2ban:/data"
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/caddy:/var/log/caddy:ro"
      - "${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/fail2ban:/var/log"

    secrets:
      - fail2ban_api_token

    networks:
      - vaultwarden_network

    healthcheck:
      test: ["CMD", "fail2ban-client", "status"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '0.2'
          memory: 128M
        reservations:
          cpus: '0.05'
          memory: 64M

    cap_add:
      - NET_ADMIN
      - NET_RAW

# Docker Secrets (UPDATED: Added admin_basic_auth_hash)
secrets:
  admin_token:
    file: ./secrets/.docker_secrets/admin_token
  admin_basic_auth_hash:
    file: ./secrets/.docker_secrets/admin_basic_auth_hash
  smtp_password:
    file: ./secrets/.docker_secrets/smtp_password
  push_installation_id:
    file: ./secrets/.docker_secrets/push_installation_id
  push_installation_key:
    file: ./secrets/.docker_secrets/push_installation_key
  ddclient_api_token:
    file: ./secrets/.docker_secrets/ddclient_api_token
  fail2ban_api_token:
    file: ./secrets/.docker_secrets/fail2ban_api_token

# Networks
networks:
  vaultwarden_network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
