# VaultWarden-OCI Docker Compose Configuration
# Removed obsolete version tag

services:
  vaultwarden:
    image: vaultwarden/server:${VAULTWARDEN_VERSION:-latest}
    container_name: vaultwarden_app
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      - DOMAIN=https://${DOMAIN}
      - DATABASE_URL=sqlite:///data/bwdata/db.sqlite3
      - ADMIN_TOKEN_FILE=/run/secrets/admin_token

      # WebSocket Configuration
      - WEBSOCKET_ENABLED=true
      - WEBSOCKET_ADDRESS=0.0.0.0
      - WEBSOCKET_PORT=3012

      # SMTP Configuration
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_SECURITY=${SMTP_SECURITY:-starttls}
      - SMTP_USERNAME=${SMTP_USERNAME:-}
      - SMTP_PASSWORD_FILE=/run/secrets/smtp_password
      - SMTP_FROM=${ADMIN_EMAIL}
      - SMTP_FROM_NAME=VaultWarden

      # Push Notifications
      - PUSH_INSTALLATION_ID_FILE=/run/secrets/push_installation_id
      - PUSH_INSTALLATION_KEY_FILE=/run/secrets/push_installation_key

      # Security Settings
      - SIGNUPS_ALLOWED=false
      - SIGNUPS_VERIFY=true
      - INVITATIONS_ALLOWED=true
      - EMERGENCY_ACCESS_ALLOWED=true
      - SENDS_ALLOWED=true
      - WEB_VAULT_ENABLED=true

      # Logging Configuration
      - LOG_LEVEL=${VAULTWARDEN_LOG_LEVEL:-info}
      - EXTENDED_LOGGING=true
      - LOG_FILE=/logs/vaultwarden.log
      - TZ=UTC

    volumes:
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/data:/data:rw
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/vaultwarden:/logs:rw

    secrets:
      - admin_token
      - smtp_password
      - push_installation_id
      - push_installation_key

    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80/alive"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: ${VAULTWARDEN_MEMORY_LIMIT:-1g}
          cpus: '0.5'
        reservations:
          memory: 256m
          cpus: '0.1'

    networks:
      - vaultwarden_network

  caddy:
    # Changed default from specific version to 'latest'
    image: caddy:${CADDY_VERSION:-latest}
    container_name: vaultwarden_caddy
    restart: unless-stopped
    user: "${PUID:-1000}:${PGID:-1000}"

    environment:
      - DOMAIN=${DOMAIN}
      - EMAIL=${ADMIN_EMAIL}
      # ADMIN_BASIC_AUTH_HASH is passed via environment by startup.sh
      - ADMIN_BASIC_AUTH_HASH=${ADMIN_BASIC_AUTH_HASH}
      # CLOUDFLARE_API_TOKEN is passed via environment by startup.sh for ACME DNS challenge
      - CLOUDFLARE_API_TOKEN=${FAIL2BAN_API_TOKEN} # Using fail2ban token as it needs firewall perms

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy/cloudflare-ips.caddy:/etc/caddy/cloudflare-ips.caddy:ro
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/caddy/data:/data:rw
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/caddy/config:/config:rw
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/caddy:/logs:rw
      - ./secrets/.docker_secrets/admin_basic_auth_hash:/admin_basic_auth_hash:ro

    # Removed admin_basic_auth_hash and fail2ban_api_token from secrets here

    depends_on:
      vaultwarden:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "caddy", "version"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: ${CADDY_MEMORY_LIMIT:-128m}
          cpus: '0.2'
        reservations:
          memory: 64m
          cpus: '0.05'

    networks:
      - vaultwarden_network

  fail2ban:
    # Changed default from specific version to 'latest'
    image: crazymax/fail2ban:${FAIL2BAN_VERSION:-latest}
    container_name: vaultwarden_fail2ban
    restart: unless-stopped
    # Runs as root by default, which is correct

    environment:
      - TZ=UTC
      - F2B_LOG_LEVEL=${FAIL2BAN_LOG_LEVEL:-INFO}
      - F2B_LOG_TARGET=/var/log/fail2ban.log
      - F2B_DB_PURGE_AGE=1d
      - F2B_MAX_RETRY=3
      - F2B_DEST_EMAIL=${ADMIN_EMAIL}
      # Passed via environment by startup.sh
      - FAIL2BAN_API_TOKEN=${FAIL2BAN_API_TOKEN:-}
      - CLOUDFLARE_ZONE_ID=${CLOUDFLARE_ZONE_ID:-}

    volumes:
      - ./fail2ban/jail.d:/config/jail.d:ro
      - ./fail2ban/filter.d:/config/filter.d:ro
      - ./fail2ban/action.d:/config/action.d:ro
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/caddy:/var/log/caddy:ro
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/logs/fail2ban:/var/log:rw

    # Removed fail2ban_api_token from secrets here

    healthcheck:
      test: ["CMD-SHELL", "fail2ban-client ping"]
      interval: 60s
      timeout: 15s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: ${FAIL2BAN_MEMORY_LIMIT:-64m}
          cpus: '0.1'
        reservations:
          memory: 32m
          cpus: '0.02'

    networks:
      - vaultwarden_network

  ddclient:
    # Changed default from specific version to 'latest'
    image: linuxserver/ddclient:${DDCLIENT_VERSION:-latest}
    container_name: vaultwarden_ddclient
    restart: unless-stopped
    # --- START FIX: Use PUID/PGID ---
    user: "${PUID:-1000}:${PGID:-1000}"
    # --- END FIX ---

    volumes:
      - ./ddclient/ddclient.conf:/etc/ddclient/ddclient.conf:ro
      - ${PROJECT_STATE_DIR:-/var/lib/vaultwarden}/ddclient/cache:/var/cache/ddclient:rw

    environment:
      - DD_PROTOCOL=cloudflare
      - DD_ZONE=${CLOUDFLARE_ZONE_ID}
      - DD_HOST=${DDCLIENT_HOSTNAME}
      # DD_PASSWORD (API token) is passed via environment by startup.sh
      - DD_PASSWORD=${DDCLIENT_API_TOKEN}

    # Removed ddclient_api_token from secrets here

    healthcheck:
      test: ["CMD-SHELL", "pidof ddclient"]
      interval: 90s
      timeout: 15s
      retries: 5
      start_period: 60s

    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    deploy:
      resources:
        limits:
          memory: ${DDCLIENT_MEMORY_LIMIT:-64m}
          cpus: '0.1'
        reservations:
          memory: 32m
          cpus: '0.02'

    networks:
      - vaultwarden_network

# Secrets managed externally by startup script
# Removed redundant entries
secrets:
  admin_token:
    file: ./secrets/.docker_secrets/admin_token
  smtp_password:
    file: ./secrets/.docker_secrets/smtp_password
  push_installation_id:
    file: ./secrets/.docker_secrets/push_installation_id
  push_installation_key:
    file: ./secrets/.docker_secrets/push_installation_key

# Network configuration
networks:
  vaultwarden_network:
    name: ${DOCKER_NETWORK_NAME:-vaultwarden_network}
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
