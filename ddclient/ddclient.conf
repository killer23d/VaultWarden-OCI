# DDClient configuration for Cloudflare using Docker secrets
daemon=300
ssl=yes
use=web, web=https://checkip.amazonaws.com

# Cloudflare settings - the container will substitute environment variables
protocol=cloudflare
zone=lazymocha.com
ttl=1
server=www.cloudflare.com
login=${CLOUDFLARE_ZONE_ID}
password=${DDCLIENT_API_TOKEN}
${DDCLIENT_HOSTNAME}

