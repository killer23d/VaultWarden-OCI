name: PR330 runner inventory fix
on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Update exact runner inventory assertions
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/suites/foundation/case-runner-contracts.bash')
          text = path.read_text()
          replacements = [
              ('[[ "${#REGISTERED_RECORDS[@]}" -eq 31 ]] || fail "real runner listed ${#REGISTERED_RECORDS[@]} records; expected 31"',
               '[[ "${#REGISTERED_RECORDS[@]}" -eq 32 ]] || fail "real runner listed ${#REGISTERED_RECORDS[@]} records; expected 32"'),
              ('[[ "${#REGISTERED_PATHS[@]}" -eq 24 ]] || fail "real runner listed ${#REGISTERED_PATHS[@]} unique physical cases; expected 24"',
               '[[ "${#REGISTERED_PATHS[@]}" -eq 25 ]] || fail "real runner listed ${#REGISTERED_PATHS[@]} unique physical cases; expected 25"'),
              ('[[ "$(sort -u "$real_files" | wc -l | tr -d \'[:space:]\')" -eq 24 ]] || fail "list-files contains duplicate physical paths"',
               '[[ "$(sort -u "$real_files" | wc -l | tr -d \'[:space:]\')" -eq 25 ]] || fail "list-files contains duplicate physical paths"'),
              ('[[ "$(grep -c \'^  \' "$list_one")" -eq 31 ]] || fail "fixture list did not preserve 31 logical records"',
               '[[ "$(grep -c \'^  \' "$list_one")" -eq 32 ]] || fail "fixture list did not preserve 32 logical records"'),
              ('[[ "$(wc -l < "$files_one" | tr -d \'[:space:]\')" -eq 24 ]] || fail "fixture list-files did not preserve 24 unique physical paths"',
               '[[ "$(wc -l < "$files_one" | tr -d \'[:space:]\')" -eq 25 ]] || fail "fixture list-files did not preserve 25 unique physical paths"'),
              ('[[ "$(sort -u "$files_one" | wc -l | tr -d \'[:space:]\')" -eq 24 ]] || fail "fixture list-files duplicated a physical path"',
               '[[ "$(sort -u "$files_one" | wc -l | tr -d \'[:space:]\')" -eq 25 ]] || fail "fixture list-files duplicated a physical path"'),
              ('[[ "$(find "$FIXTURE_TESTS/suites" -type f -name \'case-*.bash\' | wc -l | tr -d \'[:space:]\')" -eq 24 ]] \\\n    || fail "fixture construction did not create one file per unique physical path"',
               '[[ "$(find "$FIXTURE_TESTS/suites" -type f -name \'case-*.bash\' | wc -l | tr -d \'[:space:]\')" -eq 25 ]] \\\n    || fail "fixture construction did not create one file per unique physical path"'),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one inventory assertion match, found {count}: {old}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          git diff --check
      - name: Commit inventory assertions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/suites/foundation/case-runner-contracts.bash
          git commit -m "test: update canonical runner inventory assertions"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
