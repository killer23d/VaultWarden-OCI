name: PR8 first inspection corrections
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Apply minimal corrections
        shell: bash
        run: |
          git show origin/delta:startup.sh > startup.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          def sub1(path, pattern, repl):
              p=Path(path); s=p.read_text(); n,c=re.subn(pattern,repl,s,count=1,flags=re.M|re.S)
              if c != 1: raise SystemExit(f"{path}: expected 1 regex match, got {c}: {pattern}")
              p.write_text(n)

          def rep1(path, old, new):
              p=Path(path); s=p.read_text(); c=s.count(old)
              if c != 1: raise SystemExit(f"{path}: expected 1 exact match, got {c}: {old[:90]!r}")
              p.write_text(s.replace(old,new,1))

          # startup.sh: preserve current delta verbatim except PR8 behavior.
          rep1('startup.sh', '''  if ! check_docker_available; then
            log_error "Docker daemon is not running or not accessible"
            return 1
          fi

          if [ ! -f "docker-compose.yml" ]; then''', '''  if ! check_docker_available; then
            log_error "Docker daemon is not running or not accessible"
            return 1
          fi
          if ! check_compose_available; then
            log_error "Docker Compose v2 plugin is not available"
            log_error "Install with: sudo apt install docker-compose-plugin"
            return 1
          fi

          if [ ! -f "docker-compose.yml" ]; then''')
          sub1('startup.sh', r'''# Run check_age_key_health\(\) before any SOPS invocation.*?^check_age_key_health_preflight\(\) \{.*?^\}\n\n# #38''', '''# Run check_age_key_health() before any SOPS invocation so a corrupt,
          # missing, or wrong-permissions canonical key produces an actionable error.
          check_age_key_health_preflight() {
            local canonical_key="/etc/vaultwarden/age-key.txt"
            if check_age_key_health "$canonical_key" 2>/dev/null; then
              SOPS_AGE_KEY_FILE="$canonical_key"
              export SOPS_AGE_KEY_FILE
              return 0
            fi
            log_error "Age key health check FAILED: ${canonical_key}"
            log_error "Restore the operational Age private key at ${canonical_key}, then run: sudo make key-health"
            return 1
          }

          # #38''')
          sub1('startup.sh', r'''\n  # Re-emit the key-health advisory immediately before the final success line.*?\n  fi\n\n  log_success "VaultWarden-OCI startup completed"''', '''

          log_success "VaultWarden-OCI startup completed"''')

          # Runtime env validation: only an opening quote requires a matching closing quote.
          p=Path('lib/config.sh'); s=p.read_text()
          s=s.replace('''        if [[ "$raw_value" == \\"* && "$raw_value" != *\\" ]] \\
            || [[ "$raw_value" == \\'* && "$raw_value" != *\\' ]] \\
            || [[ "$raw_value" != \\"* && "$raw_value" == *\\" ]] \\
            || [[ "$raw_value" != \\'* && "$raw_value" == *\\' ]]; then''', '''        if [[ "$raw_value" == \\"* && "$raw_value" != *\\" ]] \\
            || [[ "$raw_value" == \\'* && "$raw_value" != *\\' ]]; then''')
          p.write_text(s)

          # Restore rotation: one live key, no checkout private key or checkout .env mutation.
          p=Path('utilities/restore-run.sh'); s=p.read_text()
          s=re.sub(r'''#\n# Prune old Age private key backups.*?^\}\n\n#\n# Generates a fresh age key pair''', '''#
          # Generates a fresh age key pair''', s, count=1, flags=re.M|re.S)
          s=s.replace('''# Generates a fresh age key pair and installs it to every configured location
          # so the stack is immediately usable with the new key after the restore.
          #
          # Install locations (in order):
          #   1. secrets/keys/age-key.txt  (project-local copy; required for all modes)
          #   2. /etc/vaultwarden/age-key.txt  (systemd canonical; if it already exists)
          #   3. SOPS_AGE_KEY_FILE in .env updated to the canonical path
          #   4. SOPS_AGE_KEY_FILE in /etc/vaultwarden/vaultwarden.env (if present)
          #
          # Writes atomically: generates to a temp file, validates, then moves.''', '''# Generates a fresh age key pair and promotes it to the canonical operational
          # path. Runtime env authorities are staged in the same transaction so they
          # continue to name that canonical key. Checkout .env is never mutated.
          #
          # Writes atomically: generates to a temp file, validates, then promotes.''')
          s=s.replace('''        log_info "  /etc/vaultwarden/age-key.txt"
                  [[ -f "/etc/vaultwarden/age-key.txt" ]] && \\
                      log_info "  /etc/vaultwarden/age-key.txt"
                  log_info "  runtime SOPS authority remains canonical"''', '''        log_info "  /etc/vaultwarden/age-key.txt"
                  log_info "  runtime SOPS authority remains canonical"''')
          s=s.replace('''    local local_key_dir="$PROJECT_ROOT/secrets/keys"
              local local_key_file="$local_key_dir/age-key.txt"
              local systemd_key="/etc/vaultwarden/age-key.txt"
              local canonical_key="$systemd_key"
              local env_file="$PROJECT_ROOT/.env"''', '''    local systemd_key="/etc/vaultwarden/age-key.txt"
              local canonical_key="$systemd_key"''')
          s=s.replace('''    local staged_local_key="" staged_systemd_key="" staged_env="" staged_systemd_env="" staged_install_env=""''', '''    local staged_systemd_key="" staged_systemd_env="" staged_install_env=""''')
          s=s.replace('''        _restore_rotation_backup "$backup_dir/systemd-key.exists" "$backup_dir/systemd-age-key.txt" "$systemd_key"
                  _restore_rotation_backup "$backup_dir/local-key.exists" "$backup_dir/local-age-key.txt" "$local_key_file"
                  _restore_rotation_backup "$backup_dir/repo-env.exists" "$backup_dir/repo.env" "$env_file"
                  _restore_rotation_backup "$backup_dir/systemd-env.exists"''', '''        _restore_rotation_backup "$backup_dir/systemd-key.exists" "$backup_dir/systemd-age-key.txt" "$systemd_key"
                  _restore_rotation_backup "$backup_dir/systemd-env.exists"''')
          s=s.replace('''    staged_local_key="$staged_dir/local-age-key.txt"
              staged_systemd_key="$staged_dir/systemd-age-key.txt"
              staged_env="$staged_dir/repo.env"''', '''    staged_systemd_key="$staged_dir/systemd-age-key.txt"''')
          s=s.replace('''    install -d -m 700 "$local_key_dir" || { log_error "Failed to prepare repo-local key directory."; return 1; }
              install -d -m 700 -o root -g root "$(dirname "$systemd_key")" || { log_error "Failed to prepare /etc/vaultwarden."; return 1; }
              install -m 600 "$new_key_tmp" "$staged_local_key" || { log_error "Failed to stage repo-local key."; return 1; }
              install -m 600 -o root -g root "$new_key_tmp" "$staged_systemd_key" || { log_error "Failed to stage root-operated key."; return 1; }
              _stage_env_with_key "$env_file" "$staged_env" "$canonical_key" || { log_error "Failed to stage repo .env update."; return 1; }''', '''    install -d -m 700 -o root -g root "$(dirname "$systemd_key")" || { log_error "Failed to prepare /etc/vaultwarden."; return 1; }
              install -m 600 -o root -g root "$new_key_tmp" "$staged_systemd_key" || { log_error "Failed to stage root-operated key."; return 1; }''')
          s=s.replace('''    [[ -f "$systemd_key" ]] && { cp -f "$systemd_key" "$backup_dir/systemd-age-key.txt" || return 1; : > "$backup_dir/systemd-key.exists"; }
              [[ -f "$local_key_file" ]] && { cp -f "$local_key_file" "$backup_dir/local-age-key.txt" || return 1; : > "$backup_dir/local-key.exists"; }
              [[ -f "$env_file" ]] && { cp -f "$env_file" "$backup_dir/repo.env" || return 1; : > "$backup_dir/repo-env.exists"; }''', '''    [[ -f "$systemd_key" ]] && { cp -f "$systemd_key" "$backup_dir/systemd-age-key.txt" || return 1; : > "$backup_dir/systemd-key.exists"; }''')
          s=re.sub(r'''\n    if \[\[ -f "\$local_key_file" \]\]; then\n        local backup_ts;.*?\n    fi\n\n    if ! cp -f "\$staged_local_key" "\$local_key_file"; then _rollback_rotation; return 1; fi\n    promoted_any=true\n    chmod 600 "\$local_key_file" 2>/dev/null \|\| true\n    if ! install -m 600 -o root -g root "\$staged_systemd_key" "\$systemd_key"; then''', '''

              promoted_any=true
              if ! install -m 600 -o root -g root "$staged_systemd_key" "$systemd_key"; then''', s, count=1, flags=re.M|re.S)
          s=s.replace('''    if [[ -f "$staged_env" ]] && ! cp -f "$staged_env" "$env_file"; then _rollback_rotation; return 1; fi
          ''','')
          s=s.replace('''    log_success "  New key installed: $local_key_file"
              log_success "  New key installed: $systemd_key"
              [[ -f "$staged_env" ]] && log_success "  SOPS_AGE_KEY_FILE=${canonical_key} written to .env"''', '''    log_success "  New key installed: $systemd_key"''')
          s=s.replace('''    ROTATED_KEY_FILE="$local_key_file"''', '''    ROTATED_KEY_FILE="$systemd_key"''')
          s=s.replace('''    ROTATED_PUB_KEY=$(grep -m1 '^# public key:' "$local_key_file" | sed 's/^# public key: //' || true)
              if [[ -z "$ROTATED_PUB_KEY" ]]; then
                  ROTATED_PUB_KEY=$(age-keygen -y "$local_key_file" 2>/dev/null || true)
              fi''', '''    ROTATED_PUB_KEY=$(grep -m1 '^# public key:' "$systemd_key" | sed 's/^# public key: //' || true)
              if [[ -z "$ROTATED_PUB_KEY" ]]; then
                  ROTATED_PUB_KEY=$(age-keygen -y "$systemd_key" 2>/dev/null || true)
              fi''')
          s=s.replace('''
              # 7. Prune old Age private key backups — keep only 2 most recent
              _prune_old_age_keys "$local_key_dir"
          ''','\n')
          p.write_text(s)

          # setup-systemd consumes, validates and permissions the canonical key only.
          p=Path('utilities/setup-systemd.sh'); s=p.read_text()
          s=re.sub(r'''    # The operational Age key is provisioned directly at its canonical path\..*?\n    local rclone_dest=''', '''    # The operational Age key is provisioned directly at its canonical path.
              log_info "Checking canonical age key at $AGE_KEY_DEST ..."
              if [[ -f "$AGE_KEY_DEST" ]]; then
                  if [[ "$DRY_RUN" == "true" ]]; then
                      log_info "[DRY RUN] Would validate root:root 600 on $AGE_KEY_DEST"
                  else
                      fix_known_path_permissions "$AGE_KEY_DEST"
                      log_success "Canonical age key present: $AGE_KEY_DEST"
                  fi
              else
                  log_warn "Canonical Age key is missing: $AGE_KEY_DEST"
                  log_warn "Install the correct operational key there, then rerun this command."
              fi

              local rclone_dest=''', s, count=1, flags=re.M|re.S)
          p.write_text(s)
          PY
          rm -f .github/workflows/pr8-repair.yml
      - name: Syntax and focused authority checks
        shell: bash
        run: |
          bash -n startup.sh lib/config.sh utilities/restore-run.sh utilities/setup-systemd.sh
          bash tests/suites/foundation/case-runtime-authority.bash
          echo '--- remaining checkout Age-key references ---'
          grep -R -n --exclude-dir=.git --exclude='*.md' 'secrets/keys/age-key.txt' . || true
          echo '--- explicit load_env_file callers ---'
          grep -R -n --include='*.sh' --include='*.bash' 'load_env_file ' . || true
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime: tighten canonical authority after inspection'
          git push origin HEAD:pr8-runtime-authority-age-custody
