name: PR10 Latest Override Documentation Fix

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  apply-fix:
    if: startsWith(github.event.head_commit.message, 'ci')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0

      - name: Apply bounded documentation and regression changes
        run: python3 .github/pr10_latest_doc_fix.py

      - name: Regenerate command reference
        run: bash utilities/write-command-reference.sh

      - name: Validate focused changes
        run: |
          bash -n setup.sh utilities/setup-env.sh tests/suites/foundation/case-runner-contracts.bash
          VW_TEST_CASE_MODE=repository-interface bash tests/suites/foundation/case-runner-contracts.bash
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.sh utilities/setup-env.sh docs/SCRIPTS.md docs/PROJECT-BOUNDARY.md docs/DEPLOYMENT.md docs/COMMAND-REFERENCE.md tests/suites/foundation/case-runner-contracts.bash
          git commit -m "docs: document persistent latest override"
          git push origin HEAD:agent/pr10-platform-simplification
