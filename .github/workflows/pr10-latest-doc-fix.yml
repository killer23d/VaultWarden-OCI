name: PR10 Latest Override Documentation Fix

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  apply-fix:
    if: github.event.head_commit.message != 'docs: document persistent latest override'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0

      - name: Clarify persistent latest override contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'setup.sh',
              '# operator explicitly wants mutable upstream versions for this run.\n',
              '# operator explicitly wants mutable upstream versions. Environment generation\n'
              '# persists supported mutable image/CrowdSec tags in .env until they are re-pinned.\n',
          )
          replace_once(
              'setup.sh',
              '  --use-latest        Explicit override: use current live upstream component versions\n'
              '                      for this run instead of the repository-pinned normal defaults.\n'
              '                      Caddy remains pinned because xcaddy builds require a version tag.\n',
              '  --use-latest        Explicit override: opt into mutable upstream component versions.\n'
              "                      Environment generation writes supported image/CrowdSec version\n"
              "                      fields as 'latest' in .env; later pulls remain mutable until\n"
              '                      those fields are re-pinned. SOPS resolves latest for setup.\n'
              '                      Caddy remains pinned because xcaddy builds require a version tag.\n',
          )
          replace_once(
              'setup.sh',
              '        log_info "SOPS version: will resolve latest from GitHub because --use-latest was requested"\n',
              '        log_info "SOPS version: will resolve latest from GitHub because --use-latest was requested"\n'
              '        log_warn "--use-latest also persists mutable supported image/CrowdSec version tags in .env until they are re-pinned."\n',
          )

          replace_once(
              'utilities/setup-env.sh',
              '    --use-latest          Explicit override: set supported component versions to latest;\n'
              '                          Caddy remains pinned because xcaddy builder tags require\n'
              '                          an explicit version.\n',
              '    --use-latest          Explicit override: write supported image/CrowdSec version fields\n'
              "                          as 'latest' in .env. This persists across later pulls until\n"
              '                          those fields are re-pinned. Caddy remains pinned because\n'
              '                          xcaddy builder tags require an explicit version.\n',
          )
          replace_once(
              'utilities/setup-env.sh',
              '    if [[ "$USE_LATEST" == "true" ]]; then\n        local temp2\n',
              '    if [[ "$USE_LATEST" == "true" ]]; then\n'
              '        log_warn "--use-latest is writing persistent mutable version tags to .env; re-pin those fields to return to reproducible updates."\n'
              '        local temp2\n',
          )

          replace_once(
              'docs/SCRIPTS.md',
              '`setup-system.sh` fails closed outside Ubuntu 24.04 LTS Noble and outside amd64/arm64. Production setup uses repository-pinned component/tool versions by default. The explicit `--use-latest` override remains available for operator-requested live-version runs and is outside the normal/golden path.\n',
              '`setup-system.sh` fails closed outside Ubuntu 24.04 LTS Noble and outside amd64/arm64. Production setup uses repository-pinned component/tool versions by default. The explicit `--use-latest` override remains available for operator-requested live-version runs and is outside the normal/golden path. For supported image/CrowdSec fields, that override writes literal `latest` values into the generated `.env`; later pulls therefore remain mutable until the operator re-pins those fields. Caddy and yq stay exact-pinned; SOPS resolves its latest stable release only for the setup-system invocation.\n',
          )

          replace_once(
              'docs/PROJECT-BOUNDARY.md',
              'The project is pre-release. `VERSION` is a development identifier until the first real release. Production setup consumes source-controlled version pins by default. An explicit `--use-latest` override remains available for operator-requested live-version runs, but it is outside the normal/golden path. Runtime host code targets Ubuntu 24.04 LTS Noble on amd64/arm64 and may use its GNU toolchain directly.\n',
              'The project is pre-release. `VERSION` is a development identifier until the first real release. Production setup consumes source-controlled version pins by default. An explicit `--use-latest` override remains available for operator-requested live-version runs, but it is outside the normal/golden path. For supported image/CrowdSec fields, the override writes literal `latest` values into `.env`, intentionally keeping later pulls mutable until the operator re-pins those fields. Caddy and yq remain exact-pinned; SOPS latest resolution applies only to the setup-system invocation. Runtime host code targets Ubuntu 24.04 LTS Noble on amd64/arm64 and may use its GNU toolchain directly.\n',
          )

          deploy_anchor = 'The normal production lifecycle is root-operated. A Docker-group re-login is not a required deployment phase for the supported operator path.\n\n'
          deploy_insert = '''The normal production lifecycle is root-operated. A Docker-group re-login is not a required deployment phase for the supported operator path.\n\n### Optional mutable-version override\n\nNormal production setup uses the repository-pinned versions. `--use-latest` is an explicit operator opt-in outside the golden path:\n\n```bash\nsudo ./setup.sh install \\\n  --domain vault.yourdomain.com \\\n  --email admin@yourdomain.com \\\n  --use-latest\n```\n\nThis override is intentionally persistent for supported image and CrowdSec version fields: environment generation writes literal `latest` values into `.env`, so later image pulls or CrowdSec setup can resolve newer versions until those fields are restored to exact pins. Caddy and yq remain exact-pinned. SOPS resolves the latest stable release only for the setup-system invocation. `--auto` does not imply `--use-latest`.\n\n'''
          replace_once('docs/DEPLOYMENT.md', deploy_anchor, deploy_insert)

          old_test = '''grep -Fq 'Production setup uses repository-pinned component/tool versions by default.' docs/SCRIPTS.md \\\n    || fail 'operator docs must state that normal production setup is source-pinned'\ngrep -Fq 'The explicit `--use-latest` override remains available for operator-requested live-version runs and is outside the normal/golden path.' docs/SCRIPTS.md \\\n    || fail 'operator docs must retain the explicit --use-latest override contract'\n! grep -Fq 'mutable latest-version resolution is not part of the operator interface' docs/SCRIPTS.md \\\n    || fail 'operator docs must not deny the supported --use-latest override'\n'''
          new_test = '''grep -Fq 'Production setup uses repository-pinned component/tool versions by default.' docs/SCRIPTS.md \\\n    || fail 'operator docs must state that normal production setup is source-pinned'\ngrep -Fq 'The explicit `--use-latest` override remains available for operator-requested live-version runs and is outside the normal/golden path.' docs/SCRIPTS.md \\\n    || fail 'operator docs must retain the explicit --use-latest override contract'\ngrep -Fq 'writes literal `latest` values into the generated `.env`; later pulls therefore remain mutable until the operator re-pins those fields.' docs/SCRIPTS.md \\\n    || fail 'operator docs must explain that latest image/CrowdSec state persists in .env'\n! grep -Fq 'mutable latest-version resolution is not part of the operator interface' docs/SCRIPTS.md \\\n    || fail 'operator docs must not deny the supported --use-latest override'\n! grep -Fq 'for this run instead of the repository-pinned normal defaults' setup.sh \\\n    || fail 'setup help must not describe persistent latest tags as run-local'\ngrep -Fq "fields as 'latest' in .env; later pulls remain mutable until" setup.sh \\\n    || fail 'setup help must disclose persistent mutable .env tags'\ngrep -Fq "as 'latest' in .env. This persists across later pulls until" utilities/setup-env.sh \\\n    || fail 'setup-env help must disclose persistent mutable .env tags'\ngrep -Fq 'run: ./tests/run-tests.sh all' .github/workflows/canonical-tests.yml \\\n    || fail 'CI must execute the canonical permanent test entrypoint exactly'\n'''
          replace_once('tests/suites/foundation/case-runner-contracts.bash', old_test, new_test)
          PY

      - name: Regenerate command reference
        run: bash utilities/write-command-reference.sh

      - name: Validate focused changes
        run: |
          bash -n setup.sh utilities/setup-env.sh tests/suites/foundation/case-runner-contracts.bash
          VW_TEST_CASE_MODE=repository-interface bash tests/suites/foundation/case-runner-contracts.bash
          git diff --check

      - name: Commit correction
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add setup.sh utilities/setup-env.sh docs/SCRIPTS.md docs/PROJECT-BOUNDARY.md docs/DEPLOYMENT.md docs/COMMAND-REFERENCE.md tests/suites/foundation/case-runner-contracts.bash
          git commit -m "docs: document persistent latest override"
          git push origin HEAD:agent/pr10-platform-simplification
