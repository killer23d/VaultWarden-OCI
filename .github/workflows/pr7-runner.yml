name: PR7 runner
on:
  pull_request:
    branches:
      - delta
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Apply scoped patch
        run: |
          python3 .github/pr7-preprocess.py
          python3 /tmp/pr7_patch.py
          python3 .github/pr7-postfix.py
          python3 .github/pr7-testfix.py
          python3 .github/pr7-direct-tests.py
          python3 .github/pr7-testfix2.py
          python3 .github/pr7-testfix3.py
          python3 .github/pr7-editorfix.py
          python3 .github/pr7-workspacefix.py
          python3 .github/pr7-runtimefixture.py
          rm -f .github/pr7-preprocess.py .github/pr7-postfix.py .github/pr7-testfix.py .github/pr7-direct-tests.py .github/pr7-testfix2.py .github/pr7-testfix3.py .github/pr7-editorfix.py .github/pr7-workspacefix.py .github/pr7-runtimefixture.py .github/workflows/pr7-apply-validate.yml .github/workflows/pr7-runner.yml
      - name: Install validation dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3-yaml 7zip
      - name: Diagnose non-root recovery fixture
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/security/case-secrets.bash')
          t = p.read_text()
          t = t.replace('''if [[ "$MODE" == "core" || "$MODE" == "all" ]]; then\n    check_recovery_kit_attachment_passphrase_contract\nfi\n''', '''if false; then\n    check_recovery_kit_attachment_passphrase_contract\nfi\n''', 1)
          p.write_text(t)
          PY
          set +e
          export VW_TEST_CASE_MODE=core
          export PS4='+${FUNCNAME[0]:-main}:${LINENO}: '
          bash -x tests/suites/security/case-secrets.bash > /tmp/pr7-core.trace 2>&1
          rc=$?
          grep -n -C 35 'Sensitive workspaces require root privileges' /tmp/pr7-core.trace || true
          tail -n 200 /tmp/pr7-core.trace
          exit "$rc"
