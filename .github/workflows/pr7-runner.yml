name: PR7 runner
on:
  pull_request:
    branches:
      - delta
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Extract and apply patch script
        shell: bash
        run: |
          set -euo pipefail
          awk '/python3 <<'"'"'PY'"'"'/{capture=1; next} capture && /^          PY$/{exit} capture{sub(/^          /, ""); print}' .github/workflows/pr7-apply-validate.yml > /tmp/pr7_patch.py
          python3 - <<'PYFIX'
          from pathlib import Path
          p=Path('/tmp/pr7_patch.py')
          lines=p.read_text().splitlines(True)
          for i,line in enumerate(lines):
              if "local (temp_plain|temp_file)" in line and "pat=re.compile" in line:
                  indent=line[:len(line)-len(line.lstrip())]
                  lines[i]=indent + "pat=re.compile(r'(?ms)^(\\s*)local (temp_plain|temp_file)\\n\\1\\2=\\$\\(mktemp -p /dev/shm(?: --suffix=\\.yaml)? 2>/dev/null \\|\\| mktemp(?: --suffix=\\.yaml)?\\)\\n.*?\\1register_cleanup \"_remove_sensitive_file\" \"\\$\\2\"\\n')\n"
                  break
          else:
              raise SystemExit('plaintext matcher line not found in extracted patch')

          start=next(i for i,line in enumerate(lines) if "p=Path('utilities/secrets-rotate.sh')" in line)
          end=next(i for i in range(start,len(lines)) if "p.write_text(t[:m.start()]+new+t[m.end():])" in lines[i])
          indent=lines[start][:len(lines[start])-len(lines[start].lstrip())]
          replacement = '''p=Path('utilities/secrets-rotate.sh'); t=p.read_text()
old_plain=''' + repr('''    local temp_plain\n    temp_plain=$(mktemp -p /dev/shm --suffix=.yaml 2>/dev/null || mktemp --suffix=.yaml)\n    if ! install -m 600 /dev/null "$temp_plain" 2>/dev/null; then\n        rm -f "$temp_plain"\n        log_error "Failed to secure temp file: $temp_plain"\n        return 1\n    fi\n    if [[ -n "$temp_plain" && "$temp_plain" != /dev/shm/* ]]; then\n        log_warn "rotate: /dev/shm unavailable — plaintext temp file is disk-backed: $temp_plain"\n        log_warn "        Ensure full-disk encryption is active on this host."\n    fi\n    register_cleanup "_remove_sensitive_file" "$temp_plain"\n''') + '''\nnew_plain=''' + repr('''    local temp_plain sensitive_workspace\n    sensitive_workspace="$(create_sensitive_workspace secrets-rotate)" || return 1\n    register_cleanup "remove_sensitive_workspace" "$sensitive_workspace"\n    temp_plain="${sensitive_workspace}/secrets.yaml"\n    install -m 600 /dev/null "$temp_plain" || return 1\n''') + '''\nif old_plain not in t: raise SystemExit('rotate plaintext block missing')\nt=t.replace(old_plain,new_plain,1)\nold_patched=''' + repr('''    local temp_patched\n    temp_patched=$(mktemp -p /dev/shm --suffix=.yaml 2>/dev/null || mktemp --suffix=.yaml)\n    if ! install -m 600 /dev/null "$temp_patched" 2>/dev/null; then\n        rm -f "$temp_patched"\n        log_error "Failed to secure temp file: $temp_patched"\n        return 1\n    fi\n    if [[ -n "$temp_patched" && "$temp_patched" != /dev/shm/* ]]; then\n        log_warn "rotate: /dev/shm unavailable — patched temp file is disk-backed: $temp_patched"\n        log_warn "        Ensure full-disk encryption is active on this host."\n    fi\n    register_cleanup "_remove_sensitive_file" "$temp_patched"\n''') + '''\nnew_patched=''' + repr('''    local temp_patched\n    temp_patched="${sensitive_workspace}/secrets-patched.yaml"\n    install -m 600 /dev/null "$temp_patched" || return 1\n''') + '''\nif old_patched not in t: raise SystemExit('rotate patched block missing')\nt=t.replace(old_patched,new_patched,1)\np.write_text(t)\n'''
          lines[start:end+1]=[indent + line if line.strip() else line for line in replacement.splitlines(True)]
          p.write_text(''.join(lines))
          PYFIX
          python3 /tmp/pr7_patch.py
          rm -f .github/workflows/pr7-apply-validate.yml .github/workflows/pr7-runner.yml
      - name: Install validation dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3-yaml 7zip
      - name: Syntax validation
        shell: bash
        run: |
          set -euo pipefail
          for f in lib/crypto.sh lib/secrets.sh lib/defaults.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh tests/suites/security/case-secrets.bash; do bash -n "$f"; done
      - name: ShellCheck
        shell: bash
        run: shellcheck -x lib/crypto.sh lib/secrets.sh lib/defaults.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh
      - name: Focused security tests
        shell: bash
        run: |
          sudo env VW_TEST_CASE_MODE=sensitive-cleanup bash tests/suites/security/case-secrets.bash
          sudo env VW_TEST_CASE_MODE=core bash tests/suites/security/case-secrets.bash
      - name: Full suite
        shell: bash
        run: sudo ./tests/run-tests.sh all
      - name: Commit validated changes
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "secrets: fail closed on sensitive workspaces and SOPS replacement"
          git push origin HEAD:pr7-sensitive-workspace-sops-hardening
