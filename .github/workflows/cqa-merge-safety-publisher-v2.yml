name: Temporary CQA merge-safety publisher v2

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  publish-and-validate:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils python3-argon2 python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Verify source refs
        run: |
          git fetch origin \
            refs/heads/delta:refs/remotes/origin/delta \
            refs/heads/cqa-force-ack:refs/remotes/origin/cqa-force-ack \
            refs/heads/cqa-lock-preparation:refs/remotes/origin/cqa-lock-preparation \
            refs/heads/cqa-root-hints:refs/remotes/origin/cqa-root-hints \
            refs/heads/cqa-readonly-config:refs/remotes/origin/cqa-readonly-config \
            refs/heads/cqa-recovery-guard:refs/remotes/origin/cqa-recovery-guard \
            refs/heads/cqa-remediation:refs/remotes/origin/cqa-remediation
          test "$(git rev-parse refs/remotes/origin/delta)" = '5cdee3c2f527e565e76e7da78da1d4f628b26041'
          test "$(git rev-parse refs/remotes/origin/cqa-force-ack)" = 'ae76c02f45393c13a02ede72e8c0c92157de58fc'
          test "$(git rev-parse refs/remotes/origin/cqa-lock-preparation)" = 'f248cb57f72cc8cba13ae00c03323f758b31a7cf'
          test "$(git rev-parse refs/remotes/origin/cqa-root-hints)" = '54d6a3194d0521834060956df5754b640c14b042'
          test "$(git rev-parse refs/remotes/origin/cqa-readonly-config)" = 'e1dab709af894ab28f1b7e09d223f317bcb0bfea'
          test "$(git rev-parse refs/remotes/origin/cqa-recovery-guard)" = '0c2d6031bca9b7c8872ba0df76ecd0133e0dbe96'
          test "$(git rev-parse refs/remotes/origin/cqa-remediation)" = '9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1'

      - name: Apply focused PR 266 follow-up
        run: |
          git config user.name 'OpenAI'
          git config user.email 'noreply@openai.com'
          git switch -C cqa-root-hints refs/remotes/origin/cqa-root-hints
          python3 - <<'PY'
          from pathlib import Path

          common = Path('lib/common.sh')
          text = common.read_text()
          old = (
              '        local caller="${BASH_SOURCE[1]:-$0}" remediation arg\n'
              '        printf -v remediation \'sudo %q\' "$caller"\n'
          )
          new = (
              '        local caller="${BASH_SOURCE[1]:-$0}" remediation arg\n'
              '        if [[ "$caller" != */* && -f "./$caller" ]]; then\n'
              '            caller="./$caller"\n'
              '        fi\n'
              '        printf -v remediation \'sudo %q\' "$caller"\n'
          )
          if old not in text:
              raise SystemExit('require_root target not found')
          common.write_text(text.replace(old, new, 1))

          path = Path('tests/suites/security/case-security-privileges.bash')
          text = path.read_text()
          start = text.index('check_root_remediation_hints() (\n')
          block = text[start:]
          if not block.rstrip().endswith('check_root_remediation_hints'):
              raise SystemExit('unexpected root-hint block ending')
          text = text[:start].rstrip() + '\n'
          insert_at = text.index('check_privilege_contracts() (\n')
          text = text[:insert_at] + block.rstrip() + '\n\n' + text[insert_at:]

          text = text.replace(
              "assert_hint 'sudo startup.sh --skip-pull --background'",
              "assert_hint 'sudo ./startup.sh --skip-pull --background'",
              1,
          )
          text = text.replace(
              "assert_hint 'sudo startup.sh stop'",
              "assert_hint 'sudo ./startup.sh stop'",
              1,
          )

          probe_anchor = 'chmod 0644 "$TMP/state/config/install.env"\n'
          probe_lines = ''.join([
              '\n',
              'PROBE="$TMP/root-hint-probe"\n',
              'cat >"$PROBE" <<EOF_PROBE\n',
              '#!/usr/bin/env bash\n',
              'source "$ROOT/lib/common.sh"\n',
              "log_error(){ printf 'ERROR: %s\\n' \"\\$*\" >&2; }\n",
              "log_hint(){ printf 'HINT: %s\\n' \"\\$*\" >&2; }\n",
              'require_root "\\$@"\n',
              'EOF_PROBE\n',
              'chmod 0755 "$PROBE"\n',
              'ABS_PROBE="$TMP/absolute probe.sh"\n',
              'cp "$PROBE" "$ABS_PROBE"\n',
              'chmod 0755 "$ABS_PROBE"\n',
          ])
          if probe_anchor not in text:
              raise SystemExit('probe insertion target not found')
          text = text.replace(probe_anchor, probe_anchor + probe_lines, 1)

          assert_start = text.index('assert_hint() {\n')
          assert_end = text.index('\n}\n\nassert_root_free() {', assert_start)
          assert_body = text[assert_start:assert_end]
          assert_tail = (
              '    [[ "$hint" != *"requires root"* && "$hint" != *"must be run"* ]] \\\n'
              '        || fail "$label appended prose to the sudo command"'
          )
          if assert_tail not in assert_body:
              raise SystemExit('assert_hint tail not found')
          assert_body = assert_body.replace(
              assert_tail,
              assert_tail + '\n    ASSERTED_HINT="$hint"',
              1,
          )
          text = text[:assert_start] + assert_body + text[assert_end:]

          round_trip = ''.join([
              'assert_hint_round_trip() {\n',
              '    local hint="$1" label="$2"\n',
              '    shift 2\n',
              "    python3 - \"$hint\" \"$@\" <<'PY_PARSE' \\\n",
              '        || fail "$label remediation did not parse back to the original argument vector"\n',
              'import shlex\n',
              'import sys\n',
              '\n',
              'actual = shlex.split(sys.argv[1], posix=True)\n',
              'expected = ["sudo", *sys.argv[2:]]\n',
              'if actual != expected:\n',
              '    print(f"actual={actual!r}", file=sys.stderr)\n',
              '    print(f"expected={expected!r}", file=sys.stderr)\n',
              '    raise SystemExit(1)\n',
              'PY_PARSE\n',
              '}\n\n',
          ])
          root_free_anchor = 'assert_root_free() {\n'
          if root_free_anchor not in text:
              raise SystemExit('assert_root_free target not found')
          text = text.replace(root_free_anchor, round_trip + root_free_anchor, 1)

          startup_anchor = (
              "assert_hint 'sudo ./startup.sh stop' \"$ROOT\" 'startup stop' \\\n"
              '    "$BASH" startup.sh stop\n'
          )
          quoting_tests = ''.join([
              '\n',
              "quote_value='value with spaces;dollar$paren()&pipe|'\n",
              "printf -v quote_rendered '%q' \"$quote_value\"\n",
              'assert_hint "sudo ./root-hint-probe --label $quote_rendered" "$TMP" \'quoted bare caller\' \\\n',
              '    "$BASH" root-hint-probe --label "$quote_value"\n',
              'assert_hint_round_trip "$ASSERTED_HINT" \'quoted bare caller\' \\\n',
              '    ./root-hint-probe --label "$quote_value"\n',
              'pass "quoted remediation parses back without execution"\n',
              '\n',
              "printf -v abs_probe_rendered '%q' \"$ABS_PROBE\"\n",
              'assert_hint "sudo $abs_probe_rendered stop" "$ROOT" \'absolute caller path\' \\\n',
              '    "$BASH" "$ABS_PROBE" stop\n',
              'assert_hint_round_trip "$ASSERTED_HINT" \'absolute caller path\' "$ABS_PROBE" stop\n',
              'pass "absolute caller paths remain unchanged and shell-safe"\n',
          ])
          if startup_anchor not in text:
              raise SystemExit('startup test insertion target not found')
          text = text.replace(startup_anchor, startup_anchor + quoting_tests, 1)
          path.write_text(text)
          PY
          git diff --check
          test "$(git diff --name-only | sort)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          git add lib/common.sh tests/suites/security/case-security-privileges.bash
          git commit -m 'fix(privilege): make bare remediation paths executable'
          test "$(git rev-parse HEAD^{tree})" = 'e71547427055a12690ef93f5a410d45af540c425'

      - name: Validate PR 266 follow-up
        run: |
          set -o pipefail
          mkdir -p /tmp/cqa-evidence/pr266
          git diff --check refs/remotes/origin/cqa-root-hints..HEAD
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck -x --severity=warning
          ./tests/run-tests.sh list | tee /tmp/cqa-evidence/pr266/list.log
          ./tests/run-tests.sh security | tee /tmp/cqa-evidence/pr266/security-focused.log
          for suite in foundation security operations data-protection; do
            ./tests/run-tests.sh "$suite" | tee "/tmp/cqa-evidence/pr266/${suite}.log"
          done
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --exit-code

      - name: Push PR 266 follow-up
        run: |
          test "$(git ls-remote origin refs/heads/cqa-root-hints | cut -f1)" = '54d6a3194d0521834060956df5754b640c14b042'
          git push origin HEAD:refs/heads/cqa-root-hints
          git rev-parse HEAD | tee /tmp/cqa-evidence/pr266/head.txt

      - name: Build conflict-free integration branch
        run: |
          git fetch origin refs/heads/cqa-root-hints:refs/remotes/origin/cqa-root-hints
          git switch -C cqa-split-integration-v2 5cdee3c2f527e565e76e7da78da1d4f628b26041
          for branch in cqa-force-ack cqa-lock-preparation cqa-root-hints cqa-readonly-config cqa-recovery-guard; do
            echo "MERGE ${branch}" | tee -a /tmp/cqa-evidence/merge-order.log
            git merge --no-ff --no-edit "refs/remotes/origin/${branch}" 2>&1 | tee -a /tmp/cqa-evidence/merge-order.log
          done
          test -z "$(git status --short)"

      - name: Validate integrated tree
        run: |
          set -o pipefail
          mkdir -p /tmp/cqa-evidence/integration
          git diff --check
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck -x --severity=warning
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --exit-code
          for suite in foundation security operations data-protection; do
            ./tests/run-tests.sh "$suite" | tee "/tmp/cqa-evidence/integration/${suite}.log"
          done
          git diff --name-only 9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1 HEAD | tee /tmp/cqa-evidence/integration/diff-names.txt
          test "$(cat /tmp/cqa-evidence/integration/diff-names.txt)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          git diff 9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1 HEAD -- lib/common.sh tests/suites/security/case-security-privileges.bash > /tmp/cqa-evidence/integration/old-aggregate.diff
          git rev-parse HEAD | tee /tmp/cqa-evidence/integration/commit.txt
          git rev-parse HEAD^{tree} | tee /tmp/cqa-evidence/integration/tree.txt
          git diff --stat 5cdee3c2f527e565e76e7da78da1d4f628b26041 HEAD | tee /tmp/cqa-evidence/integration/diffstat.txt

      - name: Push persistent integration branch
        run: |
          test -z "$(git ls-remote origin refs/heads/cqa-split-integration-v2)"
          git push origin HEAD:refs/heads/cqa-split-integration-v2

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cqa-merge-safety-evidence-v2
          path: /tmp/cqa-evidence
          if-no-files-found: warn
          retention-days: 7
