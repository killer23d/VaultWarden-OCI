name: Temporary PR 291 runtime validation

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-pr291-runtime-validate.yml'
      - '.github/tmp-pr291-blocker-fix.patch'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply blocker correction
        shell: bash
        run: |
          echo 'bf9b09fb72ea220bbd74cf3e4aaad9888bc17b89f38878c0668e623651f48d15  .github/tmp-pr291-blocker-fix.patch' | sha256sum --check
          git apply .github/tmp-pr291-blocker-fix.patch
          rm -f .github/tmp-pr291-blocker-fix.patch
          rm -f .github/workflows/tmp-pr291-runtime-validate.yml
          git diff --check

      - name: Install focused validation dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck

      - name: Validate focused source
        shell: bash
        run: |
          bash -n utilities/maintenance-health.sh \
            tests/suites/operations/case-operations.bash \
            tests/suites/foundation/case-systemd.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-operations.bash \
            tests/suites/foundation/case-systemd.bash
          bash tests/suites/operations/case-operations.bash
          bash tests/suites/foundation/case-systemd.bash

      - name: Validate installed runtime from /opt
        shell: bash
        run: |
          stub_bin=$(mktemp -d)
          cleanup() {
            sudo rm -rf /opt/vaultwarden-scripts /etc/vaultwarden /var/lib/vaultwarden
            rm -rf "$stub_bin"
          }
          trap cleanup EXIT

          sudo mkdir -p /opt/vaultwarden-scripts/utilities /var/lib/vaultwarden/config
          sudo cp maintenance.sh /opt/vaultwarden-scripts/
          sudo cp utilities/maintenance-health.sh /opt/vaultwarden-scripts/utilities/
          sudo cp -a lib /opt/vaultwarden-scripts/
          sudo chmod 0700 /opt/vaultwarden-scripts/maintenance.sh \
            /opt/vaultwarden-scripts/utilities/maintenance-health.sh

          sudo tee /var/lib/vaultwarden/config/install.env >/dev/null <<'EOF_ENV'
          PROJECT_STATE_DIR=/var/lib/vaultwarden
          BACKUP_DIR=/var/lib/vaultwarden/backups
          VW_SMTP_HOST=smtp.example.invalid
          EOF_ENV
          sudo chmod 0600 /var/lib/vaultwarden/config/install.env
          sudo mkdir -p /var/lib/vaultwarden/backups/db /var/lib/vaultwarden/backups/full
          sudo touch /var/lib/vaultwarden/backups/db/quick-validation.age
          sudo touch /var/lib/vaultwarden/backups/full/quick-validation.age

          cat > "$stub_bin/docker" <<'EOF_DOCKER'
          #!/usr/bin/env bash
          printf '%s\n' "$*" >>"${DOCKER_CALLS:?}"
          case "$*" in
            'compose --project-name vaultwarden-oci ps --all --format json')
              printf '%s\n' '[{"Name":"vaultwarden_app","Service":"vaultwarden","State":"running","Health":"healthy"},{"Name":"vaultwarden_caddy","Service":"caddy","State":"running","Health":"healthy"}]'
              ;;
            'exec vaultwarden_app curl '*'/api/config')
              printf '200'
              ;;
            *)
              printf 'unexpected docker invocation: %s\n' "$*" >&2
              exit 64
              ;;
          esac
          EOF_DOCKER
          cat > "$stub_bin/curl" <<'EOF_CURL'
          #!/usr/bin/env bash
          printf 'alive'
          EOF_CURL
          chmod 0700 "$stub_bin/docker" "$stub_bin/curl"

          cd /opt/vaultwarden-scripts
          sudo env \
            PATH="$stub_bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin" \
            DOCKER_CALLS=/tmp/pr291-docker-calls \
            ./maintenance.sh health --quick

          [[ "$(grep -c '^compose ' /tmp/pr291-docker-calls)" -eq 1 ]]
          grep -Fxq 'compose --project-name vaultwarden-oci ps --all --format json' \
            /tmp/pr291-docker-calls

      - name: Verify health units
        shell: bash
        run: |
          stub_dir=$(mktemp -d)
          cleanup() {
            sudo rm -rf /opt/vaultwarden-scripts
            rm -rf "$stub_dir"
          }
          trap cleanup EXIT
          sudo mkdir -p /opt/vaultwarden-scripts
          printf '#!/usr/bin/env bash\nexit 0\n' \
            | sudo tee /opt/vaultwarden-scripts/maintenance.sh >/dev/null
          sudo chmod 0755 /opt/vaultwarden-scripts/maintenance.sh
          cat > "$stub_dir/docker.service" <<'EOF_DOCKER_UNIT'
          [Unit]
          Description=Test Docker stub
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
          EOF_DOCKER_UNIT
          cat > "$stub_dir/vaultwarden-notify-failure@.service" <<'EOF_NOTIFY'
          [Unit]
          Description=Test notifier
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          EOF_NOTIFY
          SYSTEMD_UNIT_PATH="$stub_dir:$PWD/systemd:/etc/systemd/system:/usr/lib/systemd/system:/lib/systemd/system" \
            systemd-analyze verify systemd/vaultwarden-health.service systemd/vaultwarden-health.timer

      - name: Commit validated correction
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Fix quick health Compose project lookup'
          git push origin HEAD:fix/health-quick-exit-contract
