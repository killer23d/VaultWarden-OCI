name: PR4 inspection safety fixes

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-inspection-safety]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply inspection safety fixes
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 .pr4-inspection-safety-fix.py
      - name: Install generated-doc dependency
        shell: bash
        run: |
          set -euo pipefail
          YQ_VERSION="v4.53.3"
          YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
      - name: Validate inspection safety fixes
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            utilities/setup-firewall.sh \
            utilities/maintenance-update-firewall.sh \
            utilities/setup-systemd.sh \
            tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning \
            utilities/setup-firewall.sh \
            utilities/maintenance-update-firewall.sh \
            utilities/setup-systemd.sh \
            tests/suites/operations/case-firewall-update.bash
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          bash tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
      - name: Commit validated inspection safety fixes
        shell: bash
        run: |
          set -euo pipefail
          git add \
            docs/COMMAND-REFERENCE.md \
            utilities/setup-firewall.sh \
            utilities/maintenance-update-firewall.sh \
            utilities/setup-systemd.sh \
            tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: fail closed on hidden UFW and lifecycle drift [skip pr4-inspection-safety]'
          git push origin HEAD:pr4-firewall-exactness
