name: PR4 branch autofix

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-autofix]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply focused fixes and regenerate docs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin delta
          git show origin/delta:setup.sh > setup.sh
          python3 - <<'PY'
          from pathlib import Path

          p = Path('setup.sh')
          text = p.read_text()
          old = '''    # Apply iptables rules on a best-effort basis.
              if [[ -x "${SCRIPT_DIR}/utilities/setup-firewall.sh" ]]; then
                  echo "INFO: Applying VaultWarden iptables rules..."
                  if "${SCRIPT_DIR}/utilities/setup-firewall.sh" --phase iptables; then
                      echo "OK: VaultWarden iptables rules applied"
                  else
                      echo "WARN: utilities/setup-firewall.sh --phase iptables did not complete successfully" >&2
                      echo "WARN: Run it manually after setup, or enable systemd/vaultwarden-iptables.service" >&2
                  fi
              fi
          '''
          new = '''    if ! "${SCRIPT_DIR}/utilities/setup-firewall.sh" --phase iptables \\
                "${_auto[@]}" "${_dry[@]}" "${_force[@]}"; then
                _phase_failed 5 "Required Docker/OCI firewall reconciliation failed" \\
                  "Check Docker's firewall backend and the FORWARD/DOCKER-USER chains." \\
                  "Re-run: sudo ./utilities/setup-firewall.sh --phase iptables --auto"
              fi
          '''
          if old not in text:
              raise SystemExit('expected setup.sh firewall block not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('utilities/setup-firewall.sh')
          text = p.read_text()
          old = '''    ssh_port="$(sshd -T 2>/dev/null | awk '/^port /{print $2; exit}')"'''
          new = '''    ssh_port="$(sshd -T 2>/dev/null | awk '/^port /{print $2; exit}' || true)"'''
          if old not in text:
              raise SystemExit('expected sshd probe not found')
          p.write_text(text.replace(old, new, 1))
          PY
          bash -n setup.sh utilities/setup-firewall.sh utilities/maintenance-update-firewall.sh
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --check
          git add setup.sh utilities/setup-firewall.sh docs/COMMAND-REFERENCE.md
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: finalize exact reconciliation docs [skip pr4-autofix]'
          git push origin HEAD:pr4-firewall-exactness
