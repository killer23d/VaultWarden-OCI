name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Verify Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile Python
        run: python3 -m compileall -q vaultwarden_oci tests
      - name: Parse shell glue
        run: bash -n setup.sh dashboard.sh vaultwarden_oci/dashboard.sh tests/acceptance_edge_packet.sh
      - name: Real exact-image admin credential boundary
        run: python3 tests/acceptance_admin_hash.py
      - name: Supported predecessor transition, successful update, and coherent rollback
        run: |
          success_host="$(mktemp -d /tmp/vwoci-update-success.XXXXXX)"
          failure_host="$(mktemp -d /tmp/vwoci-update-failure.XXXXXX)"
          state_file="$(mktemp /tmp/vwoci-update-state.XXXXXX)"
          crowdsec_root="$(mktemp -d /tmp/vwoci-crowdsec-transition.XXXXXX)"
          crowdsec_state="$(mktemp /tmp/vwoci-crowdsec-state.XXXXXX)"
          trap 'git worktree remove --force /tmp/vwoci-previous >/dev/null 2>&1 || true; chmod -R u+w "$success_host" "$failure_host" "$crowdsec_root" >/dev/null 2>&1 || true; rm -rf "$success_host" "$failure_host" "$state_file" "$crowdsec_root" "$crowdsec_state" || true' EXIT
          previous_ref="$(git merge-base HEAD origin/v2)"
          if [ "$previous_ref" = "$(git rev-parse HEAD)" ]; then previous_ref="$(git rev-parse HEAD^)"; fi
          git worktree add --detach /tmp/vwoci-previous "$previous_ref"

          # Actual predecessor code creates its real all-origin Worker config.
          # Candidate first pass re-arms it local-only and must stop for a new
          # Fail Open confirmation. The actual predecessor confirmation schema
          # then binds that proof to the new invocation before host expansion.
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_crowdsec_transition.py seed-predecessor "$crowdsec_root" "$crowdsec_state"
          PYTHONPATH="$PWD" python3 tests/acceptance_previous_crowdsec_transition.py rearm-candidate "$crowdsec_root" "$crowdsec_state"
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_crowdsec_transition.py confirm-predecessor "$crowdsec_root" "$crowdsec_state"
          PYTHONPATH="$PWD" python3 tests/acceptance_previous_crowdsec_transition.py migrate-candidate "$crowdsec_root" "$crowdsec_state"

          # Prove an ordinary successful forward transaction with the actual
          # supported predecessor updater, not only its rollback behavior.
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_update.py install-previous /tmp/vwoci-previous "$success_host"
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_update_success.py "$PWD" "$success_host"

          # Retain the independent post-start fail-closed/coherent rollback proof.
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_update.py install-previous /tmp/vwoci-previous "$failure_host"
          PYTHONPATH=/tmp/vwoci-previous python3 tests/acceptance_previous_update.py fail-forward-update "$PWD" "$failure_host" "$state_file"
          candidate_version="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["candidate"])' "$state_file")"
          candidate_python="$failure_host/opt/vaultwarden-oci/releases/$candidate_version"
          PYTHONPATH="$candidate_python" python3 tests/acceptance_previous_update.py rollback-with-candidate "$failure_host" "$state_file"
      - name: Unit and bounded integration suite
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: CLI help is authoritative
        run: |
          ./vwctl --help >/dev/null
          ./vwctl doctor --help >/dev/null
          ./vwctl update --help >/dev/null
          ./vwctl recovery --help >/dev/null
          ./vwctl recovery-kit --help >/dev/null
          bash ./dashboard.sh --help >/dev/null
      - name: Release-neutral path, content, complexity, and documentation audit
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          root = Path('.')
          generation_tokens = ('v' + '1', 'v' + '2', 'beta')
          path_pattern = re.compile(
              r'(^|[/_.-])(?:' + '|'.join(generation_tokens) + r')([/_.-]|$)',
              re.I,
          )
          stage_path_pattern = re.compile(r'(^|[/_.-])phase[0-9]+([/_.-]|$)', re.I)
          forbidden_paths = []
          for path in root.rglob('*'):
              if '.git' in path.parts:
                  continue
              value = path.as_posix()
              if path_pattern.search(value) or stage_path_pattern.search(value):
                  forbidden_paths.append(value)

          # Product-generation labels are forbidden. Genuine protocol/API/schema
          # versions remain valid compatibility identifiers.
          generation_pattern = re.compile(r'(?i)(?:^|[^A-Za-z0-9])v(?:1|2)(?:$|[^A-Za-z0-9.])')
          technical_version_pattern = re.compile(
              r'(?i)(?:/v(?:1|2)(?:/|\b)|age-encryption\.org/v1|application/vnd\.[^\s"\']*\.v(?:1|2)\+|\bAge v1 header\b)'
          )
          other_patterns = [
              re.compile(r'(?i)(?:^|[^A-Za-z0-9])phase\s*[0-9]+(?:$|[^A-Za-z0-9])'),
              re.compile(r'\bbeta\b', re.I),
              re.compile(r'VWOCI_DEVELOPMENT'), re.compile(r'resolve_latest_supported'),
              re.compile(r'pre[- ]release implementation', re.I),
              re.compile(r'implementation stage', re.I),
          ]
          violations = []
          for path in root.rglob('*'):
              if not path.is_file() or '.git' in path.parts or path == Path('.github/workflows/ci.yml'):
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              for number, line in enumerate(text.splitlines(), 1):
                  if generation_pattern.search(line) and not technical_version_pattern.search(line):
                      violations.append(f'{path}:{number}:{line.strip()}')
                      continue
                  if any(pattern.search(line) for pattern in other_patterns):
                      violations.append(f'{path}:{number}:{line.strip()}')

          source_paths = list(Path('vaultwarden_oci').glob('*.py')) + list(Path('systemd').glob('*')) + [Path('setup.sh'), Path('dashboard.sh'), Path('vwctl')]
          non_goals = [
              re.compile(r'\bpostfix\b|\bpostqueue\b|\bsendmail\b', re.I),
              re.compile(r'\bkubernetes\b|\bswarm\b|\bhigh[- ]availability\b', re.I),
          ]
          complexity = []
          for path in source_paths:
              if not path.is_file():
                  continue
              text = path.read_text(encoding='utf-8')
              for number, line in enumerate(text.splitlines(), 1):
                  if any(pattern.search(line) for pattern in non_goals):
                      complexity.append(f'{path}:{number}:{line.strip()}')

          markdown = [Path('README.md'), *Path('docs').glob('*.md'), Path('reports/TEST-STRATEGY.md')]
          link_re = re.compile(r'\[[^\]]+\]\(([^)]+)\)')
          broken_links = []
          for path in markdown:
              text = path.read_text(encoding='utf-8')
              for raw_target in link_re.findall(text):
                  target = raw_target.strip().split('#', 1)[0]
                  if not target or target.startswith(('http://', 'https://', 'mailto:')):
                      continue
                  resolved = (path.parent / target).resolve()
                  try:
                      resolved.relative_to(root.resolve())
                  except ValueError:
                      broken_links.append(f'{path}: link escapes repository: {target}')
                      continue
                  if not resolved.exists():
                      broken_links.append(f'{path}: missing local link: {target}')

          if forbidden_paths or violations or complexity or broken_links:
              print('generation-labelled paths:')
              print('\n'.join(forbidden_paths))
              print('generation-labelled content:')
              print('\n'.join(violations))
              print('unexpected non-goal runtime references:')
              print('\n'.join(complexity))
              print('broken local documentation links:')
              print('\n'.join(broken_links))
              raise SystemExit(1)
          PY

  caddy-config-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Exact custom Caddy build and config validation
        run: python3 tests/acceptance_caddy_config.py

  crowdsec-package-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Real CrowdSec firewall package sequencing
        run: sudo -E python3 tests/acceptance_crowdsec_firewall_package.py

  recovery-crypto-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone 7zip
          if ! command -v 7zz >/dev/null 2>&1; then sudo ln -s "$(command -v 7z)" /usr/local/bin/7zz; fi
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Real Age SOPS rclone recovery path
        run: python3 tests/acceptance_recovery_crypto.py
      - name: Real AES-256 recovery-kit ZIP path
        run: python3 tests/acceptance_recovery_kit.py

  edge-packet-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Real Docker IPv4 IPv6 origin path
        run: sudo bash tests/acceptance_edge_packet.sh
