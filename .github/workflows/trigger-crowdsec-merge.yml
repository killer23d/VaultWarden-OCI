name: Trigger CrowdSec installer merge

on:
  pull_request_target:
    branches:
      - Beta
    types:
      - opened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.actor == 'killer23d' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Beta
          fetch-depth: 0

      - name: Apply reviewed migration
        shell: bash
        run: |
          python3 - <<'PY'
          import re
          import textwrap
          from pathlib import Path

          workflow = Path('.github/workflows/merge-crowdsec-installer.yml').read_text()
          match = re.search(
              r"          python3 - <<'PY'\n(?P<body>.*?)\n          PY\n",
              workflow,
              re.DOTALL,
          )
          if not match:
              raise SystemExit('could not extract reviewed migration program')
          program = textwrap.dedent(match.group('body'))
          exec(compile(program, 'merge-crowdsec-installer', 'exec'), {})
          PY

      - name: Validate result
        shell: bash
        run: |
          bash -n utilities/setup-crowdsec.sh
          bash -n tests/test-crowdsec-config.sh
          tests/test-crowdsec-config.sh
          sudo apt-get update
          sudo apt-get install -y shellcheck
          shellcheck -x --severity=warning utilities/setup-crowdsec.sh tests/test-crowdsec-config.sh
          if grep -R -n 'setup-crowdsec-core' utilities tests .github docs; then
            echo 'stale setup-crowdsec-core reference remains' >&2
            exit 1
          fi

      - name: Commit result
        shell: bash
        run: |
          rm -f .github/workflows/merge-crowdsec-installer.yml
          rm -f .github/workflows/trigger-crowdsec-merge.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(crowdsec): merge and harden setup installer"
          git push origin HEAD:Beta
