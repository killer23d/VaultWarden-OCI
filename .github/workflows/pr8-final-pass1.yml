name: PR8 final authority inspection
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Pass 1 - authority and legacy-path audit
        shell: bash
        run: |
          set -euo pipefail
          bash tests/suites/foundation/case-runtime-authority.bash

          echo '--- checkout Age-key production references ---'
          age_refs="$(grep -R -n --exclude-dir=.git --exclude-dir=tests --exclude-dir=docs --exclude-dir=.github --exclude='*.md' 'secrets/keys/age-key.txt' . || true)"
          printf '%s\n' "$age_refs"
          unexpected_age="$(printf '%s\n' "$age_refs" | grep -v '^./utilities/backup-run.sh:' | sed '/^$/d' || true)"
          [[ -z "$unexpected_age" ]] || { echo 'Unexpected production checkout Age-key reference remains' >&2; exit 1; }

          echo '--- repository .env production fallback scan ---'
          env_fallbacks="$(grep -R -n --include='*.sh' --include='*.bash' -E 'load_env_file .*PROJECT_ROOT.*\.env|load_env_file .*\/\.env|Using repository \.env.*fallback|repository \.env as .*fallback' lib utilities startup.sh setup.sh backup.sh restore.sh 2>/dev/null | grep -vE 'env-edit|setup-|migrat|authoring' || true)"
          printf '%s\n' "$env_fallbacks"
          [[ -z "$env_fallbacks" ]] || { echo 'Production repository .env fallback remains' >&2; exit 1; }

          echo '--- Compose v1 executable fallback scan ---'
          compose_v1="$(grep -R -n --exclude-dir=.git --exclude-dir=tests --exclude-dir=docs --exclude-dir=.github --exclude='*.md' -E 'command -v[[:space:]]+docker-compose|(^|[;&|])[[:space:]]*docker-compose[[:space:]]|echo[[:space:]]+["'\'' ]*docker-compose["'\'' ]*' Makefile lib utilities *.sh 2>/dev/null || true)"
          printf '%s\n' "$compose_v1"
          [[ -z "$compose_v1" ]] || { echo 'Compose v1 executable fallback remains' >&2; exit 1; }

          echo '--- DNS secret-source ladder scan ---'
          ! grep -nE 'CLOUDFLARE_ZONE_ID|CF_TOKEN_FILE|/run/secrets/caddy_cloudflare_dns_token|docker compose exec -T caddy' utilities/maintenance-update-dns.sh

          echo '--- canonical setup key custody ---'
          grep -Fq 'local AGE_KEY_FILE="/etc/vaultwarden/age-key.txt"' utilities/setup-secrets.sh
          ! grep -Fq 'local AGE_KEY_FILE="${AGE_KEY_FILE:-/etc/vaultwarden/age-key.txt}"' utilities/setup-secrets.sh
          grep -Fq 'DOCKER_COMP          := docker compose' Makefile
          grep -Fq 'readonly _VW_CANONICAL_AGE_KEY_FILE="/etc/vaultwarden/age-key.txt"' lib/config.sh

          echo 'PASS final inspection 1: runtime/env/Age/DNS/Compose authorities are singular'
      - name: Remove inspection workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-final-pass1.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove PR8 final inspection helper'
          git push origin HEAD:pr8-runtime-authority-age-custody
