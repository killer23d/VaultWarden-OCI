name: Finalize cross-identity health coordination

on:
  pull_request:
    types:
      - reopened
    branches:
      - delta

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - name: Check out current review branch head
        uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Detect execution mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/final-health-cross-identity.py ]]; then
            echo 'mode=bootstrap' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=validate' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bounded staging state
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 6114f9121d7a8edc7d09f2877f1b9d05c745811a HEAD
          expected=$'.github/final-health-cross-identity.py\n.github/workflows/final-health-cross-identity.yml'
          actual="$(git diff --name-only 6114f9121d7a8edc7d09f2877f1b9d05c745811a...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected staging diff:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml

          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux-amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Apply reviewed cross-identity transform
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile .github/final-health-cross-identity.py
          python3 .github/final-health-cross-identity.py
          sed -i 's#sudo -n -- rm -f -- /run/lock/vaultwarden-health.lock#sudo -n -- /usr/bin/rm -f -- /run/lock/vaultwarden-health.lock#' \
            tests/suites/operations/case-health-alerts.bash
          grep -Fq 'sudo -n -- /usr/bin/rm -f -- /run/lock/vaultwarden-health.lock' \
            tests/suites/operations/case-health-alerts.bash
          git rm \
            .github/final-health-cross-identity.py \
            .github/workflows/final-health-cross-identity.yml

          git diff --check
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          bash -n tests/suites/operations/case-lock-fd-hygiene.bash
          bash -n lib/log.sh
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash \
            tests/suites/operations/case-lock-fd-hygiene.bash \
            lib/log.sh

      - name: Run focused operations validation
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run-tests.sh operations

      - name: Publish final code
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.github/final-health-cross-identity.py\n.github/workflows/final-health-cross-identity.yml\nlib/log.sh\nsystemd/vaultwarden-health.service\ntests/suites/operations/case-health-alerts.bash\ntests/suites/operations/case-lock-fd-hygiene.bash\nutilities/maintenance-health.sh'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected transformed file set:\n%s\n' "$actual" >&2
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Serialize health checks across invocation identities'
          git push origin HEAD:refactor/single-lock-ownership

      - name: Validate exact final PR head
        shell: bash
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote origin refs/heads/refactor/single-lock-ownership | awk '{print $1}')"
          [[ -n "$remote_head" ]]
          [[ "$(git rev-parse HEAD)" == "$remote_head" ]]
          printf 'Exact PR head: %s\n' "$remote_head"

          git fetch --no-tags origin delta:refs/remotes/origin/delta
          expected=$'lib/log.sh\nlib/operations.sh\nsystemd/vaultwarden-health.service\ntests/suites/foundation/case-systemd.bash\ntests/suites/operations/case-health-alerts.bash\ntests/suites/operations/case-lock-fd-hygiene.bash\ntests/suites/operations/case-operations.bash\nutilities/maintenance-health.sh\nutilities/setup-systemd.sh'
          actual="$(git diff --name-only origin/delta...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected final PR file set:\n%s\n' "$actual" >&2
            exit 1
          }

          git diff --check origin/delta...HEAD
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 shellcheck -x --severity=warning

          docker compose version
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet

          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          diff -q docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          python3 utilities/verify-production-readiness-remediation.py

          set +e
          ./tests/run-tests.sh all > /tmp/all-tests.log 2>&1
          tests_rc=$?
          set -e
          cat /tmp/all-tests.log
          (( tests_rc == 0 )) || exit "$tests_rc"

          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf 'Working tree is not clean after validation:\n%s\n' "$status" >&2
            exit 1
          fi

      - name: Generate exhaustive lock inventory evidence
        shell: bash
        run: |
          set -euo pipefail
          {
            echo '=== exact final head ==='
            git rev-parse HEAD
            echo

            echo '=== [1] operation_acquire and --specific-lock ==='
            grep -RIn --exclude-dir=.git -E 'operation_acquire|--specific-lock' . || true
            echo

            echo '=== [2] direct flock calls and lock variable/path declarations ==='
            grep -RIn --exclude-dir=.git -E 'flock|(^|[^A-Za-z0-9_])LOCK(_FILE|_PATH|_DIR|_TARGET|_FD)?=' . || true
            echo

            echo '=== [3] literal VaultWarden lock paths and health resolvers ==='
            grep -RIn --exclude-dir=.git -E '/run/lock|vaultwarden-.*\.lock|VW_HEALTH_LOCK_FILE|_health_readonly_lock_path|_health_host_gate_path' . || true
            echo

            echo '=== [4] lock-path chown/chmod/install ==='
            grep -RIn --exclude-dir=.git -E 'chown|chmod|install' . \
              | grep -Ei 'lock|LOCK' || true
            echo

            echo '=== [5] lock-path touch/redirection/mktemp/ln/mv/mkdir ==='
            grep -RIn --exclude-dir=.git -E 'touch|>|mktemp|(^|[^A-Za-z])(ln|mv|mkdir)([^A-Za-z]|$)' . \
              | grep -Ei 'lock|LOCK' || true
            echo

            echo '=== [6] managed identity drop-in 20-identity.conf ==='
            grep -RIn --exclude-dir=.git -F '20-identity.conf' . || true
            echo

            echo '=== [7] managed identity drop-in 30-run-as-root.conf ==='
            grep -RIn --exclude-dir=.git -F '30-run-as-root.conf' . || true
            echo

            echo '=== [8] User= and Group= overrides ==='
            grep -RIn -E '(^|[^A-Za-z])(User|Group)=' systemd utilities tests .github/workflows || true
            echo

            echo '=== [9] Makefile and dashboard callers ==='
            grep -nE 'health|operations|backup|restore|maintenance|flock' Makefile dashboard.sh || true
            echo

            echo '=== [10] systemd and workflow callers ==='
            grep -RIn -E 'health|operations|backup|restore|maintenance|flock|/run/lock' systemd .github/workflows || true
            echo

            echo '=== [11] changed-file scope ==='
            git diff --name-status origin/delta...HEAD
          } > /tmp/lock-inventory.txt
          cat /tmp/lock-inventory.txt

          cat > /tmp/lock-owner-inventory.md <<'TABLE'
          | Lock domain | Current preparation owner before PR #281 | Final preparation owner | Remains? / rationale |
          | --- | --- | --- | --- |
          | Global and operation-specific mutation locks under `/run/lock/vaultwarden-*.lock` | `lib/operations.sh` plus `utilities/setup-systemd.sh` precreation/metadata and legacy identity/group setup | `lib/operations.sh` | Yes. Owner-bound runtime holder remains the single preparation and lifetime owner. |
          | Host-wide health gate on the `/run/lock` directory inode | None | `utilities/maintenance-health.sh` | New advisory gate; no file, group, daemon, registry, or installer ownership. Serializes every supported EUID before local lock preparation. |
          | Root health regular file `/run/lock/vaultwarden-health.lock` | `utilities/maintenance-health.sh`, `utilities/setup-systemd.sh`, and `lib/operations.sh` when repair passed it as a specific operation lock | `utilities/maintenance-health.sh` | Yes, as the root local second layer after the host gate. |
          | Non-root XDG/TMP health regular files | `utilities/maintenance-health.sh` | `utilities/maintenance-health.sh` | Yes. Preserves local ownership, mode `0600`, and path-resolution compatibility after the host gate. |
          | `/run/lock/vaultwarden-migrate.lock` | `lib/migrate.sh` | `lib/migrate.sh` | Yes. Protects migration/resume state, including direct entry. |
          | `/run/lock/vaultwarden-email-queue.lock` | `utilities/email-queue.sh` | `utilities/email-queue.sh` | Yes. Narrow Postfix queue mutation domain. |
          | `/run/lock/vaultwarden-breakglass.lock` | `utilities/setup-secrets.sh` | `utilities/setup-secrets.sh` | Yes. Narrow break-glass account operation domain. |
          | `/run/lock/vw-notify-<unit>.lock` | `utilities/notify-failure.sh` | `utilities/notify-failure.sh` | Yes. Per-unit duplicate notification suppression. |
          | `${PROJECT_STATE_DIR}/.vw-health-alert/recovery-delivery.lock` | `lib/health-alerts.sh` | `lib/health-alerts.sh` | Yes. Local exactly-once incident/recovery state transition. |
          TABLE
          cat /tmp/lock-owner-inventory.md

      - name: Upload exact-head evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: pr-281-cross-identity-exact-head-evidence
          path: |
            /tmp/all-tests.log
            /tmp/lock-inventory.txt
            /tmp/lock-owner-inventory.md
          if-no-files-found: error
          retention-days: 14
