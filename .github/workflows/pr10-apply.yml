name: PR10 one-shot apply

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0

      - name: Apply PR10 cleanup
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def read(path): return Path(path).read_text()
          def write(path, text): Path(path).write_text(text)
          def must_replace(path, old, new):
              text = read(path)
              if old not in text:
                  raise SystemExit(f"{path}: expected text not found: {old[:100]!r}")
              write(path, text.replace(old, new))

          write('VERSION', '0.1.0-dev\n')
          changelog = read('CHANGELOG.md')
          changelog = changelog.replace('\n---\n\n## [1.0.0] — 2026-03-26\n\n### Added\n', '\n\n### Pre-release baseline\n\nVaultWarden-OCI has not had a public release yet. The entries below describe the initial pre-release repository baseline.\n\n')
          changelog = changelog.replace('- Initial public release of VaultWarden-OCI.\n', '- Initial VaultWarden-OCI repository baseline.\n')
          changelog = re.sub(r'\n\[1\.0\.0\]:[^\n]*\n\[Unreleased\]:[^\n]*\n?$', '\n', changelog)
          if '[1.0.0]' in changelog or 'releases/tag/v1.0.0' in changelog:
              raise SystemExit('CHANGELOG.md: false 1.0.0 release reference remains')
          write('CHANGELOG.md', changelog)

          boundary = read('docs/PROJECT-BOUNDARY.md').rstrip() + '''\n\n## Explicit product-scope decisions\n\nThese decisions are intentional and should not be reopened as generic cleanup work without new product evidence:\n\n- **C1 — `acme_http`: keep.** Direct HTTP-01 remains an advanced fallback. Cloudflare DNS-01 stays the first-run and normal production path.\n- **C2 — macOS developer convenience: keep only in developer/test tooling.** Production host code assumes the supported Ubuntu Noble GNU userspace and must not carry BSD/macOS runtime branches.\n- **C3 — restore start-policy aliases: keep.** `--start` and `--no-start` remain concise aliases for `--start-policy auto` and `--start-policy manual`; they do not create a second policy authority.\n- **C4 — HTTP email providers: keep.** Provider API drivers remain advanced alternatives. Postfix/direct SMTP remains the normal production interface and first-run path.\n- **C5 — CrowdSec advanced modes: keep the currently documented modes only.** The normal installer remains the daemon-backed Cloudflare Workers path. Existing proxy-disabled/autonomous modes remain advanced options; do not add more variants without a demonstrated small-team need.\n\n## Version and host policy\n\nThe project is pre-release. `VERSION` is a development identifier until the first real release. Production setup consumes source-controlled version pins and does not offer a mutable `--use-latest` mode. Runtime host code targets Ubuntu 24.04 LTS Noble on amd64/arm64 and may use its GNU toolchain directly.\n'''
          write('docs/PROJECT-BOUNDARY.md', boundary)

          must_replace('utilities/pre-production-drill.sh', "perms=$(stat -c '%a' \"$key_file\" 2>/dev/null || stat -f '%OLp' \"$key_file\" 2>/dev/null || echo \"???\")", "perms=$(stat -c '%a' \"$key_file\" 2>/dev/null || echo \"???\")")
          must_replace('utilities/pre-production-drill.sh', '# init-permissions has restart:"no" and exits after fixing bind-mount ownership;\n    # it is intentionally included here to verify it completes successfully.\n    local expected_services=(vaultwarden caddy postfix init-permissions)', '# These are the current production services in docker-compose.yml.example.\n    local expected_services=(vaultwarden caddy postfix)')

          must_replace('docker-compose.yml.example', '# Core flow: host permission preparation -> vaultwarden + caddy -> postfix', '# Core services: vaultwarden + caddy + postfix')
          write('docker-compose.yml.example', read('docker-compose.yml.example').replace('setup-iptables.sh', 'utilities/setup-firewall.sh'))
          dev = read('docker-compose.override.dev.yml.example')
          dev = re.sub(r'  # Mailpit - Email capture during development \(replaces abandoned mailhog\)\n  # =+\n  # mailhog/mailhog[^\n]*\n  # axllent/mailpit[^\n]*\n  # Port mapping[^\n]*\n', '  # Mailpit - development email capture\n  # =============================================================================\n', dev)
          dev = re.sub(r'  # Version is sourced from MAILPIT_VERSION[^\n]*\n', '', dev)
          write('docker-compose.override.dev.yml.example', dev)

          common = read('lib/common.sh')
          common, n = re.subn(r'_common_stat_mode\(\) \{.*?^\}\n\n_common_stat_owner\(\) \{.*?^\}\n\n_common_stat_group\(\) \{.*?^\}', "_common_stat_mode() { stat -c '%a' \"$1\" 2>/dev/null; }\n_common_stat_owner() { stat -c '%U' \"$1\" 2>/dev/null; }\n_common_stat_group() { stat -c '%G' \"$1\" 2>/dev/null; }", common, count=1, flags=re.M|re.S)
          if n != 1: raise SystemExit('lib/common.sh: stat helper block not found')
          common, n = re.subn(r'_package_manager_hint\(\) \{.*?^\}', "_package_manager_hint() {\n    printf '%s\\n' 'sudo apt-get install'\n}", common, count=1, flags=re.M|re.S)
          if n != 1: raise SystemExit('lib/common.sh: package hint block not found')
          write('lib/common.sh', common)

          crypto = read('lib/crypto.sh')
          crypto, n = re.subn(r'_stat_octal_perms\(\) \{.*?^\}\n\n_stat_file_size\(\) \{.*?^\}\n\n_stat_owner\(\) \{.*?^\}\n\n_stat_group\(\) \{.*?^\}', "_stat_octal_perms() { stat -c '%a' -- \"$1\" 2>/dev/null; }\n\n_stat_file_size() { stat -c '%s' -- \"$1\" 2>/dev/null; }\n\n_stat_owner() { stat -c '%U' -- \"$1\" 2>/dev/null; }\n\n_stat_group() { stat -c '%G' -- \"$1\" 2>/dev/null; }", crypto, count=1, flags=re.M|re.S)
          if n != 1: raise SystemExit('lib/crypto.sh: stat helper block not found')
          crypto, n = re.subn(r'''    local checksum\n    if has_command sha256sum; then\n        checksum=\$\(sha256sum "\$file" \| cut -d' ' -f1\)\n    elif has_command shasum; then\n        checksum=\$\(shasum -a 256 "\$file" \| cut -d' ' -f1\)\n    else\n        log_error "No SHA256 utility available \(sha256sum or shasum\)"\n        return 1\n    fi\n\n    printf '%s\\n' "\$checksum"''', '''    if ! has_command sha256sum; then\n        log_error "Required GNU sha256sum command is unavailable"\n        return 1\n    fi\n\n    local checksum\n    checksum=$(sha256sum -- "$file" | cut -d' ' -f1) || return 1\n    printf '%s\\n' "$checksum"''', crypto, count=1)
          if n != 1: raise SystemExit('lib/crypto.sh: SHA fallback block not found')
          write('lib/crypto.sh', crypto)

          setup = read('setup.sh')
          setup = setup.replace('# Set SOPS_VERSION to use a specific release. When unset or blank, setup uses\n# the repository-pinned production default. Pass --use-latest to intentionally\n# resolve the current SOPS release from GitHub during dependency installation.\n', '# Set SOPS_VERSION to use a specific release. When unset or blank, setup uses\n# the repository-pinned production default.\n')
          setup = setup.replace('USE_LATEST=false\n', '').replace('                      to rotate them. Does NOT imply --use-latest.\n', '                      to rotate them.\n')
          setup = re.sub(r'  --use-latest        Use live upstream container and CrowdSec versions in \.env,\n                      and resolve the latest SOPS release instead of the pinned\n                      production default\.\n', '', setup)
          setup = setup.replace('        --use-latest)   USE_LATEST=true;           shift ;;\n', '')
          setup = re.sub(r'\nif \[\[ "\$USE_LATEST" == "true" && "\$SOPS_VERSION_ENV_SET" == "true" \]\]; then\n.*?\nfi\n', '\n', setup, count=1, flags=re.S)
          setup = setup.replace('    local _dry=() _force=() _auto=() _skip_deps=() _use_latest=()\n', '    local _dry=() _force=() _auto=() _skip_deps=()\n').replace('    [[ "$USE_LATEST" == "true" ]] && _use_latest=(--use-latest)\n', '')
          setup = setup.replace('        "${_auto[@]}" "${_skip_deps[@]}" "${_use_latest[@]}" "${_dry[@]}" "${_force[@]}" \\\n', '        "${_auto[@]}" "${_skip_deps[@]}" "${_dry[@]}" "${_force[@]}" \\\n').replace('        "${_use_latest[@]}" "${_dry[@]}" "${_force[@]}" "${_dev_flags[@]}" \\\n', '        "${_dry[@]}" "${_force[@]}" "${_dev_flags[@]}" \\\n')
          if '--use-latest' in setup or 'USE_LATEST' in setup: raise SystemExit('setup.sh: mutable latest contract remains')
          write('setup.sh', setup)

          env = read('utilities/setup-env.sh').replace('USE_LATEST=false\n', '').replace('            --use-latest)   USE_LATEST=true ;;\n', '')
          env = re.sub(r'    --use-latest          Set compatible mutable image/component versions to \'latest\';\n                          Caddy remains pinned because xcaddy builder tags do not\n                          support caddy:latest-builder\.\n', '', env)
          env, n = re.subn(r'detect_ssh_log_path\(\) \{.*?^\}', "detect_ssh_log_path() {\n    printf '%s\\n' '/var/log/auth.log'\n}", env, count=1, flags=re.M|re.S)
          if n != 1: raise SystemExit('setup-env: SSH log detector not found')
          env = env.replace('        local domain_matches=false email_matches=false latest_matches=false storage_matches=false\n', '        local domain_matches=false email_matches=false versions_match=false storage_matches=false\n')
          env, n = re.subn(r'''\n        if \[\[ "\$USE_LATEST" == "true" \]\]; then\n.*?\n        else\n            grep -qE '\^\(VAULTWARDEN\|CADDY\|POSTFIX\|BUSYBOX\)_VERSION=latest' "\$env_file" \\\n                \|\| latest_matches=true\n        fi\n''', '''\n        grep -qE '^(VAULTWARDEN|CADDY|POSTFIX|BUSYBOX|CROWDSEC|CF_WORKER_BOUNCER|FIREWALL_BOUNCER)_VERSION=latest' "$env_file" \\\n            || versions_match=true\n''', env, count=1, flags=re.S)
          if n != 1: raise SystemExit('setup-env: idempotency latest block not found')
          env = env.replace('           [[ "$latest_matches"  == "true" ]] && \\\n', '           [[ "$versions_match" == "true" ]] && \\\n')
          env, n = re.subn(r'''\n    if \[\[ "\$USE_LATEST" == "true" \]\]; then\n        local temp2\n.*?\n        temp_env="\$temp2"\n    fi\n''', '\n', env, count=1, flags=re.S)
          if n != 1: raise SystemExit('setup-env: render latest block not found')
          if '--use-latest' in env or 'USE_LATEST' in env: raise SystemExit('setup-env: mutable latest remains')
          write('utilities/setup-env.sh', env)

          system = read('utilities/setup-system.sh').replace('USE_LATEST=false\n', '').replace('export USE_LATEST FORCE\n', 'export FORCE\n').replace('    --use-latest          Resolve the latest SOPS release instead of the pinned default\n', '').replace('            --use-latest)   USE_LATEST=true ;;\n', '')
          system = re.sub(r'\n    if \[\[ "\$USE_LATEST" == "true" && "\$SOPS_VERSION_CLI_SET" == "true" \]\]; then\n.*?\n    fi\n    if \[\[ "\$USE_LATEST" == "true" && "\$_SOPS_VERSION_ENV_SET" == "true" \]\]; then\n.*?\n    fi\n', '\n', system, count=1, flags=re.S)
          system, n = re.subn(r'\n# Resolve the latest release tag from the GitHub API\.\nresolve_github_latest\(\) \{.*?^\}\n', '\n', system, count=1, flags=re.M|re.S)
          if n != 1: raise SystemExit('setup-system: latest resolver not found')
          system, n = re.subn(r'''install_sops\(\) \{\n    local sops_ver="\$\{SOPS_VERSION:-\$SOPS_DEFAULT_VERSION\}"\n    if \[\[ "\$USE_LATEST" == "true" \]\]; then\n.*?\n    elif \[\[ -n "\$sops_ver" \]\]; then''', '''install_sops() {\n    local sops_ver="${SOPS_VERSION:-$SOPS_DEFAULT_VERSION}"\n    if [[ -n "$sops_ver" ]]; then''', system, count=1, flags=re.S)
          if n != 1: raise SystemExit('setup-system: install_sops latest block not found')
          if '--use-latest' in system or 'USE_LATEST' in system or '/releases/latest' in system: raise SystemExit('setup-system: mutable latest remains')
          write('utilities/setup-system.sh', system)

          crowd = read('utilities/setup-crowdsec.sh').replace('USE_LATEST=false\n', '').replace('        --use-latest)  USE_LATEST=true; shift ;;\n', '')
          crowd = re.sub(r'    --use-latest         Override version pins and use the current live upstream\n                         release of each component\.\n', '', crowd)
          crowd, n = re.subn(r'\nif \[\[ "\$USE_LATEST" == "true" \]\]; then\n.*?\n\[\[ "\$\{FIREWALL_BOUNCER_VERSION:-\}"  == "latest" \]\] && FIREWALL_BOUNCER_VERSION=""\n', '''\nfor _version_var in CROWDSEC_VERSION CF_WORKER_BOUNCER_VERSION FIREWALL_BOUNCER_VERSION; do\n    _version_value="${!_version_var:-}"\n    if [[ -z "$_version_value" || "$_version_value" == "latest" ]]; then\n        log_error "${_version_var} must be pinned to a source-controlled version in .env."\n        exit 1\n    fi\ndone\nunset _version_var _version_value\n''', crowd, count=1, flags=re.S)
          if n != 1: raise SystemExit('setup-crowdsec: latest block not found')
          crowd = crowd.replace('    log_warn "Recommended: sudo ./utilities/setup-crowdsec.sh --use-latest"\n', '    log_warn "Recommended: sudo ./utilities/setup-crowdsec.sh"\n')
          crowd, n1 = re.subn(r'''    _cs_pkg="crowdsec"\n    if \[\[ -n "\$CROWDSEC_VERSION" \]\]; then\n        _cs_pkg="crowdsec=\$\{CROWDSEC_VERSION\}"\n        log_info "CrowdSec version pinned: \$\{CROWDSEC_VERSION\}"\n    else\n        log_info "CrowdSec version: installing latest from packagecloud repository"\n    fi''', '''    _cs_pkg="crowdsec=${CROWDSEC_VERSION}"\n    log_info "CrowdSec version pinned: ${CROWDSEC_VERSION}"''', crowd, count=1)
          crowd, n2 = re.subn(r'''    if \[\[ -n "\$\{FIREWALL_BOUNCER_VERSION:-\}" \]\]; then\n        _fw_pkg="\$\{_fw_base\}-\$\{_fw_suffix\}=\$\{FIREWALL_BOUNCER_VERSION\}"\n        log_info "Firewall bouncer version pinned: \$\{FIREWALL_BOUNCER_VERSION\}"\n    else\n        _fw_pkg="\$\{_fw_base\}-\$\{_fw_suffix\}"\n        log_info "Firewall bouncer version: installing latest from packagecloud repository"\n    fi''', '''    _fw_pkg="${_fw_base}-${_fw_suffix}=${FIREWALL_BOUNCER_VERSION}"\n    log_info "Firewall bouncer version pinned: ${FIREWALL_BOUNCER_VERSION}"''', crowd, count=1)
          crowd, n3 = re.subn(r'''        _worker_pkg="crowdsec-cloudflare-worker-bouncer"\n        if \[\[ -n "\$CF_WORKER_BOUNCER_VERSION" \]\]; then\n            _worker_pkg="\$\{_worker_pkg\}=\$\{CF_WORKER_BOUNCER_VERSION#v\}"\n            log_info "CF Workers bouncer package version pinned: \$\{CF_WORKER_BOUNCER_VERSION#v\}"\n        else\n            log_info "CF Workers bouncer package version: using configured CrowdSec repository candidate"\n        fi''', '''        _worker_pkg="crowdsec-cloudflare-worker-bouncer=${CF_WORKER_BOUNCER_VERSION#v}"\n        log_info "CF Workers bouncer package version pinned: ${CF_WORKER_BOUNCER_VERSION#v}"''', crowd, count=1)
          if (n1,n2,n3) != (1,1,1): raise SystemExit(f'setup-crowdsec: pin blocks not found {(n1,n2,n3)}')
          if '--use-latest' in crowd or 'USE_LATEST' in crowd: raise SystemExit('setup-crowdsec: mutable latest remains')
          write('utilities/setup-crowdsec.sh', crowd)

          scripts = read('docs/SCRIPTS.md').replace('`setup-system.sh` fails closed outside Ubuntu 24.04 LTS Noble and outside amd64/arm64.\n', '`setup-system.sh` fails closed outside Ubuntu 24.04 LTS Noble and outside amd64/arm64. Production setup uses repository-pinned component/tool versions; mutable latest-version resolution is not part of the operator interface.\n')
          write('docs/SCRIPTS.md', scripts)

          for path in [p for p in Path('.').rglob('*') if p.is_file() and '.git' not in p.parts]:
              try: text = path.read_text()
              except UnicodeDecodeError: continue
              updated = text.replace('utilities/generate-command-ref.sh', 'utilities/write-command-reference.sh')
              updated = re.sub(r'^.*VWOCI-PRR-PATCH[^\n]*\n', '', updated, flags=re.M)
              if updated != text: path.write_text(updated)

          Path('LICENSE').write_text('''MIT License\n\nCopyright (c) 2026 VaultWarden-OCI contributors\n\nPermission is hereby granted, free of charge, to any person obtaining a copy\nof this software and associated documentation files (the "Software"), to deal\nin the Software without restriction, including without limitation the rights\nto use, copy, modify, merge, publish, distribute, sublicense, and/or sell\ncopies of the Software, and to permit persons to whom the Software is\nfurnished to do so, subject to the following conditions:\n\nThe above copyright notice and this permission notice shall be included in all\ncopies or substantial portions of the Software.\n\nTHE SOFTWARE IS PROVIDED "AS IS", WITHOUT WARRANTY OF ANY KIND, EXPRESS OR\nIMPLIED, INCLUDING BUT NOT LIMITED TO THE WARRANTIES OF MERCHANTABILITY,\nFITNESS FOR A PARTICULAR PURPOSE AND NONINFRINGEMENT. IN NO EVENT SHALL THE\nAUTHORS OR COPYRIGHT HOLDERS BE LIABLE FOR ANY CLAIM, DAMAGES OR OTHER\nLIABILITY, WHETHER IN AN ACTION OF CONTRACT, TORT OR OTHERWISE, ARISING FROM,\nOUT OF OR IN CONNECTION WITH THE SOFTWARE OR THE USE OR OTHER DEALINGS IN THE\nSOFTWARE.\n''')

          workflow = read('.github/workflows/doc-drift.yml')
          workflow = workflow.replace('            "simple_verify_age_key"\n', '            "simple_verify_age_key"\n            "init-permissions"\n            "utilities/generate-command-ref.sh"\n            "--use-latest"\n            "VWOCI-PRR-PATCH"\n')
          start = workflow.index('      - name: Check for unpinned version references\n')
          end = workflow.index('      - name: Systemd unit hardening check\n', start)
          replacement = '''      - name: Check pinned production version contract\n        run: |\n          FAIL=0\n          if grep -RFn -- '--use-latest' setup.sh utilities/setup-system.sh utilities/setup-env.sh utilities/setup-crowdsec.sh; then\n            echo "UNPINNED: mutable --use-latest production setup mode is forbidden"\n            FAIL=1\n          fi\n          if grep -RFn '/releases/latest' setup.sh utilities/ lib/ --include='*.sh' 2>/dev/null; then\n            echo "UNPINNED: production shell code must not resolve mutable GitHub latest releases"\n            FAIL=1\n          fi\n          if grep -rn '@latest' utilities/ lib/ --include='*.sh' 2>/dev/null; then\n            echo "UNPINNED: mutable @latest reference found in production shell code"\n            FAIL=1\n          fi\n          if ! grep -Fq 'SOPS_DEFAULT_VERSION="v3.13.2"' utilities/setup-system.sh; then\n            echo "UNPINNED: setup-system.sh must define the pinned SOPS default"\n            FAIL=1\n          fi\n          if grep -Eq '^(VAULTWARDEN_VERSION|CADDY_VERSION|POSTFIX_VERSION|BUSYBOX_VERSION|CROWDSEC_VERSION|CF_WORKER_BOUNCER_VERSION|FIREWALL_BOUNCER_VERSION)=latest$' .env.example; then\n            echo "UNPINNED: component version in .env.example"\n            FAIL=1\n          fi\n          if grep -En '^[[:space:]]*--with[[:space:]]+github.com/[^[:space:]@]+([[:space:]\\\\]|$)' caddy/Dockerfile; then FAIL=1; fi\n          if grep -En '^[[:space:]]*--with[[:space:]]+github.com/.*@(latest|main|master|HEAD)([[:space:]\\\\]|$)' caddy/Dockerfile; then FAIL=1; fi\n          [[ $FAIL -eq 0 ]] || exit 1\n\n      - name: Check Noble-only production host assumptions\n        run: |\n          FAIL=0\n          for term in 'stat -f' 'shasum' 'dnf' 'yum'; do\n            matches=$(grep -RFn -- "$term" setup.sh startup.sh maintenance.sh backup.sh restore.sh recover.sh lib/ utilities/ --include='*.sh' 2>/dev/null || true)\n            if [[ -n "$matches" ]]; then echo "UNSUPPORTED HOST FALLBACK FOUND: $term"; echo "$matches"; FAIL=1; fi\n          done\n          [[ $FAIL -eq 0 ]] || exit 1\n\n'''
          write('.github/workflows/doc-drift.yml', workflow[:start] + replacement + workflow[end:])
          PY

          git rm -f reports/PRODUCTION-READINESS-delta-2026-07-23-6a7d9e70954c.md

      - name: Install command-reference dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age python3-argon2 python3-bcrypt python3-yaml
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Regenerate command reference and smoke-check diff
        shell: bash
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          bash utilities/write-command-reference.sh
          git diff --check
          bash -n setup.sh utilities/setup-env.sh utilities/setup-system.sh utilities/setup-crowdsec.sh utilities/pre-production-drill.sh lib/common.sh lib/crypto.sh

      - name: Remove one-shot workflow and publish
        shell: bash
        run: |
          git rm .github/workflows/pr10-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "cleanup: narrow production platform and refresh operator contract"
          git push origin HEAD:agent/pr10-platform-simplification
