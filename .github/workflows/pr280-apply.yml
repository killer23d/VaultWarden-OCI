name: PR 280 Apply Remediation
on:
  push:
    branches:
      - codex/small-team-runtime-remediation
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install focused validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age python3-yaml
      - name: Apply bounded patch
        run: |
          set -euo pipefail
          cat .pr280-patch-* > /tmp/pr280.patch.b64
          base64 --decode /tmp/pr280.patch.b64 > /tmp/pr280.patch
          git apply --check /tmp/pr280.patch
          git apply /tmp/pr280.patch
      - name: Validate focused behavior
        run: |
          set -euo pipefail
          git diff --check
          find . \
            -path './.git' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) \
            -print0 | xargs -0 -n1 bash -n
          python3 utilities/verify-production-readiness-remediation.py
          bash tests/suites/foundation/case-config-env.bash
          bash tests/suites/foundation/case-systemd.bash
          bash tests/suites/security/case-secrets.bash
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --exit-code -- docs/COMMAND-REFERENCE.md
      - name: Commit final implementation
        run: |
          set -euo pipefail
          rm -f .pr280-patch-* .github/workflows/pr280-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "complete small-team runtime remediation"
          git push origin HEAD:codex/small-team-runtime-remediation
