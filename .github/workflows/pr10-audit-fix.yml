name: PR10 audit cleanup

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0
      - name: Apply audit findings
        run: |
          python3 .github/pr10-audit-fix.py
          git diff --check
          bash -n lib/operations.sh lib/health-alerts.sh utilities/maintenance-health.sh utilities/restore-run.sh
          shellcheck -x --severity=warning lib/operations.sh lib/health-alerts.sh utilities/maintenance-health.sh utilities/restore-run.sh
          echo 'Remaining portability markers in production runtime:'
          grep -REn --include='*.sh' 'stat[[:space:]]+-L?f([[:space:]]|%)|shasum|(^|[[:space:]])(dnf|yum)([[:space:]]|$)|date[[:space:]]+-(j|v)' \
            setup.sh startup.sh maintenance.sh backup.sh restore.sh recover.sh lib/ utilities/ || true
          echo 'Remaining BSD/macOS prose in production runtime:'
          grep -REn --include='*.sh' 'BSD|macOS|Darwin|Homebrew' \
            setup.sh startup.sh maintenance.sh backup.sh restore.sh recover.sh lib/ utilities/ || true
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/operations.sh lib/health-alerts.sh utilities/maintenance-health.sh utilities/restore-run.sh
          git diff --cached --quiet && exit 0
          git commit -m 'cleanup: finish Noble-only safety paths'
          git push origin HEAD:agent/pr10-platform-simplification
