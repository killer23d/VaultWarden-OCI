name: PR 280 Snapshot Cleanup
on:
  push:
    branches:
      - codex/small-team-runtime-remediation
permissions:
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Restore workflow and remove temporary snapshot
        run: |
          set -euo pipefail
          git checkout 12c4af6eaeb795a8ebbb8208f2cda5ddf100dc02 -- .github/workflows/doc-drift.yml
          rm -f .github/workflows/pr280-source-snapshot.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/workflows/doc-drift.yml .github/workflows/pr280-source-snapshot.yml
          git commit -m "ci: remove temporary source snapshot workflow"
          git push origin HEAD:codex/small-team-runtime-remediation
