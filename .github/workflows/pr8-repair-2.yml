name: PR8 structural inspection corrections
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Apply structural corrections
        shell: bash
        run: |
          git show origin/delta:startup.sh > startup.sh
          python3 - <<'PY'
          from pathlib import Path
          import re

          def rx(path, pattern, replacement, label):
              p = Path(path)
              text = p.read_text()
              new, count = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f"{path}: {label}: expected one match, got {count}")
              p.write_text(new)

          # startup.sh: current delta plus only canonical-key and Compose-v2 gates.
          rx(
              'startup.sh',
              r'(  if ! check_docker_available; then\n.*?\n  fi\n)\n  if \[ ! -f "docker-compose.yml" \]; then',
              r'\1  if ! check_compose_available; then\n    log_error "Docker Compose v2 plugin is not available"\n    log_error "Install with: sudo apt install docker-compose-plugin"\n    return 1\n  fi\n\n  if [ ! -f "docker-compose.yml" ]; then',
              'compose prerequisite',
          )
          rx(
              'startup.sh',
              r'# Run check_age_key_health\(\) before any SOPS invocation.*?^check_age_key_health_preflight\(\) \{.*?^\}\n\n# #38',
              '# Run check_age_key_health() before any SOPS invocation so a corrupt,\n# missing, or wrong-permissions canonical key produces an actionable error.\ncheck_age_key_health_preflight() {\n  local canonical_key="/etc/vaultwarden/age-key.txt"\n  if check_age_key_health "$canonical_key" 2>/dev/null; then\n    SOPS_AGE_KEY_FILE="$canonical_key"\n    export SOPS_AGE_KEY_FILE\n    return 0\n  fi\n  log_error "Age key health check FAILED: ${canonical_key}"\n  log_error "Restore the operational Age private key at ${canonical_key}, then run: sudo make key-health"\n  return 1\n}\n\n# #38',
              'canonical startup key preflight',
          )
          rx(
              'startup.sh',
              r'\n  # Re-emit the key-health advisory immediately before the final success line.*?\n  fi\n\n  log_success "VaultWarden-OCI startup completed"',
              '\n\n  log_success "VaultWarden-OCI startup completed"',
              'legacy key reminder removal',
          )

          # Runtime env validation: a quote is structural only when it opens the value.
          p = Path('lib/config.sh')
          text = p.read_text()
          text, count = re.subn(
              r'        if \[\[ "\$raw_value" == \\"\* && "\$raw_value" != \*\\" \]\] \\\n            \|\| \[\[ "\$raw_value" == \\\'\* && "\$raw_value" != \*\\\' \]\] \\\n            \|\| \[\[ "\$raw_value" != \\"\* && "\$raw_value" == \*\\" \]\] \\\n            \|\| \[\[ "\$raw_value" != \\\'\* && "\$raw_value" == \*\\\' \]\]; then',
              '        if [[ "$raw_value" == \\"* && "$raw_value" != *\\" ]] \\\n            || [[ "$raw_value" == \\\'* && "$raw_value" != *\\\' ]]; then',
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'lib/config.sh: quote validation correction expected one match, got {count}')
          p.write_text(text)

          # Restore: keep the existing rekey transaction, but collapse live custody to /etc.
          p = Path('utilities/restore-run.sh')
          text = p.read_text()

          def r1(pattern, replacement, label):
              global text
              text, count = re.subn(pattern, replacement, text, count=1, flags=re.M | re.S)
              if count != 1:
                  raise SystemExit(f'restore-run.sh: {label}: expected one match, got {count}')

          r1(r'#\n# Prune old Age private key backups.*?^\}\n\n#\n# Generates a fresh age key pair', '#\n# Generates a fresh age key pair', 'remove persistent old-key pruning')
          r1(r'# Generates a fresh age key pair and installs it to every configured location.*?# Sets ROTATED_KEY_FILE and ROTATED_PUB_KEY for display\.', '# Generates a fresh age key pair and promotes it to the canonical operational\n# path. Runtime env authorities are staged in the same transaction so they\n# continue to name that canonical key. Checkout .env is never mutated.\n#\n# Writes atomically: generates to a temp file, validates, then promotes.\n# Returns 0 on success, 1 on any failure.\n# Sets ROTATED_KEY_FILE and ROTATED_PUB_KEY for display.', 'rotation contract comment')
          r1(r'        log_info "  /etc/vaultwarden/age-key.txt"\n        \[\[ -f "/etc/vaultwarden/age-key.txt" \]\] && \\\n            log_info "  /etc/vaultwarden/age-key.txt"\n        log_info "  runtime SOPS authority remains canonical"', '        log_info "  /etc/vaultwarden/age-key.txt"\n        log_info "  runtime SOPS authority remains canonical"', 'dry-run duplicate')
          r1(r'    local local_key_dir="\$PROJECT_ROOT/secrets/keys"\n    local local_key_file="\$local_key_dir/age-key.txt"\n    local systemd_key="/etc/vaultwarden/age-key.txt"\n    local canonical_key="\$systemd_key"\n    local env_file="\$PROJECT_ROOT/\.env"', '    local systemd_key="/etc/vaultwarden/age-key.txt"\n    local canonical_key="$systemd_key"', 'live key declarations')
          r1(r'    local staged_local_key="" staged_systemd_key="" staged_env="" staged_systemd_env="" staged_install_env=""', '    local staged_systemd_key="" staged_systemd_env="" staged_install_env=""', 'staged declarations')
          text = re.sub(r'^        _restore_rotation_backup "\$backup_dir/local-key\.exists".*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^        _restore_rotation_backup "\$backup_dir/repo-env\.exists".*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    staged_local_key=.*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    staged_env=.*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    install -d -m 700 "\$local_key_dir".*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    install -m 600 "\$new_key_tmp" "\$staged_local_key".*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    _stage_env_with_key "\$env_file".*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    \[\[ -f "\$local_key_file" \]\] && .*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    \[\[ -f "\$env_file" \]\] && .*\n', '', text, count=1, flags=re.M)
          r1(r'\n    if \[\[ -f "\$local_key_file" \]\]; then\n        local backup_ts;.*?\n    chmod 600 "\$local_key_file" 2>/dev/null \|\| true\n', '\n    promoted_any=true\n', 'remove repo key promotion and persistent backup')
          text = re.sub(r'^    if \[\[ -f "\$staged_env" \]\] && .*\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    log_success "  New key installed: \$local_key_file"\n', '', text, count=1, flags=re.M)
          text = re.sub(r'^    \[\[ -f "\$staged_env" \]\] && log_success .*\.env"\n', '', text, count=1, flags=re.M)
          text = text.replace('    ROTATED_KEY_FILE="$local_key_file"', '    ROTATED_KEY_FILE="$systemd_key"', 1)
          text = text.replace('"$local_key_file"', '"$systemd_key"')
          text = re.sub(r'\n    # 7\. Prune old Age private key backups.*?\n    _prune_old_age_keys .*?\n', '\n', text, count=1, flags=re.M | re.S)

          start = text.index('_rotate_age_key() {')
          end = text.index('\n}\n\n# Prints the new age key', start) + 2
          rotation = text[start:end]
          forbidden = ['secrets/keys/age-key.txt', '$PROJECT_ROOT/.env', 'local_key_file', 'staged_env', 'repo.env', '_prune_old_age_keys']
          leftovers = [value for value in forbidden if value in rotation]
          if leftovers:
              raise SystemExit(f'restore-run.sh: legacy rotation custody remains: {leftovers}')
          p.write_text(text)

          # systemd install validates the canonical key in place and never copies a checkout key.
          rx(
              'utilities/setup-systemd.sh',
              r'    # The operational Age key is provisioned directly at its canonical path\..*?\n    local rclone_dest=',
              '    # The operational Age key is provisioned directly at its canonical path.\n    log_info "Checking canonical age key at $AGE_KEY_DEST ..."\n    if [[ -f "$AGE_KEY_DEST" ]]; then\n        if [[ "$DRY_RUN" == "true" ]]; then\n            log_info "[DRY RUN] Would validate root:root 600 on $AGE_KEY_DEST"\n        else\n            fix_known_path_permissions "$AGE_KEY_DEST"\n            log_success "Canonical age key present: $AGE_KEY_DEST"\n        fi\n    else\n        log_warn "Canonical Age key is missing: $AGE_KEY_DEST"\n        log_warn "Install the correct operational key there, then rerun this command."\n    fi\n\n    local rclone_dest=',
              'systemd canonical key section',
          )
          PY
          rm -f .github/workflows/pr8-repair.yml .github/workflows/pr8-repair-2.yml
      - name: Focused validation
        shell: bash
        run: |
          bash -n startup.sh lib/config.sh utilities/restore-run.sh utilities/setup-systemd.sh
          bash tests/suites/foundation/case-runtime-authority.bash
          echo '--- checkout Age-key references outside docs/tests ---'
          grep -R -n --exclude-dir=.git --exclude-dir=tests --exclude='*.md' 'secrets/keys/age-key.txt' . || true
          echo '--- explicit load_env_file callers ---'
          grep -R -n --include='*.sh' --include='*.bash' 'load_env_file ' . || true
      - name: Commit corrections
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime: tighten canonical authority after inspection'
          git push origin HEAD:pr8-runtime-authority-age-custody
