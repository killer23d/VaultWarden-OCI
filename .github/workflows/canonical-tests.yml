name: Canonical Test Runner

on:
  pull_request:

permissions:
  contents: read

jobs:
  canonical-tests:
    name: Canonical tests (all)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Verify V2 Python 3.12
        if: github.event.pull_request.base.ref == 'v2'
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'

      - name: Run V2 focused tests
        if: github.event.pull_request.base.ref == 'v2'
        run: |
          python3 -m unittest discover -s tests/v2 -p 'test_*.py' -v
          python3 -m compileall -q vaultwarden_oci tests/v2 vwctl

      - name: Install legacy V1 test dependencies
        if: github.event.pull_request.base.ref != 'v2'
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml

          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Run legacy V1 canonical permanent test entrypoint
        if: github.event.pull_request.base.ref != 'v2'
        run: ./tests/run-tests.sh all

  v2-recovery-crypto-acceptance:
    name: V2 recovery crypto acceptance
    if: github.event.pull_request.base.ref == 'v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Install pinned recovery crypto tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux_amd64 -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Exercise real Age/SOPS fresh-host recovery
        run: python3 tests/v2/acceptance_recovery_crypto.py

  v2-edge-packet-acceptance:
    name: V2 edge packet acceptance
    if: github.event.pull_request.base.ref == 'v2'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Verify exact PR head checkout
        run: |
          test "$(git rev-parse HEAD)" = "${{ github.event.pull_request.head.sha }}"

      - name: Exercise real Docker IPv4/IPv6 origin path
        run: sudo bash tests/v2/acceptance_edge_packet.sh