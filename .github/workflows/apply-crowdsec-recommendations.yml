name: Apply CrowdSec recommendations

on:
  push:
    branches:
      - Beta
    paths:
      - .github/workflows/apply-crowdsec-recommendations.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: Beta
          fetch-depth: 0

      - name: Update CrowdSec configuration
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          setup = Path("utilities/setup-crowdsec.sh")
          text = setup.read_text()
          old = '''if [[ "$DRY_RUN" == "true" ]]; then
              log_info "[DRY RUN] Would install hub collections: crowdsecurity/linux, crowdsecurity/caddy, crowdsecurity/http-cve, Dominic-Wagner/vaultwarden"
          else
              cscli collections install crowdsecurity/linux                   || true
              cscli collections install crowdsecurity/caddy                   || true
              cscli collections install crowdsecurity/http-cve                || true
              cscli collections install crowdsecurity/base-http-scenarios     || true
              cscli collections install crowdsecurity/appsec-generic-rules    || true
              cscli collections install crowdsecurity/appsec-virtual-patching || true
              cscli collections install crowdsecurity/whitelist-good-actors   || true
              cscli collections install crowdsecurity/iptables                || true
              cscli collections install Dominic-Wagner/vaultwarden            || true
              log_success "Hub collections installed."
          fi'''
          new = '''_recommended_collections=(
              crowdsecurity/linux
              crowdsecurity/caddy
              crowdsecurity/iptables
              Dominic-Wagner/vaultwarden
          )
          _obsolete_collections=(
              crowdsecurity/appsec-generic-rules
              crowdsecurity/appsec-virtual-patching
          )

          if [[ "$DRY_RUN" == "true" ]]; then
              log_info "[DRY RUN] Would install recommended hub collections: ${_recommended_collections[*]}"
              log_info "[DRY RUN] Would remove inactive AppSec collections: ${_obsolete_collections[*]}"
          else
              for _collection in "${_recommended_collections[@]}"; do
                  cscli collections install "$_collection" || true
              done

              # AppSec rule collections do not inspect traffic by themselves. This
              # deployment has no AppSec listener or request-forwarding remediation
              # component, so remove stale subscriptions rather than imply protection.
              for _collection in "${_obsolete_collections[@]}"; do
                  cscli collections remove "$_collection" --force >/dev/null 2>&1 || true
              done
              unset _collection

              log_success "Recommended CrowdSec hub collections installed; inactive AppSec collections removed."
          fi'''
          if old not in text:
              raise SystemExit("expected CrowdSec collection block was not found")
          setup.write_text(text.replace(old, new, 1))

          compose = Path("docker-compose.yml.example")
          text = compose.read_text()
          marker = "      LOG_LEVEL: ${LOG_LEVEL:-warn}\n      EXTENDED_LOGGING: ${EXTENDED_LOGGING:-true}\n"
          replacement = (
              "      LOG_LEVEL: ${LOG_LEVEL:-warn}\n"
              "      # Required by the Dominic-Wagner/vaultwarden CrowdSec parser.\n"
              "      LOG_TIMESTAMP_FORMAT: ${LOG_TIMESTAMP_FORMAT:-%Y-%m-%d %H:%M:%S.%3f%z}\n"
              "      EXTENDED_LOGGING: ${EXTENDED_LOGGING:-true}\n"
          )
          if "LOG_TIMESTAMP_FORMAT:" not in text:
              if marker not in text:
                  raise SystemExit("Vaultwarden logging marker was not found in compose template")
              text = text.replace(marker, replacement, 1)
              compose.write_text(text)

          env = Path(".env.example")
          text = env.read_text()
          if "LOG_TIMESTAMP_FORMAT=" not in text:
              candidates = [
                  "LOG_LEVEL=warn\n",
                  "LOG_LEVEL=info\n",
              ]
              for marker in candidates:
                  if marker in text:
                      text = text.replace(
                          marker,
                          marker
                          + "# Include a numeric UTC offset so CrowdSec can parse Vaultwarden events.\n"
                          + "LOG_TIMESTAMP_FORMAT=%Y-%m-%d %H:%M:%S.%3f%z\n",
                          1,
                      )
                      break
              else:
                  raise SystemExit("LOG_LEVEL marker was not found in .env.example")
              env.write_text(text)

          docs = Path("docs/CROWDSEC.md")
          text = docs.read_text()
          heading = "## Collection policy"
          if heading not in text:
              text += '''

## Collection policy

This deployment intentionally subscribes only to the top-level collections that
match its acquired logs and exposed services:

- `crowdsecurity/linux`
- `crowdsecurity/caddy`
- `crowdsecurity/iptables`
- `Dominic-Wagner/vaultwarden`

Dependencies such as `sshd`, `base-http-scenarios`, `http-cve`, and
`whitelist-good-actors` are installed automatically by those collections.

The AppSec rule collections are not installed. CrowdSec AppSec requires both an
AppSec acquisition listener and a compatible remediation component that forwards
HTTP requests for inspection; this Caddy deployment currently uses log-based
CrowdSec detection plus Cloudflare and host-firewall enforcement instead.

Kernel firewall events are acquired from journald with `type: syslog`. Only
packets that reach the VM can be logged; traffic dropped by an OCI Security List
or another provider-side firewall is not visible to CrowdSec on the host.
'''
              docs.write_text(text)

          test = Path("tests/test-crowdsec-config.sh")
          test.write_text(r'''#!/usr/bin/env bash
set -euo pipefail

ROOT="$(cd "$(dirname "${BASH_SOURCE[0]}")/.." && pwd)"

acquis="${ROOT}/crowdsec/acquis.yaml"
setup="${ROOT}/utilities/setup-crowdsec.sh"
compose="${ROOT}/docker-compose.yml.example"

grep -q '"_TRANSPORT=kernel"' "$acquis"
grep -A4 '"_TRANSPORT=kernel"' "$acquis" | grep -q 'type: syslog'

if grep -Eq '^[[:space:]]*cscli collections install crowdsecurity/appsec-' "$setup"; then
    echo "inactive AppSec collections must not be installed" >&2
    exit 1
fi

grep -q 'crowdsecurity/iptables' "$setup"
grep -q 'Dominic-Wagner/vaultwarden' "$setup"
grep -q 'LOG_TIMESTAMP_FORMAT:.*%Y-%m-%d %H:%M:%S.%3f%z' "$compose"

echo "CrowdSec configuration checks passed."
''')
          test.chmod(0o755)
          PY

      - name: Validate changes
        shell: bash
        run: |
          bash -n utilities/setup-crowdsec.sh
          bash tests/test-crowdsec-config.sh
          python3 - <<'PY'
          from pathlib import Path
          text = Path("crowdsec/acquis.yaml").read_text()
          docs = [part for part in text.split("\n---\n") if part.strip()]
          if len(docs) != 5:
              raise SystemExit(f"expected 5 acquisition documents, found {len(docs)}")
          PY

      - name: Commit updates
        shell: bash
        run: |
          rm -f .github/workflows/apply-crowdsec-recommendations.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(crowdsec): align collections and log parsing"
          git push origin HEAD:Beta
