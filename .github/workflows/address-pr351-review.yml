name: Address PR 351 review blockers
on:
  push:
    branches: [codex/final-operator-manual-normalization]
permissions:
  contents: write
jobs:
  fix:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/final-operator-manual-normalization
          fetch-depth: 0
      - name: Apply bounded review fixes
        run: |
          python3 .github/scripts/address-pr351-review.py
          python3 .github/scripts/address-pr351-test-fallout.py
      - name: Compile and run focused full unit suite
        run: |
          python3 -m compileall -q vaultwarden_oci tests
          bash -n setup.sh dashboard.sh vaultwarden_oci/dashboard.sh tests/acceptance_edge_packet.sh
          python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A versions.toml vaultwarden_oci systemd-v2 tests docs/OPERATIONS.md
          git commit -m 'Fix final release update coherence and cleanup blockers'
          git push origin HEAD:codex/final-operator-manual-normalization
