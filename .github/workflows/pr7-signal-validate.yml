name: PR7 apply validated signal cleanup
on:
  pull_request:
    branches:
      - delta
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Apply validated fix
        run: python3 .github/pr7-signal-fix.py
      - name: Remove temporary validation files
        run: rm -f .github/pr7-signal-fix.py .github/workflows/pr7-signal-validate.yml
      - name: Commit validated fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "secrets: register runtime workspace signal cleanup"
          git push origin HEAD:pr7-sensitive-workspace-sops-hardening
