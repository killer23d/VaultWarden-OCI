name: Temporary PR 291 exact container selection

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-pr291-exact-container.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact-name correction
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = 'ba3f9e4e2c3bbfcfb76b0dc9b7685aa3b1e30f7a'
          python3 <<'PY'
          from pathlib import Path

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{label}: expected one exact match, found {count}")
              return text.replace(old, new, 1)

          health_path = Path("utilities/maintenance-health.sh")
          health = health_path.read_text()
          replacements = (
              ('        "vaultwarden_app:vaultwarden"', '        "vaultwarden_app"'),
              ('        "vaultwarden_caddy:caddy"', '        "vaultwarden_caddy"'),
              ('        managed+=("vaultwarden_postfix:postfix")', '        managed+=("vaultwarden_postfix")'),
              ('    local entry container service row state health', '    local container row state health'),
              (
                  '    for entry in "${managed[@]}"; do\n'
                  '        container="${entry%%:*}"\n'
                  '        service="${entry#*:}"',
                  '    for container in "${managed[@]}"; do',
              ),
              (
                  '            | jq -c --arg name "$container" --arg service "$service" \\',
                  '            | jq -c --arg name "$container" \\',
              ),
              (
                  "                'map(select(.Name == $name or .Service == $service)) | .[0] // empty' 2>/dev/null)",
                  "                'map(select(.Name == $name)) | .[0] // empty' 2>/dev/null)",
              ),
          )
          for index, (old, new) in enumerate(replacements, 1):
              health = replace_once(health, old, new, f"health replacement {index}")
          health_path.write_text(health)

          test_path = Path("tests/suites/operations/case-operations.bash")
          test = test_path.read_text()
          old_snapshot = '''printf '%s\\n' '[{"Name":"vaultwarden_app","Service":"vaultwarden","State":"running","Health":"healthy"},{"Name":"vaultwarden_caddy","Service":"caddy","State":"exited","Health":""},{"Name":"vaultwarden_postfix","Service":"postfix","State":"running","Health":"healthy"}]' '''.rstrip()
          new_snapshot = '''printf '%s\\n' '[{"Name":"vaultwarden_app","Service":"vaultwarden","State":"running","Health":"healthy"},{"Name":"vaultwarden_caddy_run_1","Service":"caddy","State":"exited","Health":""},{"Name":"vaultwarden_caddy","Service":"caddy","State":"running","Health":"healthy"},{"Name":"vaultwarden_postfix","Service":"postfix","State":"exited","Health":""}]' '''.rstrip()
          test = replace_once(test, old_snapshot, new_snapshot, "snapshot fixture")
          test = replace_once(
              test,
              "    || fail 'quick Compose snapshot did not cover running managed containers'",
              "    || fail 'quick Compose snapshot did not select the running managed containers'",
              "snapshot pass assertion",
          )
          old_assertion = (
              "grep -Fq 'fail:container:vaultwarden_caddy:Container not running: vaultwarden_caddy (state: exited)' \\\n"
              "    \"$TMP/snapshot.results\" \\\n"
              "    || fail 'quick Compose snapshot did not preserve stopped-container state'"
          )
          new_assertion = (
              "grep -Fq 'pass:container:vaultwarden_caddy:vaultwarden_caddy is running (health: healthy)' \\\n"
              "    \"$TMP/snapshot.results\" \\\n"
              "    || fail 'quick Compose snapshot selected a one-off container instead of the exact managed Caddy container'\n"
              "! grep -Fq 'fail:container:vaultwarden_caddy:' \"$TMP/snapshot.results\" \\\n"
              "    || fail 'one-off Caddy state was attributed to the managed Caddy container'\n"
              "grep -Fq 'fail:container:vaultwarden_postfix:Container not running: vaultwarden_postfix (state: exited)' \\\n"
              "    \"$TMP/snapshot.results\" \\\n"
              "    || fail 'quick Compose snapshot did not preserve stopped-container state'"
          )
          test = replace_once(test, old_assertion, new_assertion, "exact-name regression assertion")
          test_path.write_text(test)
          PY
          rm -f .github/workflows/tmp-pr291-exact-container.yml
          git diff --check

      - name: Validate focused contract
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          bash -n utilities/maintenance-health.sh tests/suites/operations/case-operations.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-operations.bash
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
            printf 'VW_TEST_REPO_ROOT=%q\n' "$PWD"
            sed -n \
              '/^check_health_quick_profile_contract() (/,/^check_health_quick_profile_contract$/p' \
              tests/suites/operations/case-operations.bash
          } > /tmp/pr291-quick-contract.bash
          bash /tmp/pr291-quick-contract.bash

      - name: Commit validated correction
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Select quick health containers by exact name'
          git push origin HEAD:fix/health-quick-exit-contract
