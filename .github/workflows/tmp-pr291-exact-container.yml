name: Temporary PR 291 exact container selection

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-pr291-exact-container.yml'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply exact-name correction
        shell: bash
        run: |
          test "$(git rev-parse HEAD^)" = '265314684bc97d92457a749219131faf1da603ea'
          git apply <<'PATCH'
          diff --git a/tests/suites/operations/case-operations.bash b/tests/suites/operations/case-operations.bash
          --- a/tests/suites/operations/case-operations.bash
          +++ b/tests/suites/operations/case-operations.bash
          @@ -1,7 +1,7 @@
           printf '%s\n' "$(( count + 1 ))" >"$DOCKER_COUNT"
           printf '%s\n' "$*" >"${DOCKER_ARGS:?}"
           printf '%s\n' "$PWD" >"${DOCKER_PWD:?}"
          -printf '%s\n' '[{"Name":"vaultwarden_app","Service":"vaultwarden","State":"running","Health":"healthy"},{"Name":"vaultwarden_caddy","Service":"caddy","State":"exited","Health":""},{"Name":"vaultwarden_postfix","Service":"postfix","State":"running","Health":"healthy"}]'
          +printf '%s\n' '[{"Name":"vaultwarden_app","Service":"vaultwarden","State":"running","Health":"healthy"},{"Name":"vaultwarden_caddy_run_1","Service":"caddy","State":"exited","Health":""},{"Name":"vaultwarden_caddy","Service":"caddy","State":"running","Health":"healthy"},{"Name":"vaultwarden_postfix","Service":"postfix","State":"exited","Health":""}]'
           EOF_DOCKER
           chmod 0700 "$TMP/bin/docker"
           installed_runtime="$TMP/opt/vaultwarden-scripts"
          @@ -24,7 +24,12 @@
           [[ -z "$(find "$installed_runtime" -mindepth 1 -maxdepth 1 -print -quit)" ]] \
               || fail 'installed-runtime snapshot fixture unexpectedly contained a Compose file'
           [[ "$(grep -c '^pass:container:' "$TMP/snapshot.results")" -eq 2 ]] \
          -    || fail 'quick Compose snapshot did not cover running managed containers'
          -grep -Fq 'fail:container:vaultwarden_caddy:Container not running: vaultwarden_caddy (state: exited)' \
          +    || fail 'quick Compose snapshot did not select the running managed containers'
          +grep -Fq 'pass:container:vaultwarden_caddy:vaultwarden_caddy is running (health: healthy)' \
          +    "$TMP/snapshot.results" \
          +    || fail 'quick Compose snapshot selected a one-off container instead of the exact managed Caddy container'
          +! grep -Fq 'fail:container:vaultwarden_caddy:' "$TMP/snapshot.results" \
          +    || fail 'one-off Caddy state was attributed to the managed Caddy container'
          +grep -Fq 'fail:container:vaultwarden_postfix:Container not running: vaultwarden_postfix (state: exited)' \
               "$TMP/snapshot.results" \
               || fail 'quick Compose snapshot did not preserve stopped-container state'
          diff --git a/utilities/maintenance-health.sh b/utilities/maintenance-health.sh
          --- a/utilities/maintenance-health.sh
          +++ b/utilities/maintenance-health.sh
          @@ -1,18 +1,16 @@
           _check_quick_containers() {
               log_info "Checking managed container state from one Compose snapshot..."
               local -a managed=(
          -        "vaultwarden_app:vaultwarden"
          -        "vaultwarden_caddy:caddy"
          +        "vaultwarden_app"
          +        "vaultwarden_caddy"
               )
               if _postfix_sidecar_configured; then
          -        managed+=("vaultwarden_postfix:postfix")
          +        managed+=("vaultwarden_postfix")
               fi
           
          -    local entry container service row state health
          -    for entry in "${managed[@]}"; do
          -        container="${entry%%:*}"
          -        service="${entry#*:}"
          +    local container row state health
          +    for container in "${managed[@]}"; do
                   row=$(printf '%s' "$QUICK_COMPOSE_SNAPSHOT" \
          -            | jq -c --arg name "$container" --arg service "$service" \
          -                'map(select(.Name == $name or .Service == $service)) | .[0] // empty' 2>/dev/null)
          +            | jq -c --arg name "$container" \
          +                'map(select(.Name == $name)) | .[0] // empty' 2>/dev/null)
                   if [[ -z "$row" ]]; then
          PATCH
          rm -f .github/workflows/tmp-pr291-exact-container.yml
          git diff --check

      - name: Validate focused contract
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y jq shellcheck
          bash -n utilities/maintenance-health.sh tests/suites/operations/case-operations.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-operations.bash
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail'
            printf 'VW_TEST_REPO_ROOT=%q\n' "$PWD"
            sed -n \
              '/^check_health_quick_profile_contract() (/,/^check_health_quick_profile_contract$/p' \
              tests/suites/operations/case-operations.bash
          } > /tmp/pr291-quick-contract.bash
          bash /tmp/pr291-quick-contract.bash

      - name: Commit validated correction
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Select quick health containers by exact name'
          git push origin HEAD:fix/health-quick-exit-contract
