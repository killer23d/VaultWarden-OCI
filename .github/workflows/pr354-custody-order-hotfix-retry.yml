name: PR354 custody ordering hotfix retry

on:
  push:
    branches:
      - fix/blank-vm-offline-age-bootstrap-2026-08-27

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Retry first-run recovery custody ordering fix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply corrected custody-order patch
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/pr354-custody-order-hotfix.yml').read_text(encoding='utf-8')
          marker = '        run: |\n'
          if marker not in workflow:
              raise SystemExit('original hotfix run block not found')
          run_block = workflow.split(marker, 1)[1]
          lines = run_block.splitlines()
          shell = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines) + '\n'

          extra = r"""
          # Keep older custody-focused test doubles compatible with the generated-custody defer flag,
          # and bypass the credential editor in tests specifically about workspace retention/removal.
          recovery_tests = Path('tests/test_recovery_ux.py')
          text = recovery_tests.read_text(encoding='utf-8')
          old = '''    def _successful_generated_setup(argv, *, offline_recipient_factory=None):
              del argv
              if offline_recipient_factory is None:
                  raise AssertionError("generated custody callback was not supplied")
              offline_recipient_factory()
              return 0
          '''
          new = '''    def _successful_generated_setup(
              argv,
              *,
              offline_recipient_factory=None,
              defer_next_actions=False,
          ):
              del argv
              if offline_recipient_factory is None:
                  raise AssertionError("generated custody callback was not supplied")
              if not defer_next_actions:
                  raise AssertionError("generated custody must defer setup next-actions until handoff")
              offline_recipient_factory()
              return 0
          '''
          if old not in text:
              raise SystemExit('custody setup test double not found')
          text = text.replace(old, new, 1)
          needle = '''                mock.patch.object(setup_frontend.setup, "main", side_effect=self._successful_generated_setup),
                          mock.patch.object(
                              setup_frontend.recovery_ux,
          '''
          replacement = '''                mock.patch.object(setup_frontend.setup, "main", side_effect=self._successful_generated_setup),
                          mock.patch.object(setup_frontend, "_complete_external_credentials_before_handoff"),
                          mock.patch.object(
                              setup_frontend.recovery_ux,
          '''
          if text.count(needle) != 3:
              raise SystemExit(f'expected three custody test contexts, found {text.count(needle)}')
          text = text.replace(needle, replacement)
          recovery_tests.write_text(text, encoding='utf-8')
          """

          extra = '\n'.join(line[10:] if line.startswith('          ') else line for line in extra.splitlines())
          closing = '\nPY\n\ngit rm .github/workflows/pr354-custody-order-hotfix.yml\n'
          if closing not in shell:
              raise SystemExit('original hotfix closing marker not found')
          shell = shell.replace(
              closing,
              '\n' + extra + '\nPY\n\ngit rm .github/workflows/pr354-custody-order-hotfix.yml\ngit rm .github/workflows/pr354-custody-order-hotfix-retry.yml\n',
              1,
          )
          Path('/tmp/apply-pr354-custody-order.sh').write_text(shell, encoding='utf-8')
          PY
          bash /tmp/apply-pr354-custody-order.sh
