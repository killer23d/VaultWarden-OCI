name: Temporary PR330 post-reboot source reproof hardening

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply post-reboot recovery reproof patch
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one replacement target, found {count}")
              p.write_text(text.replace(old, new, 1))

          controller = "utilities/noble-host-acceptance.sh"
          tests = "tests/suites/operations/case-host-acceptance.bash"
          docs = "docs/HOST-ACCEPTANCE.md"

          replace_once(
              controller,
              '''verify_bound_backup_with_recovery_kit() {\n    local prefix="$1" kit="$2" verify_root archive_digest\n    verify_root="$STATE_ROOT/verify-${prefix,,}"\n    download_bound_backup "$prefix" "verify-${prefix,,}"\n    if ! run_with_sensitive_tmp env \\\n            RCLONE_REMOTE_NAME="$RCLONE_REMOTE" RCLONE_REMOTE_PATH="$RCLONE_REMOTE_PATH" \\\n            RCLONE_CONFIG="$RCLONE_CONFIG_PATH" \\\n            bash ./restore.sh inspect --remote --file "$BOUND_BACKUP_FILE" \\\n            --from-recovery-kit "$kit"; then\n        rm -rf -- "$verify_root"\n        return 1\n    fi\n    archive_digest="$(sha_file "$BOUND_BACKUP_FILE")"\n    meta_add "${prefix}_RECOVERY_KIT_INSPECT_VERIFIED_SHA256" "$archive_digest"\n    rm -rf -- "$verify_root"\n}\n''',
              '''verify_bound_backup_with_recovery_kit() {\n    local prefix="$1" kit="$2" stage_name="${3:-verify-${prefix,,}}" retain_stage="${4:-false}"\n    local verify_root archive_digest verified_epoch\n    [[ "$stage_name" =~ ^[A-Za-z0-9_.-]+$ ]] || die 'Invalid recovery verification stage name.'\n    [[ "$retain_stage" == "true" || "$retain_stage" == "false" ]] \\\n        || die 'Recovery verification retain flag must be true or false.'\n    verify_root="$STATE_ROOT/$stage_name"\n    download_bound_backup "$prefix" "$stage_name"\n    if ! run_with_sensitive_tmp env \\\n            RCLONE_REMOTE_NAME="$RCLONE_REMOTE" RCLONE_REMOTE_PATH="$RCLONE_REMOTE_PATH" \\\n            RCLONE_CONFIG="$RCLONE_CONFIG_PATH" \\\n            bash ./restore.sh inspect --remote --file "$BOUND_BACKUP_FILE" \\\n            --from-recovery-kit "$kit"; then\n        rm -rf -- "$verify_root"\n        return 1\n    fi\n    archive_digest="$(sha_file "$BOUND_BACKUP_FILE")"\n    verified_epoch="$(date +%s)"\n    meta_add "${prefix}_RECOVERY_KIT_INSPECT_VERIFIED_SHA256" "$archive_digest"\n    meta_add "${prefix}_RECOVERY_KIT_INSPECT_VERIFIED_EPOCH" "$verified_epoch"\n    if [[ "$retain_stage" == "true" ]]; then\n        meta_add "${prefix}_RECOVERY_CACHE_ARCHIVE_SHA256" "$archive_digest"\n        meta_add "${prefix}_RECOVERY_CACHE_PATH_HASH" "$(hash_text "$BOUND_BACKUP_FILE")"\n        meta_add "${prefix}_RECOVERY_CACHE_VERIFIED_EPOCH" "$verified_epoch"\n        log "Retained exact authenticated ${prefix} recovery cache until restore completes: $BOUND_BACKUP_FILE"\n    else\n        rm -rf -- "$verify_root"\n    fi\n}\n\npre_uninstall_recovery_gate() {\n    # STATE_ROOT and every external dependency must survive the canonical reset\n    # before we create the retained safety copy. Recheck after the authenticated\n    # download/inspect too so the final action before uninstall is still the\n    # canonical destructive-survival boundary.\n    validate_destructive_survival\n    verify_bound_backup_with_recovery_kit \\\n        DR_SOURCE "$RECOVERY_KIT" pre-uninstall-recovery-cache true\n    validate_destructive_survival\n    log 'Fresh post-reboot authenticated DR-source proof passed immediately before destructive reset.'\n}\n'''
          )

          replace_once(
              controller,
              '''    # Canonical manual install intentionally enables timers for future boots.\n    # From this point onward an EXIT cleanup always disables them again, even if\n    # one of the validation assertions below fails. activate-automation is the\n    # only phase allowed to re-enable/start recurring automation.\n    trap cleanup_pre_custody_timers EXIT\n''',
              '''    # Canonical manual install enables timers for future boots before it returns.\n    # EXIT cleanup covers ordinary success/failure and catchable termination and\n    # leaves timers disabled after this helper returns, but it cannot eliminate\n    # the narrow abrupt power-loss/SIGKILL window while the canonical installer\n    # itself is enabling them. Operators must not reboot/power-cycle during this\n    # validation step. activate-automation is the only later controller phase\n    # allowed to intentionally re-enable/start recurring automation.\n    trap cleanup_pre_custody_timers EXIT\n'''
          )

          replace_once(
              controller,
              '''                validate_destructive_survival\n                step uninstall-reset bash ./utilities/uninstall-vaultwarden.sh run --test-reset --i-have-saved-my-recovery-kit --force\n''',
              '''                step pre-uninstall-recovery-gate pre_uninstall_recovery_gate\n                step uninstall-reset bash ./utilities/uninstall-vaultwarden.sh run --test-reset --i-have-saved-my-recovery-kit --force\n'''
          )

          replace_once(
              controller,
              '''            restore)\n                step dr-source-download download_bound_backup DR_SOURCE restore-source\n                step exact-full-restore run_with_sensitive_tmp env RCLONE_REMOTE_NAME="$RCLONE_REMOTE" RCLONE_REMOTE_PATH="$RCLONE_REMOTE_PATH" \\\n''',
              '''            restore)\n                log 'Certification requires a fresh post-reset remote download. If it fails, the retained pre-uninstall authenticated cache remains under STATE_ROOT for emergency non-certifying recovery; do not treat that fallback as acceptance evidence.'\n                step dr-source-download download_bound_backup DR_SOURCE restore-source\n                step exact-full-restore run_with_sensitive_tmp env RCLONE_REMOTE_NAME="$RCLONE_REMOTE" RCLONE_REMOTE_PATH="$RCLONE_REMOTE_PATH" \\\n'''
          )

          replace_once(
              controller,
              '''                save_phase post-restore-validation\n                rm -rf -- "$STATE_ROOT/restore-source" || true\n''',
              '''                save_phase post-restore-validation\n                rm -rf -- "$STATE_ROOT/restore-source" "$STATE_ROOT/pre-uninstall-recovery-cache" || true\n'''
          )

          replace_once(
              tests,
              '''# Post-restore manual systemd validation must leave every recurring timer disabled,\n# not merely inactive, and must do so even when a validation assertion fails.\n''',
              '''# Post-restore manual systemd validation must leave every recurring timer disabled\n# after ordinary success/failure. The canonical installer still has a documented\n# abrupt-reboot window while it enables timers for future boots before returning.\n'''
          )

          replace_once(
              tests,
              '''  [[ -e "$AT/disabled" ]] || fail "successful manual validation left timers enabled for reboot"\n''',
              '''  [[ -e "$AT/disabled" ]] || fail "successful manual validation did not leave timers disabled after return"\n'''
          )

          replace_once(
              tests,
              '''source_download_line="$(grep -n 'dr-source-download download_bound_backup DR_SOURCE restore-source' "$A" | cut -d: -f1)"\nexact_restore_line="$(grep -n 'bash ./restore.sh interactive --remote --file \\\"\\$BOUND_BACKUP_FILE\\\"' "$A" | cut -d: -f1)"\nrestore_checkpoint_line="$(grep -n 'save_phase post-restore-validation' "$A" | cut -d: -f1)"\n''',
              '''reboot_line="$(grep -n 'save_phase post-reboot' "$A" | cut -d: -f1)"\npost_reboot_check_line="$(grep -n 'systemd-after-reboot bash ./utilities/setup-systemd.sh validate' "$A" | cut -d: -f1)"\npre_uninstall_reproof_line="$(grep -n 'pre-uninstall-recovery-gate pre_uninstall_recovery_gate' "$A" | cut -d: -f1)"\nuninstall_reset_line="$(grep -n 'uninstall-reset bash ./utilities/uninstall-vaultwarden.sh run --test-reset' "$A" | cut -d: -f1)"\nsource_download_line="$(grep -n 'dr-source-download download_bound_backup DR_SOURCE restore-source' "$A" | cut -d: -f1)"\nexact_restore_line="$(grep -n 'bash ./restore.sh interactive --remote --file \\\"\\$BOUND_BACKUP_FILE\\\"' "$A" | cut -d: -f1)"\nrestore_checkpoint_line="$(grep -n 'save_phase post-restore-validation' "$A" | cut -d: -f1)"\ncache_cleanup_line="$(grep -n 'rm -rf -- \\\"\\$STATE_ROOT/restore-source\\\" \\\"\\$STATE_ROOT/pre-uninstall-recovery-cache\\\"' "$A" | cut -d: -f1)"\n'''
          )

          replace_once(
              tests,
              '''(( canary_line < source_backup_line && source_backup_line < source_kit_decrypt_line \\\n   && source_kit_decrypt_line < source_download_line && source_download_line < exact_restore_line )) \\\n  || fail "canary/bound-backup/pre-DR-kit-proof/exact-restore sequencing regressed"\n(( exact_restore_line < restore_checkpoint_line && restore_checkpoint_line < repair_line && repair_line < e2e_line )) \\\n  || fail "successful restore is not checkpointed before post-restore validation"\n''',
              '''(( canary_line < source_backup_line && source_backup_line < source_kit_decrypt_line \\\n   && source_kit_decrypt_line < reboot_line && reboot_line < post_reboot_check_line \\\n   && post_reboot_check_line < pre_uninstall_reproof_line \\\n   && pre_uninstall_reproof_line < uninstall_reset_line \\\n   && uninstall_reset_line < source_download_line && source_download_line < exact_restore_line )) \\\n  || fail "canary/early-proof/reboot/pre-uninstall-reproof/reset/fresh-download/restore sequencing regressed"\n(( exact_restore_line < restore_checkpoint_line && restore_checkpoint_line < cache_cleanup_line \\\n   && cache_cleanup_line < repair_line && repair_line < e2e_line )) \\\n  || fail "successful restore/cache-cleanup is not checkpointed before post-restore validation"\n'''
          )

          insert_after = '''! grep -Fq 'age -d' <<< "$inspect_function" \\\n  || fail "acceptance recovery proof still performs a custom Age-only decrypt"\n'''
          addition = '''! grep -Fq 'age -d' <<< "$inspect_function" \\\n  || fail "acceptance recovery proof still performs a custom Age-only decrypt"\ngrep -Fq 'DR_SOURCE "$RECOVERY_KIT" pre-uninstall-recovery-cache true' "$A" \\\n  || fail "post-reboot pre-uninstall authenticated source re-proof is missing or not retained"\ngrep -Fq 'RECOVERY_CACHE_VERIFIED_EPOCH' "$A" \\\n  || fail "retained authenticated recovery cache verification time is not checkpointed"\ngrep -Fq 'pre_uninstall_recovery_gate' "$A" \\\n  || fail "destructive reset is not guarded by a dedicated post-reboot recovery gate"\n'''
          replace_once(tests, insert_after, addition)

          replace_once(
              tests,
              '''[[ "$(grep -Ec '^[[:space:]]+validate_destructive_survival$' "$A")" -ge 2 ]] \\\n  || fail "destructive survival is not checked at input validation and immediately before uninstall"\n''',
              '''[[ "$(grep -Ec '^[[:space:]]+validate_destructive_survival$' "$A")" -ge 3 ]] \\\n  || fail "destructive survival is not checked before state init and around the final pre-uninstall recovery gate"\n'''
          )

          replace_once(
              docs,
              '''11. post-restore health, email, drill, and application E2E while recurring timers remain non-running; the canonical manual install is verified and an exit-safe cleanup then leaves every managed recurring timer disabled even if validation fails, so an unexpected reboot cannot cross the custody gate, including assertion of the same pre-DR canary;''',
              '''11. post-restore health, email, drill, and application E2E while recurring timers remain non-running; the canonical manual install is verified and EXIT cleanup leaves every managed recurring timer disabled after ordinary success/failure, including assertion of the same pre-DR canary; because canonical manual install enables timers for future boots before it returns, operators must avoid power loss/SIGKILL/reboot during that narrow installer window;'''
          )

          replace_once(
              docs,
              '''Before any reboot/uninstall destructive transition, the controller re-downloads that exact bound remote source and runs canonical read-only `restore.sh inspect --remote --file ... --from-recovery-kit ...`. Canonical inspect loads the recovery kit's historical backup-integrity HMAC key, authenticates the `.sha256.hmac` cohort, decrypts the archive with its Age identity, and performs restore preflight without stopping services or modifying live state. A wrong, stale, or Age-only kit therefore fails while the original host is still intact.\n\nAfter uninstall, the controller does not call `restore.sh latest`. It downloads the four required members of that exact remote cohort (`.age`, `.sha256`, `.sha256.hmac`, `.meta`) into the root-only acceptance state area, verifies the archive and cohort digests against the checkpoint, and calls canonical restore with `--remote --file` on that staged full backup. The explicit local `--file` remains authoritative; `--remote` is present only to enter canonical bare-metal/bootstrap mode after `--test-reset` removed the runtime environment. The post-restore E2E invocation must find the same canary.''',
              '''The controller performs an early authenticated source proof before reboot, then repeats the proof at the destructive boundary. After the verified real reboot and post-reboot smoke/systemd checks, the `uninstall` phase re-downloads the exact bound remote cohort again and runs canonical read-only `restore.sh inspect --remote --file ... --from-recovery-kit ...` immediately before `uninstall-reset`. Canonical inspect loads the recovery kit's historical backup-integrity HMAC key, authenticates the `.sha256.hmac` cohort, decrypts the archive with its Age identity, and performs restore preflight without stopping services or modifying live state. A missing/corrupt/inaccessible object, stale credentials, wrong HMAC, or wrong Age identity therefore stops the drill while the original host is still intact.\n\nThat post-reboot authenticated cohort is retained under the already survival-validated `STATE_ROOT/pre-uninstall-recovery-cache` until restore succeeds. It is an emergency safety copy, not certification evidence for post-reset remote availability. After uninstall, the controller still requires a **fresh** download of the same four bound remote cohort members (`.age`, `.sha256`, `.sha256.hmac`, `.meta`), re-verifies the checkpointed archive/cohort digests, and restores only from that fresh post-reset remote download. If this fresh download fails, certification stops; the retained cache remains available for emergency non-certifying host recovery. Do not resume/claim acceptance after using that fallback—recover the disposable host, investigate remote availability, and restart the drill. The controller never calls `restore.sh latest`; explicit local `--file` remains authoritative while `--remote` only enters canonical bare-metal/bootstrap mode. The post-restore E2E invocation must find the same canary.'''
          )

          replace_once(
              docs,
              '''Only the next phase performs permission repair, startup, manual systemd installation, health, email, pre-production drill, and post-DR application E2E. The manual systemd step arms its EXIT cleanup before invoking the canonical installer, then proves the install produced enabled-but-inactive timers; the cleanup disables all managed recurring timers before the step can return on installer failure, validation failure, or success. This keeps the custody boundary reboot-safe: an unexpected reboot before `activate-automation` cannot start backup, maintenance, DNS, health, or firewall timers. If any of those checks fail, `resume` restarts `post-restore-validation`; it does not repeat the already successful restore or rotate the Age key again.''',
              '''Only the next phase performs permission repair, startup, manual systemd installation, health, email, pre-production drill, and post-DR application E2E. The manual systemd step arms its EXIT cleanup before invoking the canonical installer, then proves the install produced enabled-but-inactive timers; the cleanup disables all managed recurring timers before the step can return on installer failure, validation failure, or success. Once that helper has returned, the controller has verified the recurring timers are disabled through recovery custody. This is **not** an absolute power-loss guarantee during the installer itself: canonical `--no-enable-now`/manual mode still executes `systemctl enable` for future boots before returning, so an abrupt power loss, SIGKILL, or reboot in that narrow interval can bypass the EXIT cleanup. Do not reboot or power-cycle during `systemd-install-manual`. If any later check fails, `resume` restarts `post-restore-validation`; it does not repeat the already successful restore or rotate the Age key again.'''
          )

          replace_once(
              docs,
              '''After post-restore E2E succeeds, the controller enters `recovery-export` and invokes the canonical `utilities/secrets-export-recovery-kit.sh`. All managed recurring timers are still disabled at this point and remain disabled throughout export/copy/custody, including across an unexpected reboot. This is deliberately separate from the automatic `vaultwarden-age-key-rotation-<timestamp>.txt` handoff:''',
              '''After post-restore E2E succeeds, the controller enters `recovery-export` and invokes the canonical `utilities/secrets-export-recovery-kit.sh`. At this point the manual installer has returned and the controller has verified all managed recurring timers disabled; they remain disabled throughout export/copy/custody unless an external actor changes them, so a reboot **after that verification** does not activate them. This guarantee intentionally excludes the narrow abrupt-reboot window inside `systemd-install-manual` described above. This is deliberately separate from the automatic `vaultwarden-age-key-rotation-<timestamp>.txt` handoff:'''
          )

          replace_once(
              docs,
              '''- the pre-DR external recovery kit's successful canonical authenticated inspect of that exact offsite source;\n- uninstall output and residual result;''',
              '''- the pre-DR external recovery kit's successful early canonical authenticated inspect of that exact offsite source;\n- the **post-reboot, immediately pre-uninstall** fresh download plus canonical authenticated inspect of that exact source, including retained-cache digest/timestamp evidence;\n- the successful fresh post-reset remote re-download used as the actual restore source;\n- uninstall output and residual result;'''
          )
          PY

          bash -n utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age shellcheck

      - name: Run host-acceptance contract
        run: bash tests/suites/operations/case-host-acceptance.bash

      - name: Run focused ShellCheck
        run: |
          shellcheck -x utilities/noble-host-acceptance.sh
          shellcheck -x tests/suites/operations/case-host-acceptance.bash

      - name: Commit validated product changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'fix: reprove DR source immediately before reset'
          git push origin HEAD:test/noble-host-acceptance
