name: PR10 normalize changelog ending
on:
  push:
    branches: [agent/pr10-platform-simplification]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('CHANGELOG.md')
          s=p.read_text()
          old='\n\n[1.0.0]: https://github.com/killer23d/VaultWarden-OCI/releases/tag/v1.0.0\n'
          new='\n[1.0.0]: https://github.com/killer23d/VaultWarden-OCI/releases/tag/v1.0.0\n'
          if old not in s:
              raise SystemExit('changelog release-link separator not found')
          p.write_text(s.replace(old,new,1))
          PY
          git rm .github/workflows/pr10-normalize-changelog.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: normalize pre-release changelog source"
          git push origin HEAD:agent/pr10-platform-simplification
