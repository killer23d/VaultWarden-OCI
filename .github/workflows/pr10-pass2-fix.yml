name: PR10 pass2 fixes

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Apply pass 2 fixes
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("utilities/setup-env.sh"); lines=p.read_text().splitlines(); a=lines.index("detect_ssh_log_path() {"); b=next(i for i in range(a+1,len(lines)) if lines[i]=="}"); lines[a:b+1]=["detect_ssh_log_path() {","    printf \x27%s\\n\x27 \x27/var/log/auth.log\x27","}"]; p.write_text("\n".join(lines)+"\n")'
          python3 -c 'from pathlib import Path; p=Path("utilities/setup-system.sh"); s=p.read_text(); a=s.index("_SOPS_VERSION_ENV_SET=false\n"); b=s.index("SOPS_VERSION=\"${SOPS_VERSION:-$SOPS_DEFAULT_VERSION}\"",a); s=s[:a]+s[b:]; s=s.replace("SOPS_VERSION_CLI_SET=false\n","").replace("                SOPS_VERSION_CLI_SET=true\n",""); p.write_text(s)'
          bash -n utilities/setup-env.sh utilities/setup-system.sh
          shellcheck -x --severity=warning utilities/setup-env.sh utilities/setup-system.sh
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add utilities/setup-env.sh utilities/setup-system.sh
          git commit -m "fix: finish Noble-only setup cleanup"
          git push origin HEAD:agent/pr10-platform-simplification
