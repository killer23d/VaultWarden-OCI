name: PR 280 source snapshot
on:
  push:
    branches:
      - codex/small-team-runtime-remediation
    paths:
      - '.github/workflows/pr280-source.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Publish exact target sources
        shell: bash
        run: |
          set -euo pipefail
          rm -f .pr280-src-setup-* .pr280-src-test-* .pr280-src-manifest
          rm -rf .pr280-src
          mkdir -p .pr280-src
          cp utilities/setup-systemd.sh .pr280-src/setup-systemd.sh
          cp tests/suites/foundation/case-systemd.bash .pr280-src/case-systemd.bash
          {
            git rev-parse HEAD
            sha256sum utilities/setup-systemd.sh tests/suites/foundation/case-systemd.bash
            wc -l utilities/setup-systemd.sh tests/suites/foundation/case-systemd.bash
          } > .pr280-src/manifest
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git add -A .pr280-src .pr280-src-setup-* .pr280-src-test-* .pr280-src-manifest
          git commit -m 'stage exact PR 280 target sources'
          git push origin HEAD:codex/small-team-runtime-remediation
