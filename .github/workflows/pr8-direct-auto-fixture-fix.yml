name: PR8 direct auto fixture fix
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Install focused test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Keep alternate key path test-only
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("tests/suites/security/case-secrets.bash"); t=p.read_text(); n="  direct_bin=\"$direct_tmp/bin\"\n"; assert t.count(n)==1, t.count(n); i="  # Protected-handoff fixture only: redirect the copied setup script so this test never writes a synthetic key into the runner real /etc.\n  direct_setup=\"$direct_fixture/utilities/setup-secrets.sh\"\n  grep -Fxq '\''    local AGE_KEY_FILE=\"/etc/vaultwarden/age-key.txt\"'\'' \"$direct_setup\" || fail \"copied setup-secrets canonical key declaration missing\"\n  sed -i '\''s|^    local AGE_KEY_FILE=\"/etc/vaultwarden/age-key.txt\"$|    local AGE_KEY_FILE=\"${VW_TEST_AGE_KEY_FILE:?}\"|'\'' \"$direct_setup\"\n\n"; p.write_text(t.replace(n,i+n))'
          bash -n tests/suites/security/case-secrets.bash
          shellcheck -x --severity=warning tests/suites/security/case-secrets.bash
          VW_TEST_CASE_MODE=sensitive-cleanup bash tests/suites/security/case-secrets.bash
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-direct-auto-fixture-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: keep direct-auto Age path override fixture-only'
          git push origin HEAD:pr8-runtime-authority-age-custody
