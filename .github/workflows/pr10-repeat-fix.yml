name: PR10 repeat inspection fixes

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Apply repeat inspection fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          common = Path('lib/common.sh')
          s = common.read_text()
          s = s.replace("printf '%s" + chr(10) + "' 'sudo apt-get install'", "printf '%s\\n' 'sudo apt-get install'")
          common.write_text(s)

          crypto = Path('lib/crypto.sh')
          s = crypto.read_text()
          s = s.replace(
              '# Portable stat helpers\n#\n# GNU stat and BSD stat use different format strings.\n# We detect which is present at call time rather than relying on a global flag.\n',
              '# GNU stat helpers for the supported Ubuntu Noble production host.\n'
          )
          s = s.replace("printf '%s" + chr(10) + "' \"$checksum\"", "printf '%s\\n' \"$checksum\"")
          crypto.write_text(s)

          test = Path('tests/suites/foundation/case-storage-setup.bash')
          s = test.read_text()
          s = s.replace("pass 'production setup surfaces no longer expose --use-latest'\n", '')
          test.write_text(s)
          PY
          bash -n lib/common.sh lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          shellcheck -x --severity=warning lib/common.sh lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          VW_TEST_CASE_MODE=host-architecture bash tests/suites/foundation/case-storage-setup.bash
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/common.sh lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          git commit -m "fix: finish repeat platform cleanup inspection"
          git push origin HEAD:agent/pr10-platform-simplification
