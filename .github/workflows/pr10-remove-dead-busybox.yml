name: PR10 Remove Dead BusyBox Surface

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.head_commit.message == 'audit: trigger dead BusyBox cleanup'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0

      - name: Remove stale BusyBox version surface
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              '.env.example',
              'POSTFIX_VERSION=5.1.0\nBUSYBOX_VERSION=1.38.0\n',
              'POSTFIX_VERSION=5.1.0\n',
          )

          replace_once(
              'utilities/setup-env.sh',
              "               grep -qE '^POSTFIX_VERSION=latest'     \"$env_file\" && \\\n               grep -qE '^BUSYBOX_VERSION=latest'     \"$env_file\" && \\\n               ! grep -qE '^CADDY_VERSION=latest'     \"$env_file\" && \\\n",
              "               grep -qE '^POSTFIX_VERSION=latest'     \"$env_file\" && \\\n               ! grep -qE '^BUSYBOX_VERSION='         \"$env_file\" && \\\n               ! grep -qE '^CADDY_VERSION=latest'     \"$env_file\" && \\\n",
          )
          replace_once(
              'utilities/setup-env.sh',
              "            grep -qE '^(VAULTWARDEN|CADDY|POSTFIX|BUSYBOX|CROWDSEC|CF_WORKER_BOUNCER|FIREWALL_BOUNCER)_VERSION=latest' \"$env_file\" \\\n                || versions_match=true\n",
              "            if ! grep -qE '^(VAULTWARDEN|CADDY|POSTFIX|CROWDSEC|CF_WORKER_BOUNCER|FIREWALL_BOUNCER)_VERSION=latest' \"$env_file\" && \\\n               ! grep -qE '^BUSYBOX_VERSION=' \"$env_file\"; then\n                versions_match=true\n            fi\n",
          )
          replace_once(
              'utilities/setup-env.sh',
              '            sub(/^POSTFIX_VERSION=.*/,     "POSTFIX_VERSION=latest");\n            sub(/^BUSYBOX_VERSION=.*/,     "BUSYBOX_VERSION=latest");\n            sub(/^CROWDSEC_VERSION=.*/,    "CROWDSEC_VERSION=latest");\n',
              '            sub(/^POSTFIX_VERSION=.*/,     "POSTFIX_VERSION=latest");\n            sub(/^CROWDSEC_VERSION=.*/,    "CROWDSEC_VERSION=latest");\n',
          )

          replace_once(
              '.github/workflows/doc-drift.yml',
              "            'POSTFIX_VERSION=5.1.0'\n            'BUSYBOX_VERSION=1.38.0'\n            'CROWDSEC_VERSION=1.7.8'\n",
              "            'POSTFIX_VERSION=5.1.0'\n            'CROWDSEC_VERSION=1.7.8'\n",
          )
          replace_once(
              '.github/workflows/doc-drift.yml',
              "          if grep -Eq '^(VAULTWARDEN_VERSION|CADDY_VERSION|POSTFIX_VERSION|BUSYBOX_VERSION|CROWDSEC_VERSION|CF_WORKER_BOUNCER_VERSION|FIREWALL_BOUNCER_VERSION)=latest$' .env.example; then\n",
              "          if grep -Eq '^(VAULTWARDEN_VERSION|CADDY_VERSION|POSTFIX_VERSION|CROWDSEC_VERSION|CF_WORKER_BOUNCER_VERSION|FIREWALL_BOUNCER_VERSION)=latest$' .env.example; then\n",
          )
          replace_once(
              '.github/workflows/doc-drift.yml',
              "          if ! grep -Fq 'ghcr.io/dani-garcia/vaultwarden:${VAULTWARDEN_VERSION:-1.37.1}' docker-compose.yml.example; then\n",
              "          if grep -RFn -- 'BUSYBOX_VERSION' .env.example setup.sh utilities/ lib/ docker-compose.yml.example; then\n            echo \"STALE CONFIG: BUSYBOX_VERSION remains after removal of the BusyBox production consumer\"\n            FAIL=1\n          fi\n          if ! grep -Fq 'ghcr.io/dani-garcia/vaultwarden:${VAULTWARDEN_VERSION:-1.37.1}' docker-compose.yml.example; then\n",
          )

          replace_once(
              'tests/suites/foundation/case-runner-contracts.bash',
              "grep -Fq \"as 'latest' in .env. This persists across later pulls until\" utilities/setup-env.sh \\\n    || fail 'setup-env help must disclose persistent mutable .env tags'\n",
              "grep -Fq \"as 'latest' in .env. This persists across later pulls until\" utilities/setup-env.sh \\\n    || fail 'setup-env help must disclose persistent mutable .env tags'\n! grep -Fq 'BUSYBOX_VERSION' .env.example \\\n    || fail 'dead BusyBox production version surface must stay absent from .env.example'\n! grep -Fq 'BUSYBOX_VERSION' utilities/setup-env.sh \\\n    || fail 'setup-env must not manage the removed BusyBox production version surface'\n",
          )
          PY

      - name: Validate focused cleanup
        run: |
          bash -n utilities/setup-env.sh tests/suites/foundation/case-runner-contracts.bash
          VW_TEST_CASE_MODE=repository-interface bash tests/suites/foundation/case-runner-contracts.bash
          ! grep -RFn -- 'BUSYBOX_VERSION' .env.example setup.sh utilities/ lib/ docker-compose.yml.example
          git diff --check

      - name: Commit cleanup and remove helper
        run: |
          rm -f .github/workflows/pr10-remove-dead-busybox.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "cleanup: remove stale BusyBox version surface"
          git push origin HEAD:agent/pr10-platform-simplification
