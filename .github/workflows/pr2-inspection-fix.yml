name: PR2 inspection fix
on:
  push:
    branches: [fix/authenticated-backup-cohort]
permissions:
  contents: write
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authenticated-backup-cohort
          fetch-depth: 0
      - name: Apply inspection fix
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr2-inspection-fix.py
          bash -n utilities/restore-run.sh tests/suites/data-protection/case-restore-recovery.bash
          shellcheck -x --severity=warning utilities/restore-run.sh tests/suites/data-protection/case-restore-recovery.bash
          git diff --check
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml >/dev/null
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Run complete test suite
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run-tests.sh all
      - name: Commit fix and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr2-inspection-fix.yml .github/pr2-inspection-fix.py
          git add utilities/restore-run.sh tests/suites/data-protection/case-restore-recovery.bash
          git commit -m 'restore: secure remote listing diagnostics'
          git push origin HEAD:fix/authenticated-backup-cohort
