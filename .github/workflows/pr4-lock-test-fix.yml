name: PR4 xtables lock validation

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-lock]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Add lock contract assertions and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/operations/case-firewall-update.bash')
          text = p.read_text()
          anchor = '''assert_file_contains "$iptables_unit" 'ReadWritePaths=/run/xtables.lock /run/lock /run/vaultwarden-oci /run/vaultwarden-iptables'
'''
          extra = '''assert_file_contains "$iptables_unit" 'ExecStartPre=+/usr/bin/touch /run/xtables.lock'
assert_file_contains "$iptables_unit" 'ExecStartPre=+/usr/bin/chown root:root /run/xtables.lock'
assert_file_contains "$iptables_unit" 'ExecStartPre=+/usr/bin/chmod 0600 /run/xtables.lock'
'''
          if anchor not in text:
              raise SystemExit('iptables unit sandbox assertion anchor not found')
          if 'ExecStartPre=+/usr/bin/touch /run/xtables.lock' in text:
              raise SystemExit('xtables lock assertions already present')
          p.write_text(text.replace(anchor, anchor + extra, 1))
          PY
          bash -n tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
          git add tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: cover xtables runtime lock setup [skip pr4-lock]'
          git push origin HEAD:pr4-firewall-exactness
