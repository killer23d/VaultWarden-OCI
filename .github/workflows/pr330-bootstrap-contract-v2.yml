name: PR330 exact bootstrap contract v2
on:
  pull_request:

permissions:
  contents: write

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Patch exact bootstrap contract
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('utilities/noble-host-acceptance.sh')
          s = controller.read_text()
          old = '--from-recovery-kit "$RECOVERY_KIT" --no-backup --start-policy manual --force'
          new = '--from-recovery-kit "$RECOVERY_KIT" --start-policy manual --force'
          if s.count(old) != 1:
              raise SystemExit(f'controller no-backup pattern count={s.count(old)}')
          controller.write_text(s.replace(old, new, 1))

          test = Path('tests/suites/operations/case-host-acceptance.bash')
          s = test.read_text()
          old = 'A="$ROOT_REPO/utilities/noble-host-acceptance.sh"\n'
          new = old + 'RESTORE="$ROOT_REPO/utilities/restore-run.sh"\n'
          if s.count(old) != 1:
              raise SystemExit(f'test restore-owner insertion count={s.count(old)}')
          s = s.replace(old, new, 1)

          marker = '! grep -Fq \'restore.sh latest full --remote\' "$A" || fail "controller still restores an unbound remote latest backup"\n'
          addition = marker + '''! grep -Fq -- '--no-backup --start-policy manual --force' "$A" \\
  || fail "fresh full DR restore still bypasses canonical snapshot policy with --no-backup"\ngrep -Fq '&& [[ "$USE_REMOTE" == "true" ]]' "$RESTORE" \\
  || fail "canonical restore no longer admits missing-environment remote bootstrap mode"\nexplicit_file_line="$(grep -Fn 'if [[ -n "$BACKUP_FILE" ]]' "$RESTORE" | head -1 | cut -d: -f1)"\nsource_select_line="$(grep -Fn 'select_backup_source || return 1' "$RESTORE" | head -1 | cut -d: -f1)"\n[[ "$explicit_file_line" =~ ^[0-9]+$ && "$source_select_line" =~ ^[0-9]+$ ]] \\
  || fail "canonical exact-file/remote-source selection contract could not be located"\n(( explicit_file_line < source_select_line )) \\
  || fail "canonical restore no longer gives explicit --file precedence over remote source selection"\n'''
          if s.count(marker) != 1:
              raise SystemExit(f'test bootstrap marker count={s.count(marker)}')
          test.write_text(s.replace(marker, addition, 1))

          doc = Path('docs/HOST-ACCEPTANCE.md')
          s = doc.read_text()
          old = 'canonical `restore.sh interactive --remote --file <staged-full-backup> --from-recovery-kit ... --no-backup --start-policy manual --force`; the local file is still the exact restore source while `--remote` enables the supported missing-environment bootstrap path;'
          new = 'canonical `restore.sh interactive --remote --file <staged-full-backup> --from-recovery-kit ... --start-policy manual --force`; the local file is still the exact restore source while `--remote` enables the supported missing-environment bootstrap path. The controller does not force `--no-backup`; canonical full restore already skips the snapshot on a genuinely fresh target with no live database and retains its normal snapshot policy otherwise;'
          if s.count(old) != 1:
              raise SystemExit(f'doc restore command count={s.count(old)}')
          doc.write_text(s.replace(old, new, 1))
          PY
          bash -n utilities/noble-host-acceptance.sh
          bash -n tests/suites/operations/case-host-acceptance.bash
          git diff --check

      - name: Validate focused contracts
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age shellcheck
          bash tests/suites/operations/case-host-acceptance.bash
          shellcheck -x --severity=warning utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash

      - name: Commit validated product changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "test: lock exact bootstrap restore contract"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
