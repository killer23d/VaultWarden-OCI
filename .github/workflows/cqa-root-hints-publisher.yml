name: Temporary CQA root-hints publisher

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish focused fast-forward follow-up
        run: |
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/delta)" = '5cdee3c2f527e565e76e7da78da1d4f628b26041'
          test "$(git rev-parse origin/cqa-root-hints)" = '54d6a3194d0521834060956df5754b640c14b042'
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git switch -C cqa-root-hints origin/cqa-root-hints
          python3 - <<'PY'
          from pathlib import Path
          lines = Path('.github/workflows/cqa-merge-safety-publisher-v2.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(lines) if "python3 - <<'PY'" in line)
          end = next(i for i in range(start + 1, len(lines)) if lines[i].strip() == 'PY')
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in lines[start + 1:end])
          Path('/tmp/apply-cqa-root-hints.py').write_text(code + '\n')
          PY
          python3 /tmp/apply-cqa-root-hints.py
          git diff --check
          test "$(git diff --name-only | sort)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          ./tests/run-tests.sh list >/dev/null
          tmp=$(mktemp)
          {
            printf '%s\n' '#!/usr/bin/env bash' 'set -euo pipefail' 'source tests/lib/test-root.bash'
            sed -n '/^check_root_remediation_hints() (/,/^check_root_remediation_hints$/p' tests/suites/security/case-security-privileges.bash
          } >"$tmp"
          bash "$tmp"
          rm -f "$tmp"
          git add lib/common.sh tests/suites/security/case-security-privileges.bash
          git commit -m 'fix(privilege): make bare remediation paths executable'
          test "$(git ls-remote origin refs/heads/cqa-root-hints | cut -f1)" = '54d6a3194d0521834060956df5754b640c14b042'
          git push origin HEAD:refs/heads/cqa-root-hints
          git rev-parse HEAD
