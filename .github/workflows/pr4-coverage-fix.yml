name: PR4 focused coverage fix

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-coverage]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Add initial UFW reconciliation coverage
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 - <<'PY'
          import base64
          from pathlib import Path
          p = Path('tests/suites/operations/case-firewall-update.bash')
          text = p.read_text()
          anchor = "# PR4 iptables acceptance checks: Docker owns normal forwarding/NAT; this\n# project only removes OCI/legacy exceptions after a successful rollback snapshot.\n"
          block = base64.b64decode("").decode()
          if anchor not in text:
              raise SystemExit('iptables acceptance anchor not found')
          if 'SETUP_UFW_PROBE=' in text:
              raise SystemExit('setup UFW coverage already present')
          p.write_text(text.replace(anchor, block + anchor, 1))
          PY
          bash -n tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
          git add tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'test: cover initial firewall exactness [skip pr4-coverage]'
          git push origin HEAD:pr4-firewall-exactness
