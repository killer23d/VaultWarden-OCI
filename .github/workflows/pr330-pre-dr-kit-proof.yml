name: PR330 pre-DR recovery proof
on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Add pre-destructive recovery-kit proof
        run: |
          python3 - <<'PY'
          from pathlib import Path

          controller = Path('utilities/noble-host-acceptance.sh')
          lines = controller.read_text().splitlines()
          needle = '                    RCLONE_CONFIG="$RCLONE_CONFIG_PATH" bash ./restore.sh list --remote'
          matches = [i for i, line in enumerate(lines) if line == needle]
          if len(matches) != 1:
              raise SystemExit(f'expected one remote-list command, found {len(matches)}')
          i = matches[0]
          proof = '                step pre-dr-recovery-kit-decrypt verify_bound_backup_with_kit DR_SOURCE "$RECOVERY_KIT"'
          if proof in lines:
              raise SystemExit('pre-DR proof already present')
          lines.insert(i + 1, proof)
          controller.write_text('\n'.join(lines) + '\n')

          test = Path('tests/suites/operations/case-host-acceptance.bash')
          lines = test.read_text().splitlines()
          start_text = '  recipient="$(age-keygen -y "$AT/new.key")"'
          end_text = '    || fail "copied rotated recovery kit could not decrypt bound post-DR backup"'
          starts = [i for i, line in enumerate(lines) if line == start_text]
          ends = [i for i, line in enumerate(lines) if line == end_text]
          if len(starts) != 1 or len(ends) != 1 or ends[0] < starts[0]:
              raise SystemExit('could not isolate Age decrypt fixture block')
          replacement = [
              '  old_recipient="$(age-keygen -y "$AT/old.key")"',
              '  new_recipient="$(age-keygen -y "$AT/new.key")"',
              '  printf \'bound DR source payload\\n\' | age -r "$old_recipient" -o "$AT/dr-source-full.age"',
              '  printf \'bound post-DR payload\\n\' | age -r "$new_recipient" -o "$AT/post-dr-full.age"',
              '  META_FILE="$AT/metadata"',
              '  : > "$META_FILE"',
              '  meta_add DR_SOURCE_BACKUP_BASENAME full_backup_source_fixture.tar.zst.age',
              '  meta_add DR_SOURCE_BACKUP_ARCHIVE_SHA256 "$(sha_file "$AT/dr-source-full.age")"',
              '  meta_add DR_SOURCE_BACKUP_COHORT_SHA256 "$(printf \'0%.0s\' {1..64})"',
              '  meta_add POST_DR_BACKUP_BASENAME full_backup_fixture.tar.zst.age',
              '  meta_add POST_DR_BACKUP_ARCHIVE_SHA256 "$(sha_file "$AT/post-dr-full.age")"',
              '  meta_add POST_DR_BACKUP_COHORT_SHA256 "$(printf \'0%.0s\' {1..64})"',
              '  download_bound_backup(){',
              '    case "$1" in',
              '      DR_SOURCE)',
              '        # shellcheck disable=SC2034 # consumed by sourced verify_bound_backup_with_kit()',
              '        BOUND_BACKUP_FILE="$AT/dr-source-full.age"',
              '        ;;',
              '      POST_DR)',
              '        # shellcheck disable=SC2034 # consumed by sourced verify_bound_backup_with_kit()',
              '        BOUND_BACKUP_FILE="$AT/post-dr-full.age"',
              '        ;;',
              '      *) return 1 ;;',
              '    esac',
              '  }',
              '  verify_bound_backup_with_kit DR_SOURCE "$AT/old.kit" \\',
              '    || fail "pre-DR recovery kit could not decrypt the bound DR source backup"',
              '  if ( verify_bound_backup_with_kit DR_SOURCE "$AT/other.kit" ) >/dev/null 2>&1; then',
              '    fail "unrelated pre-DR recovery kit decrypted the bound DR source backup"',
              '  fi',
              '  verify_bound_backup_with_kit POST_DR "$AT/new.kit" \\',
              '    || fail "copied rotated recovery kit could not decrypt bound post-DR backup"',
          ]
          lines[starts[0]:ends[0] + 1] = replacement

          source_line = 'source_backup_line="$(grep -n \'dr-full-backup run_and_bind_full_backup DR_SOURCE\' "$A" | cut -d: -f1)"'
          source_matches = [i for i, line in enumerate(lines) if line == source_line]
          if len(source_matches) != 1:
              raise SystemExit('could not find source-backup ordering variable')
          lines.insert(source_matches[0] + 1, 'source_kit_decrypt_line="$(grep -n \'pre-dr-recovery-kit-decrypt verify_bound_backup_with_kit DR_SOURCE\' "$A" | cut -d: -f1)"')

          assertion = '(( canary_line < source_backup_line && source_backup_line < source_download_line && source_download_line < exact_restore_line )) \\'
          assertion_matches = [i for i, line in enumerate(lines) if line == assertion]
          if len(assertion_matches) != 1:
              raise SystemExit('could not find exact-source ordering assertion')
          ai = assertion_matches[0]
          if ai + 1 >= len(lines) or 'canary/bound-backup/exact-restore sequencing regressed' not in lines[ai + 1]:
              raise SystemExit('unexpected exact-source ordering assertion body')
          lines[ai:ai + 2] = [
              '(( canary_line < source_backup_line && source_backup_line < source_kit_decrypt_line \\',
              '   && source_kit_decrypt_line < source_download_line && source_download_line < exact_restore_line )) \\',
              '  || fail "canary/bound-backup/pre-DR-kit-proof/exact-restore sequencing regressed"',
          ]
          test.write_text('\n'.join(lines) + '\n')

          doc = Path('docs/HOST-ACCEPTANCE.md')
          lines = doc.read_text().splitlines()
          paragraph = "On the pre-DR invocation, create/record a unique canary such as `NOBLE-DR-CANARY-<run-id>`. **Only after that hook succeeds** does the controller create the full DR source backup. It snapshots the full-backup inventory before/after that command and requires exactly one newly published full backup. That backup's exact basename, archive digest, cohort digest, creation time, and remote object identity are checkpointed."
          matches = [i for i, line in enumerate(lines) if line == paragraph]
          if len(matches) != 1:
              raise SystemExit('could not find DR source documentation paragraph')
          di = matches[0]
          proof_paragraph = 'Before any reboot/uninstall destructive transition, the controller re-downloads that exact bound remote source and performs an `age` decrypt probe with the external **pre-DR recovery kit**. This proves that the retained kit supplied to the drill can actually decrypt the exact offsite recovery point that will be used after reset; a wrong or stale kit fails while the original host is still intact.'
          lines[di + 1:di + 1] = ['', proof_paragraph]

          evidence = '- the exact bound DR source backup basename, archive SHA-256, cohort digest, and rclone location;'
          matches = [i for i, line in enumerate(lines) if line == evidence]
          if len(matches) != 1:
              raise SystemExit('could not find DR source evidence bullet')
          lines.insert(matches[0] + 1, "- the pre-DR external recovery kit's successful decrypt probe against that exact offsite source;")
          doc.write_text('\n'.join(lines) + '\n')
          PY

          bash -n utilities/noble-host-acceptance.sh
          bash -n tests/suites/operations/case-host-acceptance.bash
          git diff --check

      - name: Install focused dependency
        run: sudo apt-get update && sudo apt-get install -y age

      - name: Validate focused contracts
        run: |
          bash tests/suites/operations/case-host-acceptance.bash
          shellcheck -x --severity=warning utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash

      - name: Commit safety proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md
          git commit -m "test: prove recovery kit before destructive DR"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
