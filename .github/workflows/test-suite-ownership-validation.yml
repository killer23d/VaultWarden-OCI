name: Test Suite Ownership Validation

on:
  pull_request:
    branches:
      - delta

jobs:
  clean-pr-branch:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-suite-ownership-consolidation
          fetch-depth: 0

      - name: Normalize ownership cleanup diff
        run: |
          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("tests/test-backup.sh"),
              Path("tests/test-lifecycle.sh"),
              Path("tests/test-operator-ui.sh"),
              Path("tests/test-secrets.sh"),
              Path("tests/test-security-privileges.sh"),
          ]
          for path in files:
              text = path.read_text()
              if path.name in {"test-backup.sh", "test-lifecycle.sh", "test-operator-ui.sh"}:
                  text = text.replace('gsub(/\\{/ ,"{")', 'gsub(/\\{/ ,"{")')
                  text = text.replace('gsub(/\\{/ ,', 'gsub(/\\{/,' )
              if path.name == "test-secrets.sh":
                  needle = '    || fail "schema_field raw output/schema query behavior failed"\ncf_keys='
                  if needle in text:
                      text = text.replace(
                          needle,
                          '    || fail "schema_field raw output/schema query behavior failed"\n\ncf_keys=',
                          1,
                      )
              if not text.endswith("\n"):
                  text += "\n"
              path.write_text(text)
          PY
          git diff --check
          git diff --stat

      - name: Commit normalized diff
        run: |
          if git diff --quiet; then
            echo 'No normalization changes needed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/test-backup.sh tests/test-lifecycle.sh tests/test-operator-ui.sh tests/test-secrets.sh tests/test-security-privileges.sh
          git commit -m 'tests: normalize consolidated suite diff'
          git push origin HEAD:test-suite-ownership-consolidation

  validate:
    needs: clean-pr-branch
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: test-suite-ownership-consolidation
          fetch-depth: 0

      - name: Fetch delta baseline
        run: git fetch origin delta

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils python3-argon2 python3-yaml shellcheck zstd
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: git diff --check
        run: |
          git diff --check origin/delta...HEAD
          printf '%s\n' '$ git diff --check origin/delta...HEAD' 'RESULT: PASS' >> /tmp/ownership-validation.log

      - name: Bash syntax validation
        run: |
          bash -n tests/run-tests.sh tests/test-*.sh
          printf '%s\n' '$ bash -n tests/run-tests.sh tests/test-*.sh' 'RESULT: PASS' >> /tmp/ownership-validation.log

      - name: Warning-level ShellCheck
        run: |
          find . -type f -name '*.sh' | xargs shellcheck -x --severity=warning
          printf '%s\n' "$ find . -type f -name '*.sh' | xargs shellcheck -x --severity=warning" 'RESULT: PASS' >> /tmp/ownership-validation.log

      - name: Canonical permanent regression suite
        run: |
          ./tests/run-tests.sh all
          printf '%s\n' '$ ./tests/run-tests.sh all' 'RESULT: PASS' >> /tmp/ownership-validation.log

      - name: Makefile diff protection
        run: |
          git diff -- Makefile
          test -z "$(git diff -- Makefile)"
          git diff origin/delta...HEAD -- Makefile
          test -z "$(git diff origin/delta...HEAD -- Makefile)"
          printf '%s\n' '$ git diff -- Makefile' 'RESULT: PASS (empty)' '$ git diff origin/delta...HEAD -- Makefile' 'RESULT: PASS (empty)' >> /tmp/ownership-validation.log

      - name: Workflow contract
        run: |
          grep -Fq 'tests/**' .github/workflows/doc-drift.yml
          grep -Fq './tests/run-tests.sh all' .github/workflows/doc-drift.yml
          test "$(grep -Fc './tests/run-tests.sh all' .github/workflows/doc-drift.yml)" -eq 1
          printf '%s\n' '$ workflow contract checks' 'RESULT: PASS' >> /tmp/ownership-validation.log

      - name: Export validated checkout
        run: tar --exclude=.git -czf /tmp/ownership-checkout.tar.gz .

      - uses: actions/upload-artifact@v4
        with:
          name: ownership-validation-checkout
          path: |
            /tmp/ownership-validation.log
            /tmp/ownership-checkout.tar.gz
          retention-days: 1
