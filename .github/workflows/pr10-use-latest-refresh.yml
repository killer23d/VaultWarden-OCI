name: PR10 latest-version override refresh

on:
  push:
    branches:
      - agent/pr10-platform-simplification
    paths:
      - '.github/workflows/doc-drift.yml'

permissions:
  contents: write

jobs:
  finalize-contract:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Align repository-interface version assertions
        run: python3 .github/pr10-finalize-version-contract.py

      - name: Validate foundation contract
        run: |
          bash -n tests/suites/foundation/case-runner-contracts.bash
          ./tests/run-tests.sh foundation
          git diff --check

      - name: Commit permanent test contract
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/suites/foundation/case-runner-contracts.bash
          git diff --cached --check
          git commit -m 'test: enforce scoped latest-version override'
          git push origin HEAD:agent/pr10-platform-simplification
