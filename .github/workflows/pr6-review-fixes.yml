name: PR6 review fixes
on:
  push:
    branches:
      - agent/pr6-update-crowdsec-readiness
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr6-update-crowdsec-readiness
          fetch-depth: 0
      - name: Apply and validate review fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def block(*items):
              return "\n".join(items) + "\n"

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              p.write_text(text.replace(old, new, 1))

          update = 'utilities/maintenance-update.sh'
          replace_once(update, block(
              'check_update_readiness() {',
              '    if [[ "$DRY_RUN" == "true" ]]; then',
              '        log_info "[DRY RUN] Would wait for critical services and run health --quick"',
              '        return 0',
              '    fi',
              '    if [[ ! "$UPDATE_READINESS_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then',
              '        log_error "UPDATE_READINESS_TIMEOUT must be a positive integer, got: ${UPDATE_READINESS_TIMEOUT}"',
              '        return 1',
              '    fi',
              '',
              '    local service',
              '    for service in "${_VW_DEFAULT_CRITICAL_SERVICES[@]}"; do',
              '        if ! wait_for_service_ready "$service" "$UPDATE_READINESS_TIMEOUT"; then',
              '            log_error "Critical service did not become ready after update: $service"',
              '            return 1',
              '        fi',
              '    done',
              '',
              '    if ! VAULTWARDEN_INTERNAL_HEALTH_CHECK=true \\',
              '        "${PROJECT_ROOT}/utilities/maintenance-health.sh" --quick --quiet; then',
              '        log_error "Bounded post-update health profile failed"',
              '        return 1',
              '    fi',
              '    log_success "Post-update readiness gate passed"',
              '    return 0',
              '}',
          ), block(
              'check_update_readiness() {',
              '    local context="${1:-post-update}"',
              '    if [[ "$DRY_RUN" == "true" ]]; then',
              '        log_info "[DRY RUN] Would wait for critical services and run health --quick (${context})"',
              '        return 0',
              '    fi',
              '    if [[ ! "$UPDATE_READINESS_TIMEOUT" =~ ^[1-9][0-9]*$ ]]; then',
              '        log_error "UPDATE_READINESS_TIMEOUT must be a positive integer, got: ${UPDATE_READINESS_TIMEOUT}"',
              '        return 1',
              '    fi',
              '',
              '    local service',
              '    for service in "${_VW_DEFAULT_CRITICAL_SERVICES[@]}"; do',
              '        if ! wait_for_service_ready "$service" "$UPDATE_READINESS_TIMEOUT"; then',
              '            log_error "Critical service did not become ready during ${context}: $service"',
              '            return 1',
              '        fi',
              '    done',
              '',
              '    if ! VAULTWARDEN_INTERNAL_HEALTH_CHECK=true \\',
              '        "${PROJECT_ROOT}/utilities/maintenance-health.sh" --quick --quiet; then',
              '        log_error "Bounded ${context} health profile failed"',
              '        return 1',
              '    fi',
              '    log_success "${context} readiness gate passed"',
              '    return 0',
              '}',
              '',
              'check_image_update_preflight() {',
              '    if check_update_readiness "pre-update baseline"; then',
              '        return 0',
              '    fi',
              '    log_error "Pre-update readiness is not clean; refusing to mutate packages or images."',
              '    log_error "Resolve existing health warnings/failures first so they cannot be mistaken for an image regression."',
              '    return 1',
              '}',
          ), 'update readiness helper')

          replace_once(update,
              'if recreate_update_stack && check_update_readiness; then',
              'if recreate_update_stack && check_update_readiness "post-update"; then',
              'post-update context')
          replace_once(update,
              '    if check_update_readiness; then\n        log_warn "Update failed, rollback healthy. The previous image set is serving traffic."',
              '    if check_update_readiness "rollback"; then\n        log_warn "Update failed, rollback healthy. The previous image set is serving traffic."',
              'rollback context')
          replace_once(update, block(
              '    operation_set_phase "2" "Pre-update safety backup"',
              '    run_pre_update_backup || exit 1',
              '    if [[ "$UPDATE_SYSTEM" == "true" ]]; then',
              '        operation_set_phase "3" "System package update"',
              '        update_system_packages',
              '    fi',
              '',
              '    local image_transaction=false',
              '    if [[ "$UPDATE_IMAGES" == "true" ]] || [[ "$FORCE" == "true" ]]; then',
              '        image_transaction=true',
              '        operation_set_phase "4" "Container image update"',
          ), block(
              '    operation_set_phase "2" "Pre-update safety backup"',
              '    run_pre_update_backup || exit 1',
              '',
              '    local image_transaction=false',
              '    if [[ "$UPDATE_IMAGES" == "true" ]] || [[ "$FORCE" == "true" ]]; then',
              '        image_transaction=true',
              '        check_image_update_preflight || exit 1',
              '    fi',
              '',
              '    if [[ "$UPDATE_SYSTEM" == "true" ]]; then',
              '        operation_set_phase "3" "System package update"',
              '        update_system_packages',
              '    fi',
              '',
              '    if [[ "$image_transaction" == "true" ]]; then',
              '        operation_set_phase "4" "Container image update"',
          ), 'pre-mutation baseline ordering')
          replace_once(update,
              '        if ! apply_update_stack || ! check_update_readiness; then',
              '        if ! apply_update_stack || ! check_update_readiness "post-system-update"; then',
              'system update context')

          setup = 'utilities/setup-crowdsec.sh'
          replace_once(setup,
              '    log_success "crowdsec-cloudflare-worker-bouncer enabled and started."\n',
              block(
                  '    if ! crowdsec_worker_wait_ready 30; then',
                  '        log_error "Required crowdsec-cloudflare-worker-bouncer did not establish a valid recent LAPI pull: ${CROWDSEC_READINESS_DETAIL}"',
                  '        return 1',
                  '    fi',
                  '    log_success "crowdsec-cloudflare-worker-bouncer is active, valid, and pulling from CrowdSec LAPI."',
              ),
              'bounded bouncer pull readiness')

          test = 'tests/suites/operations/case-readiness.bash'
          replace_once(test, block(
              '    cat > "$tmpdir/bin/cscli" <<\'EOF_CSCLI\'',
              '#!/usr/bin/env bash',
              'set -euo pipefail',
              'if [[ "${CSCLI_QUERY_OK:-true}" != true ]]; then exit 1; fi',
              'if [[ "${1:-}" == bouncers && "${2:-}" == list ]]; then',
              '    printf \'%s\\n\' "${CSCLI_BOUNCERS-cloudflare-worker-bouncer 127.0.0.1 valid}"',
              '    exit 0',
              'fi',
              'exit 2',
              'EOF_CSCLI',
          ), block(
              '    cat > "$tmpdir/bin/cscli" <<\'EOF_CSCLI\'',
              '#!/usr/bin/env bash',
              'set -euo pipefail',
              'if [[ "${CSCLI_QUERY_OK:-true}" != true ]]; then exit 1; fi',
              'if [[ "${1:-}" == bouncers && "${2:-}" == inspect && "${3:-}" == cloudflare-worker-bouncer ]]; then',
              '    [[ "${CSCLI_BOUNCER_PRESENT:-true}" == true ]] || exit 1',
              '    if [[ -n "${CSCLI_LAST_PULL:-}" ]]; then',
              '        printf \'{"name":"cloudflare-worker-bouncer","revoked":%s,"last_pull":"%s"}\\n\' \\',
              '            "${CSCLI_REVOKED:-false}" "$CSCLI_LAST_PULL"',
              '    else',
              '        printf \'{"name":"cloudflare-worker-bouncer","revoked":%s,"last_pull":null}\\n\' \\',
              '            "${CSCLI_REVOKED:-false}"',
              '    fi',
              '    exit 0',
              'fi',
              'exit 2',
              'EOF_CSCLI',
          ), 'structured bouncer mock')
          replace_once(test,
              '    export CSCLI_QUERY_OK=true CSCLI_BOUNCERS="cloudflare-worker-bouncer 127.0.0.1 valid"\n',
              block(
                  '    export CSCLI_QUERY_OK=true CSCLI_BOUNCER_PRESENT=true CSCLI_REVOKED=false',
                  '    export CSCLI_LAST_PULL="$(date -u +\'%Y-%m-%dT%H:%M:%SZ\')"',
              ),
              'valid bouncer fixture')
          replace_once(test, block(
              '    CSCLI_BOUNCERS=""',
              '    export CSCLI_BOUNCERS',
              '    set +e; crowdsec_worker_readiness; rc=$?; set -e',
              '    [[ "$rc" -eq 1 ]] || fail "unregistered bouncer must be NOT READY"',
              '',
              '    CLOUDFLARE_PROXY_ENABLED=false',
          ), block(
              '    CSCLI_BOUNCER_PRESENT=false',
              '    export CSCLI_BOUNCER_PRESENT',
              '    set +e; crowdsec_worker_readiness; rc=$?; set -e',
              '    [[ "$rc" -eq 1 ]] || fail "unregistered bouncer must be NOT READY"',
              '',
              '    CSCLI_BOUNCER_PRESENT=true CSCLI_REVOKED=true',
              '    export CSCLI_BOUNCER_PRESENT CSCLI_REVOKED',
              '    set +e; crowdsec_worker_readiness; rc=$?; set -e',
              '    [[ "$rc" -eq 1 ]] || fail "revoked/invalid bouncer must be NOT READY"',
              '',
              '    CSCLI_REVOKED=false CSCLI_LAST_PULL=""',
              '    export CSCLI_REVOKED CSCLI_LAST_PULL',
              '    set +e; crowdsec_worker_readiness; rc=$?; set -e',
              '    [[ "$rc" -eq 1 ]] || fail "bouncer with no successful LAPI pull must be NOT READY"',
              '',
              '    CSCLI_LAST_PULL="$(date -u -d \'10 minutes ago\' +\'%Y-%m-%dT%H:%M:%SZ\')"',
              '    export CSCLI_LAST_PULL',
              '    set +e; crowdsec_worker_readiness; rc=$?; set -e',
              '    [[ "$rc" -eq 1 ]] || fail "bouncer with stale LAPI pull must be NOT READY"',
              '',
              '    CSCLI_LAST_PULL="$(date -u +\'%Y-%m-%dT%H:%M:%SZ\')"',
              '    export CSCLI_LAST_PULL',
              '    crowdsec_worker_readiness || fail "recent valid LAPI pull should restore readiness: $CROWDSEC_READINESS_DETAIL"',
              '',
              '    CLOUDFLARE_PROXY_ENABLED=false',
          ), 'invalid pull-state tests')

          preflight = block(
              'check_pre_update_baseline() (',
              '    set -euo pipefail',
              '    tmpdir="$(mktemp -d)"',
              '    trap \'rm -rf "$tmpdir"\' EXIT',
              '    extract_function check_image_update_preflight "$UPDATE" > "$tmpdir/preflight.sh"',
              '    [[ -s "$tmpdir/preflight.sh" ]] || fail "could not extract check_image_update_preflight"',
              '    log_error() { :; }',
              '    READY_RESULT=0',
              '    READY_CALLS=0',
              '    check_update_readiness() {',
              '        (( READY_CALLS++ )) || true',
              '        return "$READY_RESULT"',
              '    }',
              '    # shellcheck disable=SC1090',
              '    source "$tmpdir/preflight.sh"',
              '',
              '    check_image_update_preflight || fail "clean pre-update baseline should pass"',
              '    [[ "$READY_CALLS" -eq 1 ]] || fail "pre-update baseline must run readiness once"',
              '',
              '    READY_RESULT=1 READY_CALLS=0',
              '    set +e; check_image_update_preflight; rc=$?; set -e',
              '    [[ "$rc" -eq 1 && "$READY_CALLS" -eq 1 ]] || fail "unclean baseline must abort"',
              '',
              '    preflight_line="$(grep -n \'^[[:space:]]*check_image_update_preflight || exit 1$\' "$UPDATE" | cut -d: -f1)"',
              '    system_line="$(grep -n \'^[[:space:]]*update_system_packages$\' "$UPDATE" | tail -1 | cut -d: -f1)"',
              '    snapshot_line="$(grep -n \'^[[:space:]]*snapshot_image_digests$\' "$UPDATE" | tail -1 | cut -d: -f1)"',
              '    [[ -n "$preflight_line" && -n "$system_line" && -n "$snapshot_line" ]] || fail "could not locate update ordering"',
              '    (( preflight_line < system_line && preflight_line < snapshot_line )) || fail "baseline must run before package/image mutation"',
              ')',
              '',
          )
          replace_once(test,
              '\ncheck_crowdsec_readiness() (\n',
              '\n' + preflight + 'check_crowdsec_readiness() (\n',
              'preflight behavior test')
          replace_once(test,
              block(
                  '    require \'crowdsec_resolve_lapi_port\' "$SETUP_CROWDSEC" \\',
                  '        "CrowdSec setup must reuse the shared LAPI resolver"',
              ),
              block(
                  '    require \'crowdsec_resolve_lapi_port\' "$SETUP_CROWDSEC" \\',
                  '        "CrowdSec setup must reuse the shared LAPI resolver"',
                  '    require \'crowdsec_worker_wait_ready[[:space:]]+30\' "$SETUP_CROWDSEC" \\',
                  '        "CrowdSec setup must wait for a valid recent LAPI pull after activation"',
              ),
              'setup wait contract')
          replace_once(test,
              'check_update_transaction\ncheck_crowdsec_readiness\n',
              'check_update_transaction\ncheck_pre_update_baseline\ncheck_crowdsec_readiness\n',
              'preflight invocation')
          PY

          bash -n lib/crowdsec.sh utilities/maintenance-update.sh utilities/setup-crowdsec.sh tests/suites/operations/case-readiness.bash
          shellcheck -x --severity=warning lib/crowdsec.sh utilities/maintenance-update.sh utilities/setup-crowdsec.sh tests/suites/operations/case-readiness.bash
          bash tests/suites/operations/case-readiness.bash
          bash tests/suites/operations/case-crowdsec.bash
          git diff --check
      - name: Publish fixes and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utilities/maintenance-update.sh utilities/setup-crowdsec.sh tests/suites/operations/case-readiness.bash
          git rm .github/workflows/pr6-review-fixes.yml
          git commit -m 'fix: tighten update and CrowdSec readiness'
          git push origin HEAD:agent/pr6-update-crowdsec-readiness
