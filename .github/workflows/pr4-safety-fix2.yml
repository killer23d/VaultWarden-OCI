name: PR4 safety fix 2

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-safety-fix2]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
      - name: Apply rollback safety patch
        run: |
          set -euo pipefail
          python3 .pr4-safety-patch.py
          bash -n utilities/setup-firewall.sh tests/suites/operations/case-firewall-update.bash
          git diff --check
          git add utilities/setup-firewall.sh tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: restore rollback on interruption [skip pr4-safety-fix2]'
          git push origin HEAD:pr4-firewall-exactness
