name: PR4 atomic firewall updater

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  patch-and-test:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-update-txn]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply updater transaction fix
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 .pr4-update-main-helper-fix.py
          python3 .pr4-update-transaction.py
          python3 .pr4-update-transaction-fix.py
      - name: Validate updater transaction fix
        shell: bash
        run: |
          set -euo pipefail
          bash -n \
            utilities/maintenance-update-firewall.sh \
            tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-update-firewall.sh \
            tests/suites/operations/case-firewall-update.bash
          bash tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
      - name: Commit validated updater transaction
        shell: bash
        run: |
          set -euo pipefail
          git add \
            utilities/maintenance-update-firewall.sh \
            tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: roll back partial updater generations [skip pr4-update-txn]'
          git push origin HEAD:pr4-firewall-exactness
