name: PR8 final authority contract

on:
  push:
    branches:
      - pr8-runtime-authority-age-custody
    paths:
      - '.github/workflows/pr8-final-contract.yml'

permissions:
  contents: write

jobs:
  patch-validate:
    if: github.event.head_commit.message != 'docs: correct runtime authority recovery contract'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Patch authority and recovery contract
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one match, found {count}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "docs/CONFIGURATION.md",
              '''| `/etc/vaultwarden/vaultwarden.env` | Installed environment used by systemd-managed runtime | Installed by `setup-systemd.sh`; do not hand-edit normally |''',
              '''| `/etc/vaultwarden/vaultwarden.env` | Installed environment used by systemd-managed runtime | Generated by `env-edit.sh sync` (also invoked by `setup-systemd.sh install`); do not hand-edit normally |''',
          )

          replace_once(
              "docs/CONFIGURATION.md",
              '''The runtime loader first discovers `PROJECT_STATE_DIR` from:

1. an explicit caller override;
2. repository `.env`;
3. `/etc/vaultwarden/vaultwarden.env`;
4. the default `/var/lib/vaultwarden`.

Production runtime loads one installed authority: `/etc/vaultwarden/vaultwarden.env` when present, otherwise `${PROJECT_STATE_DIR}/config/install.env`. Repository `.env` is authoring input only and is never a production fallback. Missing or malformed runtime authority is fatal; repair it with `sudo make sync-env`.

Explicit caller overrides for state directory, data device, and data mount are reapplied after loading. The operational Age private key is always `/etc/vaultwarden/age-key.txt`.

The authoring/sync workflow is intentionally different from runtime precedence:

```text
repository .env
    -> sudo make sync-env
${PROJECT_STATE_DIR}/config/install.env
    -> setup-systemd install
/etc/vaultwarden/vaultwarden.env
```

Use `utilities/env-edit.sh status` to inspect paths and drift.''',
              '''The runtime loader never consults repository `.env`. It establishes the state directory from an explicit caller `PROJECT_STATE_DIR` when one is supplied; otherwise it starts with `/var/lib/vaultwarden`. If `/etc/vaultwarden/vaultwarden.env` exists and no caller override was supplied, a valid `PROJECT_STATE_DIR` recorded in that installed environment replaces the default bootstrap path.

Production runtime then loads exactly one runtime authority. `/etc/vaultwarden/vaultwarden.env` wins when it exists. Only when that installed file is absent does the loader look for `${PROJECT_STATE_DIR}/config/install.env` under the state directory established above. An existing but unreadable or malformed installed environment is fatal rather than a reason to fall back.

This makes `/var/lib/vaultwarden/config/install.env` automatically discoverable when the installed environment is missing. A non-default persistent state directory is intentionally not discovered by scanning mounts or by consulting repository `.env`: if `/etc/vaultwarden/vaultwarden.env` has been lost, the recovery caller must already supply the custom `PROJECT_STATE_DIR` so the loader can locate its `config/install.env`. For example, recovery for a dedicated state volume at `/mnt/vw-data` should invoke the relevant command with `PROJECT_STATE_DIR=/mnt/vw-data` in its environment. Missing runtime authority remains fatal; after recovery, regenerate the installed artifacts with `sudo make sync-env` from the repository authoring environment.

Explicit caller overrides for state directory, data device, and data mount are reapplied after loading. The operational Age private key is always `/etc/vaultwarden/age-key.txt`.

The authoring/sync workflow is intentionally different from runtime precedence:

```text
repository .env
    -> sudo make sync-env  (utilities/env-edit.sh sync)
       -> ${PROJECT_STATE_DIR}/config/install.env
       -> /etc/vaultwarden/vaultwarden.env

setup-systemd.sh install invokes the same env-edit sync before installing units.
```

Use `utilities/env-edit.sh status` to inspect paths and drift.''',
          )

          replace_once(
              "utilities/setup-systemd.sh",
              '''WHAT install DOES:
    1. Copies executable scripts to /opt/vaultwarden-scripts/ (root:root 700):
         startup.sh  maintenance.sh  backup.sh  restore.sh
         utilities/setup-firewall.sh
         utilities/maintenance-run.sh      utilities/maintenance-health.sh
         utilities/maintenance-update.sh   utilities/maintenance-db-maint.sh
         utilities/maintenance-email.sh    utilities/maintenance-update-dns.sh
         utilities/notify-failure.sh       utilities/maintenance-update-firewall.sh
         utilities/backup-run.sh           utilities/restore-run.sh
       Scripts are self-locating via BASH_SOURCE[0]. The utilities/ subdirectory
       structure is preserved at the destination.
    2. Copies lib/ -> /opt/vaultwarden-scripts/lib/ (root:root 644)
    3. Copies public startup runtime assets under /opt/vaultwarden-scripts/:
         docker-compose.yml  docker-compose.yml.example  secrets-schema.yaml  VERSION
         caddy/Caddyfile  caddy/Caddyfile.degraded  caddy/Dockerfile       (root:root 644)
         caddy/entrypoint.sh                                                    (root:root 755)
       Private secrets are not copied into this code bundle.
    4. Installs the authoritative environment file to /etc/vaultwarden/vaultwarden.env (root:root 600)
       using ${PROJECT_STATE_DIR}/config/install.env or the installed runtime authority.
    5. Requires the operational Age key at /etc/vaultwarden/age-key.txt
    6. Copies systemd/*.{service,timer} and renders vaultwarden-startup.service -> /etc/systemd/system/
    7. systemctl daemon-reload
    8. Installs a Docker lifecycle drop-in so firewall reconciliation and startup rerun after dockerd restarts
    9. Enables vaultwarden-startup.service and enables timers; starts timers only according to start policy
   10. If timers were started now, verifies all managed timers are active and have a next trigger''',
              '''WHAT install DOES:
    1. Requires and validates the operational Age key at /etc/vaultwarden/age-key.txt
       before copying scripts, creating install paths, syncing runtime env files, or installing units.
    2. Copies executable scripts to /opt/vaultwarden-scripts/ (root:root 700):
         startup.sh  maintenance.sh  backup.sh  restore.sh
         utilities/setup-firewall.sh
         utilities/maintenance-run.sh      utilities/maintenance-health.sh
         utilities/maintenance-update.sh   utilities/maintenance-db-maint.sh
         utilities/maintenance-email.sh    utilities/maintenance-update-dns.sh
         utilities/notify-failure.sh       utilities/maintenance-update-firewall.sh
         utilities/backup-run.sh           utilities/restore-run.sh
       Scripts are self-locating via BASH_SOURCE[0]. The utilities/ subdirectory
       structure is preserved at the destination.
    3. Copies lib/ -> /opt/vaultwarden-scripts/lib/ (root:root 644)
    4. Copies public startup runtime assets under /opt/vaultwarden-scripts/:
         docker-compose.yml  docker-compose.yml.example  secrets-schema.yaml  VERSION
         caddy/Caddyfile  caddy/Caddyfile.degraded  caddy/Dockerfile       (root:root 644)
         caddy/entrypoint.sh                                                    (root:root 755)
       Private secrets are not copied into this code bundle.
    5. Runs utilities/env-edit.sh sync, using repository .env as authoring input to regenerate
       ${PROJECT_STATE_DIR}/config/install.env and /etc/vaultwarden/vaultwarden.env (root:root 600).
    6. Copies systemd/*.{service,timer} and renders vaultwarden-startup.service -> /etc/systemd/system/
    7. systemctl daemon-reload
    8. Installs a Docker lifecycle drop-in so firewall reconciliation and startup rerun after dockerd restarts
    9. Enables vaultwarden-startup.service and enables timers; starts timers only according to start policy
   10. If timers were started now, verifies all managed timers are active and have a next trigger''',
          )

          p = Path("tests/suites/foundation/case-runtime-authority.bash")
          text = p.read_text()
          marker = '''pass "authoring and strict runtime environment behavior"

[[ "$config" == *"load_authoring_environment()"* ]]'''
          if text.count(marker) != 1:
              raise SystemExit(f"runtime-authority test insertion marker count {text.count(marker)}")
          addition = r'''pass "authoring and strict runtime environment behavior"

custom_state="$tmp/custom-state"
mkdir -p "$custom_state/config"
printf 'PROJECT_STATE_DIR=%s\nCUSTOM_RUNTIME_ONLY=custom-state-ok\n' "$custom_state" > "$custom_state/config/install.env"
chmod 600 "$custom_state/config/install.env"
(
    export PROJECT_ROOT="$tmp/repo"
    unset PROJECT_STATE_DIR
    export VW_CONFIG_INSTALLED_ENV_FILE="$tmp/missing-custom-installed.env"
    source "$ROOT/lib/config.sh"
    if load_project_environment >/dev/null 2>&1; then exit 1; fi
    [[ -z "${CUSTOM_RUNTIME_ONLY:-}" ]]
) || fail "runtime loader auto-discovered a non-default persistent state path without an explicit locator"
(
    export PROJECT_ROOT="$tmp/repo"
    export PROJECT_STATE_DIR="$custom_state"
    export VW_CONFIG_INSTALLED_ENV_FILE="$tmp/missing-custom-installed.env"
    source "$ROOT/lib/config.sh"
    load_project_environment >/dev/null
    [[ "${PROJECT_STATE_DIR:-}" == "$custom_state" ]]
    [[ "${CUSTOM_RUNTIME_ONLY:-}" == "custom-state-ok" ]]
) || fail "explicit PROJECT_STATE_DIR did not recover custom persistent runtime authority when installed env was missing"
pass "custom persistent runtime fallback requires an explicit state locator when installed env is missing"

[[ "$config" == *"load_authoring_environment()"* ]]'''
          p.write_text(text.replace(marker, addition, 1))
          PY

          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --check

      - name: Focused validation
        run: |
          bash -n utilities/setup-systemd.sh
          bash -n tests/suites/foundation/case-runtime-authority.bash
          shellcheck -x --severity=warning utilities/setup-systemd.sh tests/suites/foundation/case-runtime-authority.bash
          bash tests/suites/foundation/case-runtime-authority.bash
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.generated.md
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          diff -u /tmp/COMMAND-REFERENCE.generated.md docs/COMMAND-REFERENCE.md
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml.example -f docker-compose.override.dev.yml.example config --quiet

      - name: Full suite
        run: |
          ./tests/run-tests.sh all

      - name: Commit validated patch and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr8-final-contract.yml
          git add docs/CONFIGURATION.md docs/COMMAND-REFERENCE.md utilities/setup-systemd.sh tests/suites/foundation/case-runtime-authority.bash
          git diff --cached --check
          git commit -m 'docs: correct runtime authority recovery contract'
          git push origin HEAD:pr8-runtime-authority-age-custody
