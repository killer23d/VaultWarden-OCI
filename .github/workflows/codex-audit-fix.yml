name: Apply edge audit fixes

on:
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply audit fixes
        run: python3 .github/codex_audit_fix.py
      - name: Compile
        run: python3 -m compileall -q vaultwarden_oci tests/v2
      - name: Keep workflow update separate
        run: git checkout HEAD -- .github/workflows/v2-ci.yml
      - name: Remove temporary audit machinery
        run: rm -f .github/codex_audit_fix.py .github/workflows/codex-audit-fix.yml
      - name: Commit audit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix findings from first Caddy edge audit"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
