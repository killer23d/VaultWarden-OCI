name: Fix health contract regression test

on:
  push:
    branches:
      - refactor/single-lock-ownership

permissions:
  contents: write

jobs:
  fix-validate-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Verify bounded staging state
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD~1)" = "99838419d76ecd2cd9ebc3a0b233181530f9d15a"
          expected='.github/workflows/fix-health-contract-regression.yml'
          actual="$(git diff --name-only 99838419d76ecd2cd9ebc3a0b233181530f9d15a...HEAD)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected pre-fix diff:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Correct stale contract assertion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/suites/operations/case-operations.bash')
          text = path.read_text()
          old = '''require '^SuccessExitStatus=0 1 3 75$' "$UNIT" \\
            "health unit must treat expected contention 75 as success, but not all failures"
          '''
          new = '''require '^SuccessExitStatus=0 1 75$' "$UNIT" \\
            "health unit must preserve exit 3/4 as failures while accepting warnings and contention"
          '''
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one stale health SuccessExitStatus assertion')
          path.write_text(text.replace(old, new, 1))
          PY
          rm -f -- .github/workflows/fix-health-contract-regression.yml
          git diff --check

      - name: Verify final scope
        shell: bash
        run: |
          set -euo pipefail
          actual_delta="$(git diff --name-only 99838419d76ecd2cd9ebc3a0b233181530f9d15a | sort)"
          [[ "$actual_delta" == 'tests/suites/operations/case-operations.bash' ]] || {
            printf 'Unexpected regression-fix delta:\n%s\n' "$actual_delta" >&2
            exit 1
          }
          expected_pr=$'lib/operations.sh\nsystemd/vaultwarden-health.service\ntests/suites/foundation/case-systemd.bash\ntests/suites/operations/case-health-alerts.bash\ntests/suites/operations/case-lock-fd-hygiene.bash\ntests/suites/operations/case-operations.bash\nutilities/maintenance-health.sh\nutilities/setup-systemd.sh'
          actual_pr="$(git diff --name-only 1ff4f908866de7a917c37fa37147981d238af28f | sort)"
          [[ "$actual_pr" == "$expected_pr" ]] || {
            printf 'Unexpected final PR scope:\n%s\n' "$actual_pr" >&2
            exit 1
          }
          test ! -e .github/workflows/fix-health-contract-regression.yml

      - name: Install operations test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux-amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Validate operations regression
        shell: bash
        run: |
          set -euo pipefail
          bash -n tests/suites/operations/case-operations.bash
          shellcheck -x --severity=warning tests/suites/operations/case-operations.bash
          ./tests/run-tests.sh operations

      - name: Commit and push fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m 'Align health systemd contract regression test'
          git push origin HEAD:refactor/single-lock-ownership
