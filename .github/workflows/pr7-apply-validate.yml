name: PR7 apply and validate

on:
  push:
    branches: [pr7-sensitive-workspace-sops-hardening]

permissions:
  contents: write

jobs:
  apply-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Apply scoped hardening
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          def replace_once(path, old, new):
              p=Path(path); text=p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{path}: expected exactly one replacement, found {text.count(old)}")
              p.write_text(text.replace(old,new,1))

          def replace_function(path, name, body):
              p=Path(path); lines=p.read_text().splitlines(True)
              start=None
              for i,line in enumerate(lines):
                  if line.startswith(name+'() {'):
                      start=i; break
              if start is None: raise SystemExit(f"{path}: function {name} not found")
              end=None
              for i in range(start+1,len(lines)):
                  if lines[i].rstrip('\n') == '}':
                      end=i; break
              if end is None: raise SystemExit(f"{path}: end of {name} not found")
              lines[start:end+1]=[body.rstrip()+"\n"]
              p.write_text(''.join(lines))

          crypto=Path('lib/crypto.sh')
          text=crypto.read_text()
          marker='encrypt_sops_file() {'
          if marker not in text: raise SystemExit('encrypt_sops_file marker missing')
          helper=r'''# Create a root-only workspace only on verified volatile storage.
          # Callers own lifecycle registration so existing signal/operation traps remain authoritative.
          _sensitive_backing_is_volatile() {
              local path="$1" fs_type
              [[ -d "$path" && ! -L "$path" ]] || return 1
              command -v findmnt >/dev/null 2>&1 || return 1
              fs_type="$(findmnt -n -T "$path" -o FSTYPE 2>/dev/null)" || return 1
              [[ "$fs_type" == "tmpfs" || "$fs_type" == "ramfs" ]]
          }

          create_sensitive_workspace() {
              local purpose="${1:-sensitive}" base workspace old_umask metadata
              [[ "$purpose" =~ ^[a-z0-9][a-z0-9-]*$ ]] || {
                  log_error "Sensitive workspace purpose is invalid: $purpose"
                  return 1
              }
              if (( EUID != 0 )); then
                  log_error "Sensitive workspaces require root privileges."
                  return 1
              fi

              for base in /run/vaultwarden-oci /dev/shm; do
                  if [[ "$base" == "/run/vaultwarden-oci" && ! -e "$base" ]]; then
                      _sensitive_backing_is_volatile /run || continue
                      install -d -m 0700 -o root -g root "$base" 2>/dev/null || continue
                  fi
                  _sensitive_backing_is_volatile "$base" || continue
                  old_umask="$(umask)"
                  umask 077
                  workspace="$(mktemp -d -p "$base" "vw-${purpose}.XXXXXXXXXX" 2>/dev/null)" || {
                      umask "$old_umask" || true
                      continue
                  }
                  umask "$old_umask"
                  if ! chmod 0700 "$workspace" 2>/dev/null; then
                      rm -rf -- "$workspace" 2>/dev/null || true
                      continue
                  fi
                  metadata="$(stat -c '%u:%g:%a' -- "$workspace" 2>/dev/null)" || {
                      rm -rf -- "$workspace" 2>/dev/null || true
                      continue
                  }
                  if [[ "$metadata" != "0:0:700" ]] || ! _sensitive_backing_is_volatile "$workspace"; then
                      rm -rf -- "$workspace" 2>/dev/null || true
                      continue
                  fi
                  printf '%s\n' "$workspace"
                  return 0
              done

              log_error "No verified volatile root-only workspace is available under /run/vaultwarden-oci or /dev/shm."
              return 1
          }

          remove_sensitive_workspace() {
              local workspace="${1:-}" file
              [[ -n "$workspace" && ! -L "$workspace" && -d "$workspace" ]] || return 1
              case "$workspace" in
                  /run/vaultwarden-oci/vw-*|/dev/shm/vw-*) ;;
                  *) return 1 ;;
              esac
              while IFS= read -r -d '' file; do
                  if declare -F secure_delete >/dev/null 2>&1; then
                      secure_delete "$file" 2>/dev/null || rm -f -- "$file" 2>/dev/null || true
                  elif command -v shred >/dev/null 2>&1; then
                      shred -fuz -- "$file" 2>/dev/null || rm -f -- "$file" 2>/dev/null || true
                  else
                      rm -f -- "$file" 2>/dev/null || true
                  fi
              done < <(find -P "$workspace" -type f -print0 2>/dev/null)
              rm -rf -- "$workspace"
          }

          '''
          crypto.write_text(text.replace(marker,helper+marker,1))

          replace_function('lib/crypto.sh','encrypt_sops_file',r'''encrypt_sops_file() {
              local file="$1"
              local age_key_file="${2:-}"
              [[ -f "$file" ]] || { log_error "encrypt_sops_file: file not found: $file"; return 1; }
              if [[ -z "$age_key_file" ]]; then
                  age_key_file="$(resolve_age_key_path)" || return 1
              fi
              [[ -f "$age_key_file" ]] || { log_error "encrypt_sops_file: Age key not found: $age_key_file"; return 1; }

              local file_dir file_base tmp_file rollback_file old_umask rc=0
              file_dir="$(dirname -- "$file")"
              file_base="$(basename -- "$file")"
              old_umask="$(umask)"; umask 077
              tmp_file="$(mktemp "${file_dir}/.${file_base}.encrypt.XXXXXXXXXX")" || { umask "$old_umask"; return 1; }
              rollback_file="$(mktemp "${file_dir}/.${file_base}.rollback.XXXXXXXXXX")" || {
                  umask "$old_umask"
                  rm -f -- "$tmp_file"
                  log_error "encrypt_sops_file: cannot create rollback copy; ciphertext was not replaced"
                  return 1
              }
              umask "$old_umask"
              chmod 0600 "$tmp_file" "$rollback_file" || { rm -f -- "$tmp_file" "$rollback_file"; return 1; }

              if ! cp -- "$file" "$tmp_file" || ! cp -- "$file" "$rollback_file"; then
                  log_error "encrypt_sops_file: pre-write rollback copy failed; ciphertext was not replaced"
                  rm -f -- "$tmp_file" "$rollback_file"
                  return 1
              fi

              if ! SOPS_AGE_KEY_FILE="$age_key_file" sops --encrypt --in-place "$tmp_file"; then
                  log_error "encrypt_sops_file: SOPS encryption failed"
                  rm -f -- "$tmp_file" "$rollback_file"
                  return 1
              fi
              if ! mv -- "$tmp_file" "$file"; then
                  log_error "encrypt_sops_file: atomic ciphertext promotion failed"
                  rm -f -- "$tmp_file" "$rollback_file"
                  return 1
              fi

              if ! SOPS_AGE_KEY_FILE="$age_key_file" sops --decrypt "$file" >/dev/null 2>&1; then
                  log_error "encrypt_sops_file: promoted ciphertext failed round-trip validation; restoring previous ciphertext"
                  if mv -f -- "$rollback_file" "$file"; then
                      return 1
                  fi
                  log_error "encrypt_sops_file: CRITICAL: rollback restore failed; previous ciphertext remains at $rollback_file"
                  return 1
              fi

              rm -f -- "$rollback_file" || {
                  log_warn "encrypt_sops_file: ciphertext is valid but rollback copy could not be removed: $rollback_file"
                  return 1
              }
              return 0
          }''')

          replace_function('utilities/secrets-edit.sh','_check_editor_forks',r'''_check_editor_forks() {
              local _editor_str="${EDITOR_CMD[*]}" editor_bin forking
              case "$_editor_str" in
                  *--wait*|*--nofork*|-f|*\ -f\ *|*\ -f) return 0 ;;
              esac
              editor_bin="$(basename "${EDITOR_CMD[0]}")"
              for forking in "${_FORKING_EDITORS[@]}"; do
                  [[ "$editor_bin" == "$forking" ]] || continue
                  case "$editor_bin" in
                      code)      log_error "EDITOR 'code' must wait for save. Use: EDITOR='code --wait' sudo ./edit-secrets.sh edit" ;;
                      gvim|mvim) log_error "EDITOR '$editor_bin' must stay in foreground. Use: EDITOR='$editor_bin --nofork' sudo ./edit-secrets.sh edit" ;;
                      atom)      log_error "EDITOR 'atom' must wait for save. Use: EDITOR='atom --wait' sudo ./edit-secrets.sh edit" ;;
                      *)         log_error "EDITOR '$editor_bin' is known to return before save. Re-run it with its documented wait/foreground option." ;;
                  esac
                  return 1
              done
              return 0
          }''')
          replace_once('utilities/secrets-edit.sh','    _check_editor_forks\n','    _check_editor_forks || return 1\n')
          replace_once('utilities/secrets-edit.sh', '''    local temp_file
              temp_file=$(mktemp -p /dev/shm --suffix=.yaml 2>/dev/null || mktemp --suffix=.yaml)
              if [[ -n "$temp_file" && "$temp_file" != /dev/shm/* ]]; then
                  log_warn "edit: /dev/shm unavailable — plaintext temp file is disk-backed: $temp_file"
                  log_warn "      Ensure full-disk encryption is active on this host."
              fi
              if ! install -m 600 /dev/null "$temp_file" 2>/dev/null; then
                  rm -f "$temp_file"
                  log_error "Failed to secure temp file: $temp_file"
                  return 1
              fi
              register_cleanup "_remove_sensitive_file" "$temp_file"
          ''','''    local temp_file sensitive_workspace
              sensitive_workspace="$(create_sensitive_workspace secrets-edit)" || return 1
              register_cleanup "remove_sensitive_workspace" "$sensitive_workspace"
              temp_file="${sensitive_workspace}/secrets.yaml"
              install -m 600 /dev/null "$temp_file" || return 1
          ''')

          # View and rotate plaintext staging.
          for path,purpose in [('utilities/secrets-view.sh','secrets-view'),('utilities/secrets-export-recovery-kit.sh','recovery-export')]:
              p=Path(path); t=p.read_text()
              pat=re.compile(r'(?ms)^(\s*)local (temp_plain|temp_file)\n\1\2=\$\(mktemp -p /dev/shm --suffix=\.yaml 2>/dev/null \|\| mktemp --suffix=\.yaml\)\n.*?\1register_cleanup "_remove_sensitive_file" "\$\2"\n')
              m=pat.search(t)
              if not m: raise SystemExit(f'{path}: plaintext temp block not found')
              ind,var=m.group(1),m.group(2)
              new=(f'{ind}local {var} sensitive_workspace\n'
                   f'{ind}sensitive_workspace="$(create_sensitive_workspace {purpose})" || return 1\n'
                   f'{ind}register_cleanup "remove_sensitive_workspace" "$sensitive_workspace"\n'
                   f'{ind}{var}="${{sensitive_workspace}}/secrets.yaml"\n'
                   f'{ind}install -m 600 /dev/null "${var}" || return 1\n')
              p.write_text(t[:m.start()]+new+t[m.end():])

          p=Path('utilities/secrets-rotate.sh'); t=p.read_text()
          pat=re.compile(r'(?ms)^\s*local temp_plain temp_patched\n\s*temp_plain=\$\(mktemp -p /dev/shm --suffix=\.yaml 2>/dev/null \|\| mktemp --suffix=\.yaml\).*?register_cleanup "_remove_sensitive_file" "\$temp_patched"\n')
          m=pat.search(t)
          if not m: raise SystemExit('rotate plaintext staging block not found')
          new='''    local temp_plain temp_patched sensitive_workspace
              sensitive_workspace="$(create_sensitive_workspace secrets-rotate)" || return 1
              register_cleanup "remove_sensitive_workspace" "$sensitive_workspace"
              temp_plain="${sensitive_workspace}/secrets.yaml"
              temp_patched="${sensitive_workspace}/secrets-patched.yaml"
              install -m 600 /dev/null "$temp_plain" || return 1
              install -m 600 /dev/null "$temp_patched" || return 1
          '''
          p.write_text(t[:m.start()]+new+t[m.end():])

          # Top-level automatic setup capture uses the shared verified helper.
          replace_function('setup.sh','_setup_create_sensitive_workspace',r'''_setup_create_sensitive_workspace() {
              [[ -z "${TMP_WORKDIR:-}" ]] || return 0
              TMP_WORKDIR="$(create_sensitive_workspace setup)" || return 1
              export VW_ADMIN_PLAIN_FILE="${TMP_WORKDIR}/vw_admin_plain"
              export VW_ADMIN_HASH_FILE="${TMP_WORKDIR}/vw_admin_hash"
              export CADDY_PLAIN_FILE="${TMP_WORKDIR}/caddy_plain"
              export CADDY_HASH_FILE="${TMP_WORKDIR}/caddy_hash"
          }''')
          replace_once('setup.sh','''        if rm -rf -- "$workspace"; then
          ''','''        if remove_sensitive_workspace "$workspace"; then
          ''')

          # Direct setup-secrets plaintext workspace uses the same authority; retain test override only in test mode.
          replace_function('utilities/setup-secrets.sh','_setup_secrets_create_workdir',r'''_setup_secrets_create_workdir() {
              [[ -z "${SETUP_SECRETS_OWNED_WORKDIR:-}" ]] || return 0
              if [[ "${VW_TEST_MODE:-false}" == "true" && -n "${VW_SETUP_SECRETS_TMP_DIR:-}" ]]; then
                  _ss_prepare_plain_tmp_dir || return 1
                  TMP_WORKDIR="$(mktemp -d -p "$(_ss_plain_tmp_dir)" vw-setup-secrets.XXXXXXXXXX)" || return 1
                  chmod 0700 "$TMP_WORKDIR" || { rm -rf "$TMP_WORKDIR"; return 1; }
              else
                  TMP_WORKDIR="$(create_sensitive_workspace setup-secrets)" || return 1
              fi
              SETUP_SECRETS_OWNED_WORKDIR="$TMP_WORKDIR"
          }''')
          replace_once('utilities/setup-secrets.sh','''        if rm -rf -- "$workspace"; then
          ''','''        if { [[ "${VW_TEST_MODE:-false}" == "true" && -n "${VW_SETUP_SECRETS_TMP_DIR:-}" ]] && rm -rf -- "$workspace"; } || remove_sensitive_workspace "$workspace"; then
          ''')
          replace_function('utilities/setup-secrets.sh','_ss_make_plaintext_temp',r'''_ss_make_plaintext_temp() {
              local dir tmp workspace
              if [[ "${VW_TEST_MODE:-false}" == "true" && -n "${VW_SETUP_SECRETS_TMP_DIR:-}" ]]; then
                  _ss_prepare_plain_tmp_dir || return 1
                  dir="$(_ss_plain_tmp_dir)"
              else
                  workspace="$(create_sensitive_workspace sops-plaintext)" || return 1
                  SETUP_SECRETS_OWNED_WORKDIR="${SETUP_SECRETS_OWNED_WORKDIR:-$workspace}"
                  TMP_WORKDIR="${TMP_WORKDIR:-$workspace}"
                  dir="$workspace"
              fi
              tmp=$(mktemp -p "$dir" vwsecrets.XXXXXXXXXX.yaml) || return 1
              chmod 0600 "$tmp" || { rm -f "$tmp"; return 1; }
              printf '%s' "$tmp"
          }''')

          # Age rotation private-key staging.
          replace_once('utilities/key-rotate.sh','''workdir="$(mktemp -d -p /dev/shm vw-age-rotate.XXXXXXXX 2>/dev/null || mktemp -d -t vw-age-rotate.XXXXXXXX)"
          ''','''workdir="$(create_sensitive_workspace age-rotate)" || {
              log_error "Unable to create a verified volatile Age-key rotation workspace."
              exit 1
          }
          ''')
          replace_once('utilities/key-rotate.sh','''    [[ -n "${workdir:-}" ]] && _secure_rm "$workdir"
          ''','''    [[ -n "${workdir:-}" ]] && remove_sensitive_workspace "$workdir"
          ''')

          # Runtime decryption cache contains all plaintext secrets.
          p=Path('lib/secrets.sh'); t=p.read_text()
          old='''    local _eds_tmpdir _eds_cache
              _eds_tmpdir=$(mktemp -d -t vaultwarden-secrets.XXXXXXXXXX) || {
                  log_error "export_docker_secrets: failed to create secure staging directory"
                  return 1
              }
              chmod 0700 "$_eds_tmpdir" || {
                  log_error "export_docker_secrets: failed to secure staging directory"
                  rm -rf "$_eds_tmpdir"
                  return 1
              }
          '''
          new='''    local _eds_tmpdir _eds_cache
              _eds_tmpdir="$(create_sensitive_workspace runtime-secrets)" || {
                  log_error "export_docker_secrets: no verified volatile plaintext staging directory is available"
                  return 1
              }
          '''
          if old not in t: raise SystemExit('runtime plaintext tmp block missing')
          t=t.replace(old,new,1)
          t=t.replace('''    trap "{ rm -rf '$_eds_tmpdir' 2>/dev/null || true; cleanup_secrets_environment; }" RETURN
          ''','''    trap "{ remove_sensitive_workspace '$_eds_tmpdir' 2>/dev/null || true; cleanup_secrets_environment; }" RETURN
          ''',1)
          # A9 legacy secret compatibility removal.
          t=t.replace('legacy_keys = {"backup_passphrase"}\n','legacy_keys = set()\n',1)
          t=t.replace(' and key not in legacy_keys','',1)
          legacy='''    local _legacy_manifest="${docker_dir}/.managed-secrets"
          '''
          if legacy not in t: raise SystemExit('legacy manifest declaration missing')
          t=t.replace(legacy,'',1)
          t=t.replace('''    local -a _retired_runtime_keys=(backup_passphrase)
              local _retired_runtime_key
              for _retired_runtime_key in "${_retired_runtime_keys[@]}"; do
                  _eds_remove_keys["$_retired_runtime_key"]=1
              done
          ''','',1)
          t=t.replace('''    elif VAULTWARDEN_NONINTERACTIVE_SUDO=true _maybe_sudo test -f "$_legacy_manifest"; then
                  _previous_manifest=$(VAULTWARDEN_NONINTERACTIVE_SUDO=true _maybe_sudo cat "$_legacy_manifest" 2>/dev/null || true)
          ''','',1)
          t=t.replace('''    if VAULTWARDEN_NONINTERACTIVE_SUDO=true _maybe_sudo test -e "$_legacy_manifest"; then
                  if ! VAULTWARDEN_NONINTERACTIVE_SUDO=true _maybe_sudo rm -f "$_legacy_manifest"; then
                      log_error "export_docker_secrets: failed to remove legacy managed manifest ${_legacy_manifest}"
                      return 1
                  fi
              fi

          ''','',1)
          # A10 7zz only.
          old='''  local candidate
            for candidate in 7zz 7z; do
              if command -v "$candidate" >/dev/null 2>&1; then
                printf '%s\\n' "$candidate"
                return 0
              fi
            done
            log_warn "recovery-kit email: an AES-ZIP capable 7-Zip command is required."
          '''
          new='''  if command -v 7zz >/dev/null 2>&1; then
              printf '%s\\n' 7zz
              return 0
            fi
            log_warn "recovery-kit email: Ubuntu 7zz is required."
          '''
          if old not in t: raise SystemExit('recovery 7zip resolver missing')
          t=t.replace(old,new,1)
          t=t.replace('case "${tool##*/}" in 7z|7zz) ;; *)','case "${tool##*/}" in 7zz) ;; *)',1)
          t=t.replace('Linux: run `7z x important-documents-YYYYMMDD.zip`','Linux: run `7zz x important-documents-YYYYMMDD.zip`',1)
          # B9 localize newline workaround.
          needle='''  systemd_run="$(command -v systemd-run 2>/dev/null || true)"
            if [[ -n "$systemd_run" ]] && "$systemd_run" \\
                --quiet \\
                --collect \\
                --unit="$unit_name" \\
                --on-active="$delay" \\
                /bin/sh -c "$cleanup_body" sh "$absolute_file"; then
          '''
          repl='''  local systemd_cleanup_body="$cleanup_body"
            systemd_cleanup_body="${systemd_cleanup_body#$'\\n'}"
            systemd_cleanup_body="${systemd_cleanup_body%$'\\n'}"
            systemd_cleanup_body="${systemd_cleanup_body//$'\\n'/; }"
            systemd_cleanup_body="${systemd_cleanup_body//then; /then }"
            systemd_run="$(command -v systemd-run 2>/dev/null || true)"
            if [[ -n "$systemd_run" ]] && "$systemd_run" \\
                --quiet \\
                --collect \\
                --unit="$unit_name" \\
                --on-active="$delay" \\
                /bin/sh -c "$systemd_cleanup_body" sh "$absolute_file"; then
          '''
          if needle not in t: raise SystemExit('systemd recovery block missing')
          t=t.replace(needle,repl,1)
          p.write_text(t)

          # Remove the global systemd-run wrapper.
          p=Path('lib/defaults.sh'); t=p.read_text()
          t=re.sub(r'\n# CrowdSec 1\.7\.8 rejects literal newlines.*?\nfi\n?$', '\n', t, flags=re.S)
          p.write_text(t)

          # Ubuntu Noble contract: only 7zz is accepted.
          replace_function('utilities/setup-system.sh','_resolve_7zip_command',r'''_resolve_7zip_command() {
              command -v 7zz >/dev/null 2>&1 || return 1
              printf '%s\n' 7zz
          }''')
          replace_function('utilities/setup-system.sh','_require_7zip_command',r'''_require_7zip_command() {
              if ! _resolve_7zip_command >/dev/null; then
                  log_error "Missing required Ubuntu 7zz command."
                  log_info "Install hint: sudo apt-get install -y 7zip"
                  return 1
              fi
              log_debug "Resolved 7-Zip command: 7zz"
          }''')

          # B10: break-glass expiry is systemd-only and verifiable on the supported host.
          p=Path('utilities/setup-secrets.sh'); t=p.read_text()
          sched=re.compile(r'''(?ms)^        if command -v at >/dev/null.*?^        return 0\n    \}''')
          m=sched.search(t)
          if not m: raise SystemExit('breakglass scheduler fallback block missing')
          replacement=r'''        local unit_name="vw-breakglass-cleanup"
              if ! command -v systemd-run >/dev/null 2>&1 || ! systemctl is-system-running >/dev/null 2>&1; then
                  log_error "Break-glass expiry requires a running systemd host; account creation is aborted."
                  return 1
              fi
              if ! systemd-run --quiet --collect \
                      --on-active="${expiry_hours}h" \
                      --unit="$unit_name" \
                      --description="VaultWarden breakglass auto-cleanup for ${bg_user}" \
                      -- bash -c "${cleanup_cmd}" 2>/dev/null; then
                  log_error "Could not schedule break-glass expiry with systemd; account creation is aborted."
                  return 1
              fi
              if ! systemctl is-active --quiet "${unit_name}.timer"; then
                  systemctl stop "${unit_name}.timer" "${unit_name}.service" >/dev/null 2>&1 || true
                  log_error "Break-glass expiry timer could not be verified active; account creation is aborted."
                  return 1
              fi
              log_success "Auto-cleanup scheduled and verified via systemd at ${expiry_human}"
              return 0
          }'''
          t=t[:m.start()]+replacement+t[m.end():]
          # A12: no sudo-group compatibility status/cleanup.
          t=re.sub(r'''(?ms)^        if groups "\$BREAKGLASS_USER".*?^        fi\n\n        local sudoers_file=''', "        local sudoers_file=", t, count=1)
          t=t.replace('''            elif groups "$BREAKGLASS_USER" 2>/dev/null | grep -q -w "sudo"; then
                  echo "  Sudo access: ⚠️  Member of 'sudo' group (legacy full-root configuration)"
              else
          ''','''            else
          ''',1)
          p.write_text(t)

          # Tests: removed compatibility, 7zz-only and shared helper expectations.
          p=Path('tests/suites/security/case-secrets.bash'); t=p.read_text()
          t=t.replace('''grep -Fq 'legacy_keys = {"backup_passphrase"}' "$ROOT/lib/secrets.sh" \\
              || fail "legacy backup_passphrase must remain manageable in existing secrets files"
          ''','''! grep -Fq 'backup_passphrase' "$ROOT/lib/secrets.sh" \\
              || fail "retired backup_passphrase compatibility remains in secret handling"
          ''',1)
          t=t.replace('backup_passphrase: "legacy-encrypted-state-value"\n','',1)
          legacytest=re.compile(r'''(?ms)^rm -f "\$TMP/managed-secrets"\n.*?unknown operator file removed during legacy cleanup"\n\n''')
          t,n=legacytest.subn('',t,count=1)
          if n!=1: raise SystemExit('legacy runtime cleanup test block missing')
          t=t.replace("elif command -v 7z >/dev/null 2>&1; then\n    real_tool=7z\n",'',1)
          t=t.replace('Real AES-256 ZIP stdin smoke test skipped: 7z/7zz unavailable.','Real AES-256 ZIP stdin smoke test skipped: 7zz unavailable.',1)
          t=t.replace("grep -Fq 'for candidate in 7zz 7z; do' utilities/setup-system.sh \\\n  || fail \"setup dependency resolver does not prefer 7zz with 7z fallback\"", "! grep -Fq '7z' <(sed -n '/^_resolve_7zip_command()/,/^}/p' utilities/setup-system.sh | grep -v '7zz') \\\n  || fail \"setup dependency resolver retains 7z fallback\"",1)
          t=t.replace("grep -Fq 'for candidate in 7zz 7z; do' lib/secrets.sh \\\n  || fail \"recovery ZIP helper does not prefer 7zz with 7z fallback\"", "grep -Fq 'command -v 7zz' lib/secrets.sh \\\n  || fail \"recovery ZIP helper does not require 7zz\"",1)
          t=t.replace('''fallback="$fixture/fallback"
          make_cmd "$fallback" 7z
          [[ "$(PATH="$fallback" _resolve_7zip_command)" == 7z ]]
          PATH="$fallback" _require_7zip_command
          ''','''fallback="$fixture/fallback"
          make_cmd "$fallback" 7z
          ! PATH="$fallback" _resolve_7zip_command
          ! PATH="$fallback" _require_7zip_command >/dev/null 2>&1
          ''',1)
          t=t.replace('[[ "$missing_output" == *"expected 7zz (preferred) or 7z"* ]]','[[ "$missing_output" == *"Missing required Ubuntu 7zz command"* ]]',1)
          # key-rotate mocked crypto needs the shared helper.
          t=t.replace('''check_age_key(){ [[ -s "$1" ]]; }
          MOCK_CRYPTO
          ''','''check_age_key(){ [[ -s "$1" ]]; }
