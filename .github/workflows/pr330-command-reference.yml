name: PR330 command reference artifact
on:
  pull_request:

permissions:
  contents: read

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install yq
        run: |
          YQ_VERSION="v4.53.3"
          YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
      - name: Generate command reference
        env:
          DOCKER_PROJECT_LABEL: ci
        run: bash utilities/write-command-reference.sh
      - name: Upload generated command reference
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: pr330-command-reference
          path: docs/COMMAND-REFERENCE.md
          if-no-files-found: error
          retention-days: 1
