name: PR7 post-review finalize
on:
  pull_request:
    branches:
      - delta
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'pr7-sensitive-workspace-sops-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Build corrected clean commit locally
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f"{label}: expected exactly one match, found {text.count(old)}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              "utilities/setup-secrets.sh",
              "        printf '%b\\\n' \"Expiry:",
              "        printf '%b\\n' \"Expiry:",
              "break-glass expiry printf",
          )
          replace_once(
              "utilities/setup-secrets.sh",
              "        local force_remove=false\n",
              "        local force_remove=false removal_failed=false\n",
              "break-glass removal state",
          )
          replace_once(
              "utilities/setup-secrets.sh",
              "                log_warn \"Failed to remove sudoers file: $sudoers_file — manual removal required\"\n",
              "                log_error \"Failed to remove sudoers file: $sudoers_file — manual removal required\"\n                removal_failed=true\n",
              "sudoers removal failure",
          )
          replace_once(
              "utilities/setup-secrets.sh",
              "            systemctl stop vw-breakglass-cleanup.timer 2>/dev/null || true\n            log_info \"Stopped pending systemd transient cleanup timer (vw-breakglass-cleanup)\"\n",
              "            if systemctl stop vw-breakglass-cleanup.timer >/dev/null 2>&1; then\n                log_info \"Stopped pending systemd transient cleanup timer (vw-breakglass-cleanup)\"\n            else\n                log_error \"Failed to stop pending break-glass cleanup timer\"\n                removal_failed=true\n            fi\n",
              "break-glass timer stop failure",
          )
          replace_once(
              "utilities/setup-secrets.sh",
              "            log_warn \"User removal may have had issues (user might not have had home directory)\"\n",
              "            log_error \"Failed to remove break-glass user: $BREAKGLASS_USER\"\n            removal_failed=true\n",
              "break-glass userdel failure",
          )
          replace_once(
              "utilities/setup-secrets.sh",
              "        log_success \"Break-glass admin removal completed\"\n        _notify_breakglass_event \"REMOVED\" \"User $BREAKGLASS_USER and sudoers file /etc/sudoers.d/vw-emergency removed\" \"INFO\"\n",
              "        if [[ \"$removal_failed\" == \"true\" ]]; then\n            log_error \"Break-glass admin removal is incomplete; manual remediation is required.\"\n            _notify_breakglass_event \"REMOVE_FAILED\" \"Automatic removal of $BREAKGLASS_USER or its break-glass artifacts was incomplete\" \"CRITICAL\"\n            return 1\n        fi\n\n        log_success \"Break-glass admin removal completed\"\n        _notify_breakglass_event \"REMOVED\" \"User $BREAKGLASS_USER and sudoers file /etc/sudoers.d/vw-emergency removed\" \"INFO\"\n",
              "truthful break-glass removal receipt",
          )
          replace_once(
              "lib/secrets.sh",
              "# avoiding the non-TTY -p behavior that differs between 7z and upstream 7zz.\n",
              "# avoiding non-TTY -p behavior while keeping passphrases out of process argv.\n",
              "retired 7z compatibility comment",
          )
          replace_once(
              "utilities/secrets-edit.sh",
              "# Known forking editors that return before the user has saved.\n_FORKING_EDITORS=(\"gvim\" \"mvim\" \"code\" \"atom\" \"subl\" \"sublime_text\" \"gedit\" \"kate\" \"mousepad\")\n\n",
              "",
              "dead editor registry",
          )
          replace_once(
              "utilities/secrets-edit.sh",
              "# Warn when the selected editor is known to fork.\n",
              "# Reject known GUI editors unless configured to block until save/close.\n",
              "editor gate comment",
          )

          p = Path("tests/suites/security/case-secrets.bash")
          text = p.read_text()
          source_anchor = "! grep -Fq 'Proceeding anyway' utilities/secrets-edit.sh || fail \"forking editor still warns and continues\"\n"
          source_add = (
              "! grep -Fq '_FORKING_EDITORS=' utilities/secrets-edit.sh || fail \"dead forking-editor registry remains\"\n"
              "! grep -Fq 'differs between 7z and upstream 7zz' lib/secrets.sh || fail \"retired 7z compatibility wording remains\"\n"
              "grep -Fq \"printf '%b\\\\n' \\\"Expiry:\" utilities/setup-secrets.sh || fail \"break-glass expiry output format is malformed\"\n"
          )
          if text.count(source_anchor) != 1:
              raise SystemExit("source regression anchor not unique")
          text = text.replace(source_anchor, source_anchor + source_add, 1)

          behavior_anchor = "BREAKGLASS_ROLLBACK_TEST\n\n# Direct configure uses its installed TERM trap to clean the owned workspace.\n"
          behavior_lines = [
              "BREAKGLASS_ROLLBACK_TEST",
              "",
              "# Removal must report a real failure when the account cannot be deleted; creation",
              "# rollback relies on this status to avoid claiming emergency access was removed.",
              "breakglass_remove_source=\"$(",
              "  sed -n '/^    remove_breakglass_user() {$/,/^    }$/p' utilities/setup-secrets.sh \\",
              "    | sed 's/^    //'",
              ")\"",
              "[[ -n \"$breakglass_remove_source\" ]] || fail \"break-glass removal helper could not be extracted\"",
              "BREAKGLASS_REMOVE_SOURCE=\"$breakglass_remove_source\" bash -s <<'BREAKGLASS_REMOVE_FAILURE_TEST' \\",
              "  || fail \"break-glass removal failure truthfulness regression failed\"",
              "set -euo pipefail",
              "DRY_RUN=false",
              "FORCE=true",
              "BREAKGLASS_USER=vw-test",
              "log_info() { :; }",
              "log_warn() { :; }",
              "log_error() { :; }",
              "log_success() { :; }",
              "_notify_breakglass_event() { :; }",
              "check_user_exists() { return 0; }",
              "systemctl() { return 1; }",
              "userdel() { return 73; }",
              "rm() {",
              "  [[ \" $* \" == *' /etc/sudoers.d/vw-emergency '* ]] && return 0",
              "  command rm \"$@\"",
              "}",
              "eval \"$BREAKGLASS_REMOVE_SOURCE\"",
              "set +e",
              "remove_breakglass_user --force >/dev/null 2>&1",
              "rc=$?",
              "set -e",
              "(( rc != 0 ))",
              "BREAKGLASS_REMOVE_FAILURE_TEST",
              "",
              "# Direct configure uses its installed TERM trap to clean the owned workspace.",
              "",
          ]
          behavior_add = "\n".join(behavior_lines)
          if text.count(behavior_anchor) != 1:
              raise SystemExit("behavior regression anchor not unique")
          text = text.replace(behavior_anchor, behavior_add, 1)
          p.write_text(text)
          PY

          git rm .github/workflows/pr7-pass1-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utilities/setup-secrets.sh lib/secrets.sh utilities/secrets-edit.sh tests/suites/security/case-secrets.bash
          git commit -m 'fix: make break-glass cleanup failures truthful'
          test -z "$(git status --porcelain)"
          git diff --check origin/delta...HEAD
      - name: Install validation dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3-yaml 7zip age sqlite3 coreutils tar
      - name: Validate exact clean HEAD
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --check origin/delta...HEAD
          for f in lib/crypto.sh lib/secrets.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh tests/suites/security/case-secrets.bash; do bash -n "$f"; done
          shellcheck -e SC1090,SC1091,SC2016,SC2153,SC2317 lib/crypto.sh lib/secrets.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh
      - name: Focused security tests on exact HEAD
        run: |
          sudo env VW_TEST_CASE_MODE=sensitive-cleanup bash tests/suites/security/case-secrets.bash
          sudo env VW_TEST_CASE_MODE=core bash tests/suites/security/case-secrets.bash
      - name: Full suite on exact HEAD
        run: ./tests/run-tests.sh all
      - name: Noble systemd acceptance
        run: |
          set -euo pipefail
          unit="vw-pr7-pass1-${GITHUB_RUN_ID}"
          marker="/run/${unit}.done"
          cleanup() {
            sudo systemctl stop "${unit}.timer" "${unit}.service" >/dev/null 2>&1 || true
            sudo rm -f -- "$marker"
          }
          trap cleanup EXIT
          sudo systemd-run --quiet --collect --on-active=3s --unit="$unit" \
            --description='VaultWarden PR7 post-review timer acceptance' \
            -- /usr/bin/env bash -c "umask 077; printf '%s\\n' fired > '$marker'"
          sudo systemctl is-active --quiet "${unit}.timer"
          for _ in $(seq 1 20); do sudo test -f "$marker" && break; sleep 1; done
          sudo grep -Fxq fired "$marker"
      - name: Push only validated final head
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:pr7-sensitive-workspace-sops-hardening
