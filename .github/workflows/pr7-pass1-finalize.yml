name: PR7 post-review finalize
on:
  pull_request:
    branches:
      - delta
permissions:
  contents: write
jobs:
  finalize:
    if: github.head_ref == 'pr7-sensitive-workspace-sops-hardening'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: pr7-sensitive-workspace-sops-hardening
          fetch-depth: 0
      - name: Build corrected clean commit locally
        run: |
          set -euo pipefail
          printf '%s' '   ...' | base64 -d > /tmp/pr7-pass1-fix.py
          python3 /tmp/pr7-pass1-fix.py
          rm -f /tmp/pr7-pass1-fix.py
          git rm .github/workflows/pr7-pass1-finalize.yml
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utilities/setup-secrets.sh lib/secrets.sh utilities/secrets-edit.sh utilities/key-rotate.sh tests/suites/security/case-secrets.bash
          git commit -m 'fix: make break-glass cleanup failures truthful'
          test -z "$(git status --porcelain)"
          git diff --check origin/delta...HEAD
      - name: Install validation dependencies
        run: sudo apt-get update -qq && sudo apt-get install -y shellcheck python3-yaml 7zip age sqlite3 coreutils tar
      - name: Validate exact clean HEAD
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git diff --check origin/delta...HEAD
          for f in lib/crypto.sh lib/secrets.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh tests/suites/security/case-secrets.bash; do bash -n "$f"; done
          shellcheck -e SC1090,SC1091,SC2016,SC2153,SC2317 lib/crypto.sh lib/secrets.sh setup.sh utilities/setup-secrets.sh utilities/setup-system.sh utilities/secrets-edit.sh utilities/secrets-view.sh utilities/secrets-rotate.sh utilities/secrets-export-recovery-kit.sh utilities/key-rotate.sh
      - name: Focused security tests on exact HEAD
        run: |
          sudo env VW_TEST_CASE_MODE=sensitive-cleanup bash tests/suites/security/case-secrets.bash
          sudo env VW_TEST_CASE_MODE=core bash tests/suites/security/case-secrets.bash
      - name: Full suite on exact HEAD
        run: ./tests/run-tests.sh all
      - name: Noble systemd acceptance
        run: |
          set -euo pipefail
          unit="vw-pr7-pass1-${GITHUB_RUN_ID}"
          marker="/run/${unit}.done"
          cleanup() {
            sudo systemctl stop "${unit}.timer" "${unit}.service" >/dev/null 2>&1 || true
            sudo rm -f -- "$marker"
          }
          trap cleanup EXIT
          sudo systemd-run --quiet --collect --on-active=3s --unit="$unit" \
            --description='VaultWarden PR7 post-review timer acceptance' \
            -- /usr/bin/env bash -c "umask 077; printf '%s\\n' fired > '$marker'"
          sudo systemctl is-active --quiet "${unit}.timer"
          for _ in $(seq 1 20); do sudo test -f "$marker" && break; sleep 1; done
          sudo grep -Fxq fired "$marker"
      - name: Push only validated final head
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain)"
          git push origin HEAD:pr7-sensitive-workspace-sops-hardening
