name: Temporary PR 291 manual squash

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-pr291-manual-squash.yml'

permissions:
  contents: write

jobs:
  squash-to-delta:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: delta
          fetch-depth: 0

      - name: Create one exact squash commit
        shell: bash
        run: |
          set -euo pipefail
          clean_head='9c8298f0158f3fb6ce7e2da8d2c31e06b9d5c2d6'
          expected_delta='6d7451558558e82c2d2553b93beb52378f86e481'

          test "$(git rev-parse HEAD)" = "$expected_delta"
          git fetch origin "$clean_head"
          test "$(git rev-parse FETCH_HEAD)" = "$clean_head"

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git merge --squash "$clean_head"

          cat > /tmp/expected-files <<'EOF'
          Makefile
          dashboard.sh
          docs/COMMAND-REFERENCE.md
          docs/OPERATIONS.md
          systemd/vaultwarden-health.service
          tests/suites/foundation/case-systemd.bash
          tests/suites/operations/case-firewall-update.bash
          tests/suites/operations/case-operations.bash
          tests/suites/operations/case-operator-ui.bash
          tests/suites/security/case-security-privileges.bash
          utilities/maintenance-health.sh
          EOF
          git diff --cached --name-only | sort > /tmp/actual-files
          sort -o /tmp/expected-files /tmp/expected-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --cached --check

          git commit -m 'Implement quick health and exit contract (#291)'
          git diff --quiet "$clean_head" HEAD
          git push origin HEAD:delta
