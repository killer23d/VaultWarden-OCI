name: PR10 BusyBox Safe Migration

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr10-platform-simplification
          fetch-depth: 0

      - name: Make BusyBox removal migration-safe
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected one match, found {count}: {old!r}")
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'utilities/setup-env.sh',
              "               grep -qE '^POSTFIX_VERSION=latest'     \"$env_file\" && \\\n               ! grep -qE '^BUSYBOX_VERSION='         \"$env_file\" && \\\n               ! grep -qE '^CADDY_VERSION=latest'     \"$env_file\" && \\\n",
              "               grep -qE '^POSTFIX_VERSION=latest'     \"$env_file\" && \\\n               ! grep -qE '^CADDY_VERSION=latest'     \"$env_file\" && \\\n",
          )
          replace_once(
              'utilities/setup-env.sh',
              "            if ! grep -qE '^(VAULTWARDEN|CADDY|POSTFIX|CROWDSEC|CF_WORKER_BOUNCER|FIREWALL_BOUNCER)_VERSION=latest' \"$env_file\" && \\\n               ! grep -qE '^BUSYBOX_VERSION=' \"$env_file\"; then\n                versions_match=true\n            fi\n",
              "            grep -qE '^(VAULTWARDEN|CADDY|POSTFIX|CROWDSEC|CF_WORKER_BOUNCER|FIREWALL_BOUNCER)_VERSION=latest' \"$env_file\" \\\n                || versions_match=true\n",
          )
          replace_once(
              'tests/suites/foundation/case-runner-contracts.bash',
              "! grep -Fq 'BUSYBOX_VERSION=latest' utilities/setup-env.sh \\\n    || fail 'setup-env must not render or require mutable BusyBox version state'\ngrep -Fq \"! grep -qE '^BUSYBOX_VERSION='\" utilities/setup-env.sh \\\n    || fail 'setup-env must keep a legacy-key absence check so stale .env files are regenerated'\n",
              "! grep -Fq 'BUSYBOX_VERSION' utilities/setup-env.sh \\\n    || fail 'setup-env must not own the removed BusyBox production version surface'\n",
          )
          PY

      - name: Validate migration-safe cleanup
        run: |
          bash -n utilities/setup-env.sh tests/suites/foundation/case-runner-contracts.bash
          VW_TEST_CASE_MODE=repository-interface bash tests/suites/foundation/case-runner-contracts.bash
          ! grep -Fn -- 'BUSYBOX_VERSION' utilities/setup-env.sh
          git diff --check

      - name: Commit migration-safe cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utilities/setup-env.sh tests/suites/foundation/case-runner-contracts.bash
          git commit -m "fix: keep BusyBox cleanup migration-safe"
          git push origin HEAD:agent/pr10-platform-simplification
