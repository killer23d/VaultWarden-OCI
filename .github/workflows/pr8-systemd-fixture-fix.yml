name: PR8 systemd authority fixture fix
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Update systemd fixture authority
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/foundation/case-systemd.bash')
          text = p.read_text()
          old = '    mkdir -p "$repo/secrets/keys"\n'
          new = '    mkdir -p "$repo" "$state/config"\n'
          if text.count(old) != 1:
              raise SystemExit(f'fixture mkdir expected once, got {text.count(old)}')
          text = text.replace(old, new)
          anchor = '    chmod 600 "$repo/.env"\n'
          runtime = '''    cat > "$state/config/install.env" <<EOF_RUNTIME\nDOMAIN=https://systemd-inventory.example.test\nADMIN_EMAIL=admin@example.test\nPROJECT_STATE_DIR=$state\nDATA_VOLUME_DEVICE=\nDATA_VOLUME_MOUNT=$state\nSOPS_AGE_KEY_FILE=/etc/vaultwarden/age-key.txt\nEOF_RUNTIME\n    chmod 600 "$state/config/install.env"\n'''
          if text.count(anchor) != 1:
              raise SystemExit('repo env chmod anchor mismatch')
          text = text.replace(anchor, anchor + runtime)
          old_key = '''    cat > "$repo/secrets/keys/age-key.txt" <<'EOF_KEY'\n# public key: age1systemdinventory0000000000000000000000000000000000000\nAGE-SECRET-KEY-1SYSTEMDINVENTORY\nEOF_KEY\n    chmod 600 "$repo/secrets/keys/age-key.txt"\n'''
          if text.count(old_key) != 1:
              raise SystemExit(f'legacy checkout-key fixture expected once, got {text.count(old_key)}')
          p.write_text(text.replace(old_key, ''))
          PY
          bash -n tests/suites/foundation/case-systemd.bash
          shellcheck -x --severity=warning tests/suites/foundation/case-systemd.bash
          bash tests/suites/foundation/case-systemd.bash
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-systemd-fixture-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: give systemd fixtures runtime authority'
          git push origin HEAD:pr8-runtime-authority-age-custody
