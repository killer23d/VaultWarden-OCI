name: Publish PR 280 removal state fix
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-remove-snapshot.yml'
permissions:
  contents: write
jobs:
  publish:
    name: Verify and publish removal state fix
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Verify exact patch and publish focused commits
        shell: bash
        run: |
          set -euo pipefail
          reviewed='2ba76452e66a28432c112a71873987385692ac13'
          branch='codex/small-team-runtime-remediation'
          staging_sha="$(git rev-parse HEAD)"

          git merge-base --is-ancestor "$reviewed" "$staging_sha"
          unexpected="$(git diff --name-only "$reviewed".."$staging_sha" | grep -Ev '^(\.github/workflows/pr280-remove-snapshot\.yml|\.pr280-remove-fix-[0-9][0-9]\.patch)$' || true)"
          if [[ -n "$unexpected" ]]; then
            echo 'Unexpected branch changes appeared during staging:' >&2
            printf '%s\n' "$unexpected" >&2
            exit 1
          fi

          echo '333c056e0389889ebb8d5596a93464db5e6faa7d76778df29d5876d3e942716d  .pr280-remove-fix-00.patch' | sha256sum --check
          echo 'a7029da0c695951e9bad238021be36675fcbacee563f70c380c13ed03c2ac702  .pr280-remove-fix-01.patch' | sha256sum --check
          cat .pr280-remove-fix-*.patch > /tmp/pr280-remove-fix.patch.b64
          base64 --decode /tmp/pr280-remove-fix.patch.b64 > /tmp/pr280-remove-fix.patch
          echo 'fa071055d0558bcf01d1417595e8031b7baf957d1ed6a4418dd3eaa06713fa0f  /tmp/pr280-remove-fix.patch' | sha256sum --check
          git apply --check /tmp/pr280-remove-fix.patch
          git apply /tmp/pr280-remove-fix.patch

          rm -f .pr280-remove-fix-*.patch .github/workflows/pr280-remove-snapshot.yml

          git diff --check
          find . \
            -path './.git' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) \
            -print0 | xargs -0 -n1 bash -n
          find . \
            -path './.git' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) \
            -print0 | xargs -0 shellcheck -x --severity=warning
          docker compose \
            --env-file .env.example \
            -f docker-compose.yml.example \
            config --quiet
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --exit-code -- docs/COMMAND-REFERENCE.md
          python3 utilities/verify-production-readiness-remediation.py
          TERM=xterm timeout 120 bash tests/suites/foundation/case-systemd.bash
          ./tests/run-tests.sh foundation
          ./tests/run-tests.sh security
          ./tests/run-tests.sh operations
          ./tests/run-tests.sh data-protection

          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'

          git add utilities/setup-systemd.sh
          git commit -m 'fix systemd removal state handling'

          git add tests/suites/foundation/case-systemd.bash
          git commit -m 'test systemd removal state failures'

          git add -A -- .github/workflows/pr280-remove-snapshot.yml \
            .pr280-remove-fix-00.patch .pr280-remove-fix-01.patch
          git commit -m 'remove PR 280 removal staging artifacts'

          git diff --exit-code
          mapfile -t final_files < <(git diff --name-only "$reviewed"..HEAD | sort)
          expected_files=(
            tests/suites/foundation/case-systemd.bash
            utilities/setup-systemd.sh
          )
          [[ "${final_files[*]}" == "${expected_files[*]}" ]] || {
            printf 'Unexpected final changed files:\n%s\n' "${final_files[*]}" >&2
            exit 1
          }
          test "$(git show HEAD:.github/workflows/doc-drift.yml | git hash-object --stdin)" = '2f7f27cdb5ce9d578ad215f51f0b32ac6210b8e3'
          test ! -e .github/workflows/pr280-remove-snapshot.yml
          if find . -maxdepth 1 -name '.pr280-remove-fix-*.patch' -print -quit | grep -q .; then
            echo 'Temporary patch fragments leaked into final tree.' >&2
            exit 1
          fi

          git fetch origin "$branch"
          remote_sha="$(git rev-parse "origin/$branch")"
          [[ "$remote_sha" == "$staging_sha" ]] || {
            echo "Remote branch advanced during validation: $remote_sha" >&2
            exit 1
          }
          git push origin "HEAD:refs/heads/$branch"
