name: Temporary PR 291 firewall test alignment

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-pr291-firewall-test.yml'
      - '.github/tmp-pr291-firewall-test.patch'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply test alignment
        shell: bash
        run: |
          echo '83d685b41f3ccf767b27367d35e5c511f020e92dcf8d771e5b724cec8cfd7c33  .github/tmp-pr291-firewall-test.patch' | sha256sum --check
          git apply .github/tmp-pr291-firewall-test.patch
          rm -f .github/tmp-pr291-firewall-test.patch
          rm -f .github/workflows/tmp-pr291-firewall-test.yml
          git diff --check

      - name: Validate firewall sandbox contract
        shell: bash
        run: |
          bash -n tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning tests/suites/operations/case-firewall-update.bash
          bash tests/suites/operations/case-firewall-update.bash

      - name: Commit validated test alignment
        shell: bash
        run: |
          git diff --check
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Align CrowdSec sandbox regression test'
          git push origin HEAD:fix/health-quick-exit-contract
