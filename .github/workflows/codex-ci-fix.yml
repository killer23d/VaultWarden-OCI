name: Apply Caddy CI fixes

on:
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply bounded CI fixes
        run: python3 .github/codex_ci_fix.py
      - name: Compile patched tree
        run: python3 -m compileall -q vaultwarden_oci tests/v2
      - name: Commit implementation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultwarden_oci/runtime.py vaultwarden_oci/cli.py tests/v2/test_edge_blockers.py tests/v2/test_vwctl.py
          git commit -m "Fix Caddy edge CI integration findings"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
