name: PR4 exact UFW fix

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-exactness]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Apply exact conflict handling and validate
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 .pr4-exactness-patch.py
          bash -n utilities/setup-firewall.sh utilities/maintenance-update-firewall.sh tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning utilities/setup-firewall.sh utilities/maintenance-update-firewall.sh tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
          git add utilities/setup-firewall.sh utilities/maintenance-update-firewall.sh tests/suites/operations/case-firewall-update.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: enforce exact Cloudflare ingress [skip pr4-exactness]'
          git push origin HEAD:pr4-firewall-exactness
