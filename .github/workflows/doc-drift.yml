name: Doc Drift Check
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.pr280-final-*'
      - '.pr280-patch-*'
      - '.pr280-shellcheck-fix.patch'
      - '.pr280-root-fixture-fix.patch'
      - '.pr280-call-log-owner-fix.patch'
      - '.pr280-systemd-root-read-fix.patch'
      - '.pr280-systemd-shellcheck-fix.patch'
      - 'AGENTS.md'
      - 'caddy/**'
      - 'docs/**'
      - 'README.md'
      - 'RUNBOOK.md'
      - 'utilities/**'
      - 'lib/**'
      - '*.sh'
      - 'Makefile'
      - 'systemd/**'
      - 'tests/**'
      - 'secrets-schema.yaml'
      - '.env.example'
      - 'docker-compose.yml.example'
      - '.gitignore'
permissions:
  contents: read
jobs:
  apply-pr280-remediation:
    name: Apply verified PR 280 remediation
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install focused validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Verify, apply, and validate bounded patch
        shell: bash
        run: |
          set -euo pipefail
          cat .pr280-final-* > /tmp/pr280-final.patch.b64
          echo "a9c85c13953263e2bca80cde5851d898c149219fd2fed3a597063b06f098cafc  /tmp/pr280-final.patch.b64" | sha256sum --check
          base64 --decode /tmp/pr280-final.patch.b64 > /tmp/pr280-final.patch
          echo "05fce1a200fd57ec518e4199a2b971c633f1451b18fc36bcc163cc3a894f1d99  /tmp/pr280-final.patch" | sha256sum --check
          echo "60dd20cde0747106c6f6c04a44b5c25b1b95f5d698428a8d2276ed6893eae131  .pr280-shellcheck-fix.patch" | sha256sum --check
          echo "4d32201bd3acacb00d8b8a85c8e6bf147359945680e0d9e21457a6bd707b18d0  .pr280-root-fixture-fix.patch" | sha256sum --check
          echo "77763bfbdc80ef7dc6b185719cbe19a7ac966fe3ca99d8afba0bbf834304c13d  .pr280-call-log-owner-fix.patch" | sha256sum --check
          echo "b067c49026b18e0b601150326ceaa9f15ef0b32210c302ea3b71e66f6e1119e9  .pr280-systemd-root-read-fix.patch" | sha256sum --check
          echo "3f47b42ac9a330d474e77e129e9768b62afeb35e6299339894c2e8eeb8c09a16  .pr280-systemd-shellcheck-fix.patch" | sha256sum --check
          git apply --check /tmp/pr280-final.patch
          git apply /tmp/pr280-final.patch
          for patch in .pr280-shellcheck-fix.patch .pr280-root-fixture-fix.patch .pr280-call-log-owner-fix.patch .pr280-systemd-root-read-fix.patch .pr280-systemd-shellcheck-fix.patch; do
            git apply --check "$patch"
            git apply "$patch"
          done
          git diff --check
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n1 bash -n
          shellcheck -x --severity=warning lib/crypto.sh startup.sh utilities/setup-systemd.sh tests/suites/foundation/case-config-env.bash tests/suites/foundation/case-systemd.bash tests/suites/security/case-secrets.bash
          bash tests/suites/foundation/case-systemd.bash
          bash tests/suites/security/case-secrets.bash
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          git diff --exit-code -- docs/COMMAND-REFERENCE.md
      - name: Restore workflow and commit clean final tree
        shell: bash
        run: |
          set -euo pipefail
          git show f273e7b97d4d66d51c8ddeb8c6de51e191aefd05^:.github/workflows/doc-drift.yml > .github/workflows/doc-drift.yml
          rm -f .pr280-final-* .pr280-patch-* .pr280-shellcheck-fix.patch .pr280-root-fixture-fix.patch .pr280-call-log-owner-fix.patch .pr280-systemd-root-read-fix.patch .pr280-systemd-shellcheck-fix.patch .github/workflows/pr280-apply.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "complete small-team runtime remediation"
          git push origin HEAD:codex/small-team-runtime-remediation
