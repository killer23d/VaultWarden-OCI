name: Doc Drift Check
# Temporary bootstrap; the published commit restores the permanent workflow.

on:
  push:
    branches:
      - refactor/single-lock-ownership
  pull_request:
    types:
      - reopened
    branches:
      - delta

permissions:
  contents: write

jobs:
  bootstrap-global-health-coordination:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Verify bounded staging state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 2f8ec8c5b3379433881149f4961af1ac706fce18 HEAD
          expected=$'.github/health-global-transform.py.gz.b64\n.github/workflows/doc-drift.yml\n.github/workflows/finalize-health-global-coordination.yml\n.github/workflows/finalize-health-global-rescue.yml'
          actual="$(git diff --name-only 2f8ec8c5b3379433881149f4961af1ac706fce18...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected bootstrap staging diff:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml

          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Restore workflow and apply reviewed transform
        shell: bash
        run: |
          set -euo pipefail
          git show 2f8ec8c5b3379433881149f4961af1ac706fce18:.github/workflows/doc-drift.yml \
            > .github/workflows/doc-drift.yml
          base64 -d .github/health-global-transform.py.gz.b64 | gzip -d \
            > /tmp/health-global-transform.py
          python3 /tmp/health-global-transform.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/doc-drift.yml')
          path.write_text(path.read_text().rstrip() + '\n')
          PY
          rm -f -- \
            .github/health-global-transform.py.gz.b64 \
            .github/workflows/finalize-health-global-coordination.yml \
            .github/workflows/finalize-health-global-rescue.yml

          git diff --check
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          python3 - <<'PY'
          import yaml
          with open('.github/workflows/doc-drift.yml', encoding='utf-8') as handle:
              yaml.safe_load(handle)
          PY

      - name: Validate focused changes
        shell: bash
        run: |
          set -euo pipefail
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash
          ./tests/run-tests.sh operations

      - name: Verify final scope and publish
        shell: bash
        run: |
          set -euo pipefail
          expected=$'.github/workflows/doc-drift.yml\nlib/operations.sh\nsystemd/vaultwarden-health.service\ntests/suites/foundation/case-systemd.bash\ntests/suites/operations/case-health-alerts.bash\ntests/suites/operations/case-lock-fd-hygiene.bash\ntests/suites/operations/case-operations.bash\nutilities/maintenance-health.sh\nutilities/setup-systemd.sh'
          actual="$(git diff --name-only 1ff4f908866de7a917c37fa37147981d238af28f | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected final PR scope:\n%s\n' "$actual" >&2
            exit 1
          }
          test ! -e .github/health-global-transform.py.gz.b64
          test ! -e .github/workflows/finalize-health-global-coordination.yml
          test ! -e .github/workflows/finalize-health-global-rescue.yml
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Make health coordination cross-identity safe'
          git push origin HEAD:refactor/single-lock-ownership
