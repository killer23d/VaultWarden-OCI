name: Doc Drift Check
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - '.pr280-patch-*'
permissions:
  contents: read
jobs:
  diagnose-patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Check patch fragment sizes and hashes
        run: |
          set -euo pipefail
          wc -c .pr280-patch-*
          sha256sum .pr280-patch-*
          cat .pr280-patch-* > /tmp/pr280.patch.b64
          wc -c /tmp/pr280.patch.b64
          base64 --decode --ignore-garbage /tmp/pr280.patch.b64 > /tmp/pr280.patch
          wc -c /tmp/pr280.patch
          git apply --check /tmp/pr280.patch
