name: Doc Drift Check
on:
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'docs/**'
      - 'README.md'
      - 'RUNBOOK.md'
      - 'utilities/**'
      - 'lib/**'
      - '*.sh'
      - 'Makefile'
      - 'systemd/**'
      - 'tests/**'
      - 'secrets-schema.yaml'
      - '.env.example'
      - 'docker-compose.yml.example'
      - '.gitignore'

# Global permissions
permissions:
  contents: read

jobs:
  doc-drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # yq is required by lib/schema.sh (used by secrets-rotate.sh --help and
      # write-command-reference.sh). Installing it here ensures the generated
      # COMMAND-REFERENCE.md is identical to what was committed (which was
      # produced on a machine that had yq installed).
      #
      # NOTE: 'apt-get install yq' installs python-yq (a jq wrapper), NOT the
      # mikefarah/yq Go binary. lib/schema.sh uses mikefarah yq syntax
      # (e.g. 'yq eval'), so we must install the correct binary directly.
      - name: Install yq
        run: |
          # Pinned to v4.53.3 — do NOT change to /releases/latest (violates
          # the unpinned-version check this same workflow enforces).
          # To upgrade: update YQ_VERSION and YQ_SHA256 together.
          # SHA-256 source: https://github.com/mikefarah/yq/releases/tag/v4.53.3
          # (asset: yq_linux_amd64, digest field)
          YQ_VERSION="v4.53.3"
          YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          yq --version

      - name: Check for known stale terms
        run: |
          STALE_TERMS=(
            "simple_key_resilience.sh"
            "--quick-verify"
            "cs-cloudflare-bouncer"
            "make logs FOLLOW=true"
            "--puid"
            "--pgid"
            "simple_verify_age_key"
          )
          FAIL=0
          for term in "${STALE_TERMS[@]}"; do
            matches=$(grep -rn "$term" docs/ README.md RUNBOOK.md 2>/dev/null || true)
            if [[ -n "$matches" ]]; then
              echo "STALE TERM FOUND: $term"
              echo "$matches"
              FAIL=1
            fi
          done
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Verify Makefile targets referenced in docs exist
        run: |
          FAIL=0
          while IFS= read -r target; do
            if ! grep -q "^${target}:" Makefile; then
              echo "MISSING MAKEFILE TARGET referenced in docs: make $target"
              FAIL=1
            fi
          done < <(grep -roh 'make [a-z_-]\+' docs/ README.md RUNBOOK.md | sed 's/make //' | sort -u)
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Verify script flags referenced in docs exist
        run: |
          check_flag() {
            local script="$1" flag="$2"
            if ! grep -q -- "$flag" "$script" 2>/dev/null; then
              echo "FLAG NOT FOUND: $flag in $script (referenced in docs)"
              return 1
            fi
          }
          FAIL=0
          check_flag utilities/backup-run.sh "--full-verification" || FAIL=1
          check_flag utilities/maintenance-update.sh "--images"     || FAIL=1
          check_flag utilities/maintenance-update.sh "--system"     || FAIL=1
          check_flag utilities/maintenance-update.sh "--all"        || FAIL=1
          check_flag setup.sh "--force"                             || FAIL=1
          check_flag utilities/uninstall-vaultwarden.sh "--dry-run" || FAIL=1
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Check for unpinned version references
        run: |
          FAIL=0
          # setup-crowdsec.sh may use @latest only when --use-latest clears the
          # configured pin. All other shell scripts must remain reproducible.
          if grep -rn '@latest' utilities/ lib/ --include='*.sh' \
               | grep -v 'utilities/setup-crowdsec.sh'; then
            echo "UNPINNED: @latest Go reference found outside setup-crowdsec.sh"
            FAIL=1
          fi
          # Guard against unintended /releases/latest calls in any OTHER script
          # under utilities/ — setup-crowdsec.sh legitimately uses the endpoint
          # when no version pin is configured (runtime-guarded by USE_LATEST /
          # empty CF_WORKER_BOUNCER_VERSION), so it is excluded here.
          if grep -n '/releases/latest' setup.sh 2>/dev/null; then
            echo "UNPINNED: /releases/latest GitHub API call found in setup.sh"
            FAIL=1
          fi
          if grep -Eq '^(CROWDSEC_VERSION|CF_WORKER_BOUNCER_VERSION|FIREWALL_BOUNCER_VERSION)=latest$' .env.example; then
            echo "UNPINNED: CrowdSec component version in .env.example"
            FAIL=1
          fi
          [[ $FAIL -eq 0 ]] || exit 1

      - name: Systemd unit hardening check
        run: |
          REQUIRED_DIRECTIVES=(PrivateTmp ProtectSystem ProtectHome NoNewPrivileges)
          FAIL=0
          for unit in systemd/vaultwarden-*.service; do
            [[ "$unit" == *template* ]] && continue
            for directive in "${REQUIRED_DIRECTIVES[@]}"; do
              [[ "$unit" == *iptables* ]] && [[ "$directive" == "NoNewPrivileges" ]] && continue
              if ! grep -q "^${directive}=" "$unit"; then
                echo "MISSING $directive in $unit"
                FAIL=1
              fi
            done
          done
          [[ $FAIL -eq 0 ]] && echo "All units pass hardening check." || exit 1

      - name: Verify COMMAND-REFERENCE.md is up to date
        env:
          # Suppress the docker.sh Compose-project-label diagnostic that
          # scripts emit to stderr when DOCKER_PROJECT_LABEL is unset.
          # Setting it to a fixed value makes --help output deterministic.
          DOCKER_PROJECT_LABEL: ci
        run: |
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          if ! diff -q docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md > /dev/null 2>&1; then
            echo "COMMAND-REFERENCE.md is stale. Run: make docs"
            diff docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md || true
            exit 1
          fi
          echo "COMMAND-REFERENCE.md is up to date."

  shellcheck:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run Strict Shellcheck
        run: |
          # -x: follow source statements to avoid SC1091 false positives.
          # --severity=warning: fail on warning or error; info/style are logged only.
          find . -type f -name '*.sh' | xargs shellcheck -x --severity=warning

  functional-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils python3-argon2
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.1/sops-v3.13.1.linux.amd64 -o /tmp/sops
          echo "620a9d7e3352ababeca6908cea24a6e8b14ce89a448ddbd3f94f1ef3398f470a  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Run focused tests
        run: |
          ./tests/run-tests.sh all
