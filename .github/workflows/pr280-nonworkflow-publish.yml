name: Publish PR 280 non-workflow tree
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-nonworkflow-publish.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          getent group vaultwarden >/dev/null || sudo groupadd --system vaultwarden
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Validate and publish non-workflow tree
        shell: bash
        run: |
          set -euo pipefail
          wrapper_sha='4536628d96adf793a7a918081800cbce60f0a9f9'
          git show "${wrapper_sha}:.github/workflows/pr280-health-lock.yml" > /tmp/pr280-wrapper.yml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('/tmp/pr280-wrapper.yml').read_text())
          script = next(
              step['run']
              for step in workflow['jobs']['publish']['steps']
              if step.get('name') == 'Validate and publish exact final tree'
          )

          marker = 'bash -e -o pipefail /tmp/pr280-publish.sh'
          if script.count(marker) != 1:
              raise SystemExit(f'wrapper execution marker count is {script.count(marker)}, expected 1')

          handoff = r'''python3 - <<'PY_NONWORKFLOW'
          from pathlib import Path

          path = Path('/tmp/pr280-publish.sh')
          text = path.read_text()

          def replace_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          replace_once(
              "grep -Ev '^(\\.github/workflows/pr280-health-lock\\.yml|\\.pr280-.*)$'",
              "grep -Ev '^(\\.github/workflows/pr280-health-lock\\.yml|\\.github/workflows/pr280-nonworkflow-publish\\.yml|\\.pr280-.*)$'",
              'staging path allowlist',
          )
          replace_once(
              'rm -f .pr280-* .github/workflows/pr280-health-lock.yml',
              'rm -f .pr280-*',
              'temporary artifact removal',
          )
          replace_once(
              'git add -A\ngit commit -m \'complete bounded small-team cleanup\'',
              'git checkout "$staging_sha" -- .github/workflows/doc-drift.yml\ngit add -A\ngit commit -m \'complete bounded small-team cleanup\'',
              'workflow restoration before cleanup commit',
          )
          replace_once(
              "mapfile -t expected_files <<'FILES'\n.github/workflows/doc-drift.yml\n",
              "mapfile -t expected_files <<'FILES'\n.github/workflows/pr280-health-lock.yml\n.github/workflows/pr280-nonworkflow-publish.yml\n",
              'final file whitelist workflow entries',
          )
          replace_once(
              'test ! -e .github/workflows/pr280-health-lock.yml',
              'test -e .github/workflows/pr280-health-lock.yml\ntest -e .github/workflows/pr280-nonworkflow-publish.yml',
              'temporary workflow presence assertions',
          )
          path.write_text(text)
          PY_NONWORKFLOW
          bash -e -o pipefail /tmp/pr280-publish.sh'''

          Path('/tmp/pr280-wrapper-run.sh').write_text(script.replace(marker, handoff, 1) + '\n')
          PY
          bash -e -o pipefail /tmp/pr280-wrapper-run.sh
