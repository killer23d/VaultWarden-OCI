name: Temporary CQA merge-safety export

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Fetch remediation refs
        run: |
          git fetch origin \
            refs/heads/cqa-force-ack:refs/remotes/origin/cqa-force-ack \
            refs/heads/cqa-lock-preparation:refs/remotes/origin/cqa-lock-preparation \
            refs/heads/cqa-root-hints:refs/remotes/origin/cqa-root-hints \
            refs/heads/cqa-readonly-config:refs/remotes/origin/cqa-readonly-config \
            refs/heads/cqa-recovery-guard:refs/remotes/origin/cqa-recovery-guard \
            refs/heads/cqa-remediation:refs/remotes/origin/cqa-remediation
      - name: Create Git bundle
        run: git bundle create /tmp/vaultwarden-oci-merge-safety.bundle --all
      - name: Upload Git bundle
        uses: actions/upload-artifact@v4
        with:
          name: cqa-merge-safety-source-bundle
          path: /tmp/vaultwarden-oci-merge-safety.bundle
          retention-days: 1
          compression-level: 0
