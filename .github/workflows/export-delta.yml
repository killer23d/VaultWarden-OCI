name: Export delta workspace

on:
  push:
    branches: [codex/phase1-builder]

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: delta
          fetch-depth: 0
      - name: Package repository
        run: |
          tar --exclude=.git -czf /tmp/vaultwarden-oci-delta.tar.gz .
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: vaultwarden-oci-delta
          path: /tmp/vaultwarden-oci-delta.tar.gz
          if-no-files-found: error
          retention-days: 1
