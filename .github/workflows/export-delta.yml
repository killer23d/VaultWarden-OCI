name: Phase 1 implementation builder

on:
  pull_request:
    branches: [codex/phase1-builder]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: codex/phase1-test-runner-records
          fetch-depth: 0
      - name: Apply scoped transformation
        run: |
          set -euo pipefail
          git fetch origin codex/phase1-builder
          git show origin/codex/phase1-builder:.github/phase1-fixed.b64 \
            | base64 -d | gzip -d > /tmp/apply.py
          python3 -m py_compile /tmp/apply.py
          python3 /tmp/apply.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/suites/security/case-secrets.bash')
          text = path.read_text()
          start = '''
          set -euo pipefail

          ROOT="$VW_TEST_REPO_ROOT"
          TMP="$(mktemp -d)"
          TESTS_RUN=0
          OP="age1op00000000000000000000000000000000000000000000000000000000"'''
          end = "\nprintf '1..%s\\n' \"$TESTS_RUN\"\n\ncheck_key_rotate_live_generation_transaction() ("
          call_anchor = '''        check_runtime_secret_reconciliation
                  check_key_rotate_live_generation_transaction'''
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('generated secrets transaction block not found exactly once')
          if text.count(call_anchor) != 2:
              raise SystemExit('generated secrets dispatcher anchors not found exactly twice')
          text = text.replace(start, '\ncheck_setup_secrets_transaction() (' + start, 1)
          text = text.replace(
              end,
              "\nprintf '1..%s\\n' \"$TESTS_RUN\"\n)\n\ncheck_key_rotate_live_generation_transaction() (",
              1,
          )
          text = text.replace(
              call_anchor,
              '''        check_runtime_secret_reconciliation
                  check_setup_secrets_transaction
                  check_key_rotate_live_generation_transaction''',
          )
          path.write_text(text)
          PY
          chmod +x tests/run-tests.sh tests/suites/*/case-*.bash
      - name: Static and smoke validation
        run: |
          set -euo pipefail
          bash -n \
            tests/run-tests.sh \
            tests/suites/foundation/case-runner-contracts.bash \
            tests/suites/foundation/case-config-env.bash \
            tests/suites/foundation/case-storage-setup.bash \
            tests/suites/security/case-secrets.bash \
            tests/suites/operations/case-lifecycle.bash \
            tests/suites/data-protection/case-restore-recovery.bash
          ./tests/run-tests.sh list > /tmp/list.out
          test "$(grep -c '^  ' /tmp/list.out)" -eq 27
          test "$(find tests/suites -type f -name 'case-*.bash' | wc -l | tr -d '[:space:]')" -eq 20
          test -z "$(find tests -maxdepth 1 -type f \( -name 'case-*.bash' -o -name 'test-*.sh' \) -print -quit)"
          for file in \
            tests/suites/foundation/case-runner-contracts.bash \
            tests/suites/foundation/case-config-env.bash \
            tests/suites/foundation/case-storage-setup.bash \
            tests/suites/security/case-secrets.bash \
            tests/suites/operations/case-lifecycle.bash \
            tests/suites/data-protection/case-restore-recovery.bash; do
            set +e
            VW_TEST_CASE_MODE=invalid-mode bash "$file" >/tmp/invalid-mode.out 2>&1
            rc=$?
            set -e
            test "$rc" -eq 2
          done
          VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-runner-contracts.bash
          git diff --check
      - name: Commit implementation
        run: |
          set -euo pipefail
          git add -A
          test "$(git ls-files tests | wc -l | tr -d '[:space:]')" -eq 25
          test "$(git ls-files 'tests/suites/**/case-*.bash' | wc -l | tr -d '[:space:]')" -eq 20
          test -z "$(git ls-files 'tests/test-*.sh')"
          git diff --cached --check
          git config user.name 'OpenAI Codex'
          git config user.email 'codex@openai.com'
          git commit -m 'test: consolidate Phase 1 runner cases'
          git push origin HEAD:codex/phase1-test-runner-records
      - name: Remove temporary branches
        if: success()
        run: |
          set -euo pipefail
          for branch in codex/phase1-executor codex/phase1-executor2 codex/phase1-builder; do
            git push origin --delete "$branch" || true
          done
