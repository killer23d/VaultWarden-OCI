name: PR354 resolver hotfix

on:
  push:
    branches:
      - fix/blank-vm-offline-age-bootstrap-2026-08-27

permissions:
  contents: write

jobs:
  patch:
    if: github.event.head_commit.message == 'Apply PR354 resolver hotfix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Patch resolver and regression
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('vaultwarden_oci/update_versions.py')
          text = source.read_text(encoding='utf-8')
          old = '''_RELEASE_URLS = {
              "vaultwarden": "https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest",
              "caddy": "https://api.github.com/repos/caddyserver/caddy/releases/latest",
              "caddy_dns_cloudflare": "https://api.github.com/repos/caddy-dns/cloudflare/releases/latest",
          }
          _TAG_URLS = {
              "caddy_combine_ip_ranges": "https://api.github.com/repos/fvbommel/caddy-combine-ip-ranges/tags?per_page=1",
              "caddy_ratelimit": "https://api.github.com/repos/mholt/caddy-ratelimit/tags?per_page=1",
          }
          '''
          new = '''_RELEASE_URLS = {
              "vaultwarden": "https://api.github.com/repos/dani-garcia/vaultwarden/releases/latest",
              "caddy": "https://api.github.com/repos/caddyserver/caddy/releases/latest",
          }
          _TAG_URLS = {
              "caddy_dns_cloudflare": "https://api.github.com/repos/caddy-dns/cloudflare/tags?per_page=1",
              "caddy_combine_ip_ranges": "https://api.github.com/repos/fvbommel/caddy-combine-ip-ranges/tags?per_page=1",
              "caddy_ratelimit": "https://api.github.com/repos/mholt/caddy-ratelimit/tags?per_page=1",
          }
          '''
          if old not in text:
              raise SystemExit('expected URL mapping block not found')
          text = text.replace(old, new, 1)

          old = '''    def latest_release(self, component: str) -> str:
              try:
                  url = _RELEASE_URLS[component]
          '''
          new = '''    def latest_release(self, component: str) -> str:
              # caddy-dns/cloudflare publishes version tags but no GitHub Releases.
              if component == "caddy_dns_cloudflare":
                  return self.latest_ref(component)
              try:
                  url = _RELEASE_URLS[component]
          '''
          if old not in text:
              raise SystemExit('expected latest_release block not found')
          text = text.replace(old, new, 1)
          source.write_text(text, encoding='utf-8')

          tests = Path('tests/test_update_workflow.py')
          text = tests.read_text(encoding='utf-8')
          marker = '\n\nclass UpdateTransactionTests(unittest.TestCase):\n'
          regression = '''
              def test_cloudflare_dns_latest_uses_tag_endpoint_not_release_endpoint(self) -> None:
                  calls: list[str] = []

                  def get_json(url: str, headers=None):
                      del headers
                      calls.append(url)
                      return [{"name": "v0.2.4"}]

                  lookup = update_versions.RemoteLookup(get_json=get_json)
                  self.assertEqual(lookup.latest_release("caddy_dns_cloudflare"), "v0.2.4")
                  self.assertEqual(
                      calls,
                      ["https://api.github.com/repos/caddy-dns/cloudflare/tags?per_page=1"],
                  )
                  self.assertNotIn("/releases/latest", calls[0])
          '''
          if marker not in text:
              raise SystemExit('test insertion marker not found')
          if 'test_cloudflare_dns_latest_uses_tag_endpoint_not_release_endpoint' in text:
              raise SystemExit('regression already present')
          text = text.replace(marker, '\n' + regression + marker, 1)
          tests.write_text(text, encoding='utf-8')
          PY

          git diff --check
          python3 -m unittest tests.test_update_workflow.VersionResolutionTests -v

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add vaultwarden_oci/update_versions.py tests/test_update_workflow.py
          git commit -m 'Fix Cloudflare DNS latest tag lookup'
          git push origin HEAD:fix/blank-vm-offline-age-bootstrap-2026-08-27
