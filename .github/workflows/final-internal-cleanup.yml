name: Final internal cleanup
on:
  push:
    branches: [codex/final-operator-manual-normalization]
permissions:
  contents: write
jobs:
  cleanup:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/final-operator-manual-normalization
      - run: python3 .github/scripts/final-internal-cleanup.py
      - run: |
          python3 -m compileall -q vaultwarden_oci tests
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Remove pre-release compatibility surfaces'
          git push origin HEAD:codex/final-operator-manual-normalization
