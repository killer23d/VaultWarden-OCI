name: PR6 finish patch
on:
  push:
    branches:
      - agent/pr6-update-crowdsec-readiness
permissions:
  contents: write
jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr6-update-crowdsec-readiness
      - name: Apply narrow follow-up patches
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              s = p.read_text()
              n = s.count(old)
              if n != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {n}')
              p.write_text(s.replace(old, new, 1))

          replace_once(
              'utilities/maintenance-update.sh',
              '''recreate_update_stack() {
              log_info "Recreating services on the selected image set..."
              if [[ "$DRY_RUN" == "true" ]]; then
                  log_info "[DRY RUN] Would run: docker compose up -d --force-recreate --remove-orphans"
                  return 0
              fi
              ensure_caddy_entrypoint_executable || return 1
              if ! recreate_services; then
                  log_error "Failed to recreate services"
                  return 1
              fi
              log_success "Services recreated"
              return 0
          }

          check_update_readiness() {
          ''',
              '''recreate_update_stack() {
              log_info "Recreating services on the selected image set..."
              if [[ "$DRY_RUN" == "true" ]]; then
                  log_info "[DRY RUN] Would run: docker compose up -d --force-recreate --remove-orphans"
                  return 0
              fi
              ensure_caddy_entrypoint_executable || return 1
              if ! recreate_services; then
                  log_error "Failed to recreate services"
                  return 1
              fi
              log_success "Services recreated"
              return 0
          }

          apply_update_stack() {
              log_info "Applying stack configuration without forcing container recreation..."
              if [[ "$DRY_RUN" == "true" ]]; then
                  log_info "[DRY RUN] Would run: docker compose up -d --remove-orphans"
                  return 0
              fi
              ensure_caddy_entrypoint_executable || return 1
              if ! docker compose up -d --remove-orphans; then
                  log_error "Failed to apply stack configuration"
                  return 1
              fi
              log_success "Stack configuration applied"
              return 0
          }

          check_update_readiness() {
          ''',
              'system-only apply helper')

          replace_once(
              'utilities/maintenance-update.sh',
              '''    else
                  if ! recreate_update_stack || ! check_update_readiness; then
          ''',
              '''    else
                  if ! apply_update_stack || ! check_update_readiness; then
          ''',
              'system-only non-force apply')

          replace_once(
              'README.md',
              '''sudo ./edit-secrets.sh rotate cf_account_id
          sudo ./edit-secrets.sh rotate smtp_password
          ```

          ### 5. Start and verify the live stack
          ''',
              '''sudo ./edit-secrets.sh rotate cf_account_id
          sudo ./edit-secrets.sh rotate smtp_password
          ```

          Configure the required CrowdSec enforcement path after the Cloudflare secrets are set:

          ```bash
          sudo ./utilities/setup-crowdsec.sh --use-latest
          ```

          With `CLOUDFLARE_PROXY_ENABLED=true`, this daemon-backed Workers bouncer path is the normal production golden path. Explicit proxy-disabled or autonomous modes remain advanced alternatives and are not reported as normal production readiness.

          ### 5. Start and verify the live stack
          ''',
              'README golden path')

          replace_once(
              'docs/DEPLOYMENT.md',
              '''sudo ./edit-secrets.sh rotate cf_account_id
          sudo ./edit-secrets.sh rotate smtp_password
          ```

          `cloudflare_zone_id` is a SOPS secret. Do not create a second `CLOUDFLARE_ZONE_ID` `.env` source for the normal deployment path.
          ''',
              '''sudo ./edit-secrets.sh rotate cf_account_id
          sudo ./edit-secrets.sh rotate smtp_password
          ```

          Configure CrowdSec enforcement after those Cloudflare secrets are available:

          ```bash
          sudo ./utilities/setup-crowdsec.sh --use-latest
          ```

          With `CLOUDFLARE_PROXY_ENABLED=true`, the daemon-backed Cloudflare Workers bouncer is part of normal production readiness. Proxy-disabled and autonomous modes remain explicit advanced alternatives; smoke/health do not label them as the normal production-ready path.

          `cloudflare_zone_id` is a SOPS secret. Do not create a second `CLOUDFLARE_ZONE_ID` `.env` source for the normal deployment path.
          ''',
              'deployment golden path')
          PY

          bash -n utilities/maintenance-update.sh utilities/maintenance-health.sh utilities/smoke-test.sh utilities/setup-crowdsec.sh lib/crowdsec.sh lib/crowdsec-worker.sh tests/suites/operations/case-readiness.bash tests/run-tests.sh
          bash tests/suites/operations/case-readiness.bash
          if command -v shellcheck >/dev/null 2>&1; then
            shellcheck -x --severity=warning utilities/maintenance-update.sh utilities/maintenance-health.sh utilities/smoke-test.sh utilities/setup-crowdsec.sh lib/crowdsec.sh lib/crowdsec-worker.sh tests/suites/operations/case-readiness.bash tests/run-tests.sh
          fi
          git diff --check

      - name: Publish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add utilities/maintenance-update.sh README.md docs/DEPLOYMENT.md
          git rm .github/workflows/pr6-self-patch.yml
          git commit -m 'operations: finish readiness golden path'
          git push origin HEAD:agent/pr6-update-crowdsec-readiness
