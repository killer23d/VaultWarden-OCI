name: PR6 final validator
on:
  push:
    branches:
      - agent/pr6-update-crowdsec-readiness
permissions:
  contents: write
jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr6-update-crowdsec-readiness
          fetch-depth: 0
      - name: Apply narrow regression fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          runner = 'tests/suites/foundation/case-runner-contracts.bash'
          for old, new, label in (
              ('[[ "${#REGISTERED_RECORDS[@]}" -eq 29 ]] || fail "real runner listed ${#REGISTERED_RECORDS[@]} records; expected 29"', '[[ "${#REGISTERED_RECORDS[@]}" -eq 30 ]] || fail "real runner listed ${#REGISTERED_RECORDS[@]} records; expected 30"', 'runner logical records'),
              ('[[ "${#REGISTERED_PATHS[@]}" -eq 22 ]] || fail "real runner listed ${#REGISTERED_PATHS[@]} unique physical cases; expected 22"', '[[ "${#REGISTERED_PATHS[@]}" -eq 23 ]] || fail "real runner listed ${#REGISTERED_PATHS[@]} unique physical cases; expected 23"', 'runner physical cases'),
              ('[[ "$(sort -u "$real_files" | wc -l | tr -d \'[:space:]\')" -eq 22 ]] || fail "list-files contains duplicate physical paths"', '[[ "$(sort -u "$real_files" | wc -l | tr -d \'[:space:]\')" -eq 23 ]] || fail "list-files contains duplicate physical paths"', 'runner unique paths'),
              ('[[ "$(grep -c \'^  \' "$list_one")" -eq 29 ]] || fail "fixture list did not preserve 29 logical records"', '[[ "$(grep -c \'^  \' "$list_one")" -eq 30 ]] || fail "fixture list did not preserve 30 logical records"', 'fixture logical records'),
              ('[[ "$(wc -l < "$files_one" | tr -d \'[:space:]\')" -eq 22 ]] || fail "fixture list-files did not preserve 22 unique physical paths"', '[[ "$(wc -l < "$files_one" | tr -d \'[:space:]\')" -eq 23 ]] || fail "fixture list-files did not preserve 23 unique physical paths"', 'fixture physical paths'),
              ('[[ "$(sort -u "$files_one" | wc -l | tr -d \'[:space:]\')" -eq 22 ]] || fail "fixture list-files duplicated a physical path"', '[[ "$(sort -u "$files_one" | wc -l | tr -d \'[:space:]\')" -eq 23 ]] || fail "fixture list-files duplicated a physical path"', 'fixture unique paths'),
              ('[[ "$(find "$FIXTURE_TESTS/suites" -type f -name \'case-*.bash\' | wc -l | tr -d \'[:space:]\')" -eq 22 ]] \\\n    || fail "fixture construction did not create one file per unique physical path"', '[[ "$(find "$FIXTURE_TESTS/suites" -type f -name \'case-*.bash\' | wc -l | tr -d \'[:space:]\')" -eq 23 ]] \\\n    || fail "fixture construction did not create one file per unique physical path"', 'fixture constructed cases'),
          ):
              replace_once(runner, old, new, label)

          crowdsec = 'tests/suites/operations/case-crowdsec.bash'
          replace_once(
              crowdsec,
              'cf_bouncer_install_block="$(awk \'/Attempting apt install of crowdsec-cloudflare-worker-bouncer/,/Installed crowdsec-cloudflare-worker-bouncer via apt/\' "$setup_script")"',
              'cf_bouncer_install_block="$(awk \'/Installing Cloudflare Workers bouncer from the configured CrowdSec package repository/,/Installed crowdsec-cloudflare-worker-bouncer via the CrowdSec package repository/\' "$setup_script")"',
              'CrowdSec package block marker')
          fixture_anchor = 'export CF_ACCOUNT_EMAIL="ops@example.test"\nexport CF_FREE_PLAN=true\n'
          fixture_insert = fixture_anchor + 'export VW_CROWDSEC_ETC_DIR="$TMP/etc-crowdsec"\nmkdir -p "$VW_CROWDSEC_ETC_DIR"\nprintf \'api:\\n  server:\\n    listen_uri: 127.0.0.1:8097\\n\' > "$VW_CROWDSEC_ETC_DIR/config.yaml"\n'
          replace_once(crowdsec, fixture_anchor, fixture_insert, 'CrowdSec LAPI fixture')
          lapi_anchor = 'grep -Fq \'NEW_LAPI_KEY\' "$TMP/rendered.yaml" || fail "rendered config missing LAPI key"\n'
          replace_once(crowdsec, lapi_anchor, lapi_anchor + 'grep -Fq \'http://127.0.0.1:8097/\' "$TMP/rendered.yaml" || fail "rendered config did not use the resolved LAPI port"\n', 'CrowdSec resolved LAPI assertion')

          readiness = 'tests/suites/operations/case-readiness.bash'
          behavior = r'''check_port_exhaustion_behavior() (
    set -euo pipefail
    tmpdir="$(mktemp -d)"
    trap 'rm -rf "$tmpdir"' EXIT
    extract_function _cs_find_free_port "$SETUP_CROWDSEC" > "$tmpdir/find-free-port.sh"
    [[ -s "$tmpdir/find-free-port.sh" ]] || fail "could not extract _cs_find_free_port"
    mkdir -p "$tmpdir/bin"
    cat > "$tmpdir/bin/ss" <<'EOF_SS'
#!/usr/bin/env bash
printf '%s\n' 'LISTEN 0 4096 127.0.0.1:65535 0.0.0.0:* users:(("occupied",pid=1,fd=1))'
EOF_SS
    chmod +x "$tmpdir/bin/ss"
    PATH="$tmpdir/bin:$PATH"
    export PATH
    log_error() { :; }
    # shellcheck disable=SC1090
    source "$tmpdir/find-free-port.sh"
    set +e
    output="$(_cs_find_free_port 65535)"
    rc=$?
    set -e
    [[ "$rc" -eq 1 ]] || fail "exhausted CrowdSec port search must fail, got $rc"
    [[ -z "$output" ]] || fail "exhausted CrowdSec port search must not guess a port: $output"
)

check_tls_failure_behavior() (
    set -euo pipefail
    tmpdir="$(mktemp -d)"
    trap 'rm -rf "$tmpdir"' EXIT
    extract_function check_tls_certificate "$SMOKE" > "$tmpdir/tls-check.sh"
    [[ -s "$tmpdir/tls-check.sh" ]] || fail "could not extract check_tls_certificate"
    export QUIET=true
    export DOMAIN="https://wrong-host.example.invalid"
    TLS_RESULT=""
    _require_project_environment() { return 0; }
    _check_fail() { TLS_RESULT="FAIL|$1|$2"; }
    curl() { return 60; }
    # shellcheck disable=SC1090
    source "$tmpdir/tls-check.sh"
    check_tls_certificate
    [[ "$TLS_RESULT" == FAIL\|tls-verified\|certificate\ trust\ or\ hostname\ verification\ failed* ]] \
        || fail "certificate/hostname verification failure must fail smoke readiness: $TLS_RESULT"
)

'''
          marker = 'check_shared_resolver_contract() {\n'
          p = Path(readiness)
          text = p.read_text()
          if text.count(marker) != 1:
              raise SystemExit('readiness insertion marker not unique')
          p.write_text(text.replace(marker, behavior + marker, 1))
          replace_once(
              readiness,
              'check_update_transaction\ncheck_crowdsec_readiness\ncheck_tls_contract\ncheck_port_exhaustion_and_installer_contract\ncheck_shared_resolver_contract\n',
              'check_update_transaction\ncheck_crowdsec_readiness\ncheck_tls_contract\ncheck_tls_failure_behavior\ncheck_port_exhaustion_and_installer_contract\ncheck_port_exhaustion_behavior\ncheck_shared_resolver_contract\n',
              'readiness behavior calls')
          PY
          bash tests/suites/operations/case-readiness.bash
          VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-runner-contracts.bash
          bash tests/suites/operations/case-crowdsec.bash
          git diff --check
      - name: Install test dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Validate repository
        shell: bash
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          set -euo pipefail
          git fetch --no-tags origin delta:refs/remotes/origin/delta
          git diff --check origin/delta...HEAD
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck -x --severity=warning
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml.example -f docker-compose.override.dev.yml.example config --quiet
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          diff -u /tmp/COMMAND-REFERENCE.committed.md docs/COMMAND-REFERENCE.md
          ./tests/run-tests.sh all
      - name: Publish fixes and remove validator
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/suites/foundation/case-runner-contracts.bash tests/suites/operations/case-crowdsec.bash tests/suites/operations/case-readiness.bash
          git rm .github/workflows/pr6-final-validator.yml
          git commit -m 'tests: close PR6 readiness regressions'
          git push origin HEAD:agent/pr6-update-crowdsec-readiness
