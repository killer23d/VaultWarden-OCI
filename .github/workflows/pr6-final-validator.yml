name: PR6 focused test publisher
on:
  push:
    branches:
      - agent/pr6-update-crowdsec-readiness
permissions:
  contents: write
jobs:
  publish:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr6-update-crowdsec-readiness
          fetch-depth: 0
      - name: Apply and validate focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          runner = Path('tests/suites/foundation/case-runner-contracts.bash')
          lines = runner.read_text().splitlines(keepends=True)
          changed = 0
          rules = (
              ('${#REGISTERED_RECORDS[@]}', '-eq 29', '-eq 30', 'expected 29', 'expected 30'),
              ('${#REGISTERED_PATHS[@]}', '-eq 22', '-eq 23', 'expected 22', 'expected 23'),
              ('sort -u "$real_files"', '-eq 22', '-eq 23', None, None),
              ('grep -c \'^  \' "$list_one"', '-eq 29', '-eq 30', 'preserve 29', 'preserve 30'),
              ('wc -l < "$files_one"', '-eq 22', '-eq 23', 'preserve 22', 'preserve 23'),
              ('sort -u "$files_one"', '-eq 22', '-eq 23', None, None),
              ('find "$FIXTURE_TESTS/suites"', '-eq 22', '-eq 23', None, None),
          )
          for i, line in enumerate(lines):
              for marker, old_num, new_num, old_msg, new_msg in rules:
                  if marker not in line:
                      continue
                  if old_num not in line:
                      raise SystemExit(f'runner count marker already changed or malformed: {marker}')
                  line = line.replace(old_num, new_num, 1)
                  if old_msg is not None:
                      if old_msg not in line:
                          raise SystemExit(f'runner count message missing: {marker}')
                      line = line.replace(old_msg, new_msg, 1)
                  lines[i] = line
                  changed += 1
                  break
          if changed != 7:
              raise SystemExit(f'runner count update expected 7 lines, changed {changed}')
          runner.write_text(''.join(lines))

          crowdsec = Path('tests/suites/operations/case-crowdsec.bash')
          text = crowdsec.read_text()
          old = 'cf_bouncer_install_block="$(awk \'/Attempting apt install of crowdsec-cloudflare-worker-bouncer/,/Installed crowdsec-cloudflare-worker-bouncer via apt/\' "$setup_script")"'
          new = 'cf_bouncer_install_block="$(awk \'/Installing Cloudflare Workers bouncer from the configured CrowdSec package repository/,/Installed crowdsec-cloudflare-worker-bouncer via the CrowdSec package repository/\' "$setup_script")"'
          if text.count(old) != 1:
              raise SystemExit('CrowdSec package-install block marker was not found exactly once')
          text = text.replace(old, new, 1)
          anchor = 'export CF_ACCOUNT_EMAIL="ops@example.test"\nexport CF_FREE_PLAN=true\n'
          insert = anchor + '\n'.join([
              'export VW_CROWDSEC_ETC_DIR="$TMP/etc-crowdsec"',
              'mkdir -p "$VW_CROWDSEC_ETC_DIR"',
              'printf \'api:\\n  server:\\n    listen_uri: 127.0.0.1:8097\\n\' > "$VW_CROWDSEC_ETC_DIR/config.yaml"',
              '',
          ])
          if text.count(anchor) != 1:
              raise SystemExit('CrowdSec worker fixture anchor was not found exactly once')
          text = text.replace(anchor, insert, 1)
          lapi = 'grep -Fq \'NEW_LAPI_KEY\' "$TMP/rendered.yaml" || fail "rendered config missing LAPI key"\n'
          if text.count(lapi) != 1:
              raise SystemExit('CrowdSec LAPI assertion anchor was not found exactly once')
          text = text.replace(lapi, lapi + 'grep -Fq \'http://127.0.0.1:8097/\' "$TMP/rendered.yaml" || fail "rendered config did not use the resolved LAPI port"\n', 1)
          crowdsec.write_text(text)

          readiness = Path('tests/suites/operations/case-readiness.bash')
          text = readiness.read_text()
          marker = '\ncheck_shared_resolver_contract() {\n'
          if text.count(marker) != 1:
              raise SystemExit('readiness behavior insertion marker is not unique')
          additions = '\n'.join([
              'check_port_exhaustion_behavior() (',
              '    set -euo pipefail',
              '    tmpdir="$(mktemp -d)"',
              "    trap 'rm -rf \"$tmpdir\"' EXIT",
              '    extract_function _cs_find_free_port "$SETUP_CROWDSEC" > "$tmpdir/find-free-port.sh"',
              '    [[ -s "$tmpdir/find-free-port.sh" ]] || fail "could not extract _cs_find_free_port"',
              '    mkdir -p "$tmpdir/bin"',
              '    cat > "$tmpdir/bin/ss" <<\'EOF_SS\'',
              '#!/usr/bin/env bash',
              "printf '%s\\n' 'LISTEN 0 4096 127.0.0.1:65535 0.0.0.0:* users:((\"occupied\",pid=1,fd=1))'",
              'EOF_SS',
              '    chmod +x "$tmpdir/bin/ss"',
              '    PATH="$tmpdir/bin:$PATH"',
              '    export PATH',
              '    log_error() { :; }',
              '    # shellcheck disable=SC1090',
              '    source "$tmpdir/find-free-port.sh"',
              '    set +e',
              '    output="$(_cs_find_free_port 65535)"',
              '    rc=$?',
              '    set -e',
              '    [[ "$rc" -eq 1 ]] || fail "exhausted CrowdSec port search must fail, got $rc"',
              '    [[ -z "$output" ]] || fail "exhausted CrowdSec port search must not guess a port: $output"',
              ')',
              '',
              'check_tls_failure_behavior() (',
              '    set -euo pipefail',
              '    tmpdir="$(mktemp -d)"',
              "    trap 'rm -rf \"$tmpdir\"' EXIT",
              '    extract_function check_tls_certificate "$SMOKE" > "$tmpdir/tls-check.sh"',
              '    [[ -s "$tmpdir/tls-check.sh" ]] || fail "could not extract check_tls_certificate"',
              '    export QUIET=true',
              '    export DOMAIN="https://wrong-host.example.invalid"',
              '    TLS_RESULT=""',
              '    _require_project_environment() { return 0; }',
              '    _check_fail() { TLS_RESULT="FAIL|$1|$2"; }',
              '    curl() { return 60; }',
              '    # shellcheck disable=SC1090',
              '    source "$tmpdir/tls-check.sh"',
              '    check_tls_certificate',
              '    [[ "$TLS_RESULT" == FAIL\\|tls-verified\\|certificate\\ trust\\ or\\ hostname\\ verification\\ failed* ]] \\',
              '        || fail "certificate/hostname verification failure must fail smoke readiness: $TLS_RESULT"',
              ')',
              '',
          ]) + '\n'
          readiness.write_text(text.replace(marker, '\n' + additions + marker.lstrip('\n'), 1))
          text = readiness.read_text()
          old_calls = '\n'.join([
              'check_update_transaction',
              'check_crowdsec_readiness',
              'check_tls_contract',
              'check_port_exhaustion_and_installer_contract',
              'check_shared_resolver_contract',
              '',
          ])
          new_calls = '\n'.join([
              'check_update_transaction',
              'check_crowdsec_readiness',
              'check_tls_contract',
              'check_tls_failure_behavior',
              'check_port_exhaustion_and_installer_contract',
              'check_port_exhaustion_behavior',
              'check_shared_resolver_contract',
              '',
          ])
          text = readiness.read_text()
          if text.count(old_calls) != 1:
              raise SystemExit('readiness behavior call block was not found exactly once')
          readiness.write_text(text.replace(old_calls, new_calls, 1))
          PY

          bash -n tests/suites/foundation/case-runner-contracts.bash tests/suites/operations/case-crowdsec.bash tests/suites/operations/case-readiness.bash
          shellcheck -x --severity=warning tests/suites/foundation/case-runner-contracts.bash tests/suites/operations/case-crowdsec.bash tests/suites/operations/case-readiness.bash
          bash tests/suites/operations/case-readiness.bash
          VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-runner-contracts.bash
          bash tests/suites/operations/case-crowdsec.bash
          git diff --check
      - name: Publish and self-remove
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/suites/foundation/case-runner-contracts.bash tests/suites/operations/case-crowdsec.bash tests/suites/operations/case-readiness.bash
          git rm .github/workflows/pr6-final-validator.yml
          git commit -m 'tests: close PR6 readiness regressions'
          git push origin HEAD:agent/pr6-update-crowdsec-readiness
