name: PR8 canonical key test fix
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Update removed key override compatibility contract
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/foundation/case-config-env.bash')
          text = p.read_text()
          replacements = {
              "grep -q 'SOPS_AGE_KEY_FILE=/caller/key.txt' <<< \"$output\" || fail \"caller SOPS_AGE_KEY_FILE override lost: $output\"": "grep -q 'SOPS_AGE_KEY_FILE=/etc/vaultwarden/age-key.txt' <<< \"$output\" || fail \"caller SOPS_AGE_KEY_FILE redirected canonical operational key: $output\"",
              "run_test 'supported caller overrides survive while SECRETS_FILE remains canonical' test_config_caller_overrides_keep_canonical_secrets_path": "run_test 'supported caller overrides survive while Age and secrets paths remain canonical' test_config_caller_overrides_keep_canonical_secrets_path",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one match, got {count}: {old}')
              text = text.replace(old, new)
          p.write_text(text)
          PY
          bash -n tests/suites/foundation/case-config-env.bash
          shellcheck -x --severity=warning tests/suites/foundation/case-config-env.bash
          sudo env VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-config-env.bash
      - name: Commit fix and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-config-key-test-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: assert canonical operational Age key'
          git push origin HEAD:pr8-runtime-authority-age-custody
