name: PR8 operator documentation update
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  docs:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
      - name: Update authority wording
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('docs/CONFIGURATION.md'); s=p.read_text()
          old='After the state directory is known, one complete runtime environment is loaded in this order:\n\n1. `/etc/vaultwarden/vaultwarden.env`, when installed;\n2. `${PROJECT_STATE_DIR}/config/install.env`;\n3. repository `.env` as the bootstrap/legacy fallback.\n\nExplicit caller overrides for state directory, data device, data mount, and the SOPS Age key path are reapplied after loading.'
          new='Production runtime loads one installed authority: `/etc/vaultwarden/vaultwarden.env` when present, otherwise `${PROJECT_STATE_DIR}/config/install.env`. Repository `.env` is authoring input only and is never a production fallback. Missing or malformed runtime authority is fatal; repair it with `sudo make sync-env`.\n\nExplicit caller overrides for state directory, data device, and data mount are reapplied after loading. The operational Age private key is always `/etc/vaultwarden/age-key.txt`.'
          if old not in s: raise SystemExit('CONFIGURATION runtime authority paragraph not found')
          p.write_text(s.replace(old,new,1))
          p=Path('RUNBOOK.md'); s=p.read_text()
          old='For runtime loading, `/etc/vaultwarden/vaultwarden.env` is preferred when installed, then persistent `install.env`, then repository `.env` as a bootstrap/legacy fallback.\n\nDo not hand-edit installed runtime environment files as a normal configuration workflow.'
          new='At runtime, `/etc/vaultwarden/vaultwarden.env` is authoritative when installed; otherwise `${PROJECT_STATE_DIR}/config/install.env` is used. Repository `.env` is authoring input only and is never a production fallback. Missing or malformed runtime authority must be repaired with `sudo make sync-env`. The operational Age private key is `/etc/vaultwarden/age-key.txt`.\n\nDo not hand-edit installed runtime environment files as a normal configuration workflow.'
          if old not in s: raise SystemExit('RUNBOOK runtime authority paragraph not found')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Install yq and regenerate command reference
        shell: bash
        run: |
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          DOCKER_PROJECT_LABEL=ci bash utilities/write-command-reference.sh
          rm -f .github/workflows/pr8-diagnostics.yml .github/workflows/pr8-doc-fix.yml
      - name: Validate documentation authority
        shell: bash
        run: |
          ! grep -R -n -E 'repository \.env as (a |the )?(bootstrap|legacy).*fallback|Copies secrets/keys/age-key\.txt|Legacy CLOUDFLARE_ZONE_ID shell variable fallback|Age key already configured in \.env' docs README.md RUNBOOK.md
          grep -Fq 'The operational Age private key is always `/etc/vaultwarden/age-key.txt`.' docs/CONFIGURATION.md
          grep -Fq 'Repository `.env` is authoring input only and is never a production fallback.' RUNBOOK.md
      - name: Commit documentation
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'docs: document canonical runtime authority'
          git push origin HEAD:pr8-runtime-authority-age-custody
