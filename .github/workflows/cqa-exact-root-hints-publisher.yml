name: Temporary exact CQA root-hints publisher

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact verified patch and fast-forward PR 266
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/delta)" = '5cdee3c2f527e565e76e7da78da1d4f628b26041'
          test "$(git rev-parse origin/cqa-root-hints)" = '54d6a3194d0521834060956df5754b640c14b042'
          git config user.name OpenAI
          git config user.email noreply@openai.com
          git switch -C cqa-root-hints origin/cqa-root-hints
          base64 -d "$GITHUB_WORKSPACE/.github/cqa-root-hints-followup.patch.gz.b64" | gzip -d > /tmp/cqa-root-hints.patch
          git apply --check /tmp/cqa-root-hints.patch
          git apply /tmp/cqa-root-hints.patch
          git diff --check
          test "$(git diff --name-only | sort)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          ./tests/run-tests.sh list >/dev/null
          git add lib/common.sh tests/suites/security/case-security-privileges.bash
          test "$(git write-tree)" = 'e71547427055a12690ef93f5a410d45af540c425'
          git commit -m 'fix(privilege): make bare remediation paths executable'
          test "$(git ls-remote origin refs/heads/cqa-root-hints | cut -f1)" = '54d6a3194d0521834060956df5754b640c14b042'
          git push origin HEAD:refs/heads/cqa-root-hints
          git rev-parse HEAD
