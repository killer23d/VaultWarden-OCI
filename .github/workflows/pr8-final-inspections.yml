name: PR8 final inspections

on:
  push:
    branches:
      - pr8-runtime-authority-age-custody

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Inspection pass 1 - authority and operator contract
        run: |
          set -euo pipefail
          PRODUCT_BASE=91782af2384371bd93771a12b5d8c6fc54bb80bd
          unexpected="$(git diff --name-only "$PRODUCT_BASE" HEAD | grep -v '^.github/workflows/pr8-final-inspections.yml$' || true)"
          test -z "$unexpected"

          bash tests/suites/foundation/case-runtime-authority.bash
          bash tests/suites/foundation/case-systemd.bash
          VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-storage-setup.bash

          grep -Fq '_preflight_canonical_age_key || return 1' utilities/setup-systemd.sh
          grep -Fq 'check_age_key "$AGE_KEY_DEST"' utilities/setup-systemd.sh
          preflight_line="$(grep -n '_preflight_canonical_age_key || return 1' utilities/setup-systemd.sh | head -1 | cut -d: -f1)"
          install_line="$(grep -n 'Installing scripts to $OPT_SCRIPTS_DIR' utilities/setup-systemd.sh | head -1 | cut -d: -f1)"
          test "$preflight_line" -lt "$install_line"

          if grep -Fq 'Set SOPS_AGE_KEY_FILE in .env' utilities/backup-run.sh; then exit 1; fi
          key_rotate_recipe="$(awk '/^key-rotate:/{p=1; next} p && /^[^[:space:]#].*:/{exit} p{print}' Makefile)"
          if [[ "$key_rotate_recipe" == *check-env-readable* ]]; then exit 1; fi

          storage_loader="$(awk '/^_ss_load_environment\(\)/,/^}/' utilities/setup-storage.sh)"
          [[ "$storage_loader" == *load_authoring_environment* ]]
          [[ "$storage_loader" != *'load_env_file "${PROJECT_ROOT}/.env"'* ]]
          metadata_line="$(grep -n '    _ss_dispatch_metadata "$@"' utilities/setup-storage.sh | head -1 | cut -d: -f1)"
          load_line="$(grep -n '    _ss_load_environment' utilities/setup-storage.sh | head -1 | cut -d: -f1)"
          parse_line="$(grep -n '    _parse_outer_args "$@"' utilities/setup-storage.sh | head -1 | cut -d: -f1)"
          test "$metadata_line" -lt "$load_line"
          test "$load_line" -lt "$parse_line"

          grep -Fq 'decrypt_secret "cloudflare_zone_id"' utilities/maintenance-update-dns.sh
          grep -Fq 'decrypt_secret "caddy_cloudflare_dns_token"' utilities/maintenance-update-dns.sh
          if grep -R -nE 'command -v[[:space:]]+docker-compose|DOCKER_COMP[^#]*docker-compose|(^|[;&|])[[:space:]]*docker-compose([[:space:]]|$)' Makefile lib startup.sh utilities; then exit 1; fi

      - name: Inspection pass 2 - retained safety and regression surface
        run: |
          set -euo pipefail
          REVIEW_BASE=3dbd8848c6c0d06fb99ced8ec486601461a91427
          git diff --quiet "$REVIEW_BASE" HEAD -- caddy/entrypoint.sh lib/operations.sh utilities/restore-run.sh utilities/setup-secrets.sh utilities/maintenance-health.sh utilities/maintenance-update-dns.sh

          grep -Fq 'SQLite Online Backup API failed' utilities/backup-run.sh
          grep -Fq '_db_snapshot_restart_if_needed' utilities/backup-run.sh
          grep -Fq 'CADDY_DEGRADED=true' caddy/entrypoint.sh
          grep -Fq 'Caddyfile.degraded' caddy/entrypoint.sh
          grep -Fq 'flock -n -E 75' lib/operations.sh
          grep -Fq 'return 75' lib/operations.sh

          grep -Fq '_restore_preflight_archive_expansion_capacity' utilities/restore-run.sh
          grep -Fq '_restore_preflight_db_commit_capacity' utilities/restore-run.sh
          grep -Fq '_rollback_rotation' utilities/restore-run.sh
          grep -Fq '_rollback_payload_paths' utilities/restore-run.sh
          grep -Fq 'RESTORE_FULL_PROMOTION_COMMITTED' utilities/restore-run.sh

          git diff --check
          ./tests/run-tests.sh all

      - name: Remove temporary inspection helper
        if: success()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr8-final-inspections.yml
          git commit -m "chore: remove PR8 final inspection helper"
          git push origin HEAD:pr8-runtime-authority-age-custody
