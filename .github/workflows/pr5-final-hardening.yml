name: PR5 final hardening

on:
  push:
    branches:
      - agent/recovery-kit-schema-truth

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/recovery-kit-schema-truth
          fetch-depth: 0

      - name: Apply final hardening
        run: python3 .github/pr5_final_hardening.py

      - name: Validate final hardening
        shell: bash
        run: |
          git diff --check
          bash -n lib/secrets.sh
          bash -n utilities/secrets-export-recovery-kit.sh
          bash -n tests/suites/security/case-secrets.bash
          shellcheck -x --severity=warning lib/secrets.sh utilities/secrets-export-recovery-kit.sh tests/suites/security/case-secrets.bash
          VW_TEST_CASE_MODE=recovery-kit tests/suites/security/case-secrets.bash

      - name: Commit validated final hardening
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/secrets.sh utilities/secrets-export-recovery-kit.sh
          git diff --cached --check
          git commit -m 'recovery: tighten schema-first diagnostics'
          git push origin HEAD:agent/recovery-kit-schema-truth
