name: Temporary CQA patch diagnostic

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: read

jobs:
  diagnose:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Record decode and apply evidence
        shell: bash
        run: |
          set +e
          exec > /tmp/cqa-patch-diagnostic.txt 2>&1
          echo "workspace=$GITHUB_WORKSPACE"
          wc -c .github/cqa-root-hints-followup.patch.gz.b64
          sha256sum .github/cqa-root-hints-followup.patch.gz.b64
          base64 -d .github/cqa-root-hints-followup.patch.gz.b64 > /tmp/cqa.patch.gz
          echo "base64_rc=$?"
          wc -c /tmp/cqa.patch.gz
          sha256sum /tmp/cqa.patch.gz
          gzip -t /tmp/cqa.patch.gz
          echo "gzip_test_rc=$?"
          gzip -dc /tmp/cqa.patch.gz > /tmp/cqa.patch
          echo "gzip_decode_rc=$?"
          wc -c /tmp/cqa.patch
          sha256sum /tmp/cqa.patch
          head -5 /tmp/cqa.patch
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          echo "fetch_rc=$?"
          git rev-parse origin/cqa-root-hints
          git switch -C diagnostic origin/cqa-root-hints
          echo "switch_rc=$?"
          git apply --check /tmp/cqa.patch
          echo "apply_check_rc=$?"
          git apply /tmp/cqa.patch
          echo "apply_rc=$?"
          git diff --check
          echo "diff_check_rc=$?"
          git diff --name-only
          git add lib/common.sh tests/suites/security/case-security-privileges.bash
          git write-tree
          echo "write_tree_rc=$?"
      - name: Upload diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: cqa-patch-diagnostic
          path: /tmp/cqa-patch-diagnostic.txt
          retention-days: 1
