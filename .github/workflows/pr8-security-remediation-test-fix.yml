name: PR8 final authority test fixes
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Remove final Compose v1 fallback and stale key assumptions
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('Makefile')
          text = p.read_text()
          old = 'DOCKER_COMP          ?= $(shell docker compose version >/dev/null 2>&1 && echo "docker compose" || echo "docker-compose")'
          new = 'DOCKER_COMP          := docker compose'
          if text.count(old) != 1:
              raise SystemExit(f'Makefile Compose fallback expected once, got {text.count(old)}')
          p.write_text(text.replace(old, new))

          p = Path('tests/suites/foundation/case-runtime-authority.bash')
          text = p.read_text()
          anchor = 'setup_system="$(cat utilities/setup-system.sh)"\n'
          if text.count(anchor) != 1:
              raise SystemExit('runtime authority setup-system anchor mismatch')
          text = text.replace(anchor, anchor + 'makefile="$(cat Makefile)"\n')
          anchor = '[[ "$setup_system" == *"Docker Compose v2 plugin is missing"* ]] || fail "setup v2 plugin validation missing"\n'
          assertions = '''[[ "$makefile" == *'DOCKER_COMP          := docker compose'* ]] || fail "Makefile does not use docker compose as its command authority"\n[[ "$makefile" != *'echo "docker-compose"'* ]] || fail "Makefile still contains a Compose v1 executable fallback"\n'''
          if text.count(anchor) != 1:
              raise SystemExit('runtime authority Compose assertion anchor mismatch')
          text = text.replace(anchor, anchor + assertions)
          old_scan = "lib utilities startup.sh setup.sh >/dev/null || fail \"docker-compose executable fallback found\""
          new_scan = "lib utilities startup.sh setup.sh Makefile >/dev/null || fail \"docker-compose executable fallback found\""
          if text.count(old_scan) != 1:
              raise SystemExit(f'Compose fallback scan anchor expected once, got {text.count(old_scan)}')
          p.write_text(text.replace(old_scan, new_scan))

          p = Path('tests/suites/security/case-security-privileges.bash')
          text = p.read_text()
          replacements = {
              '''grep -Fq 'sudo install -d -m 700 -o root -g root /etc/vaultwarden' startup.sh || fail "startup.sh missing root-owned /etc/vaultwarden install remediation"\ngrep -Fq 'sudo install -m 600 -o root -g root ${repo_local_key} ${canonical_key}' startup.sh || fail "startup.sh missing root-owned age key install remediation"\ngrep -Fq 'sudo make key-health' startup.sh || fail "startup.sh key verification guidance must use sudo make key-health"\npass "startup key remediation stays root-owned"\n''': '''grep -Fq 'Age key health check FAILED: ${canonical_key}' startup.sh || fail "startup.sh does not name canonical Age key failure"\ngrep -Fq 'Restore the operational Age private key at ${canonical_key}, then run: sudo make key-health' startup.sh || fail "startup.sh lacks canonical Age key recovery guidance"\n! grep -Fq 'repo_local_key' startup.sh || fail "startup.sh still advertises checkout Age-key remediation"\npass "startup key remediation stays canonical and root-operated"\n''',
              "grep -Fq '\"/etc/vaultwarden/vaultwarden.env\"' lib/config.sh || fail \"environment loader does not include installed env path\"": "grep -Fq 'VW_CONFIG_INSTALLED_ENV_FILE:-/etc/vaultwarden/vaultwarden.env' lib/config.sh || fail \"environment loader does not include installed env authority\"",
              "grep -Fq 'local AGE_KEY_FILE=\"${AGE_KEY_FILE:-/etc/vaultwarden/age-key.txt}\"' utilities/setup-secrets.sh || fail \"setup-secrets configure does not default to the canonical Age key\"": "grep -Fq 'local AGE_KEY_FILE=\"/etc/vaultwarden/age-key.txt\"' utilities/setup-secrets.sh || fail \"setup-secrets configure does not pin the canonical Age key\"",
              "grep -Fq 'AGE_KEY_FILE must be an absolute path' utilities/setup-secrets.sh || fail \"setup-secrets configure does not reject relative Age key overrides\"": "! grep -Fq 'local AGE_KEY_FILE=\"${AGE_KEY_FILE:-/etc/vaultwarden/age-key.txt}\"' utilities/setup-secrets.sh || fail \"setup-secrets configure still accepts alternate operational Age key custody\"",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected one security contract match, got {count}: {old[:90]}')
              text = text.replace(old, new)

          copy_anchor = 'cp -a lib/. "$KEY_REPO/lib/"\n'
          resolver_override = '''cat >> "$KEY_REPO/lib/crypto.sh" <<'EOF_KEY_RESOLVER'\n# Test-only: make canonical resolution unavailable so these target contracts\n# prove they fail closed rather than accepting either override decoy below.\nresolve_age_key_path() { return 1; }\nEOF_KEY_RESOLVER\n'''
          if text.count(copy_anchor) != 1:
              raise SystemExit('security key fixture copy anchor mismatch')
          text = text.replace(copy_anchor, copy_anchor + resolver_override)

          old_block = '''KEY_SHOW_OUT="$KEY_TMP/key-show.out"\nrun_key_make key-show "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show target failed"; }\ngrep -Fq "$PROD_KEY" "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show did not report production active key"; }\ngrep -Fq "$PROD_RECIPIENT" "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show did not derive production public recipient"; }\n! grep -Fq "$REPO_KEY" "$KEY_SHOW_OUT" || fail "key-show fell back to repo-local key"\n\nKEY_HEALTH_OUT="$KEY_TMP/key-health.out"\nrun_key_make key-health "$KEY_HEALTH_OUT" || { cat "$KEY_HEALTH_OUT" >&2; fail "key-health target failed"; }\ngrep -Fq "$PROD_KEY" "$KEY_HEALTH_OUT" || { cat "$KEY_HEALTH_OUT" >&2; fail "key-health did not resolve production active key"; }\ngrep -Fq 'Age key is healthy' "$KEY_HEALTH_OUT" || { cat "$KEY_HEALTH_OUT" >&2; fail "key-health did not complete active-key health check"; }\n\nKEY_BACKUP_OUT="$KEY_TMP/key-backup.out"\nrun_key_make key-backup "$KEY_BACKUP_OUT" || { cat "$KEY_BACKUP_OUT" >&2; fail "key-backup target failed"; }\nbackup_copy="$(find "$KEY_TMP/home" -name 'age-key-backup-*.txt' -type f -print | head -1)"\n[[ -n "$backup_copy" ]] || fail "key-backup did not create a transfer copy"\ngrep -Fq 'PRODUCTION-ACTIVE-KEY' "$backup_copy" || fail "key-backup copied repo-local key instead of production active key"\n! grep -Fq 'REPO-LOCAL-KEY' "$backup_copy" || fail "key-backup transfer copy contains repo-local key"\n\nKEY_ESCROW_OUT="$KEY_TMP/key-escrow.out"\nrun_key_make key-escrow "$KEY_ESCROW_OUT" || { cat "$KEY_ESCROW_OUT" >&2; fail "key-escrow target failed"; }\nescrow_copy="$(find "$KEY_TMP/home" -name 'age-key-escrow-*.txt' -type f -print | head -1)"\n[[ -n "$escrow_copy" ]] || { cat "$KEY_ESCROW_OUT" >&2; fail "key-escrow did not create an escrow file"; }\ngrep -Fq 'PRODUCTION-ACTIVE-KEY' "$escrow_copy" || fail "key-escrow wrote escrow from the wrong key"\n! grep -Fq 'REPO-LOCAL-KEY' "$escrow_copy" || fail "key-escrow escrow contains repo-local key"\npass "retained key targets use the production key and ignore the repo-local decoy"\n'''
          new_block = '''KEY_SHOW_OUT="$KEY_TMP/key-show.out"\nrun_key_make key-show "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show target failed"; }\ngrep -Fq 'Key file : <not resolved>' "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show did not report unresolved canonical key"; }\ngrep -Fq 'Restore the offline Age identity to /etc/vaultwarden/age-key.txt' "$KEY_SHOW_OUT" || { cat "$KEY_SHOW_OUT" >&2; fail "key-show lacks canonical recovery guidance"; }\n! grep -Fq "$PROD_KEY" "$KEY_SHOW_OUT" || fail "key-show accepted the installed-env Age-key override decoy"\n! grep -Fq "$REPO_KEY" "$KEY_SHOW_OUT" || fail "key-show fell back to repo-local key"\n\nKEY_HEALTH_OUT="$KEY_TMP/key-health.out"\nif run_key_make key-health "$KEY_HEALTH_OUT"; then\n    cat "$KEY_HEALTH_OUT" >&2\n    fail "key-health succeeded without canonical key resolution"\nfi\n! grep -Fq "$PROD_KEY" "$KEY_HEALTH_OUT" || fail "key-health accepted the installed-env Age-key override decoy"\n! grep -Fq "$REPO_KEY" "$KEY_HEALTH_OUT" || fail "key-health fell back to repo-local key"\n\nKEY_BACKUP_OUT="$KEY_TMP/key-backup.out"\nif run_key_make key-backup "$KEY_BACKUP_OUT"; then\n    cat "$KEY_BACKUP_OUT" >&2\n    fail "key-backup succeeded without canonical key resolution"\nfi\n[[ -z "$(find "$KEY_TMP/home" -name 'age-key-backup-*.txt' -type f -print -quit)" ]] || fail "key-backup created a copy without canonical key resolution"\n! grep -Fq "$PROD_KEY" "$KEY_BACKUP_OUT" || fail "key-backup accepted the installed-env Age-key override decoy"\n! grep -Fq "$REPO_KEY" "$KEY_BACKUP_OUT" || fail "key-backup fell back to repo-local key"\n\nKEY_ESCROW_OUT="$KEY_TMP/key-escrow.out"\nif run_key_make key-escrow "$KEY_ESCROW_OUT"; then\n    cat "$KEY_ESCROW_OUT" >&2\n    fail "key-escrow succeeded without canonical key resolution"\nfi\n[[ -z "$(find "$KEY_TMP/home" -name 'age-key-escrow-*.txt' -type f -print -quit)" ]] || fail "key-escrow created escrow without canonical key resolution"\n! grep -Fq "$PROD_KEY" "$KEY_ESCROW_OUT" || fail "key-escrow accepted the installed-env Age-key override decoy"\n! grep -Fq "$REPO_KEY" "$KEY_ESCROW_OUT" || fail "key-escrow fell back to repo-local key"\npass "retained key targets fail closed without canonical key resolution and ignore both override decoys"\n'''
          count = text.count(old_block)
          if count != 1:
              raise SystemExit(f'legacy key-target behavior block expected once, got {count}')
          p.write_text(text.replace(old_block, new_block))
          PY
          make -n help >/dev/null
          bash -n tests/suites/foundation/case-runtime-authority.bash tests/suites/security/case-security-privileges.bash
          shellcheck -x --severity=warning tests/suites/foundation/case-runtime-authority.bash tests/suites/security/case-security-privileges.bash
          bash tests/suites/foundation/case-runtime-authority.bash
          bash tests/suites/security/case-security-privileges.bash
      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-security-remediation-test-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'runtime: remove final Compose v1 fallback'
          git push origin HEAD:pr8-runtime-authority-age-custody
