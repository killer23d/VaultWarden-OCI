name: PR8 inspection cleanup

on:
  push:
    branches:
      - pr8-runtime-authority-age-custody
    paths:
      - '.github/workflows/pr8-inspection-cleanup.yml'

permissions:
  contents: write

jobs:
  clean-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Remove inspection artifact
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/foundation/case-runtime-authority.bash')
          lines = p.read_text().splitlines(keepends=True)
          matches = [i for i, line in enumerate(lines[:-1]) if line == '\\\n' and lines[i + 1].startswith('pass "authoring and strict runtime environment behavior"')]
          if len(matches) != 1:
              raise SystemExit(f'expected one standalone backslash artifact, found {len(matches)}')
          del lines[matches[0]]
          p.write_text(''.join(lines))
          PY
          git diff --check
          bash -n tests/suites/foundation/case-runtime-authority.bash
          shellcheck -x --severity=warning tests/suites/foundation/case-runtime-authority.bash
          bash tests/suites/foundation/case-runtime-authority.bash

      - name: Full suite
        run: ./tests/run-tests.sh all

      - name: Commit cleanup and remove helper
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr8-inspection-cleanup.yml
          git add tests/suites/foundation/case-runtime-authority.bash
          git diff --cached --check
          git commit -m 'test: clean runtime authority recovery fixture'
          git push origin HEAD:pr8-runtime-authority-age-custody
