name: Apply direct drift fix PR

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-caddy-crowdsec-drift
          fetch-depth: 0

      - name: Apply direct edits
        shell: bash
        run: |
          set -euo pipefail
          cp lib/storage-core.sh lib/storage.sh
          cp utilities/env-edit-core.bash utilities/env-edit.sh
          chmod 0755 utilities/env-edit.sh utilities/crowdsec-email-reconcile.bash

          awk '
            /^[[:space:]]*python3 <<'\''PY'\''$/ { capture=1; next }
            capture && /^[[:space:]]*PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/apply-direct-drift-fix.yml > /tmp/apply-direct-fix.py
          test -s /tmp/apply-direct-fix.py
          python3 /tmp/apply-direct-fix.py

          rm -f lib/storage-core.sh utilities/env-edit-core.bash
          rm -f .github/workflows/apply-direct-drift-fix.yml
          rm -f .github/workflows/apply-direct-drift-fix-pr.yml

          bash -n lib/storage.sh utilities/env-edit.sh utilities/crowdsec-email-reconcile.bash
          git diff --check

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "apply direct Caddy and CrowdSec fixes"
          git push origin HEAD:agent/fix-caddy-crowdsec-drift
