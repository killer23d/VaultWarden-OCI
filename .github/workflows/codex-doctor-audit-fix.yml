name: Apply doctor drift audit fix

on:
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply audit fix
        run: python3 .github/codex_doctor_audit_fix.py
      - name: Compile and run focused tests
        run: |
          python3 -m compileall -q vaultwarden_oci tests/v2
          python3 -m unittest tests.v2.test_caddy_edge_admin -v
      - name: Commit audit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultwarden_oci/edge.py tests/v2/test_caddy_edge_admin.py
          git commit -m "Make Caddy doctor checks drift-sensitive"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
