name: Final normalization worker
on:
  push:
    branches: [codex/final-operator-manual-normalization]
permissions:
  contents: write
jobs:
  normalize:
    if: ${{ github.actor != 'github-actions[bot]' }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: codex/final-operator-manual-normalization
      - run: python3 .github/scripts/final-normalize.py
      - run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Normalize release-neutral runtime and test surfaces'
          git push origin HEAD:codex/final-operator-manual-normalization
