name: PR4 CI repair

on:
  push:
    branches:
      - pr4-firewall-exactness

permissions:
  contents: write

jobs:
  repair:
    if: ${{ !contains(github.event.head_commit.message, '[skip pr4-repair]') }}
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          fetch-depth: 0
      - name: Repair failing PR4 checks
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin pr4-firewall-exactness
          python3 - <<'PY'
          from pathlib import Path

          p = Path('utilities/setup-firewall.sh')
          text = p.read_text()
          old = '''    if [[ "$rc" -eq 1 ]]; then
                  log_info "Docker firewall runtime already requires no VaultWarden remediation; skipping mutation."
                  return 0
              fi
          '''
          new = '''    if [[ "$rc" -eq 1 && "$FORCE" != "true" ]]; then
                  log_info "Docker firewall runtime already requires no VaultWarden remediation; skipping mutation."
                  return 0
              fi
              if [[ "$rc" -eq 1 ]]; then
                  log_info "Force reconciliation requested; checking known OCI and legacy rules."
                  rc=0
              fi
          '''
          if old not in text:
              raise SystemExit('setup-firewall reconciliation anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/suites/operations/case-operations.bash')
          text = p.read_text()
          old = '''require '^SuccessExitStatus=0 75$' "$IPTABLES_UNIT" \\
            "iptables unit must treat expected contention as success"
          '''
          new = '''reject '^SuccessExitStatus=.*75' "$IPTABLES_UNIT" \\
            "iptables unit must not treat operation contention as successful boot reconciliation"
          '''
          if old not in text:
              raise SystemExit('operation unit contention assertion anchor not found')
          p.write_text(text.replace(old, new, 1))

          p = Path('tests/suites/operations/case-firewall-update.bash')
          text = p.read_text()
          lines = text.splitlines(keepends=True)
          seen = set()
          out = []
          for line in lines:
              if 'assert_file_contains "$SETUP_FIREWALL" "trap \'_iptables_signal_rollback' in line:
                  if line in seen:
                      continue
                  seen.add(line)
              out.append(line)
          text = ''.join(out)
          old = '''cat > "$IPT_PROBE" <<'EOF_IPT_PROBE'
          #!/usr/bin/env bash
          set -euo pipefail
          DRY_RUN=false
          '''
          new = '''cat > "$IPT_PROBE" <<'EOF_IPT_PROBE'
          #!/usr/bin/env bash
          set -euo pipefail
          DRY_RUN=false
          FORCE=false
          '''
          if old not in text:
              raise SystemExit('iptables probe default anchor not found')
          p.write_text(text.replace(old, new, 1))
          PY
          bash -n utilities/setup-firewall.sh tests/suites/operations/case-operations.bash tests/suites/operations/case-firewall-update.bash
          shellcheck -x --severity=warning utilities/setup-firewall.sh tests/suites/operations/case-operations.bash tests/suites/operations/case-firewall-update.bash
          ./tests/run-tests.sh operations
          git diff --check
          git add utilities/setup-firewall.sh tests/suites/operations/case-operations.bash tests/suites/operations/case-firewall-update.bash
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'firewall: fix CI contracts [skip pr4-repair]'
          git push origin HEAD:pr4-firewall-exactness
