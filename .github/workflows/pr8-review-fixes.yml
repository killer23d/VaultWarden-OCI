name: PR8 review fixes

on:
  push:
    branches:
      - pr8-runtime-authority-age-custody

permissions:
  contents: write

jobs:
  patch-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0

      - name: Apply bounded review fixes
        run: |
          python3 .github/pr8_review_patch2.py
          sed -i '/^setup_storage=/d' tests/suites/foundation/case-runtime-authority.bash
          sed -i '/^DOMAIN=https:\/\/dns-authority\.example\.test$/a PUID=1000\nPGID=1000' tests/suites/foundation/case-runtime-authority.bash
          sed -i 's#Set SOPS_AGE_KEY_FILE in .env, or place the key at /etc/vaultwarden/age-key.txt#Restore the operational Age key at /etc/vaultwarden/age-key.txt, then re-run the backup.#g' utilities/backup-run.sh
          python3 - <<'PY'
          from pathlib import Path
          p = Path('tests/suites/foundation/case-storage-setup.bash')
          text = p.read_text()
          old = '''metadata_line="$(grep -n '^[[:space:]]*_ss_dispatch_metadata ' utilities/setup-storage.sh | cut -d: -f1)"
          load_line="$(grep -n '^[[:space:]]*_ss_load_runtime_environment$' utilities/setup-storage.sh | cut -d: -f1)"
          outer_parse_line="$(grep -n '^[[:space:]]*_parse_outer_args ' utilities/setup-storage.sh | cut -d: -f1)"
          parse_line="$(grep -n '^[[:space:]]*_mv_parse_args ' utilities/setup-storage.sh | cut -d: -f1)"
          resolve_line="$(grep -n '^[[:space:]]*_mv_resolve_args$' utilities/setup-storage.sh | cut -d: -f1)"
          execute_line="$(grep -n '^[[:space:]]*migrate_mode_main$' utilities/setup-storage.sh | cut -d: -f1)"
          [[ -n "$metadata_line" && -n "$load_line" && -n "$outer_parse_line" && -n "$resolve_line" && -n "$execute_line" \
              && "$metadata_line" -lt "$load_line" && "$load_line" -lt "$outer_parse_line" \
              && "$outer_parse_line" -lt "$parse_line" && "$parse_line" -lt "$resolve_line" && "$resolve_line" -lt "$execute_line" ]] \
              || fail 'setup-storage must dispatch metadata, load env defaults, parse outer CLI, parse migration once, resolve, then execute'
          '''
          new = '''metadata_line="$(grep -n '^[[:space:]]*_ss_dispatch_metadata ' utilities/setup-storage.sh | cut -d: -f1)"
          outer_parse_line="$(grep -n '^[[:space:]]*_parse_outer_args ' utilities/setup-storage.sh | cut -d: -f1)"
          load_line="$(grep -n '^[[:space:]]*_ss_load_environment$' utilities/setup-storage.sh | cut -d: -f1)"
          parse_line="$(grep -n '^[[:space:]]*_mv_parse_args ' utilities/setup-storage.sh | cut -d: -f1)"
          resolve_line="$(grep -n '^[[:space:]]*_mv_resolve_args$' utilities/setup-storage.sh | cut -d: -f1)"
          execute_line="$(grep -n '^[[:space:]]*migrate_mode_main$' utilities/setup-storage.sh | cut -d: -f1)"
          [[ -n "$metadata_line" && -n "$load_line" && -n "$outer_parse_line" && -n "$resolve_line" && -n "$execute_line" \
              && "$metadata_line" -lt "$outer_parse_line" && "$outer_parse_line" -lt "$load_line" \
              && "$load_line" -lt "$parse_line" && "$parse_line" -lt "$resolve_line" && "$resolve_line" -lt "$execute_line" ]] \
              || fail 'setup-storage must dispatch metadata, parse outer CLI, load mode-appropriate env defaults, parse migration once, resolve, then execute'
          '''
          if text.count(old) != 1:
              raise SystemExit(f'case-storage-setup: expected one old ordering block, found {text.count(old)}')
          p.write_text(text.replace(old, new, 1))
          PY

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Check patch
        run: |
          git diff --check
          git diff -- Makefile utilities/setup-systemd.sh utilities/backup-run.sh utilities/setup-storage.sh tests/suites/foundation/case-systemd.bash tests/suites/foundation/case-runtime-authority.bash tests/suites/foundation/case-storage-setup.bash tests/suites/operations/case-lifecycle.bash

      - name: Bash syntax and strict ShellCheck
        run: |
          for f in \
            utilities/setup-systemd.sh \
            utilities/backup-run.sh \
            utilities/setup-storage.sh \
            tests/suites/foundation/case-systemd.bash \
            tests/suites/foundation/case-runtime-authority.bash \
            tests/suites/foundation/case-storage-setup.bash \
            tests/suites/operations/case-lifecycle.bash; do
            bash -n "$f"
            shellcheck -x --severity=warning "$f"
          done

      - name: Focused authority tests
        run: |
          bash tests/suites/foundation/case-runtime-authority.bash
          bash tests/suites/foundation/case-systemd.bash
          VW_TEST_CASE_MODE=core bash tests/suites/foundation/case-storage-setup.bash

      - name: Compose and generated-doc checks
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          docker compose --env-file .env.example -f docker-compose.yml.example config --quiet
          docker compose --env-file .env.example -f docker-compose.yml.example -f docker-compose.override.dev.yml.example config --quiet
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          diff -u /tmp/COMMAND-REFERENCE.committed.md docs/COMMAND-REFERENCE.md

      - name: Full canonical test suite
        run: ./tests/run-tests.sh all

      - name: Commit validated product fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Makefile utilities/setup-systemd.sh utilities/backup-run.sh utilities/setup-storage.sh \
            tests/suites/foundation/case-systemd.bash \
            tests/suites/foundation/case-runtime-authority.bash \
            tests/suites/foundation/case-storage-setup.bash \
            tests/suites/operations/case-lifecycle.bash
          git commit -m "fix: close runtime authority review gaps"
          git push origin HEAD:pr8-runtime-authority-age-custody

      - name: Remove temporary helpers
        if: success()
        run: |
          git rm .github/workflows/pr8-review-fixes.yml .github/pr8_review_patch.py .github/pr8_review_patch2.py
          git commit -m "chore: remove PR8 review helpers"
          git push origin HEAD:pr8-runtime-authority-age-custody
