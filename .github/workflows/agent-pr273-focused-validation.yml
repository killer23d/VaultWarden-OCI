name: Finalize PR 273 quality patch

on:
  pull_request:
    branches:
      - delta
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-quality-patch:
    if: github.head_ref == 'agent/fix-health-recovery-alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply focused quality patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          health_path = Path("utilities/maintenance-health.sh")
          health = health_path.read_text()
          old_locals = '    local recovery_date recovery_time subject body\n    local started_epoch recovery_epoch duration prior_lines="" name\n'
          new_locals = '    local recovery_date recovery_time subject body recovered_file\n    local started_epoch recovery_epoch duration prior_lines="" name\n'
          if old_locals not in health:
              raise SystemExit("recovery local declaration anchor not found")
          health = health.replace(old_locals, new_locals, 1)

          notify_start = health.index('    if _send_notification "$subject" "$body"; then\n', health.index('_notify_recovery()'))
          notify_end = health.index('    _release_recovery_lock\n', notify_start)
          old_cleanup = health[notify_start:notify_end]
          if 'active incident file could not be removed' not in old_cleanup:
              raise SystemExit("unexpected recovery cleanup implementation")
          new_cleanup = '''    if _send_notification "$subject" "$body"; then
              log_info "Recovery notification sent"
              recovered_file="${ACTIVE_INCIDENT_FILE}.recovered"
              if mv -f -- "$ACTIVE_INCIDENT_FILE" "$recovered_file"; then
                  chmod 0600 "$recovered_file" 2>/dev/null || true
                  if ! rm -f -- "$recovered_file"; then
                      log_warn "Recovery email was delivered and the active incident was closed, but recovered incident cleanup failed; stale evidence remains at '${recovered_file}'. Review and remove this file manually."
                  fi
              else
                  log_warn "Recovery email was delivered, but the active incident could not be archived from '${ACTIVE_INCIDENT_FILE}' to '${recovered_file}'. Stale active incident state may require operator action; the recovery cooldown remains active."
              fi
              return 0
          fi
          '''
          health = health[:notify_start] + new_cleanup + health[notify_end:]
          health_path.write_text(health)

          test_path = Path("tests/suites/operations/case-health-alerts.bash")
          test = test_path.read_text()
          reset_anchor = '    CAPTURED_SUBJECT=""\n    CAPTURED_BODY=""\n    ACTIVE_INCIDENT_ID=""\n'
          reset_replacement = '    CAPTURED_SUBJECT=""\n    CAPTURED_BODY=""\n    ACTIVE_INCIDENT_AVAILABLE=false\n    ACTIVE_INCIDENT_ID=""\n'
          if reset_anchor not in test:
              raise SystemExit("fixture reset anchor not found")
          test = test.replace(reset_anchor, reset_replacement, 1)

          failed_assertion = '[[ -e "$ACTIVE_INCIDENT_FILE" ]] || fail "failed recovery delivery must preserve incident state for retry"\n'
          insert_at = test.index('\n! grep -Fq \'No preceding incident snapshot was available.\' "$HEALTH"', test.index(failed_assertion))
          block = r'''
          reset_fixture
          : > "$ACTIVE_INCIDENT_FILE"
          recovered_file="${ACTIVE_INCIDENT_FILE}.recovered"
          rm() {
              local arg
              for arg in "$@"; do
                  [[ "$arg" == "$recovered_file" ]] && return 1
              done
              command rm "$@"
          }
          _notify_recovery || fail "successful recovery returned nonzero when archive cleanup failed"
          unset -f rm
          (( SEND_COUNT == 1 )) || fail "cleanup failure changed the successful delivery count"
          (( RELEASE_COUNT == 0 )) || fail "cleanup failure released a successful recovery cooldown"
          [[ ! -e "$ACTIVE_INCIDENT_FILE" ]] || fail "cleanup failure left the incident active after successful delivery"
          [[ -e "$recovered_file" ]] || fail "cleanup failure did not preserve bounded recovered incident evidence"
          recovered_mode="$(stat -f '%Lp' "$recovered_file" 2>/dev/null || stat -c '%a' "$recovered_file")"
          [[ "$recovered_mode" == "600" ]] || fail "recovered incident evidence mode is $recovered_mode instead of 600"
          [[ "$TRACE" == *"Recovery notification sent"* ]] || fail "cleanup failure obscured successful delivery"
          [[ "$TRACE" == *"active incident was closed"* && "$TRACE" == *"$recovered_file"* ]] \
              || fail "cleanup failure warning was not truthful or actionable"
          _notify_recovery
          (( SEND_COUNT == 1 && ACQUIRE_COUNT == 1 )) \
              || fail "closed incident cleanup failure permitted duplicate recovery delivery"
          command rm -f "$recovered_file"

          # Exercise the real parser against the on-disk format emitted by _incident_write.
          eval "$(extract_func "$HEALTH" _incident_sanitize)"
          eval "$(extract_func "$HEALTH" _incident_set_check)"
          eval "$(extract_func "$HEALTH" _incident_load)"
          eval "$(extract_func "$HEALTH" _incident_format_duration)"

          reset_fixture
          cat > "$ACTIVE_INCIDENT_FILE" <<'INVALID_INCIDENT'
          meta<TAB>incident_id<TAB>vw-invalid-parser
          meta<TAB>started_at<TAB>2026-07-20T01:00:00+00:00
          check<TAB>container:vaultwarden_app<TAB>pass<TAB>Invalid persisted status
          INVALID_INCIDENT
          chmod 0600 "$ACTIVE_INCIDENT_FILE"
          _notify_recovery
          (( ACQUIRE_COUNT == 0 )) || fail "real parser invalid state acquired a recovery cooldown"
          (( SEND_COUNT == 0 )) || fail "real parser invalid state attempted delivery"
          [[ -e "$ACTIVE_INCIDENT_FILE" ]] || fail "real parser invalid state was not preserved"

          reset_fixture
          cat > "$ACTIVE_INCIDENT_FILE" <<'VALID_INCIDENT'
          meta<TAB>incident_id<TAB>vw-real-parser-recovery
          meta<TAB>started_at<TAB>2026-07-20T01:00:00+00:00
          meta<TAB>last_unhealthy_at<TAB>2026-07-20T01:05:00+00:00
          meta<TAB>hostname<TAB>vaultwarden-test
          check<TAB>container:vaultwarden_app<TAB>fail<TAB>Container was not running
          check<TAB>backup:age<TAB>warn<TAB>Latest backup was stale
          VALID_INCIDENT
          chmod 0600 "$ACTIVE_INCIDENT_FILE"
          _notify_recovery || fail "real serialized incident recovery failed"
          (( ACQUIRE_COUNT == 1 )) || fail "real serialized incident did not acquire recovery cooldown"
          (( SEND_COUNT == 1 )) || fail "real serialized incident did not send exactly one recovery email"
          [[ "$CAPTURED_SUBJECT" == *"RECOVERED [Incident vw-real-parser-recovery]"* ]] \
              || fail "real parser recovery subject omitted incident ID"
          [[ "$CAPTURED_BODY" == *"container:vaultwarden_app [FAIL]: Container was not running"* \
              && "$CAPTURED_BODY" == *"backup:age [WARN]: Latest backup was stale"* ]] \
              || fail "real parser recovery body omitted persisted unhealthy checks"
          [[ "$CAPTURED_BODY" == *"Duration:"* && "$CAPTURED_BODY" != *"Duration: unknown"* ]] \
              || fail "real parser recovery did not produce a valid duration"
          [[ ! -e "$ACTIVE_INCIDENT_FILE" ]] || fail "real parser recovery retained active incident state"
          [[ ! -e "${ACTIVE_INCIDENT_FILE}.recovered" ]] || fail "normal recovery retained recovered archive state"
          '''.replace('<TAB>', '\t')
          test = test[:insert_at] + block + test[insert_at:]
          test_path.write_text(test)
          PY

      - name: Validate focused patch
        shell: bash
        run: |
          set -euo pipefail
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          bash -n tests/suites/security/case-email.bash
          bash -n tests/run-tests.sh
          timeout 120 bash tests/suites/operations/case-health-alerts.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash
          git diff --check

      - name: Commit focused changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm \
            .github/workflows/agent-pr273-focused-validation.yml \
            .github/workflows/agent-pr273-quality-validation.yml
          git add \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash

          expected=$'.github/workflows/agent-pr273-focused-validation.yml\n.github/workflows/agent-pr273-quality-validation.yml\ntests/suites/operations/case-health-alerts.bash\nutilities/maintenance-health.sh'
          actual="$(git diff --cached --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
              printf 'Unexpected staged files:\n%s\n' "$actual" >&2
              exit 1
          }
          git diff --cached --check
          git commit -m "fix: close delivered recovery incidents atomically"
          git push origin HEAD:agent/fix-health-recovery-alerts
