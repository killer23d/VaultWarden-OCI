name: PR2 final coverage
on:
  push:
    branches: [fix/authenticated-backup-cohort]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authenticated-backup-cohort
          fetch-depth: 0
      - name: Apply and validate final coverage
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/pr2-final-coverage.py
          bash -n tests/suites/data-protection/case-backup.bash tests/suites/data-protection/case-restore-recovery.bash
          shellcheck -x --severity=warning tests/suites/data-protection/case-backup.bash tests/suites/data-protection/case-restore-recovery.bash
          git diff --check
      - name: Commit coverage and remove helpers
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/pr2-final-coverage.yml .github/pr2-final-coverage.py
          git add tests/suites/data-protection/case-backup.bash tests/suites/data-protection/case-restore-recovery.bash
          git commit -m 'tests: complete authenticated cohort coverage'
          git push origin HEAD:fix/authenticated-backup-cohort
