name: Phase 3 Review Fix Validation

on:
  push:
    branches:
      - codex/phase3-final-test-cleanup

permissions:
  contents: write

jobs:
  patch-validate-push:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Build final review-fix commit locally
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/suites/security/case-secrets.bash')
          text = path.read_text()
          marker = "printf 'Recovery-kit passphrase transport contract tests passed.\\n'\n"
          if text.count(marker) != 1:
              raise SystemExit('recovery-kit completion marker was not unique')
          if "real archive sentinel content" in text:
              raise SystemExit('real 7-Zip smoke already present')

          real_smoke = r'''real_tool=""
          if command -v 7zz >/dev/null 2>&1; then
              real_tool=7zz
          elif command -v 7z >/dev/null 2>&1; then
              real_tool=7z
          fi
          if [[ -n "$real_tool" ]]; then
              smoke_dir="$TMP/smoke"
              mkdir -p "$smoke_dir/out"
              printf 'real archive sentinel content\n' >"$smoke_dir/recovery-kit.txt"
              (
                  cd "$ROOT"
                  # shellcheck source=../lib/secrets.sh
                  source "$ROOT/lib/secrets.sh"
                  prompt_password_with_confirmation(){ printf '%s' 'NonProdTestPassphrase16'; }
                  _encrypt_recovery_kit_attachment \
                      "$smoke_dir/recovery-kit.txt" "$smoke_dir/kit.zip" "$real_tool"
                  _run_7zip_with_passphrase 'NonProdTestPassphrase16' "$real_tool" \
                      x -bd -y -p "-o$smoke_dir/out" -- "$smoke_dir/kit.zip" >/dev/null 2>&1
                  if _run_7zip_with_passphrase 'WrongNonProdPassphrase16' "$real_tool" \
                      t -bd -y -p -- "$smoke_dir/kit.zip" >/dev/null 2>&1; then
                      exit 9
                  fi
              ) || fail 'real AES-256 ZIP stdin smoke test failed'
              [[ -s "$smoke_dir/kit.zip" ]] || fail 'real AES-256 ZIP archive was not created'
              ! LC_ALL=C grep -aFq 'real archive sentinel content' "$smoke_dir/kit.zip" \
                  || fail 'real AES-256 ZIP contains plaintext sentinel content'
              cmp "$smoke_dir/recovery-kit.txt" "$smoke_dir/out/recovery-kit.txt" \
                  || fail 'real AES-256 ZIP extracted content mismatch'
          else
              printf 'Real AES-256 ZIP stdin smoke test skipped: 7z/7zz unavailable.\n'
          fi

          '''
          text = text.replace(marker, real_smoke + marker, 1)
          path.write_text(text)
          PY

          rm -f .github/workflows/phase3-review-fix.yml
          git diff --check
          git add tests/suites/security/case-secrets.bash .github/workflows/phase3-review-fix.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'test: restore real recovery-kit zip smoke'
          echo "FINAL_SHA=$(git rev-parse HEAD)" | tee -a "$GITHUB_ENV"
          echo "BASE_SHA=6325aef7554c77d61dab1abab2a7a633f03a7cf2" >> "$GITHUB_ENV"

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y shellcheck 7zip age
          YQ_VERSION="v4.53.3"
          YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          curl -fsSL \
            "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" \
            -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

      - name: Validate exact final commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test -z "$(git status --porcelain)"
          printf 'VALIDATING_FINAL_SHA=%s\n' "$FINAL_SHA"
          git diff --check "$BASE_SHA...$FINAL_SHA"
          find . \
            -path './.git' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 -n 1 bash -n
          find . \
            -path './.git' -prune -o \
            -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 shellcheck -x --severity=warning

          bash tests/suites/security/case-email.bash
          VW_TEST_CASE_MODE=core bash tests/suites/security/case-secrets.bash
          VW_TEST_CASE_MODE=all bash tests/suites/security/case-secrets.bash
          VW_TEST_CASE_MODE=core bash tests/suites/operations/case-health-alerts.bash
          VW_TEST_CASE_MODE=locking bash tests/suites/operations/case-health-alerts.bash
          VW_TEST_CASE_MODE=all bash tests/suites/operations/case-health-alerts.bash
          set +e
          VW_TEST_CASE_MODE=bogus bash tests/suites/security/case-secrets.bash >/dev/null 2>&1
          secrets_unknown=$?
          VW_TEST_CASE_MODE=bogus bash tests/suites/operations/case-health-alerts.bash >/dev/null 2>&1
          health_unknown=$?
          set -e
          [[ "$secrets_unknown" -eq 2 && "$health_unknown" -eq 2 ]]

          ./tests/run-tests.sh list | tee /tmp/list.out
          ./tests/run-tests.sh list-files | tee /tmp/list-files.out
          logical_count="$(grep -Ec '^  [^[:space:]].*[|]' /tmp/list.out)"
          physical_count="$(grep -c '^tests/' /tmp/list-files.out)"
          suite_count="$(grep -Ec '^[a-z-]+:$' /tmp/list.out)"
          printf 'FINAL_INVENTORY logical=%s physical=%s suites=%s\n' \
            "$logical_count" "$physical_count" "$suite_count"
          [[ "$logical_count" -eq 26 && "$physical_count" -eq 19 && "$suite_count" -eq 4 ]]

          ./tests/run-tests.sh security
          ./tests/run-tests.sh operations
          ./tests/run-tests.sh data-protection
          ./tests/run-tests.sh all

      - name: Final ownership and scope sanity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          test ! -e .github/workflows/phase3-review-fix.yml
          test ! -e tests/suites/operations/case-lock-fd-hygiene.bash
          for name in \
            check_recovery_kit_attachment_passphrase_contract \
            check_health_alert_lock_mode_normalization \
            check_recovery_notification_retry_contract \
            check_health_incident_context; do
            ! grep -Fq "$name" tests/suites/security/case-email.bash
          done
          grep -Fq 'check_recovery_kit_attachment_passphrase_contract' tests/suites/security/case-secrets.bash
          grep -Fq 'real archive sentinel content' tests/suites/security/case-secrets.bash
          grep -Fq 'WrongNonProdPassphrase16' tests/suites/security/case-secrets.bash
          grep -Fq 'check_health_state_ownership_gaps' tests/suites/operations/case-health-alerts.bash

          printf '%s\n' \
            tests/suites/operations/case-health-alerts.bash \
            tests/suites/security/case-email.bash \
            tests/suites/security/case-secrets.bash \
            | sort > /tmp/expected-files
          git diff --name-only "$BASE_SHA...$FINAL_SHA" | sort > /tmp/actual-files
          diff -u /tmp/expected-files /tmp/actual-files
          git diff --stat "$BASE_SHA...$FINAL_SHA"
          sha256sum \
            tests/suites/operations/case-health-alerts.bash \
            tests/suites/security/case-email.bash \
            tests/suites/security/case-secrets.bash
          printf 'VALIDATED_FINAL_SHA=%s\n' "$FINAL_SHA"

      - name: Push validated final commit
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$FINAL_SHA"
          git push origin HEAD:codex/phase3-final-test-cleanup
          printf 'PUSHED_VALIDATED_FINAL_SHA=%s\n' "$FINAL_SHA"
