name: Diagnose PR 280 process leak
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-health-lock.yml'
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Run only operations case and inspect survivors
        shell: bash
        run: |
          set -euo pipefail
          source_sha='8b99e68c0a8ea9b0c5bba8743a3cf6e40e890a7c'
          git show "${source_sha}:.github/workflows/pr280-health-lock.yml" > /tmp/pr280-publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('/tmp/pr280-publisher.yml').read_text())
          script = next(
              step['run']
              for step in workflow['jobs']['publish']['steps']
              if step.get('name') == 'Verify, test, and publish exact tree'
          )
          marker = 'rm -f .pr280-* .github/workflows/pr280-health-lock.yml'
          prefix, separator, _ = script.partition(marker)
          if not separator:
              raise SystemExit('publisher preparation marker not found')
          Path('/tmp/pr280-prepare.sh').write_text(prefix + '\n')
          PY
          bash -e -o pipefail /tmp/pr280-prepare.sh
          ps -e -o pid= | sort -n > /tmp/pids.before
          set +e
          timeout --kill-after=5s 180s bash tests/suites/operations/case-operations.bash > /tmp/case.log 2>&1
          rc=$?
          set -e
          cat /tmp/case.log
          printf 'case rc=%s\n' "$rc"
          sleep 1
          ps -e -o pid= | sort -n > /tmp/pids.after
          comm -13 /tmp/pids.before /tmp/pids.after | tr -d ' ' > /tmp/new-pids
          echo '--- surviving processes created by case ---'
          while read -r pid; do
            [[ "$pid" =~ ^[0-9]+$ && -d "/proc/$pid" ]] || continue
            ps -o pid=,ppid=,user=,stat=,comm=,args= -p "$pid" || true
            printf '  cwd=%s\n' "$(sudo readlink "/proc/$pid/cwd" 2>/dev/null || true)"
            printf '  fd1=%s\n' "$(sudo readlink "/proc/$pid/fd/1" 2>/dev/null || true)"
            printf '  fd2=%s\n' "$(sudo readlink "/proc/$pid/fd/2" 2>/dev/null || true)"
          done < /tmp/new-pids
          while read -r pid; do
            [[ "$pid" =~ ^[0-9]+$ ]] || continue
            sudo kill -KILL "$pid" 2>/dev/null || true
          done < <(tac /tmp/new-pids)
          [[ "$rc" -eq 0 ]]
