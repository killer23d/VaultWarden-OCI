name: Publish PR 280 health lock fix
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-health-lock.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          getent group vaultwarden >/dev/null || sudo groupadd --system vaultwarden
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Execute corrected guarded publisher
        shell: bash
        run: |
          set -euo pipefail
          source_sha='8b99e68c0a8ea9b0c5bba8743a3cf6e40e890a7c'
          git show "${source_sha}:.github/workflows/pr280-health-lock.yml" > /tmp/pr280-publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('/tmp/pr280-publisher.yml').read_text())
          script = next(
              step['run']
              for step in workflow['jobs']['publish']['steps']
              if step.get('name') == 'Verify, test, and publish exact tree'
          )
          old = "grep -Fq 'PASS suite:foundation (6 cases)' /tmp/foundation.log"
          new = "grep -Eq '^PASS[[:space:]]+suite:foundation \\(6 cases\\)$' /tmp/foundation.log"
          if script.count(old) != 1:
              raise SystemExit('foundation suite assertion source did not match exactly once')
          Path('/tmp/pr280-publish.sh').write_text(script.replace(old, new, 1) + '\n')
          PY
          bash -e -o pipefail /tmp/pr280-publish.sh
