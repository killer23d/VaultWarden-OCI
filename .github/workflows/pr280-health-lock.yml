name: Publish PR 280 final lock fix
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-health-lock.yml'
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml
          getent group vaultwarden >/dev/null || sudo groupadd --system vaultwarden
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Validate and publish exact final tree
        shell: bash
        run: |
          set -euo pipefail
          source_sha='8b99e68c0a8ea9b0c5bba8743a3cf6e40e890a7c'
          git show "${source_sha}:.github/workflows/pr280-health-lock.yml" > /tmp/pr280-publisher.yml
          python3 - <<'PY'
          from pathlib import Path
          import yaml

          workflow = yaml.safe_load(Path('/tmp/pr280-publisher.yml').read_text())
          script = next(
              step['run']
              for step in workflow['jobs']['publish']['steps']
              if step.get('name') == 'Verify, test, and publish exact tree'
          )

          def replace_once(old: str, new: str, label: str) -> None:
              global script
              count = script.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              script = script.replace(old, new, 1)

          fixture_patch = r"""python3 - <<'PY_FIXTURES'
          from pathlib import Path

          case_path = Path('tests/suites/operations/case-operations.bash')
          text = case_path.read_text()

          def replace_text_once(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              text = text.replace(old, new, 1)

          helper = r'''kill_test_tree() {
              local pid="$1" state
              [[ "$pid" =~ ^[0-9]+$ ]] || return 0
              "$BASH" -c '
                  set +e
                  kill_tree() {
                      local current="$1" child
                      kill -STOP "$current" 2>/dev/null || return 0
                      while read -r child; do
                          [[ "$child" =~ ^[0-9]+$ ]] || continue
                          kill_tree "$child"
                      done < <(ps -o pid= --ppid "$current" 2>/dev/null)
                      kill -KILL "$current" 2>/dev/null || true
                  }
                  kill_tree "$1"
              ' _ "$pid" >/dev/null 2>&1 || true
              for _ in {1..40}; do
                  [[ ! -d "/proc/${pid}" ]] && return 0
                  state="$(ps -o stat= -p "$pid" 2>/dev/null | tr -d '[:space:]')"
                  [[ -z "$state" || "$state" == Z* ]] && return 0
                  sleep 0.05
              done
              return 1
          }

          '''
          replace_text_once(
              'tmpdir="$(mktemp -d)"\ncleanup() {',
              'tmpdir="$(mktemp -d)"\n' + helper + 'cleanup() {',
              'legacy fixture kill-tree helper',
          )

          old_cleanup = '''    [[ -n "${child_pid:-}" ]] && kill "$child_pid" 2>/dev/null || true
              [[ -n "${owner_pid:-}" ]] && kill "$owner_pid" 2>/dev/null || true
              [[ -n "${owner_launcher_pid:-}" ]] && kill "$owner_launcher_pid" 2>/dev/null || true
              [[ -n "${lock_holder_pid:-}" ]] && kill "$lock_holder_pid" 2>/dev/null || true
              [[ -n "${nested_lock_holder_pid:-}" ]] && kill "$nested_lock_holder_pid" 2>/dev/null || true
              [[ -n "${holder_pid:-}" ]] && kill "$holder_pid" 2>/dev/null || true
              [[ -n "${nonglobal_pid:-}" ]] && kill "$nonglobal_pid" 2>/dev/null || true'''
          new_cleanup = '''    [[ -z "${child_pid:-}" ]] || kill_test_tree "$child_pid" || true
              [[ -z "${owner_pid:-}" ]] || kill_test_tree "$owner_pid" || true
              [[ -z "${owner_launcher_pid:-}" ]] || kill_test_tree "$owner_launcher_pid" || true
              [[ -z "${lock_holder_pid:-}" ]] || kill_test_tree "$lock_holder_pid" || true
              [[ -z "${nested_lock_holder_pid:-}" ]] || kill_test_tree "$nested_lock_holder_pid" || true
              [[ -z "${holder_pid:-}" ]] || kill_test_tree "$holder_pid" || true
              [[ -z "${nonglobal_pid:-}" ]] || kill_test_tree "$nonglobal_pid" || true'''
          replace_text_once(old_cleanup, new_cleanup, 'legacy fixture EXIT cleanup')

          replace_text_once(
              'kill "$child_pid" 2>/dev/null || true\nwait "$child_pid" 2>/dev/null || true',
              'kill_test_tree "$child_pid" || fail "arbitrary child did not terminate during cleanup"\nwait "$child_pid" 2>/dev/null || true',
              'arbitrary child cleanup',
          )
          replace_text_once(
              'kill "$holder_pid" "$nonglobal_pid" 2>/dev/null || true\nwait "$holder_pid" "$nonglobal_pid" 2>/dev/null || true',
              'kill_test_tree "$holder_pid" || fail "global owner fixture did not terminate"\nkill_test_tree "$nonglobal_pid" || fail "non-global owner fixture did not terminate"\nwait "$holder_pid" "$nonglobal_pid" 2>/dev/null || true',
              'global and non-global fixture cleanup',
          )
          replace_text_once(
              'kill "$holder_pid" 2>/dev/null || true\nwait "$holder_pid" 2>/dev/null || true',
              'kill_test_tree "$holder_pid" || fail "same-ID owner fixture did not terminate"\nwait "$holder_pid" 2>/dev/null || true',
              'same-ID fixture cleanup',
          )
          case_path.write_text(text)

          alert_path = Path('tests/suites/operations/case-health-alerts.bash')
          alert_text = alert_path.read_text()
          locale_old = "grep -qx 'c\\.utf-8'"
          locale_new = "grep -Eqx 'c\\.(utf-8|utf8)'"
          if alert_text.count(locale_old) != 1:
              raise SystemExit('UTF-8 locale alias check did not match exactly once')
          alert_path.write_text(alert_text.replace(locale_old, locale_new, 1))
          PY_FIXTURES

          """
          marker = 'rm -f .pr280-* .github/workflows/pr280-health-lock.yml'
          if script.count(marker) != 1:
              raise SystemExit('temporary-file removal marker did not match exactly once')
          script = script.replace(marker, fixture_patch + marker, 1)

          focused_start = 'set +e\ntimeout --kill-after=10s 300s bash tests/suites/operations/case-operations.bash > /tmp/health-lock.log 2>&1\n'
          focused_end = "grep -Fq 'PASS: non-root health uses a user-owned 0600 XDG lock with genuine contention exit 75' /tmp/health-lock.log\n"
          start_index = script.find(focused_start)
          end_index = script.find(focused_end)
          if start_index < 0 or end_index < start_index:
              raise SystemExit('focused health test block was not found')
          script = script[:start_index] + script[end_index + len(focused_end):]

          run_suite_helper = '''run_logged_suite() {
            local suite="$1" log="$2" rc
            set +e
            timeout --kill-after=10s 600s ./tests/run-tests.sh "$suite" >"$log" 2>&1
            rc=$?
            set -e
            cat "$log"
            [[ "$rc" -eq 0 ]] || exit "$rc"
          }
          run_logged_suite foundation /tmp/foundation.log'''
          replace_once(
              './tests/run-tests.sh foundation | tee /tmp/foundation.log',
              run_suite_helper,
              'foundation suite runner',
          )
          replace_once(
              './tests/run-tests.sh security | tee /tmp/security.log',
              'run_logged_suite security /tmp/security.log',
              'security suite runner',
          )
          replace_once(
              './tests/run-tests.sh operations | tee /tmp/operations.log',
              '''run_logged_suite operations /tmp/operations.log
          grep -Fq 'PASS: read-only health uses a dedicated close-on-exec flock owner and releases after owner death' /tmp/operations.log
          grep -Fq 'PASS: health lock path, metadata, wrapper identity, and unexpected flock failures fail as infrastructure errors' /tmp/operations.log
          grep -Fq 'PASS: health --fix remains root-operated under global and health-specific coordination' /tmp/operations.log
          grep -Fq 'PASS: non-root health uses a user-owned 0600 XDG lock with genuine contention exit 75' /tmp/operations.log''',
              'operations suite runner',
          )
          replace_once(
              './tests/run-tests.sh data-protection | tee /tmp/data-protection.log',
              'run_logged_suite data-protection /tmp/data-protection.log',
              'data-protection suite runner',
          )
          replace_once(
              "grep -Fq 'PASS suite:foundation (6 cases)' /tmp/foundation.log",
              "grep -Eq '^PASS[[:space:]]+suite:foundation \\(6 cases\\)$' /tmp/foundation.log",
              'foundation result assertion',
          )

          replace_once(
              'git add tests/suites/operations/case-operations.bash tests/suites/operations/case-lock-fd-hygiene.bash tests/suites/operations/case-crowdsec.bash',
              'git add tests/suites/operations/case-operations.bash tests/suites/operations/case-lock-fd-hygiene.bash tests/suites/operations/case-crowdsec.bash tests/suites/operations/case-health-alerts.bash',
              'test commit file list',
          )
          replace_once(
              'tests/suites/operations/case-crowdsec.bash\n',
              'tests/suites/operations/case-crowdsec.bash\ntests/suites/operations/case-health-alerts.bash\n',
              'final file whitelist',
          )

          if ' | tee /tmp/' in script:
              raise SystemExit('publisher still contains a suite tee pipeline')
          Path('/tmp/pr280-publish.sh').write_text(script + '\n')
          PY
          bash -e -o pipefail /tmp/pr280-publish.sh
