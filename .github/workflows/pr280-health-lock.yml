name: Inspect PR 280 non-root fixture
on:
  pull_request:
    paths:
      - '.github/workflows/pr280-health-lock.yml'
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: codex/small-team-runtime-remediation
          fetch-depth: 0
      - name: Render generated non-root fixture
        shell: bash
        run: |
          set -euo pipefail
          cat \
            .pr280-hl-00 .pr280-hl-01 \
            .pr280-hr-00 .pr280-hr-01 \
            .pr280-q-00 .pr280-q-01 .pr280-q-02 .pr280-q-03 .pr280-q-04 \
            .pr280-hr-03 .pr280-hr-04 .pr280-hr-05 .pr280-hr-06 .pr280-hr-07 \
            .pr280-t-00 .pr280-t-01 .pr280-t-02 .pr280-t-03 .pr280-t-04 .pr280-t-05 \
            .pr280-u-00 .pr280-u-01 .pr280-u-02 .pr280-u-03 .pr280-u-04 \
            .pr280-u-05 .pr280-u-06 .pr280-u-07 .pr280-u-08 .pr280-u-09 \
            .pr280-u-10 .pr280-u-11 .pr280-u-12 .pr280-u-13 .pr280-u-14 \
            .pr280-u-15 .pr280-u-16 > /tmp/pr280.patch.b64
          test "$(wc -c < /tmp/pr280.patch.b64)" -eq 74676
          base64 --decode /tmp/pr280.patch.b64 > /tmp/pr280.patch
          echo '1ac3df57203588a816ebeaec968ffa04c527f97f84d804af9423d6083261be30  /tmp/pr280.patch' | sha256sum --check
          git apply /tmp/pr280.patch
          base64 --decode .pr280-health-test-fix > /tmp/pr280-health-test-fix.patch
          echo '2a03344e110b78f6335896651641e8e74cd3140be7f12027e20bcbb1d7704c0d  /tmp/pr280-health-test-fix.patch' | sha256sum --check
          git apply /tmp/pr280-health-test-fix.patch
          nl -ba tests/suites/operations/case-operations.bash | sed -n '1680,1950p'
