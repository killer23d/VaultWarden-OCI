name: PR2 CI follow-up

on:
  push:
    branches:
      - fix/authenticated-backup-cohort

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/authenticated-backup-cohort
          fetch-depth: 0
      - name: Apply focused fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('utilities/backup-run.sh')
          text=p.read_text()
          replacements = {
            'log_error "[backup] Emergency restore metadata upload FAILED: $(basename "$local_member") (exit ${upload_rc}) — remote recovery point is incomplete." >&2':
              'log_error "[backup] Emergency restore metadata upload FAILED: $(basename "$local_member") (exit ${upload_rc}) — remote emergency recovery point is incomplete." >&2',
            'log_error "[backup] Emergency offsite delivery is incomplete: restore-critical metadata is missing or unusable." >&2':
              'log_error "[backup] Emergency offsite delivery is incomplete: restore-critical metadata is missing, unusable, or not delivered." >&2',
          }
          for old,new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'emergency metadata message anchor count={text.count(old)}: {old[:60]}')
              text=text.replace(old,new,1)
          old='''        local retained_archive suffix
        while IFS= read -r -d '' retained_archive; do
            while IFS= read -r suffix; do
                [[ -f "${retained_archive}${suffix}" && ! -L "${retained_archive}${suffix}" && -s "${retained_archive}${suffix}" ]] || {
                    log_error "[backup] Retained ${t} backup has an incomplete required cohort: $(basename "${retained_archive}${suffix}")"
                    return 1
                }
            done < <(backup_required_cohort_suffixes)
            if [[ "$t" == "emergency" ]] && ! _validate_emergency_restore_metadata "$retained_archive"; then
                log_error "[backup] Retained emergency backup is not restore-usable: $(basename "$retained_archive")"
                log_error "[backup] This emergency recovery point is not safe to report as offsite complete."
                return 1
            fi
        done < <(find "$local_dir" -maxdepth 1 -name '*.age' -type f -print0)
'''
          new='''        local retained_archive suffix
        while IFS= read -r -d '' retained_archive; do
            if [[ "$t" == "emergency" ]] && ! _validate_emergency_restore_metadata "$retained_archive"; then
                log_error "[backup] Retained emergency backup is not restore-usable: $(basename "$retained_archive")"
                log_error "[backup] This emergency recovery point is not safe to report as offsite complete."
                return 1
            fi
            while IFS= read -r suffix; do
                [[ -f "${retained_archive}${suffix}" && ! -L "${retained_archive}${suffix}" && -s "${retained_archive}${suffix}" ]] || {
                    log_error "[backup] Retained ${t} backup has an incomplete required cohort: $(basename "${retained_archive}${suffix}")"
                    return 1
                }
            done < <(backup_required_cohort_suffixes)
        done < <(find "$local_dir" -maxdepth 1 -name '*.age' -type f -print0)
'''
          if text.count(old) != 1:
              raise SystemExit(f'retained emergency validation block count={text.count(old)}')
          p.write_text(text.replace(old,new,1))
          PY
          bash utilities/write-command-reference.sh
          bash -n utilities/backup-run.sh utilities/restore-run.sh tests/suites/data-protection/case-backup.bash tests/suites/data-protection/case-restore-recovery.bash
          git diff --check
      - name: Run focused data-protection suite
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update >/dev/null
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml >/dev/null
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
          ./tests/run-tests.sh data-protection
      - name: Commit fixes and remove helper workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr2-ci-followup.yml
          git add utilities/backup-run.sh docs/COMMAND-REFERENCE.md
          git commit -m "backup: align generated docs and emergency status"
          git push origin HEAD:fix/authenticated-backup-cohort
