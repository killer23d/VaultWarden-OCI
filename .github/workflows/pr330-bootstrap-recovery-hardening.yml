name: PR330 exact bootstrap contract
on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Remove unnecessary no-backup override and add bootstrap contract coverage
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              return text.replace(old, new, 1)

          controller = Path('utilities/noble-host-acceptance.sh')
          text = controller.read_text()
          text = replace_once(
              text,
              '--from-recovery-kit "$RECOVERY_KIT" --no-backup --start-policy manual --force',
              '--from-recovery-kit "$RECOVERY_KIT" --start-policy manual --force',
              'exact restore no-backup removal',
          )
          controller.write_text(text)

          test = Path('tests/suites/operations/case-host-acceptance.bash')
          text = test.read_text()
          text = replace_once(
              text,
              'A="$ROOT_REPO/utilities/noble-host-acceptance.sh"\n',
              'A="$ROOT_REPO/utilities/noble-host-acceptance.sh"\nRESTORE="$ROOT_REPO/utilities/restore-run.sh"\n',
              'restore owner path',
          )
          marker = '''! grep -Fq 'restore.sh latest full --remote' "$A" || fail "controller still restores an unbound remote latest backup"\n'''
          coverage = marker + '''! grep -Fq -- '--no-backup --start-policy manual --force' "$A" \\
  || fail "fresh full DR restore still bypasses canonical snapshot policy with --no-backup"\ngrep -Fq '&& [[ "$USE_REMOTE" == "true" ]]' "$RESTORE" \\
  || fail "canonical restore no longer admits missing-environment remote bootstrap mode"\nexplicit_file_line="$(grep -Fn 'if [[ -n "$BACKUP_FILE" ]]' "$RESTORE" | head -1 | cut -d: -f1)"\nsource_select_line="$(grep -Fn 'select_backup_source || return 1' "$RESTORE" | head -1 | cut -d: -f1)"\n[[ "$explicit_file_line" =~ ^[0-9]+$ && "$source_select_line" =~ ^[0-9]+$ ]] \\
  || fail "canonical exact-file/remote-source selection contract could not be located"\n(( explicit_file_line < source_select_line )) \\
  || fail "canonical restore no longer gives explicit --file precedence over remote source selection"\n'''
          text = replace_once(text, marker, coverage, 'bootstrap cross-contract coverage')
          test.write_text(text)

          doc = Path('docs/HOST-ACCEPTANCE.md')
          text = doc.read_text()
          text = replace_once(
              text,
              'canonical `restore.sh interactive --remote --file <staged-full-backup> --from-recovery-kit ... --no-backup --start-policy manual --force`; the local file is still the exact restore source while `--remote` enables the supported missing-environment bootstrap path;',
              'canonical `restore.sh interactive --remote --file <staged-full-backup> --from-recovery-kit ... --start-policy manual --force`; the local file is still the exact restore source while `--remote` enables the supported missing-environment bootstrap path. The controller does not force `--no-backup`; canonical full restore already skips the snapshot on a genuinely fresh target with no live database and retains its normal snapshot policy otherwise;',
              'runbook exact restore command',
          )
          doc.write_text(text)
          PY

          bash -n utilities/noble-host-acceptance.sh
          bash -n tests/suites/operations/case-host-acceptance.bash
          git diff --check

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age shellcheck

      - name: Validate permanent contract and lint
        run: |
          bash tests/suites/operations/case-host-acceptance.bash
          shellcheck -x --severity=warning utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash
          git diff --check

      - name: Commit exact bootstrap contract
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md
          git diff --cached --quiet && { echo 'No changes to commit'; exit 1; }
          git commit -m "test: lock exact bootstrap restore contract"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
