name: PR10 normalize checksum

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  normalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Normalize checksum function
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          p = Path('lib/crypto.sh')
          s = p.read_text()
          a = s.index('calculate_sha256() {')
          b = s.index('\nverify_sha256() {', a)
          body = """calculate_sha256() {
              local file=\"$1\"

              if [[ ! -f \"$file\" ]]; then
                  log_error \"File not found for checksum: $file\"
                  return 1
              fi

              local checksum
              if has_command sha256sum; then
                  checksum=$(sha256sum \"$file\" | cut -d' ' -f1)
              elif has_command shasum; then
                  checksum=$(shasum -a 256 \"$file\" | cut -d' ' -f1)
              else
                  log_error \"No SHA256 utility available (sha256sum or shasum)\"
                  return 1
              fi

              printf '%s\\n' \"$checksum\"
          }
          """
          p.write_text(s[:a] + body + s[b+1:])
          PY
          git rm .github/workflows/pr10-normalize-crypto.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "chore: normalize checksum branch for PR10 apply"
          git push origin HEAD:agent/pr10-platform-simplification
