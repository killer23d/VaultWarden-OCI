name: Temporary PR330 post-reboot source reproof hardening v2

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply corrected post-reboot recovery reproof patch
        run: |
          awk '
            /^[[:space:]]+python3 <<'\''PY'\''$/ { capture=1; next }
            capture && /^[[:space:]]+PY$/ { exit }
            capture { sub(/^          /, ""); print }
          ' .github/workflows/tmp-pr330-post-reboot-reproof.yml > /tmp/pr330-patch.py
          python3 /tmp/pr330-patch.py
          python3 <<'PY'
          from pathlib import Path
          p = Path('utilities/noble-host-acceptance.sh')
          text = p.read_text()
          old = '    local prefix="$1" kit="$2" stage_name="${3:-verify-${prefix,,}}" retain_stage="${4:-false}"\n'
          new = '    local prefix="$1" kit="$2"\n    local stage_name="${3:-verify-${prefix,,}}" retain_stage="${4:-false}"\n'
          if text.count(old) != 1:
              raise SystemExit('expected one staged local-declaration target')
          p.write_text(text.replace(old, new, 1))
          PY
          bash -n utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash

      - name: Install focused dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age shellcheck

      - name: Run host-acceptance contract
        run: bash tests/suites/operations/case-host-acceptance.bash

      - name: Run warning-level focused ShellCheck
        run: |
          shellcheck -S warning -x utilities/noble-host-acceptance.sh
          shellcheck -S warning -x tests/suites/operations/case-host-acceptance.bash

      - name: Commit validated product changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md
          git diff --cached --quiet && { echo 'No product changes to commit'; exit 1; }
          git commit -m 'fix: reprove DR source immediately before reset'
          git push origin HEAD:test/noble-host-acceptance
