name: Temporary upstream stable pin discovery
on:
  pull_request:
    branches: [v2]
permissions:
  contents: read
jobs:
  resolve-public-pins:
    if: github.head_ref == 'release/0.1.0-upstream-pins'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - name: Read official release, tag and OCI registry metadata
        shell: bash
        run: |
          set -Eeuo pipefail
          set +x
          python3 - <<'PY'
          import json, re, urllib.parse, urllib.request
          def get(url, headers=None):
              h = {'User-Agent':'VaultWarden-OCI-public-pin-review','Accept':'application/vnd.github+json'}
              h.update(headers or {})
              with urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=25) as response:
                  return json.load(response)
          def stable(s):
              return isinstance(s,str) and re.fullmatch(r'v?[0-9]+\.[0-9]+\.[0-9]+',s)
          def release(repo):
              item=get('https://api.github.com/repos/'+repo+'/releases/latest')
              tag=item['tag_name']
              assert item['draft'] is False and item['prerelease'] is False and stable(tag)
              print('RELEASE',repo,tag,item['published_at'],item['html_url'])
              return tag.removeprefix('v')
          def tags(repo):
              all_tags=[]
              for page in range(1,11):
                  items=get('https://api.github.com/repos/'+repo+'/tags?per_page=100&page='+str(page))
                  assert isinstance(items,list)
                  all_tags.extend(x['name'] for x in items if stable(x['name']))
                  if len(items)<100:
                      break
              else:
                  raise RuntimeError('tag scan incomplete: '+repo)
              all_tags.sort(key=lambda t:tuple(map(int,t.removeprefix('v').split('.'))),reverse=True)
              print('STABLE_TAGS',repo,json.dumps(all_tags))
              return all_tags
          v=release('dani-garcia/vaultwarden')
          c=release('caddyserver/caddy')
          dns=tags('caddy-dns/cloudflare')[0]
          combine=tags('fvbommel/caddy-combine-ip-ranges')[0]
          rate=tags('mholt/caddy-ratelimit')[0]
          trust_tags=tags('WeidiDeng/caddy-cloudflare-ip')
          trust='f53b62aa13cb7ad79c8b47aacc3f2f03989b67e5'
          if trust_tags:
              print('TRUST_TAG_REVIEW_REQUIRED',trust_tags[0])
          else:
              print('UNTAGGED_TRUST_PLUGIN_RETAIN',trust)
          def manifest(repo,tag):
              scope=urllib.parse.quote('repository:'+repo+':pull',safe=':/')
              token=get('https://auth.docker.io/token?service=registry.docker.io&scope='+scope)['token']
              payload=get('https://registry-1.docker.io/v2/'+repo+'/manifests/'+tag,{
                  'Accept':'application/vnd.oci.image.index.v1+json, application/vnd.docker.distribution.manifest.list.v2+json',
                  'Authorization':'Bearer '+token})
              out={}
              for arch in ('amd64','arm64'):
                  matches=[x['digest'] for x in payload['manifests'] if x.get('platform',{}).get('os')=='linux' and x.get('platform',{}).get('architecture')==arch]
                  assert len(matches)==1 and re.fullmatch(r'sha256:[0-9a-f]{64}',matches[0]),(repo,tag,arch)
                  out[arch]=matches[0]
                  print('REGISTRY',repo,tag,arch,matches[0])
              return out
          result={'vaultwarden':manifest('vaultwarden/server',v),'caddy_builder':manifest('library/caddy',c+'-builder-alpine'),'caddy_runtime':manifest('library/caddy',c+'-alpine')}
          print('PIN_DISCOVERY_BEGIN')
          print('schema_version = 1\n\n[vaultwarden_oci]\nversion = "0.1.0-rc.16"\n\n[components]')
          for k,value in {'vaultwarden':v,'caddy':c,'caddy_dns_cloudflare':dns,'caddy_cloudflare_ip':trust,'caddy_combine_ip_ranges':combine,'caddy_ratelimit':rate}.items():
              print(k+' = '+json.dumps(value))
          for k,values in result.items():
              print('\n[image_digests.'+k+']')
              for arch,digest in values.items():
                  print(arch+' = '+json.dumps(digest))
          print('PIN_DISCOVERY_END')
          PY
