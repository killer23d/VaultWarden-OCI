name: PR330 acceptance hardening lint fix
on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch focused lint findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/workflows/pr330-acceptance-hardening.yml')
          text = path.read_text()

          old_cleanup = 'rm -rf -- "$STATE_ROOT/$stage_name"'
          if text.count(old_cleanup) != 1:
              raise SystemExit(f'expected one unsafe cleanup expression, found {text.count(old_cleanup)}')
          text = text.replace(old_cleanup, 'rm -rf -- "${STATE_ROOT:?}/${stage_name:?}"', 1)

          start = text.index("test.write_text(r'''#!/usr/bin/env bash")
          end = text.index("\n          ''')", start)
          block = text[start:end]

          annotations = {
              'RCLONE_REMOTE=acceptance': 'consumed by sourced acceptance helpers',
              'RCLONE_REMOTE_PATH=vaultwarden_acceptance': 'consumed by sourced acceptance helpers',
              'DNS_MUTATION_DOMAIN=vw-acceptance.example.com': 'consumed by sourced acceptance helpers',
              'ALLOW_DNS_MUTATION=true': 'consumed by sourced acceptance helpers',
              'DESTRUCTIVE=true': 'consumed by sourced acceptance helpers',
              'VW_NOBLE_TEST_DNS_MUTATION=YES': 'consumed by sourced acceptance helpers',
              'STATE_ROOT="$AT/state"': 'consumed by sourced recovery helpers',
          }

          for assignment, reason in annotations.items():
              pattern = re.compile(r'(?m)^(\s*)' + re.escape(assignment) + r'$')
              matches = list(pattern.finditer(block))
              if not matches:
                  raise SystemExit(f'expected at least one generated test assignment: {assignment}')
              block = pattern.sub(
                  lambda m: f'{m.group(1)}# shellcheck disable=SC2034 # {reason}\n{m.group(1)}{assignment}',
                  block,
              )

          old_stub = '            download_bound_backup(){ BOUND_BACKUP_FILE="$AT/post-dr-full.age"; }'
          new_stub = '''            download_bound_backup(){
              # shellcheck disable=SC2034 # consumed by sourced verify_bound_backup_with_kit()
              BOUND_BACKUP_FILE="$AT/post-dr-full.age"
            }'''
          if block.count(old_stub) != 1:
              raise SystemExit(f'expected one generated download stub, found {block.count(old_stub)}')
          block = block.replace(old_stub, new_stub, 1)

          text = text[:start] + block + text[end:]
          path.write_text(text)
          PY
          git diff --check
      - name: Commit lint fixes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr330-acceptance-hardening-fix.yml
          git add .github/workflows/pr330-acceptance-hardening.yml
          git commit -m "ci: fix focused acceptance hardening lint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
