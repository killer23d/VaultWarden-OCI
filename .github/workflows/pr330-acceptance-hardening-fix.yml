name: PR330 acceptance hardening lint fix
on:
  pull_request:

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Patch focused lint findings
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr330-acceptance-hardening.yml')
          text = path.read_text()

          replacements = [
              ('rm -rf -- "$STATE_ROOT/$stage_name"',
               'rm -rf -- "${STATE_ROOT:?}/${stage_name:?}"'),
              ('  RCLONE_REMOTE=acceptance\n  RCLONE_REMOTE_PATH=vaultwarden_acceptance\n  DNS_MUTATION_DOMAIN=vw-acceptance.example.com\n  ALLOW_DNS_MUTATION=true\n  : > "$RECOVERY_KIT"; : > "$RCLONE_CONFIG_PATH"; : > "$APPLICATION_E2E"\n  DESTRUCTIVE=true\n  VW_NOBLE_TEST_DNS_MUTATION=YES',
               '  # shellcheck disable=SC2034 # consumed by sourced validate_inputs()\n  RCLONE_REMOTE=acceptance\n  # shellcheck disable=SC2034 # consumed by sourced validate_inputs()\n  RCLONE_REMOTE_PATH=vaultwarden_acceptance\n  DNS_MUTATION_DOMAIN=vw-acceptance.example.com\n  ALLOW_DNS_MUTATION=true\n  : > "$RECOVERY_KIT"; : > "$RCLONE_CONFIG_PATH"; : > "$APPLICATION_E2E"\n  # shellcheck disable=SC2034 # consumed by sourced validate_inputs()\n  DESTRUCTIVE=true\n  # shellcheck disable=SC2034 # consumed by sourced validate_inputs()\n  VW_NOBLE_TEST_DNS_MUTATION=YES'),
              ('  DNS_MUTATION_DOMAIN=vw-acceptance.example.com\n  ALLOW_DNS_MUTATION=true\n  runtime_config_value(){ printf \'vw-acceptance.example.com\\n\'; }',
               '  # shellcheck disable=SC2034 # consumed by sourced validate_dns_mutation_scope()\n  DNS_MUTATION_DOMAIN=vw-acceptance.example.com\n  # shellcheck disable=SC2034 # consumed by sourced validate_dns_mutation_scope()\n  ALLOW_DNS_MUTATION=true\n  runtime_config_value(){ printf \'vw-acceptance.example.com\\n\'; }'),
              ('  STATE_ROOT="$AT/state"\n  age-keygen -o "$AT/old.key"',
               '  # shellcheck disable=SC2034 # consumed by sourced recovery helpers\n  STATE_ROOT="$AT/state"\n  age-keygen -o "$AT/old.key"'),
              ('  download_bound_backup(){ BOUND_BACKUP_FILE="$AT/post-dr-full.age"; }',
               '  download_bound_backup(){\n    # shellcheck disable=SC2034 # consumed by sourced verify_bound_backup_with_kit()\n    BOUND_BACKUP_FILE="$AT/post-dr-full.age"\n  }'),
          ]

          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'expected exactly one lint-fix match, found {count}: {old!r}')
              text = text.replace(old, new, 1)

          path.write_text(text)
          PY
          git diff --check
      - name: Commit lint fixes and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/pr330-acceptance-hardening-fix.yml
          git add .github/workflows/pr330-acceptance-hardening.yml
          git commit -m "ci: fix focused acceptance hardening lint"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
