name: Single lock ownership bootstrap

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  apply-validate-push:
    if: >-
      github.event.pull_request.head.ref == 'refactor/single-lock-ownership' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Verify prepared base
        run: |
          git fetch origin delta
          test "$(git rev-parse origin/delta)" = "1ff4f908866de7a917c37fa37147981d238af28f"
          git merge-base --is-ancestor 1ff4f908866de7a917c37fa37147981d238af28f HEAD

      - name: Install validation dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils p7zip-full python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo "fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo "154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Apply bounded patch
        run: |
          base64 --decode .github/single-lock-transform.py.gz.b64 | gzip -dc > /tmp/transform.py
          python3 /tmp/transform.py
          rm -f .github/single-lock-transform.py.gz.b64
          rm -f .github/workflows/single-lock-ownership-bootstrap.yml

      - name: Mandatory lock inventory
        run: |
          grep -RInE --exclude-dir=.git \
            'operation_acquire|--specific-lock|--no-global|(^|[^[:alnum:]_])flock([^[:alnum:]_]|$)|/run/lock/vaultwarden-|VW_OPERATIONS_LOCK|VW_HEALTH_LOCK_FILE|(^|[^[:alnum:]_])(chmod|chown|touch|install)([^[:alnum:]_]|$).*lock|lock.*(^|[^[:alnum:]_])(chmod|chown|touch|install)([^[:alnum:]_]|$)|groupadd|usermod|20-identity\.conf|30-run-as-root\.conf' \
            -- '*.sh' lib utilities tests systemd .github Makefile 2>/dev/null | sort || true

      - name: Verify focused diff
        run: |
          expected=$(cat <<'EOF'
          lib/operations.sh
          tests/suites/foundation/case-systemd.bash
          tests/suites/operations/case-health-alerts.bash
          tests/suites/operations/case-lock-fd-hygiene.bash
          tests/suites/operations/case-operations.bash
          utilities/maintenance-health.sh
          utilities/setup-systemd.sh
          EOF
          )
          actual=$(git diff --name-only origin/delta | sort)
          test "$actual" = "$expected"
          test -z "$(git diff --name-status origin/delta | awk '$1 != "M" {print}')"
          git diff --check origin/delta

      - name: Repository-wide Bash syntax
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n1 bash -n

      - name: Strict ShellCheck
        run: |
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 shellcheck -x --severity=warning

      - name: Docker Compose example validation
        run: docker compose --env-file .env.example -f docker-compose.yml.example config --quiet

      - name: Command reference regeneration and drift
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          diff -u /tmp/COMMAND-REFERENCE.committed.md docs/COMMAND-REFERENCE.md

      - name: Production readiness verification
        run: python3 utilities/verify-production-readiness-remediation.py

      - name: Full functional test suite
        run: ./tests/run-tests.sh all

      - name: Commit and push final branch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Refactor single lock ownership"
          git push origin HEAD:refactor/single-lock-ownership
