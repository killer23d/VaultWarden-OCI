name: PR8 authority fixture updates
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Install focused test dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml shellcheck zstd
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Update authority-aware fixtures
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('tests/suites/operations/case-lifecycle.bash')
          text = p.read_text()
          old = '  mkdir -p "$repo/secrets/keys"\n'
          new = '  mkdir -p "$repo" "$state/config"\n'
          if text.count(old) != 1:
              raise SystemExit(f'lifecycle legacy fixture mkdir expected once, got {text.count(old)}')
          text = text.replace(old, new)
          anchor = '  chmod 600 "$repo/.env"\n'
          runtime = '  cat > "$state/config/install.env" <<EOF_RUNTIME\nDOMAIN=https://systemd-policy.example.test\nADMIN_EMAIL=admin@example.test\nPROJECT_STATE_DIR=$state\nDATA_VOLUME_DEVICE=\nDATA_VOLUME_MOUNT=$state\nSOPS_AGE_KEY_FILE=/etc/vaultwarden/age-key.txt\nEOF_RUNTIME\n  chmod 600 "$state/config/install.env"\n'
          if text.count(anchor) != 1:
              raise SystemExit('lifecycle repo env chmod anchor mismatch')
          text = text.replace(anchor, anchor + runtime)
          old_key = "  cat > \"$repo/secrets/keys/age-key.txt\" <<'EOF_KEY'\n# public key: age1systemdpolicy000000000000000000000000000000000000000000\nAGE-SECRET-KEY-1SYSTEMDPOLICY\nEOF_KEY\n  chmod 600 \"$repo/secrets/keys/age-key.txt\"\n"
          if text.count(old_key) != 1:
              raise SystemExit(f'lifecycle checkout key fixture expected once, got {text.count(old_key)}')
          text = text.replace(old_key, '')
          old_stub = 'check_docker_available(){ return 0; }\nwait_for_service_ready(){ return 0; }\n'
          new_stub = 'check_docker_available(){ return 0; }\ncheck_compose_available(){ return 0; }\nwait_for_service_ready(){ return 0; }\n'
          if text.count(old_stub) != 1:
              raise SystemExit(f'startup-hardening Docker stub expected once, got {text.count(old_stub)}')
          p.write_text(text.replace(old_stub, new_stub))

          p = Path('tests/suites/data-protection/case-backup.bash')
          text = p.read_text()
          old = 'SOPS_AGE_KEY_FILE=$age_key\n'
          new = 'SOPS_AGE_KEY_FILE=/etc/vaultwarden/age-key.txt\n'
          if text.count(old) != 1:
              raise SystemExit(f'backup manifest override fixture expected once, got {text.count(old)}')
          text = text.replace(old, new)
          old = 'backup_archive_exclusions "$ROOT" "$state" "$dotdot_backup" "$age_key")'
          new = 'backup_archive_exclusions "$ROOT" "$state" "$dotdot_backup" "/etc/vaultwarden/age-key.txt")'
          if text.count(old) != 1:
              raise SystemExit(f'backup effective exclusion comparison expected once, got {text.count(old)}')
          p.write_text(text.replace(old, new))
          PY
          bash -n tests/suites/operations/case-lifecycle.bash tests/suites/data-protection/case-backup.bash
          shellcheck -x --severity=warning tests/suites/operations/case-lifecycle.bash tests/suites/data-protection/case-backup.bash
          ./tests/run-tests.sh operations
          ./tests/run-tests.sh data-protection
      - name: Commit fixture updates and remove helper workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-ops-data-fixture-fix.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'test: align lifecycle and backup fixtures with runtime authority'
          git push origin HEAD:pr8-runtime-authority-age-custody
