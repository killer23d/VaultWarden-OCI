name: Temporary chunked CQA root-hints publisher

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Reassemble exact patch and fast-forward PR 266
        run: |
          set -euo pipefail
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/delta)" = '5cdee3c2f527e565e76e7da78da1d4f628b26041'
          test "$(git rev-parse origin/cqa-root-hints)" = '54d6a3194d0521834060956df5754b640c14b042'

          cat .github/cqa-patch-chunks/00 .github/cqa-patch-chunks/01 \
              .github/cqa-patch-chunks/02 .github/cqa-patch-chunks/03 \
              > /tmp/cqa.payload
          tr -d '\n' < .github/cqa-patch-chunks/04r | rev >> /tmp/cqa.payload
          tr -d '\n' < .github/cqa-patch-chunks/05r | rev >> /tmp/cqa.payload
          tr -d '\n' < /tmp/cqa.payload > /tmp/cqa.payload.clean
          echo '4ac4ca3db2ba250e44f319da1061b0ee1aa8ec3fc0963c4b7fa873053eb7a863  /tmp/cqa.payload.clean' | sha256sum --check --status
          base64 -d /tmp/cqa.payload.clean > /tmp/cqa.patch.gz
          echo '872809e1f590d25dc53d335eb2569e9b2c9749703ecdc3ee67acbd584fb0c700  /tmp/cqa.patch.gz' | sha256sum --check --status
          gzip -dc /tmp/cqa.patch.gz > /tmp/cqa.patch
          echo '4aac46a2b762f4f59af2d4c6f151e517df6081fa53d571dafb2bb493c823d3d6  /tmp/cqa.patch' | sha256sum --check --status

          git config user.name OpenAI
          git config user.email noreply@openai.com
          git switch -C cqa-root-hints origin/cqa-root-hints
          git apply --check /tmp/cqa.patch
          git apply /tmp/cqa.patch
          git diff --check
          test "$(git diff --name-only | sort)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          ./tests/run-tests.sh list >/dev/null
          git add lib/common.sh tests/suites/security/case-security-privileges.bash
          test "$(git write-tree)" = 'e71547427055a12690ef93f5a410d45af540c425'
          git commit -m 'fix(privilege): make bare remediation paths executable'
          test "$(git ls-remote origin refs/heads/cqa-root-hints | cut -f1)" = '54d6a3194d0521834060956df5754b640c14b042'
          git push origin HEAD:refs/heads/cqa-root-hints
          git rev-parse HEAD
