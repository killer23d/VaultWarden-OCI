name: PR8 final safety inspection
on:
  push:
    branches: [pr8-runtime-authority-age-custody]
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: pr8-runtime-authority-age-custody
          fetch-depth: 0
      - name: Pass 2 - retained safety and cleaned-tree audit
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin delta:refs/remotes/origin/delta

          echo '--- validated-tree drift ---'
          drift="$(git diff --name-only 23ac05bfe146d97f0e1447051757ffbe1ece6835 HEAD -- | grep -v '^.github/workflows/pr8-final-pass2.yml$' || true)"
          printf '%s\n' "$drift"
          [[ -z "$drift" ]] || { echo 'Product tree changed after the successful full validation' >&2; exit 1; }

          echo '--- controlled SQLite offline fallback ---'
          grep -Fq 'SQLite Online Backup API failed — attempting safe offline fallback' utilities/backup-run.sh
          grep -Fq 'docker compose stop "$vw_container_name"' utilities/backup-run.sh
          grep -Fq 'DB_SNAPSHOT_METHOD="offline-checkpoint-copy"' utilities/backup-run.sh
          grep -Fq '_db_snapshot_restart_if_needed' utilities/backup-run.sh

          echo '--- Caddy degraded logging ---'
          git diff --quiet origin/delta...HEAD -- caddy/entrypoint.sh caddy/Caddyfile.degraded
          grep -Fq 'export CADDY_DEGRADED=true' caddy/entrypoint.sh
          grep -Fq 'CADDYFILE=/etc/caddy/Caddyfile.degraded' caddy/entrypoint.sh

          echo '--- shared operation guard / exit 75 ---'
          grep -Fq 'flock -n -E 75' lib/operations.sh
          grep -Fq 'return 75' lib/operations.sh
          grep -Fq 'operation_acquire' utilities/backup-run.sh
          grep -Fq 'operation_acquire' utilities/restore-run.sh
          grep -Fq 'operation_acquire' utilities/maintenance-update-dns.sh

          echo '--- restore staging, traversal, capacity, rollback ---'
          grep -Fq 'Archive contains unsafe paths. Refusing to extract.' utilities/restore-run.sh
          grep -Fq '_restore_preflight_archive_expansion_capacity' utilities/restore-run.sh
          grep -Fq '_restore_preflight_db_commit_capacity' utilities/restore-run.sh
          grep -Fq '_rollback_rotation' utilities/restore-run.sh
          grep -Fq '_rollback_payload_paths' utilities/restore-run.sh
          grep -Fq 'RESTORE_FULL_PROMOTION_COMMITTED' utilities/restore-run.sh

          echo '--- unrelated safety surfaces remained untouched ---'
          ! git diff --name-only origin/delta...HEAD -- | grep -Eq '(^|/)(firewall|ufw)|cloudflare.*cidr' || { echo 'Firewall/CIDR safety files changed unexpectedly' >&2; exit 1; }
          ! git diff --unified=0 origin/delta...HEAD -- utilities/setup-system.sh | grep -E '^[+-].*(mkfs|format|adopt|DATA_VOLUME_DEVICE|filesystem identity)' || { echo 'Storage adoption/format safety changed unexpectedly' >&2; exit 1; }
          ! git diff --unified=0 origin/delta...HEAD -- utilities/setup-secrets.sh | grep -E '^[+-].*(SETUP_SECRETS_CLEANUP_ACTIONS|cleanup.*recovery|recovery.*cleanup|remove_sensitive_workspace)' || { echo 'Recovery cleanup safety changed unexpectedly' >&2; exit 1; }
          ! git diff --unified=0 origin/delta...HEAD -- utilities/maintenance-health.sh | grep -E '^[+-].*(incident|correlation|persist|persistence)' || { echo 'Health incident/correlation persistence changed unexpectedly' >&2; exit 1; }

          echo 'PASS final inspection 2: validated tree unchanged and protected safety primitives retained'
      - name: Remove inspection workflow
        shell: bash
        run: |
          rm -f .github/workflows/pr8-final-pass2.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'chore: remove PR8 final safety inspection helper'
          git push origin HEAD:pr8-runtime-authority-age-custody
