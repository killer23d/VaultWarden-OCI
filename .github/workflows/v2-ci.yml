name: V2 CI

on:
  push:
    branches: [v2, "codex/**"]
  pull_request:
    branches: [v2]

permissions:
  contents: read

jobs:
  quality-unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Verify Python 3.12
        run: python3 -c 'import sys; assert sys.version_info[:2] == (3, 12), sys.version'
      - name: Compile Python
        run: python3 -m compileall -q vaultwarden_oci tests/v2
      - name: Parse shell glue
        run: bash -n bootstrap-v2.sh tests/v2/acceptance_edge_packet.sh
      - name: V2 unit and bounded integration suite
        run: python3 -m unittest discover -s tests/v2 -p 'test_*.py' -v
      - name: CLI help is authoritative
        run: |
          ./vwctl --help >/dev/null
          ./vwctl doctor --help >/dev/null
          ./vwctl update --help >/dev/null

  recovery-crypto-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Install pinned recovery tools
        run: |
          sudo apt-get update
          sudo apt-get install -y age rclone
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.3/sops-v3.13.3.linux.amd64 -o /tmp/sops
          echo "e5bec3346a873ae91d871550f3e698c1aad962aff462a080e40f25fde17fef6b  /tmp/sops" | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops
      - name: Real Age SOPS rclone recovery path
        run: python3 tests/v2/acceptance_recovery_crypto.py

  edge-packet-integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - name: Real Docker IPv4 IPv6 origin path
        run: sudo bash tests/v2/acceptance_edge_packet.sh
