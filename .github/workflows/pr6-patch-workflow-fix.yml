name: PR6 patch workflow fixture fix
on:
  push:
    branches:
      - agent/pr6-update-crowdsec-readiness
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: agent/pr6-update-crowdsec-readiness
      - name: Fix fixture and publish
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('.github/workflows/pr6-review-fixes.yml')
          text = path.read_text()
          old = "                  '    export CSCLI_LAST_PULL=\"$(date -u +\\'%Y-%m-%dT%H:%M:%SZ\\')\"',\n"
          new = (
              "                  '    CSCLI_LAST_PULL=\"$(date -u +\\'%Y-%m-%dT%H:%M:%SZ\\')\"',\n"
              "                  '    export CSCLI_LAST_PULL',\n"
          )
          if text.count(old) != 1:
              raise SystemExit(f'fixture line expected once, found {text.count(old)}')
          text = text.replace(old, new, 1)
          guard = "    if: github.actor != 'github-actions[bot]'\n"
          if text.count(guard) != 1:
              raise SystemExit(f'actor guard expected once, found {text.count(guard)}')
          path.write_text(text.replace(guard, '', 1))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/pr6-review-fixes.yml
          git rm .github/workflows/pr6-patch-workflow-fix.yml
          git commit -m 'chore: fix PR6 patch fixture lint'
          git push origin HEAD:agent/pr6-update-crowdsec-readiness
