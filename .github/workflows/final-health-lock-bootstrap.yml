name: Finalize host-global health coordination

on:
  pull_request:
    types:
      - reopened
    branches:
      - delta

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out review branch
        uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Verify bounded staging state
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 16e957832640dfe8ccdf38bbc5db7c5be12ca189 HEAD
          expected=$'.github/final-health-transform.part00\n.github/final-health-transform.part01\n.github/final-health-transform.part02\n.github/workflows/final-health-lock-bootstrap.yml'
          actual="$(git diff --name-only 16e957832640dfe8ccdf38bbc5db7c5be12ca189...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected bootstrap staging diff:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml

          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Apply reviewed transform
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-health-transform.part?? \
            | base64 -d \
            | gzip -d \
            > /tmp/final-health-transform.py
          python3 -m py_compile /tmp/final-health-transform.py
          python3 /tmp/final-health-transform.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/suites/operations/case-health-alerts.bash')
          text = path.read_text()
          old = '    local label="$1" path="/run/lock/vaultwarden-health-test-${UID}-${BASHPID}-${RANDOM}-${label}"\n'
          new = '    local label="$1"\n    local path="/run/lock/vaultwarden-health-test-${UID}-${BASHPID}-${RANDOM}-${label}"\n'
          if text.count(old) != 2:
              raise SystemExit('Expected two test lock-target local declarations')
          path.write_text(text.replace(old, new))
          PY

          git diff --check
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash

      - name: Run operations suite
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run-tests.sh operations

      - name: Verify scope and publish code
        shell: bash
        run: |
          set -euo pipefail
          expected=$'systemd/vaultwarden-health.service\ntests/suites/operations/case-health-alerts.bash\nutilities/maintenance-health.sh'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected transformed file set:\n%s\n' "$actual" >&2
            exit 1
          }
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            systemd/vaultwarden-health.service \
            tests/suites/operations/case-health-alerts.bash \
            utilities/maintenance-health.sh
          git diff --cached --check
          git commit -m 'Use one host-global health coordinator'
          git push origin HEAD:refactor/single-lock-ownership
