name: Finalize host-global health coordination

on:
  pull_request:
    types:
      - reopened
    branches:
      - delta

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out current review branch head
        uses: actions/checkout@v5
        with:
          ref: refactor/single-lock-ownership
          fetch-depth: 0

      - name: Detect execution mode
        id: mode
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .github/final-health-transform.part00 ]]; then
            echo 'mode=bootstrap' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=validate' >> "$GITHUB_OUTPUT"
          fi

      - name: Verify bounded staging state
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          git merge-base --is-ancestor 16e957832640dfe8ccdf38bbc5db7c5be12ca189 HEAD
          expected=$'.github/final-health-transform.part00\n.github/final-health-transform.part01\n.github/final-health-transform.part02\n.github/workflows/final-health-lock-bootstrap.yml'
          actual="$(git diff --name-only 16e957832640dfe8ccdf38bbc5db7c5be12ca189...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected bootstrap staging diff:\n%s\n' "$actual" >&2
            exit 1
          }

      - name: Install validation dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y age apache2-utils 7zip python3-argon2 python3-bcrypt python3-yaml

          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Apply reviewed transform
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          cat .github/final-health-transform.part?? \
            | base64 -d \
            | gzip -d \
            > /tmp/final-health-transform.py
          python3 -m py_compile /tmp/final-health-transform.py
          python3 /tmp/final-health-transform.py
          python3 - <<'PY'
          from pathlib import Path

          path = Path('tests/suites/operations/case-health-alerts.bash')
          text = path.read_text()

          old_local = '    local label="$1" path="/run/lock/vaultwarden-health-test-${UID}-${BASHPID}-${RANDOM}-${label}"\n'
          new_local = '    local label="$1"\n    local path="/run/lock/vaultwarden-health-test-${UID}-${BASHPID}-${RANDOM}-${label}"\n'
          if text.count(old_local) != 2:
              raise SystemExit('Expected two test lock-target local declarations')
          text = text.replace(old_local, new_local)

          replacements = {
              '    TRACE+="health-before-global\\n"\n': "    TRACE+=$'health-before-global\\n'\n",
              'operation_set_phase(){ TRACE+="phase\\n"; return 0; }\n': "operation_set_phase(){ TRACE+=$'phase\\n'; return 0; }\n",
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'Expected exactly one trace fixture: {old!r}')
              text = text.replace(old, new)

          path.write_text(text)
          PY

          git diff --check
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash

      - name: Run focused operations validation
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          ./tests/run-tests.sh operations

      - name: Verify scope and publish code
        if: steps.mode.outputs.mode == 'bootstrap'
        shell: bash
        run: |
          set -euo pipefail
          expected=$'systemd/vaultwarden-health.service\ntests/suites/operations/case-health-alerts.bash\nutilities/maintenance-health.sh'
          actual="$(git diff --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected transformed file set:\n%s\n' "$actual" >&2
            exit 1
          }
          git diff --check

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            systemd/vaultwarden-health.service \
            tests/suites/operations/case-health-alerts.bash \
            utilities/maintenance-health.sh
          git diff --cached --check
          git commit -m 'Use one host-global health coordinator'
          git push origin HEAD:refactor/single-lock-ownership

      - name: Validate exact final PR head
        if: steps.mode.outputs.mode == 'validate'
        shell: bash
        run: |
          set -euo pipefail

          remote_head="$(git ls-remote origin refs/heads/refactor/single-lock-ownership | awk '{print $1}')"
          [[ -n "$remote_head" ]]
          [[ "$(git rev-parse HEAD)" == "$remote_head" ]]
          printf 'Exact PR head: %s\n' "$remote_head"

          git fetch --no-tags origin delta:refs/remotes/origin/delta
          expected=$'lib/operations.sh\nsystemd/vaultwarden-health.service\ntests/suites/foundation/case-systemd.bash\ntests/suites/operations/case-health-alerts.bash\ntests/suites/operations/case-lock-fd-hygiene.bash\ntests/suites/operations/case-operations.bash\nutilities/maintenance-health.sh\nutilities/setup-systemd.sh'
          actual="$(git diff --name-only origin/delta...HEAD | sort)"
          [[ "$actual" == "$expected" ]] || {
            printf 'Unexpected final PR file set:\n%s\n' "$actual" >&2
            exit 1
          }

          git diff --check origin/delta...HEAD
          while IFS= read -r -d '' file; do
            bash -n "$file"
          done < <(find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0)
          find . -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 shellcheck -x --severity=warning

          set +e
          ./tests/run-tests.sh all > /tmp/all-tests.log 2>&1
          tests_rc=$?
          set -e
          cat /tmp/all-tests.log
          (( tests_rc == 0 )) || exit "$tests_rc"

          git diff --check
          status="$(git status --porcelain=v1 --untracked-files=all)"
          if [[ -n "$status" ]]; then
            printf 'Working tree is not clean after validation:\n%s\n' "$status" >&2
            exit 1
          fi

          {
            echo '=== operation guard callers ==='
            grep -RIn --exclude-dir=.git --include='*.sh' --include='*.bash' \
              -E 'operation_acquire|--specific-lock' . || true
            echo
            echo '=== direct flock and lock-path users ==='
            grep -RIn --exclude-dir=.git --include='*.sh' --include='*.bash' \
              -E 'flock|LOCK(_FILE|_PATH|_DIR|_TARGET)?=' . || true
            echo
            echo '=== Make, dashboard, workflow, and systemd callers ==='
            grep -RIn -E 'operations|health --fix|backup|restore|maintenance|flock' \
              Makefile dashboard.sh systemd .github/workflows || true
          } > /tmp/lock-inventory.txt
          cat /tmp/lock-inventory.txt

      - name: Upload exact-head evidence
        if: always() && steps.mode.outputs.mode == 'validate'
        uses: actions/upload-artifact@v6
        with:
          name: pr-281-exact-head-evidence
          path: |
            /tmp/all-tests.log
            /tmp/lock-inventory.txt
          if-no-files-found: error
          retention-days: 14
