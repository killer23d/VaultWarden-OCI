name: PR330 acceptance hardening v2
on:
  pull_request:

permissions:
  contents: write

jobs:
  harden:
    if: github.event.pull_request.head.ref == 'test/noble-host-acceptance'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Apply staged hardening recipe
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          workflow = Path('.github/workflows/pr330-acceptance-hardening.yml').read_text().splitlines()
          start = next(i for i, line in enumerate(workflow) if line.strip() == "python3 - <<'PY'") + 1
          end = next(i for i in range(start, len(workflow)) if workflow[i] == '          PY')
          code_lines = workflow[start:end]
          code = '\n'.join(line[10:] if line.startswith('          ') else line for line in code_lines) + '\n'
          exec(compile(code, 'pr330-acceptance-hardening-recipe.py', 'exec'), {})

          controller = Path('utilities/noble-host-acceptance.sh')
          ctext = controller.read_text()
          old_cleanup = 'rm -rf -- "$STATE_ROOT/$stage_name"'
          if ctext.count(old_cleanup) != 1:
              raise SystemExit(f'expected one unsafe cleanup expression, found {ctext.count(old_cleanup)}')
          controller.write_text(ctext.replace(old_cleanup, 'rm -rf -- "${STATE_ROOT:?}/${stage_name:?}"', 1))

          test = Path('tests/suites/operations/case-host-acceptance.bash')
          ttext = test.read_text()
          annotations = {
              'RCLONE_REMOTE=acceptance': 'consumed by sourced acceptance helpers',
              'RCLONE_REMOTE_PATH=vaultwarden_acceptance': 'consumed by sourced acceptance helpers',
              'DNS_MUTATION_DOMAIN=vw-acceptance.example.com': 'consumed by sourced acceptance helpers',
              'ALLOW_DNS_MUTATION=true': 'consumed by sourced acceptance helpers',
              'DESTRUCTIVE=true': 'consumed by sourced acceptance helpers',
              'VW_NOBLE_TEST_DNS_MUTATION=YES': 'consumed by sourced acceptance helpers',
              'STATE_ROOT="$AT/state"': 'consumed by sourced recovery helpers',
          }
          for assignment, reason in annotations.items():
              pattern = re.compile(r'(?m)^(\s*)' + re.escape(assignment) + r'$')
              if not pattern.search(ttext):
                  raise SystemExit(f'expected generated test assignment: {assignment}')
              ttext = pattern.sub(
                  lambda m: f'{m.group(1)}# shellcheck disable=SC2034 # {reason}\n{m.group(1)}{assignment}',
                  ttext,
              )

          old_stub = '  download_bound_backup(){ BOUND_BACKUP_FILE="$AT/post-dr-full.age"; }'
          new_stub = '''  download_bound_backup(){
            # shellcheck disable=SC2034 # consumed by sourced verify_bound_backup_with_kit()
            BOUND_BACKUP_FILE="$AT/post-dr-full.age"
          }'''
          if ttext.count(old_stub) != 1:
              raise SystemExit(f'expected one download stub, found {ttext.count(old_stub)}')
          test.write_text(ttext.replace(old_stub, new_stub, 1))
          PY

          bash -n utilities/noble-host-acceptance.sh
          bash -n tests/suites/operations/case-host-acceptance.bash
          git diff --check

      - name: Install focused test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y age
          YQ_VERSION="v4.53.3"
          YQ_SHA256="fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4"
          curl -fsSL "https://github.com/mikefarah/yq/releases/download/${YQ_VERSION}/yq_linux_amd64" -o /tmp/yq
          echo "${YQ_SHA256}  /tmp/yq" | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq

      - name: Run focused controller contracts
        run: |
          bash tests/suites/operations/case-host-acceptance.bash
          shellcheck -x --severity=warning utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash

      - name: Regenerate command reference
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          bash utilities/write-command-reference.sh
          git diff --check

      - name: Commit hardened acceptance design
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add utilities/noble-host-acceptance.sh tests/suites/operations/case-host-acceptance.bash docs/HOST-ACCEPTANCE.md docs/COMMAND-REFERENCE.md
          git commit -m "test: bind Noble DR evidence and external mutations"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
