name: Finalize PR 273 formatting

on:
  pull_request:
    branches:
      - delta
    types: [synchronize]

permissions:
  contents: write

jobs:
  finalize-formatting:
    if: github.head_ref == 'agent/fix-health-recovery-alerts'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Align recovery cleanup indentation
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          path = Path("utilities/maintenance-health.sh")
          text = path.read_text()
          start = text.index('\nif _send_notification "$subject" "$body"; then\n', text.index('_notify_recovery()')) + 1
          end = text.index('    _release_recovery_lock\n', start)
          block = text[start:end]
          if not block.endswith('fi\n'):
              raise SystemExit("unexpected recovery delivery block")
          indented = ''.join(f'    {line}' if line.strip() else line for line in block.splitlines(keepends=True))
          path.write_text(text[:start] + indented + text[end:])
          PY

      - name: Validate formatting-only fix
        shell: bash
        run: |
          set -euo pipefail
          bash -n utilities/maintenance-health.sh
          bash -n tests/suites/operations/case-health-alerts.bash
          timeout 120 bash tests/suites/operations/case-health-alerts.bash
          shellcheck -x --severity=warning \
            utilities/maintenance-health.sh \
            tests/suites/operations/case-health-alerts.bash
          git diff --check

      - name: Commit formatting fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/agent-pr273-indent-fix.yml
          git add utilities/maintenance-health.sh
          expected=$'.github/workflows/agent-pr273-indent-fix.yml\nutilities/maintenance-health.sh'
          actual="$(git diff --cached --name-only | sort)"
          [[ "$actual" == "$expected" ]] || {
              printf 'Unexpected staged files:\n%s\n' "$actual" >&2
              exit 1
          }
          git diff --cached --check
          git commit -m "style: align recovery cleanup block"
          git push origin HEAD:agent/fix-health-recovery-alerts
