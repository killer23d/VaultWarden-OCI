name: Temporary CQA integration v2 publisher

on:
  pull_request:
    branches:
      - delta

permissions:
  contents: write

jobs:
  publish:
    if: github.head_ref == 'cqa-merge-safety-export'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          show-progress: false
      - name: Merge exact heads and publish persistent integration branch
        run: |
          set -euo pipefail
          mkdir -p /tmp/cqa-integration-v2
          git fetch origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse origin/delta)" = '5cdee3c2f527e565e76e7da78da1d4f628b26041'
          test "$(git rev-parse origin/cqa-force-ack)" = 'ae76c02f45393c13a02ede72e8c0c92157de58fc'
          test "$(git rev-parse origin/cqa-lock-preparation)" = 'f248cb57f72cc8cba13ae00c03323f758b31a7cf'
          test "$(git rev-parse origin/cqa-root-hints)" = 'c70000dab8d2b5e68c9ef92a7fc13aca723b1ac8'
          test "$(git rev-parse origin/cqa-readonly-config)" = 'e1dab709af894ab28f1b7e09d223f317bcb0bfea'
          test "$(git rev-parse origin/cqa-recovery-guard)" = '0c2d6031bca9b7c8872ba0df76ecd0133e0dbe96'
          test "$(git rev-parse origin/cqa-remediation)" = '9a8314b4c1d1ae4217f8fee4e23f32c6fab021d1' || test "$(git rev-parse origin/cqa-remediation)" = '9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1'
          test -z "$(git ls-remote origin refs/heads/cqa-split-integration-v2)"

          git config user.name OpenAI
          git config user.email noreply@openai.com
          git switch -C cqa-split-integration-v2 5cdee3c2f527e565e76e7da78da1d4f628b26041
          for branch in cqa-force-ack cqa-lock-preparation cqa-root-hints cqa-readonly-config cqa-recovery-guard; do
            echo "MERGE ${branch}" | tee -a /tmp/cqa-integration-v2/merge-order.log
            git merge --no-ff --no-edit "origin/${branch}" 2>&1 | tee -a /tmp/cqa-integration-v2/merge-order.log
          done
          test -z "$(git status --short)"
          git diff --check
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 | xargs -0 -n 1 bash -n
          ./tests/run-tests.sh list | tee /tmp/cqa-integration-v2/list.log
          git diff --name-only 9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1 HEAD | tee /tmp/cqa-integration-v2/diff-names.txt
          test "$(cat /tmp/cqa-integration-v2/diff-names.txt)" = $'lib/common.sh\ntests/suites/security/case-security-privileges.bash'
          git diff 9a8314b4c4d1ae4217f8fee4e23f32c6fab021d1 HEAD -- lib/common.sh tests/suites/security/case-security-privileges.bash > /tmp/cqa-integration-v2/old-aggregate.diff
          git rev-parse HEAD | tee /tmp/cqa-integration-v2/commit.txt
          git rev-parse 'HEAD^{tree}' | tee /tmp/cqa-integration-v2/tree.txt
          git diff --stat 5cdee3c2f527e565e76e7da78da1d4f628b26041 HEAD | tee /tmp/cqa-integration-v2/diffstat.txt
          git push origin HEAD:refs/heads/cqa-split-integration-v2
      - name: Upload integration construction evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cqa-integration-v2-construction
          path: /tmp/cqa-integration-v2
          if-no-files-found: warn
          retention-days: 7
