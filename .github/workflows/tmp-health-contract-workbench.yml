name: Temporary health contract workbench

on:
  pull_request:
    branches:
      - delta
    paths:
      - '.github/workflows/tmp-health-contract-workbench.yml'
      - '.github/tmp-health-contract.patch.gz.b64'

permissions:
  contents: write

jobs:
  validate-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Apply bounded health contract patch
        shell: bash
        run: |
          base64 -d .github/tmp-health-contract.patch.gz.b64 | gzip -d > /tmp/health-contract.patch
          echo '4bd02836b36bf49600cddac4395d939e3ba50f53f6db2d2dc967b63abc977e04  /tmp/health-contract.patch' | sha256sum --check
          git apply /tmp/health-contract.patch
          rm -f .github/workflows/tmp-health-contract-workbench.yml
          rm -f .github/tmp-health-contract.patch.gz.b64
          git diff --check

      - name: Install validation dependencies
        shell: bash
        run: |
          sudo apt-get update
          sudo apt-get install -y age apache2-utils p7zip-full python3-argon2 python3-bcrypt python3-yaml shellcheck
          curl -fsSL https://github.com/mikefarah/yq/releases/download/v4.53.3/yq_linux_amd64 -o /tmp/yq
          echo 'fa52a4e758c63d38299163fbdd1edfb4c4963247918bf9c1c5d31d84789eded4  /tmp/yq' | sha256sum --check --status
          sudo install -m 755 /tmp/yq /usr/local/bin/yq
          curl -fsSL https://github.com/getsops/sops/releases/download/v3.13.2/sops-v3.13.2.linux.amd64 -o /tmp/sops
          echo '154dfe4cd70554bdd82b98e4cd4acf191d43d01ead6f00a73477aa44c4ac42ef  /tmp/sops' | sha256sum --check --status
          sudo install -m 755 /tmp/sops /usr/local/bin/sops

      - name: Run syntax and strict ShellCheck
        shell: bash
        run: |
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 -n 1 bash -n
          find . -path './.git' -prune -o -type f \( -name '*.sh' -o -name '*.bash' \) -print0 \
            | xargs -0 shellcheck -x --severity=warning

      - name: Validate production Compose
        shell: bash
        run: docker compose --env-file .env.example -f docker-compose.yml.example config --quiet

      - name: Verify generated command reference
        shell: bash
        env:
          DOCKER_PROJECT_LABEL: ci
        run: |
          cp docs/COMMAND-REFERENCE.md /tmp/COMMAND-REFERENCE.committed.md
          bash utilities/write-command-reference.sh
          diff -u /tmp/COMMAND-REFERENCE.committed.md docs/COMMAND-REFERENCE.md

      - name: Verify health systemd units
        shell: bash
        run: |
          stub_dir=$(mktemp -d)
          cleanup() {
            sudo rm -f /opt/vaultwarden-scripts/maintenance.sh
            sudo rmdir /opt/vaultwarden-scripts 2>/dev/null || true
            rm -rf "$stub_dir"
          }
          trap cleanup EXIT
          sudo mkdir -p /opt/vaultwarden-scripts
          printf '#!/usr/bin/env bash\nexit 0\n' | sudo tee /opt/vaultwarden-scripts/maintenance.sh >/dev/null
          sudo chmod 0755 /opt/vaultwarden-scripts/maintenance.sh
          cat > "$stub_dir/docker.service" <<'EOF_DOCKER'
          [Unit]
          Description=Test Docker stub
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          RemainAfterExit=yes
          EOF_DOCKER
          cat > "$stub_dir/vaultwarden-notify-failure@.service" <<'EOF_NOTIFY'
          [Unit]
          Description=Test failure notifier
          [Service]
          Type=oneshot
          ExecStart=/bin/true
          EOF_NOTIFY
          SYSTEMD_UNIT_PATH="$stub_dir:$PWD/systemd:/etc/systemd/system:/usr/lib/systemd/system:/lib/systemd/system" \
            systemd-analyze verify systemd/vaultwarden-health.service systemd/vaultwarden-health.timer

      - name: Run focused health contract tests
        shell: bash
        run: |
          bash tests/suites/operations/case-operations.bash
          bash tests/suites/operations/case-operator-ui.bash
          bash tests/suites/foundation/case-systemd.bash
          bash tests/suites/operations/case-lock-fd-hygiene.bash

      - name: Run complete canonical suite
        shell: bash
        run: ./tests/run-tests.sh all

      - name: Commit validated patch
        shell: bash
        run: |
          git diff --check
          git status --short
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m 'Implement quick health exit contract'
          git push origin HEAD:fix/health-quick-exit-contract
