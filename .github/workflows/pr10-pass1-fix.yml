name: PR10 pass1 fixes

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Apply pass 1 fixes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          crypto = Path('lib/crypto.sh')
          lines = crypto.read_text().splitlines()
          needle = '    checksum=$(sha256sum -- "$file" | cut -d\' \' -f1) || return 1'
          try:
              i = lines.index(needle)
          except ValueError:
              raise SystemExit('checksum assignment not found')
          lines[i:i+1] = [
              '    if ! checksum=$(sha256sum -- "$file" | cut -d\' \' -f1); then',
              '        log_error "Failed to calculate SHA256 checksum: $file"',
              '        return 1',
              '    fi',
          ]
          for j in range(i + 4, min(i + 10, len(lines))):
              if lines[j] == 'verify_sha256() {' and lines[j-1] != '':
                  lines.insert(j, '')
                  break
          crypto.write_text('\n'.join(lines) + '\n')

          test = Path('tests/suites/foundation/case-storage-setup.bash')
          text = test.read_text()
          start = text.index('if ! bash "$setup_system" --use-latest --sops-version v3.13.2')
          end_marker = 'rm -f /tmp/vw-sops-ambiguous.$$\n'
          end = text.index(end_marker, start) + len(end_marker)
          replacement = '''for removed_latest_surface in \\
    "$PROJECT_ROOT/setup.sh" \\
    "$setup_system" \\
    "$PROJECT_ROOT/utilities/setup-env.sh" \\
    "$setup_crowdsec"; do
    if grep -Fq -- '--use-latest' "$removed_latest_surface"; then
        fail "removed --use-latest production contract remains in $removed_latest_surface"
    fi
done
pass 'production setup surfaces no longer expose --use-latest'\n'''
          test.write_text(text[:start] + replacement + text[end:])
          PY
          bash -n lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          shellcheck -x --severity=warning lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          VW_TEST_CASE_MODE=host-architecture bash tests/suites/foundation/case-storage-setup.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          git commit -m "test: assert pinned production setup contract"
          git push origin HEAD:agent/pr10-platform-simplification
