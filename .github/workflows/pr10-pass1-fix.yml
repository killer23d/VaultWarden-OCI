name: PR10 pass1 fixes

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Apply pass 1 fixes
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("lib/crypto.sh"); lines=p.read_text().splitlines(); i=next(i for i,x in enumerate(lines) if x.strip().startswith("checksum=$(sha256sum -- \"$file\"")); lines[i:i+1]=["    if ! checksum=$(sha256sum -- \"$file\" | cut -d\x27 \x27 -f1); then","        log_error \"Failed to calculate SHA256 checksum: $file\"","        return 1","    fi"]; j=next(j for j in range(i+4,min(i+12,len(lines))) if lines[j]=="verify_sha256() {"); lines.insert(j,"") if lines[j-1] else None; p.write_text("\n".join(lines)+"\n")'
          python3 -c 'from pathlib import Path; p=Path("tests/suites/foundation/case-storage-setup.bash"); s=p.read_text(); a=s.index("if ! bash \"$setup_system\" --use-latest --sops-version v3.13.2"); marker="rm -f /tmp/vw-sops-ambiguous.$$\n"; b=s.index(marker,a)+len(marker); r="for removed_latest_surface in \\\n    \"$PROJECT_ROOT/setup.sh\" \\\n    \"$setup_system\" \\\n    \"$PROJECT_ROOT/utilities/setup-env.sh\" \\\n    \"$setup_crowdsec\"; do\n    if grep -Fq -- \x27--use-latest\x27 \"$removed_latest_surface\"; then\n        fail \"removed --use-latest production contract remains in $removed_latest_surface\"\n    fi\ndone\npass \x27production setup surfaces no longer expose --use-latest\x27\n"; p.write_text(s[:a]+r+s[b:])'
          bash -n lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          shellcheck -x --severity=warning lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/crypto.sh tests/suites/foundation/case-storage-setup.bash
          git commit -m "test: assert pinned production setup contract"
          git push origin HEAD:agent/pr10-platform-simplification
