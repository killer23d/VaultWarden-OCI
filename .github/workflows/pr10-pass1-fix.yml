name: PR10 pass1 fix
on:
  push:
    branches: [agent/pr10-platform-simplification]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('lib/crypto.sh')
          s=p.read_text()
          old='''    local checksum
    checksum=$(sha256sum -- "$file" | cut -d' ' -f1) || return 1
    printf '%s\\n' "$checksum"
}
verify_sha256() {'''
          new='''    local checksum
    if ! checksum=$(sha256sum -- "$file" | cut -d' ' -f1); then
        log_error "Failed to calculate SHA256 checksum: $file"
        return 1
    fi
    printf '%s\\n' "$checksum"
}

verify_sha256() {'''
          if old not in s:
              raise SystemExit('checksum block not found')
          p.write_text(s.replace(old,new,1))
          PY
          bash -n lib/crypto.sh
          shellcheck -x --severity=warning lib/crypto.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/crypto.sh
          git commit -m "fix: preserve checksum failure diagnostics"
          git push origin HEAD:agent/pr10-platform-simplification
