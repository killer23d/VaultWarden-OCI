name: PR10 pass1 fix

on:
  push:
    branches:
      - agent/pr10-platform-simplification

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          ref: agent/pr10-platform-simplification
      - name: Restore checksum diagnostics
        shell: bash
        run: |
          python3 -c 'from pathlib import Path; p=Path("lib/crypto.sh"); s=p.read_text(); old="    local checksum\n    checksum=$(sha256sum -- \"$file\" | cut -d\x27 \x27 -f1) || return 1\n    printf \x27%s\\n\x27 \"$checksum\"\n}\nverify_sha256() {"; new="    local checksum\n    if ! checksum=$(sha256sum -- \"$file\" | cut -d\x27 \x27 -f1); then\n        log_error \"Failed to calculate SHA256 checksum: $file\"\n        return 1\n    fi\n    printf \x27%s\\n\x27 \"$checksum\"\n}\n\nverify_sha256() {"; assert old in s; p.write_text(s.replace(old,new,1))'
          bash -n lib/crypto.sh
          shellcheck -x --severity=warning lib/crypto.sh
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/crypto.sh
          git commit -m "fix: preserve checksum failure diagnostics"
          git push origin HEAD:agent/pr10-platform-simplification
