name: Apply final Caddy audit fixes

on:
  pull_request:
    branches: [v2]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - name: Apply final audit fixes
        run: python3 .github/codex_final_caddy_fix.py
      - name: Compile and run focused unit tests
        run: |
          python3 -m compileall -q vaultwarden_oci tests/v2
          python3 -m unittest tests.v2.test_caddy_edge_admin -v
      - name: Build exact Caddy and exercise rate limit
        run: python3 tests/v2/acceptance_caddy_config.py
      - name: Commit implementation fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add vaultwarden_oci/runtime.py tests/v2/test_caddy_edge_admin.py tests/v2/acceptance_caddy_config.py
          git commit -m "Bound Cloudflare trust refresh and strengthen Caddy acceptance"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
