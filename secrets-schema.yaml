# secrets-schema.yaml — VaultWarden-OCI secret schema
#
# SINGLE SOURCE OF TRUTH for every secret key managed by this project.
#
# Operator workflow:
#   1. Edit this file to add, rename, or remove a secret key.
#   2. Run ./edit-secrets.sh edit  (or the relevant setup/rotate command).
#
# This file is NEVER encrypted and contains NO secret values — only structural
# metadata. It is safe to commit.
#
# Field reference:
#   key         — key name as it appears in secrets.yaml (^[a-z][a-z0-9_]*$)
#   label       — human-readable prompt shown during interactive collection
#   hash        — fixed transform contract: argon2id | bcrypt | plain | none
#   placeholder — value written by `setup-secrets.sh bootstrap` before real secrets are set
#   collect     — collection mode: interactive | auto | conditional | skip
#   auto_fn     — supported generator when collect=auto (empty string if collect≠auto)
#   condition_fn — supported Bash predicate when collect=conditional
#   conditional_group — optional named runtime requirement group
#   apply       — closed apply contract:
#                 type: compose_restart | systemd_restart | crowdsec_worker_config | none
#                 targets: explicit service targets for that type
#   required    — if true, check_placeholder_values() fails when this key is still a placeholder
#   hint        — comment line injected above this key in the plaintext temp file during `edit`
#                 (empty string = no hint injected)
#
# Ordering of entries determines the collection prompt order and the key order
# written to a freshly bootstrapped secrets.yaml.
schema_version: 1

secrets:

  # ── VaultWarden admin credentials ─────────────────────────────────────────

  - key: admin_token
    label: "VaultWarden admin panel token"
    hash: argon2id
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: compose_restart
      targets:
        - vaultwarden
    required: true
    hint: "HASHED (Argon2id) — do NOT type plaintext here. Use: ./edit-secrets.sh rotate admin_token"

  - key: admin_basic_auth_hash
    label: "Caddy Basic-Auth hash (bcrypt)"
    hash: bcrypt
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: compose_restart
      targets:
        - caddy
    required: true
    hint: "HASHED (bcrypt) — do NOT type plaintext here. Use: ./edit-secrets.sh rotate admin_basic_auth_hash"

  # ── Email delivery ─────────────────────────────────────────────────────────

  - key: smtp_password
    label: "SMTP relay password"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: compose_restart
      targets:
        - postfix
    required: false
    conditional_group: email_smtp
    hint: ""

  - key: email_api_token
    label: "Email provider API token"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: none
      targets: []
    required: false
    conditional_group: email_api
    hint: ""

  # ── Backup ────────────────────────────────────────────────────────────────

  - key: file_integrity_hmac_key
    label: "Backup integrity HMAC key (auto-generated)"
    hash: plain
    placeholder: "CHANGE_ME_FILE_INTEGRITY_HMAC_KEY"
    collect: auto
    auto_fn: "auto_generate_secret_field"
    condition_fn: ""
    apply:
      type: none
      targets: []
    required: false
    conditional_group: authenticated_integrity
    hint: "Used to authenticate backup checksum sidecars. Rotate only after retaining old keys for legacy backups."

  # ── Mobile push notifications ─────────────────────────────────────────────

  - key: push_installation_id
    label: "Push notification installation ID"
    hash: plain
    placeholder: "CHANGE_ME_OR_LEAVE_EMPTY"
    # condition_fn is evaluated by setup-secrets.sh before collection. A false
    # result writes the schema placeholder without prompting.
    collect: conditional
    auto_fn: ""
    condition_fn: "condition_push_enabled"
    apply:
      type: compose_restart
      targets:
        - vaultwarden
    required: false
    conditional_group: push
    hint: ""

  - key: push_installation_key
    label: "Push notification installation key"
    hash: plain
    placeholder: "CHANGE_ME_OR_LEAVE_EMPTY"
    # See push_installation_id above — both fields are an atomic group.
    collect: conditional
    auto_fn: ""
    condition_fn: "condition_push_enabled"
    apply:
      type: compose_restart
      targets:
        - vaultwarden
    required: false
    conditional_group: push
    hint: ""

  # ── Cloudflare / Caddy ────────────────────────────────────────────────────

  - key: caddy_cloudflare_dns_token
    label: "Cloudflare DNS API token (Zone:DNS:Edit + Zone:Zone:Read — used by Caddy ACME DNS-01)"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: compose_restart
      targets:
        - caddy
    required: true
    hint: ""

  - key: cf_worker_bouncer_token
    label: "CrowdSec Cloudflare Workers bouncer token (Zone:Firewall Services:Edit)"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: crowdsec_worker_config
      targets:
        - crowdsec-cloudflare-worker-bouncer
    required: false
    conditional_group: cloudflare_proxy
    hint: ""

  - key: cloudflare_zone_id
    label: "Cloudflare Zone ID (32-char hex — required by CrowdSec CF bouncer)"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: crowdsec_worker_config
      targets:
        - crowdsec-cloudflare-worker-bouncer
    required: false
    conditional_group: cloudflare_proxy
    hint: ""

  - key: cf_account_id
    label: "Cloudflare Account ID (32-char hex — required by CrowdSec CF bouncer)"
    hash: plain
    placeholder: "PLACEHOLDER_NOT_CONFIGURED"
    collect: interactive
    auto_fn: ""
    apply:
      type: crowdsec_worker_config
      targets:
        - crowdsec-cloudflare-worker-bouncer
    required: false
    conditional_group: cloudflare_proxy
    hint: ""
