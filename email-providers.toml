# Built-in operational notification provider catalog.
# This is immutable release metadata, not operator-editable transport policy.

[providers.mailersend]
name = "MailerSend"
endpoint = "https://api.mailersend.com/v1/email"
auth_mode = "bearer"
content_type = "application/json"
encoding = "json"
request_template = '''{"from":{"email":"{from_email}","name":"{from_name}"},"to":[{"email":"{to_email}"}],"subject":"{subject}","text":"{text}"}'''
success_statuses = [202]
retry_statuses = [429, 500, 502, 503, 504]

[providers.mailgun]
name = "Mailgun"
endpoint = "https://api.mailgun.net/v3/{mailgun_domain}/messages"
auth_mode = "basic"
basic_user = "api"
content_type = "application/x-www-form-urlencoded"
encoding = "form"
request_template = '''from={from_header}&to={to_email}&subject={subject}&text={text}'''
success_statuses = [200]
retry_statuses = [429, 500, 502, 503, 504]

[[providers.mailgun.options]]
name = "mailgun_domain"
required = true
pattern = '''^[A-Za-z0-9](?:[A-Za-z0-9.-]{0,251}[A-Za-z0-9])?$'''

[providers.postmark]
name = "Postmark"
endpoint = "https://api.postmarkapp.com/email"
auth_mode = "header"
auth_header = "X-Postmark-Server-Token"
content_type = "application/json"
encoding = "json"
request_template = '''{"From":"{from_header}","To":"{to_email}","Subject":"{subject}","TextBody":"{text}"}'''
success_statuses = [200]
retry_statuses = [429, 500, 502, 503, 504]

[providers.resend]
name = "Resend"
endpoint = "https://api.resend.com/emails"
auth_mode = "bearer"
content_type = "application/json"
encoding = "json"
request_template = '''{"from":"{from_header}","to":["{to_email}"],"subject":"{subject}","text":"{text}"}'''
success_statuses = [200]
retry_statuses = [500, 502, 503, 504]

[providers.sendgrid]
name = "SendGrid"
endpoint = "https://api.sendgrid.com/v3/mail/send"
auth_mode = "bearer"
content_type = "application/json"
encoding = "json"
request_template = '''{"personalizations":[{"to":[{"email":"{to_email}"}]}],"from":{"email":"{from_email}","name":"{from_name}"},"subject":"{subject}","content":[{"type":"text/plain","value":"{text}"}]}'''
success_statuses = [202]
retry_statuses = [429, 500, 502, 503, 504]

[providers.cyberpersons]
name = "CyberPersons"
endpoint = "https://api.cyberpersons.com/v1/send-email"
auth_mode = "bearer"
content_type = "application/json"
encoding = "json"
request_template = '''{"from":"{from_email}","to":"{to_email}","subject":"{subject}","text":"{text}"}'''
success_statuses = [202]
success_field = "success"
success_value = true
# Current CyberPersons docs use 429 for account-wide minute/hour/day/month
# limits shared across API keys and SMTP credentials, so status alone cannot
# prove a bounded transient condition. 503 is the status-only transient case;
# 429 and 500/send_failed remain visible and are not SMTP-fallback eligible.
retry_statuses = [503]

[aliases]
cyberpanel = "cyberpersons"
